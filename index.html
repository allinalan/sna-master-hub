<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sharp Ninja Academy — Master Hub</title>
<meta name="description" content="One place for the Sharp Ninja Academy program: campaign calendar, topic bank, call archive, and guest speakers.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23AE3B15'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Hiragino Mincho ProN,Yu Mincho,serif' fill='%23F3EFE6'%3E忍%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0E0B08" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#191410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   SNA MASTER HUB — "Program Book" design system
   A dark lacquer masthead wraps warm paper boards. Vermilion seal, brass
   details. Fraunces (display) · Hanken Grotesk (everything else — its
   figures are tabular out of the box, so dates and numbers line up without a
   monospace). Boards stay light so PNG export and print keep working.
   Type sits on one scale (11 · 12 · 13 · 14 · 16 · 18 · 22 · 28 · 40px);
   nothing ships below 11px. Weight carries hierarchy, not faded colour:
   --ink-faint is for placeholders and decoration, never for text you read.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light dark;
  --radius:12px;
  --serif:"Fraunces",Georgia,serif;
  --sans:"Hanken Grotesk",-apple-system,"Helvetica Neue",sans-serif;
  --monof:var(--sans);           /* was Spline Sans Mono: Hanken's tabular figures do the aligning now */
  --hair:1px;                    /* a separator: one device pixel on a retina screen (below) */
  /* motion — colour fades on --ease-out, sheets on the iOS sheet curve, anything that
     moves under your hand on a real spring (damping .82, response 320ms: settles in
     440ms with 1.1% overshoot). The bouncy one (damping .6) is for checkmarks only. */
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --ease-sheet:cubic-bezier(.32,.72,0,1);
  --spring:linear(0,.074,.232,.411,.577,.714,.819,.895,.946,.978,.997,1.007,1.01,1.011,1.01,1.008,1.006,1.004,1.003,1.002,1);
  --spring-bouncy:linear(0,.075,.249,.458,.659,.827,.952,1.034,1.078,1.094,1.091,1.076,1.057,1.037,1.02,1.007,.998,.993,.991,.991,.992,.994,.996,.998,1);
  --spring-dur:440ms;
}
@media (min-resolution:2dppx){:root{--hair:.5px}}
/* ── colour ──
   Every colour on the page is one of these; component rules below never carry a
   hex of their own. The light set is restated on body.exporting and on the PNG
   export's holder, so Export and Print always produce the light board whatever
   the screen is showing. Dark (further down) only swaps the base colours; the
   derived ones (fills, rings, tints — mixed from --ink and --accent) follow. */
:root,body.exporting,.png-holder{
  --paper:#F3EFE6; --paper-deep:#EAE4D6; --paper-top:#F8F5EE;
  --card:#FFFDF8; --card-raised:#FFFEFB;
  --ink:#1C1712; --ink-soft:#5E5645; --ink-faint:#736A57; --ink-strong:#000;
  --line:#DCD5C3; --line-soft:#E8E2D2; --line-strong:#C9C0AA;
  --accent:#AE3B15; --accent-deep:#8F2F0F; --accent-soft:#F1DFD2; --accent-ink:#7C2C0E;
  --on-accent:#FFF9F1;           /* text on an --accent (or --bad) fill */
  --brass:#8E7942; --brass-soft:#EFE7D2;
  --good:#3D6B4F; --good-bg:#DFE9DC;
  --warn:#96760A; --warn-bg:#F2E7C6; --warn-ink:#6E5606;
  --bad:#B42318;  --bad-bg:#F5DFDA;  /* errors and overdue only — the brand red is --accent */
  --alan:#33608F; --alan-bg:#DCE7F1;
  --ben:#7B4B8F;  --ben-bg:#E9DFF0;
  --tier3:#5B57A8;
  --selection:#EAD9C4;
  --dim:rgba(18,13,8,.32); --dim-soft:rgba(18,13,8,.24);    /* behind a modal · behind the drawer */
  /* the masthead and tab band are the dark cover in both themes */
  --shell:#191410; --shell-hi:#221C15;
  --shell-text:#F4EEDF; --shell-mut:#9A907C; --shell-dim:#988E78; --shell-btn:#EDE6D6;
  --shell-line:rgba(244,238,223,.1); --shell-edge:rgba(244,238,223,.16);
  --shell-fill:rgba(244,238,223,.10); --shell-fill-hover:rgba(244,238,223,.17);
  --seal:#AE3B15; --seal-ink:#F6EFE2;
  --dot-ok:#6FA080; --dot-edited:#D9A62E;
  --knob:#FFFFFF;
  /* marks: the solid squares and badges on the boards. They carry --on-mark text
     and keep their colour in both themes (only black gets a ring in the dark). */
  --mark-call:#2E7D4F; --mark-1on1:#7A3FA8; --mark-text:#2C6BB5; --mark-missed:#C0392B;
  --mark-off:#1C1712; --mark-off-ring:transparent; --mark-none:#5E5645;
  --mark-open:#DDAA00; --mark-open-ink:#3A2C00; --mark-brass:#8E7942;
  --on-mark:#F4EEDF;
  /* derived */
  --fill:color-mix(in oklab,var(--ink) 6%,transparent);          /* grey buttons, search fields, segmented tracks */
  --fill-hover:color-mix(in oklab,var(--ink) 10%,transparent);
  --fill-strong:color-mix(in oklab,var(--ink) 16%,transparent);  /* a switch that's off */
  --hover:color-mix(in oklab,var(--ink) 7%,transparent);         /* a row in a list you're pointing at */
  --band:color-mix(in oklab,var(--ink) 3.5%,transparent);        /* alternate months on the check-in board */
  --ring:color-mix(in oklab,var(--ink) 30%,transparent);         /* a square you're pointing at */
  --focus-ring:color-mix(in oklab,var(--accent) 14%,transparent);
  --accent-tint:color-mix(in oklab,var(--accent) 7%,transparent); /* this week's lane */
  --accent-line:color-mix(in oklab,var(--accent) 22%,transparent);
  /* elevation — three steps, nothing else casts a shadow */
  --elev-1:0 0 0 var(--hair) rgba(28,23,18,.06),0 1px 2px rgba(28,23,18,.05);
  --elev-2:0 0 0 var(--hair) rgba(28,23,18,.10),0 4px 12px rgba(28,23,18,.08),0 16px 40px rgba(28,23,18,.14);
  --elev-3:0 0 0 var(--hair) rgba(28,23,18,.12),0 24px 64px rgba(28,23,18,.28);
}
body.exporting,.png-holder{color-scheme:light}
/* dark: warm, low paper, the same hierarchy. Screen only, so paper never prints dark. */
@media screen and (prefers-color-scheme:dark){
  :root{
    --paper:#15110D; --paper-deep:#1B1612; --paper-top:#18130F;
    --card:#211B15; --card-raised:#2A231C;
    --ink:#F2EBDD; --ink-soft:#BFB4A0; --ink-faint:#988E7A; --ink-strong:#FFFFFF;
    --line:rgba(242,235,221,.13); --line-soft:rgba(242,235,221,.07); --line-strong:rgba(242,235,221,.22);
    --accent:#E8734A; --accent-deep:#F08A66; --accent-soft:rgba(232,115,74,.15); --accent-ink:#F29C7B;
    --on-accent:#1B110B;
    --brass:#CDB57E; --brass-soft:rgba(205,181,126,.14);
    --good:#74C08E; --good-bg:rgba(116,192,142,.15);
    --warn:#E2B54C; --warn-bg:rgba(226,181,76,.15); --warn-ink:#E9C46A;
    --bad:#F2735F;  --bad-bg:rgba(242,115,95,.15);
    --alan:#94BBE8; --alan-bg:rgba(148,187,232,.15);
    --ben:#C9A2DE;  --ben-bg:rgba(201,162,222,.15);
    --tier3:#A9A5EA;
    --selection:rgba(232,115,74,.32);
    --dim:rgba(0,0,0,.5); --dim-soft:rgba(0,0,0,.42);
    --shell:#0E0B08; --shell-hi:#16120E;
    --mark-off:#050403; --mark-off-ring:rgba(242,235,221,.24);
    --focus-ring:color-mix(in oklab,var(--accent) 28%,transparent);
    --elev-1:0 0 0 var(--hair) rgba(242,235,221,.07),0 1px 2px rgba(0,0,0,.3);
    --elev-2:0 0 0 var(--hair) rgba(242,235,221,.10),0 4px 12px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.4);
    --elev-3:0 0 0 var(--hair) rgba(242,235,221,.12),0 24px 64px rgba(0,0,0,.55);
  }
}
@media print{:root{color-scheme:light}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:linear-gradient(180deg,var(--paper-top) 0,var(--paper) 560px) no-repeat,var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding:0 0 110px}
.mono{font-family:var(--monof);font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
::selection{background:var(--selection)}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1220px;margin:0 auto;padding:0 28px}

/* the page used to wear a film-grain overlay (a fixed layer at z-index 200, over
   the content and over the Data modal). Paper gets a little top light instead. */

.eyebrow{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);display:flex;align-items:center;gap:9px}

/* ═══════════ masthead — the dark cover ═══════════ */
header{background:linear-gradient(180deg,var(--shell-hi),var(--shell));color:var(--shell-text)}
.head-inner{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 28px 15px;max-width:1220px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:41px;height:41px;background:var(--seal);color:var(--seal-ink);border-radius:10px;flex:none;
  display:grid;place-items:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:21px;line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 8px rgba(0,0,0,.4)}
.brand h1{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.011em;line-height:1.1;color:var(--shell-text)}
.brand .sub{font-size:12px;font-weight:500;color:var(--shell-mut);margin-top:3px}
.head-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-left:auto}
.status{font-family:var(--monof);font-size:12px;color:var(--shell-mut);display:flex;align-items:center;gap:7px;margin-right:4px}
.status #saveLabel{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dot-ok);flex:none}
.dot.edited{background:var(--dot-edited)}

/* ═══════════ buttons ═══════════ */
/* filled, not outlined: grey for most, ink for the one thing the page is for,
   plain (tinted text) for the quiet ones. Sentence case, 13px semibold. */
.btn{font-family:var(--sans);font-size:13px;line-height:18px;font-weight:600;letter-spacing:0;
  padding:9px 16px;border:0;background:var(--fill);color:var(--ink);
  border-radius:10px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--fill-hover);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--ink-strong);color:var(--paper)}
.btn.on{background:var(--accent);color:var(--on-accent)}
.btn.on:hover{background:var(--accent-deep);color:var(--on-accent)}
.btn.plain{background:none;color:var(--accent);padding-left:10px;padding-right:10px}
.btn.plain:hover{background:var(--accent-soft);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:12px;line-height:16px;border-radius:8px}
a.btn{display:inline-block;text-decoration:none}
header .btn{color:var(--shell-btn);background:var(--shell-fill)}
header .btn:hover{background:var(--shell-fill-hover);color:var(--shell-text)}
header .btn.on{background:var(--accent);color:var(--on-accent)}

/* ═══════════ nav band — sticky part of the cover ═══════════ */
/* a material, not a slab: the page scrolls under it, blurred, and a hairline
   (not a shadow) marks the edge */
nav.tabs{position:sticky;top:0;z-index:50;background:color-mix(in oklab,var(--shell) 94%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);
  border-top:1px solid var(--shell-line);border-bottom:var(--hair) solid var(--shell-edge)}
.tabs-inner{max-width:1220px;margin:0 auto;padding:0 28px}
.tabs-primary{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;position:relative}
.tabs-row{display:flex;flex:none}
/* one underline per row, outside what paintTabs() rebuilds: it slides from the tab
   you were on to the one you picked, on the spring (see placeInk) */
.tab-ink{position:absolute;left:0;bottom:0;width:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);opacity:0;pointer-events:none;
  transition:transform var(--spring-dur) var(--spring),width var(--spring-dur) var(--spring),opacity .2s var(--ease-out)}
.tab-ink.sub{height:2px;border-radius:0;background:var(--shell-text)}
.tab-ink.jump{transition:none}
.tabs-primary::-webkit-scrollbar{display:none}
.tab-primary{font-family:var(--serif);font-size:16px;font-weight:500;letter-spacing:0;
  padding:15px 2px 13px;margin-right:30px;border:none;background:none;cursor:pointer;color:var(--shell-dim);
  white-space:nowrap;display:flex;align-items:baseline;gap:8px;position:relative;transition:color .18s}
.tab-primary:hover{color:var(--shell-text)}
.tab-primary.on{color:var(--shell-text);font-weight:600}
/* the label reserves its semibold width, so the tabs never shuffle when one becomes active */
:is(.tab-primary,.tab-sub) .tl{display:inline-flex;flex-direction:column}
:is(.tab-primary,.tab-sub) .tl::after{content:attr(data-label);font-weight:600;height:0;visibility:hidden;overflow:hidden;user-select:none}
.tab-primary .ct{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:0;color:var(--shell-dim)}
.tab-primary.on .ct{color:var(--shell-mut)}
.tabs-sub{display:flex;gap:0;border-top:1px solid var(--shell-line);overflow-x:auto;scrollbar-width:none;position:relative}
.tabs-sub[hidden]{display:none}
.tabs-sub::-webkit-scrollbar{display:none}
.tab-sub{font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:0;
  padding:10px 1px;margin-right:24px;border:none;background:none;cursor:pointer;color:var(--shell-dim);
  white-space:nowrap;position:relative;transition:color .18s}
.tab-sub:hover{color:var(--shell-text)}
.tab-sub.on{color:var(--shell-text);font-weight:600}
.tab-sub .ct{color:var(--shell-dim);font-size:12px;margin-left:5px;font-weight:500}
.tab-sub.on .ct{color:var(--shell-mut)}

/* ═══════════ page title + toolbar ═══════════ */
.page-head{padding:44px 0 0;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.page-head .big{font-family:var(--serif);font-size:clamp(32px,4vw,40px);font-weight:500;
  letter-spacing:-.024em;line-height:1.08;margin-top:8px}
.page-head .lede{font-size:14px;color:var(--ink-soft);margin-top:10px;max-width:58ch;line-height:1.6}
/* the how-to paragraphs are a manual, not the board: folded behind "How this works"
   until you ask for them (or turn Edit on, where they explain what you're clicking) */
body:not(.editing):not(.how-open) .page-head .lede.how{display:none}
.how-toggle{margin:6px 0 0 -10px}
body.editing .how-toggle{display:none}
/* the "what's next" ticket beside the calendar title */
.next-call{background:var(--card);border:0;border-radius:14px;
  padding:14px 18px 15px;min-width:230px;max-width:320px;box-shadow:var(--elev-1);align-self:center}
.next-call .nc-lab{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.next-call .nc-date{font-family:var(--serif);font-size:18px;font-weight:600;margin-top:6px;letter-spacing:-.011em}
.next-call .nc-topic{font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.45}
.next-call .nc-open{color:var(--accent);font-size:13px;font-weight:500;letter-spacing:0}
.next-call .nc-meta{display:flex;gap:7px;align-items:center;margin-top:10px;flex-wrap:wrap}
.next-call .nc-time{font-size:12px;color:var(--ink-soft)}
@media (max-width:760px){.next-call{max-width:none;width:100%;align-self:stretch}}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid var(--line);margin-bottom:28px}
.toolbar .grow{flex:1}
.tb-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tb-actions{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
/* a segmented control: a recessed track, the chosen segment a raised card in it */
.seg{display:flex;gap:2px;border:0;border-radius:10px;background:var(--fill);padding:2px}
.seg button{font-family:var(--sans);font-size:13px;line-height:18px;font-weight:500;letter-spacing:0;padding:6px 13px;border:none;background:none;
  border-radius:8px;cursor:pointer;color:var(--ink-soft);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card-raised);color:var(--ink);font-weight:600;
  box-shadow:0 1px 3px rgba(28,23,18,.12),0 0 0 var(--hair) rgba(28,23,18,.08)}
input.search{font-family:var(--sans);font-size:14px;line-height:18px;padding:8px 12px;border:1px solid transparent;border-radius:10px;
  background:var(--fill);color:var(--ink);width:230px;flex:0 1 230px;min-width:150px;
  transition:background-color .2s var(--ease-out),border-color .2s var(--ease-out),box-shadow .2s var(--ease-out)}
input.search::placeholder{color:var(--ink-faint)}
input.search:focus{outline:none;background:var(--card);border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring)}

/* ═══════════ stat strip — annual-report rules, not boxes ═══════════ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:14px 24px;margin:0 0 40px}
.stat{border-top:2px solid var(--ink);padding:11px 0 2px;background:none}
.stat .lab{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.stat .val{font-family:var(--sans);font-size:28px;font-weight:600;letter-spacing:-.019em;margin-top:8px;line-height:1}
.stat .meta{font-size:12px;color:var(--ink-soft);margin-top:6px}
.stat.alert{border-top-color:var(--accent)}
.stat.alert .val{color:var(--accent)}

/* ═══════════ campaign sections ═══════════ */
.season{margin-bottom:46px}
.season-head{display:flex;align-items:baseline;gap:13px;padding:0 0 11px;border-bottom:2px solid var(--ink);margin-bottom:2px;flex-wrap:wrap}
.season-head h3{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.015em}
.season-head .roman{font-size:12px;font-weight:600;color:var(--brass);letter-spacing:.04em;align-self:center}
.season-head .range{font-size:13px;color:var(--ink-soft)}
.season-head .fill{margin-left:auto;font-size:12px;color:var(--ink-soft);font-family:var(--monof);letter-spacing:0;display:flex;align-items:center;gap:8px}
.season-head .meter{width:56px;height:3px;border-radius:2px;background:var(--line-strong);overflow:hidden;flex:none}
.season-head .meter i{display:block;height:100%;background:var(--accent);border-radius:2px}

/* ═══════════ week rows ═══════════ */
.week{display:grid;grid-template-columns:118px minmax(0,1fr);gap:18px;padding:14px 8px;margin:0 -8px;
  border-bottom:1px solid var(--line-soft);align-items:start;break-inside:avoid;position:relative;
  border-radius:8px;transition:background .15s}
.week:hover{background:color-mix(in oklab,var(--card) 80%,transparent)}
.week.open{background:repeating-linear-gradient(135deg,transparent,transparent 9px,color-mix(in oklab,var(--accent) 4.5%,transparent) 9px,color-mix(in oklab,var(--accent) 4.5%,transparent) 18px)}
.week.blocked{opacity:.55}
.wk-date{font-family:var(--monof);font-size:12px;color:var(--ink-soft);padding-top:2px;line-height:1.5}
.wk-date b{display:block;color:var(--ink);font-size:14px;font-weight:600;letter-spacing:0}
.wk-date .wknum{font-size:11px;font-weight:600;color:var(--ink-faint);letter-spacing:.04em}
.wk-time{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.3}
.wk-time.custom{color:var(--accent)}
.wk-main{min-width:0}
.wk-topic{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.011em;line-height:1.3}
.wk-topic.empty{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--accent);letter-spacing:0}
.wk-detail{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.55;max-width:74ch}
.wk-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;align-items:center}
.wk-right{display:flex;flex-direction:column;gap:6px;align-items:flex-end;padding-top:2px}

/* ═══════════ chips ═══════════ */
.chip{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:0;padding:2px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-soft);white-space:nowrap}
.chip.track{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.chip.note{background:var(--warn-bg);border-color:transparent;color:var(--warn-ink)}
.chip.alan{background:var(--alan-bg);border-color:transparent;color:var(--alan);font-weight:600}
.chip.ben{background:var(--ben-bg);border-color:transparent;color:var(--ben);font-weight:600}
.chip.both{background:linear-gradient(100deg,var(--alan-bg) 50%,var(--ben-bg) 50%);border-color:transparent;color:var(--ink);font-weight:600}
.chip.tbd{border-style:dashed;background:transparent;color:var(--ink-faint)}
.chip.second{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.big{font-size:13px;padding:4px 12px}
.chip.count{background:var(--line-soft);border-color:transparent}

/* second call / proposed / alt lines under a week */
/* the tag says what the line is — no coloured rule down its side */
.wk-sub{display:flex;gap:9px;align-items:baseline;margin-top:9px;font-size:13px;color:var(--ink-soft)}
.wk-sub .tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);flex:none;padding-top:2px}
.wk-sub.proposed{color:var(--accent-ink)}
.wk-sub.proposed .tag{color:var(--accent)}

/* ═══════════ generic cards / columns ═══════════ */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
/* surfaces separate by fill: a brighter card on the paper, no outline, no shadow */
.card{background:var(--card);border:0;border-radius:var(--radius);padding:17px 18px;break-inside:avoid}
.card h4{font-family:var(--serif);font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  padding-bottom:10px;border-bottom:var(--hair) solid var(--line);margin-bottom:10px}
.card h4 .n{font-size:12px;color:var(--ink-soft);font-weight:500;letter-spacing:0}
.card ul{list-style:none}
.card li{font-size:13px;line-height:1.45;padding:6px 0 6px 16px;position:relative;border-bottom:var(--hair) solid var(--line)}
.card li:last-child{border-bottom:none}
.card li::before{content:"";position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--line-strong)}
.card li.used::before{background:var(--good)}
.card li .when{font-size:12px;font-weight:500;color:var(--good);margin-left:6px;white-space:nowrap;letter-spacing:0}
.card li.sched::before{background:var(--accent)}
.card li .when.sched{color:var(--accent)}

/* ═══════════ tables ═══════════ */
.tbl{background:var(--card);border:0;border-radius:var(--radius);overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.grid th{text-align:left;font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:600;padding:13px 14px 9px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
table.grid td{padding:11px 14px;border-bottom:var(--hair) solid var(--line);vertical-align:top}
table.grid tr:last-child td{border-bottom:none}
table.grid tbody tr{transition:background .12s}
table.grid tbody tr:hover{background:var(--paper-deep)}
table.grid td.num{color:var(--ink-soft);font-size:12px;width:34px}
table.grid td.dt{font-family:var(--monof);font-size:12px;color:var(--ink-soft);white-space:nowrap;width:96px}
table.grid tr.nocall td{color:var(--ink-faint);font-style:italic}
#teamBoard table.grid{min-width:880px}
.sec-title{font-family:var(--serif);font-size:18px;font-weight:600;margin:34px 0 12px;display:flex;align-items:baseline;gap:10px;letter-spacing:-.011em}
.sec-title .n{font-family:var(--sans);font-size:12px;color:var(--ink-soft);font-weight:500;letter-spacing:0}
/* an empty board says what's missing, then why or what to do, then (where it helps)
   one way out — no box around it. .sm is the size that sits inside a drawer or a card. */
.empty-note{text-align:center;padding:44px 20px 40px;max-width:60ch;margin:0 auto}
.empty-note .en-t{font-size:16px;font-weight:600;line-height:22px;letter-spacing:-.005em;color:var(--ink)}
.empty-note .en-l{font-size:13px;line-height:1.5;color:var(--ink-soft);margin-top:4px}
.empty-note .en-a{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.empty-note.sm{padding:18px 12px}
.empty-note.sm .en-t{font-size:14px;line-height:20px}
.empty-note.err .en-l{color:var(--bad)}
/* the coach-key gate: a card, since it holds a field */
.gate{max-width:460px;margin:40px auto;text-align:center;background:var(--card);border-radius:var(--radius);box-shadow:var(--elev-1);padding:28px 26px 26px}
.gate .en-t{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.015em}
.gate .en-l{font-size:13px;color:var(--ink-soft);margin:8px 0 18px;line-height:1.55}
.gate .en-l .gate-err{color:var(--bad);margin-top:8px}
/* loading: placeholder rows shaped like the board on its way. They stay invisible for
   the first 300 ms, so a quick load never flashes them, then fade in and breathe. */
.page-head+.skel,.page-head+.empty-note{margin-top:28px}
table.grid.sk-table{min-width:0}
#view .skel.wait,.skel.wait{animation:skelIn .24s var(--ease-out) var(--skel-wait,300ms) both}   /* #view: outranks the tab's entrance fade */
@keyframes skelIn{from{opacity:0}}
.skel .sk{display:block;height:9px;border-radius:5px;background:var(--fill-hover);animation:skelBreathe 1.1s ease-in-out infinite alternate}
.skel .sk+.sk{margin-top:8px;height:7px;background:var(--fill)}
.skel .sk.chip{height:18px;border-radius:999px;background:var(--fill)}
.skel .sk.sq{width:26px;height:26px;border-radius:6px;margin:0 auto;background:var(--fill)}
.skel th .sk{height:7px;width:44px;background:var(--fill)}
.skel td{vertical-align:middle}
@keyframes skelBreathe{to{opacity:.55}}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ═══════════ editing ═══════════ */
[data-edit]{border-radius:4px;transition:background .12s,box-shadow .12s}
body.editing [data-edit]{cursor:text;box-shadow:inset 0 -1px 0 var(--line-strong);min-height:1.2em;display:inline-block;min-width:44px}
body.editing [data-edit]:hover{background:var(--accent-soft)}
body.editing [data-edit]:focus{background:var(--card-raised);box-shadow:0 0 0 2px var(--accent);outline:none}
/* A field that stays live with Edit off (an Orders of Business note) gets Edit
   mode's minimum box while you're in it. Clicking "+ note" blanks it, and with
   no box it shrank to nothing mid-click: the row slid under the pointer, the
   caret landed outside the field, and typing went nowhere. */
[data-edit][data-live]:focus{display:inline-block;min-width:44px;min-height:1.2em}
body.editing .wk-topic.empty{color:var(--ink-faint)}
.edit-banner{display:none;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;padding:11px 15px;
  font-size:13px;color:var(--accent-ink);margin:20px 0 0;align-items:center;gap:12px;flex-wrap:wrap}
body.editing .edit-banner{display:flex}
.edit-banner b{font-weight:600}
.edit-banner .grow{flex:1}

/* controls that only exist while Edit is on */
.edit-only{display:none!important}
body.editing .edit-only{display:inline-block!important}
body.editing th.edit-only,body.editing td.edit-only{display:table-cell!important;width:28px}
.del{border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:16px;line-height:1;padding:2px 5px;border-radius:5px;vertical-align:middle;transition:background .12s,color .12s}
.del:hover{background:var(--bad-bg);color:var(--bad)}
.card h4 .del{margin-left:auto}
.card li .del{float:right;opacity:.5}
.card li:hover .del{opacity:1}
/* Edit shows a week's add / off / clear controls under the pointer, not on all
   fifty-two weeks at once (touch screens have no hover, so they always show). They
   stay up while the week's + Add… menu is open, since the menu grows out of it. */
body.editing .wk-tools{display:block!important;margin:6px 0 0 -10px}
body.editing .week :is(.wk-tools,.slot>.del,.snote>.del,.wk-date .del,.slot-pick){opacity:0;transition:opacity .2s var(--ease-out)}
body.editing .week:is(:hover,:focus-within,:has([data-menu][aria-expanded="true"])) :is(.wk-tools,.slot>.del,.snote>.del,.wk-date .del,.slot-pick){opacity:1;transition-duration:0s}
@media (hover:none){body.editing .week :is(.wk-tools,.slot>.del,.snote>.del,.wk-date .del,.slot-pick){opacity:1}}

/* ═══════════ orders of business ═══════════ */
.biz{background:var(--card);border:0;border-radius:var(--radius);overflow:hidden;margin-bottom:6px}
.biz-row{display:grid;grid-template-columns:30px minmax(0,1fr) 112px 92px 20px;gap:10px;align-items:center;padding:11px 16px;
  border-bottom:var(--hair) solid var(--line);transition:background .12s}
.biz-row:last-of-type{border-bottom:none}
.biz-row:hover{background:var(--paper-deep)}
.biz-row.is-done{opacity:.5}
.biz-row.is-done .biz-note,.biz-row.is-done .due{text-decoration:line-through}
.biz-row.flash{animation:flash 2.6s ease-out}
@keyframes flash{0%,55%{background:var(--accent-soft)}100%{background:transparent}}
/* only the row that just changed: render() rebuilds every row, so a bare .tick.on would replay on each redraw */
.biz-row.flash .tick{animation:tickpop var(--spring-dur) var(--spring-bouncy)}
@keyframes tickpop{from{transform:scale(.6)}to{transform:none}}
.del.always{display:inline-block!important}
.biz-row.is-done .biz-t{text-decoration:line-through}
.biz-main{min-width:0}
.biz-t{font-size:14px;line-height:1.4}
.biz-note{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
.tick{width:22px;height:22px;border:1.5px solid var(--line-strong);border-radius:7px;background:var(--card-raised);cursor:pointer;
      display:grid;place-items:center;font-size:13px;color:transparent;padding:0;line-height:1}
.tick:hover{border-color:var(--mark-call)}
.tick.on{background:var(--mark-call);border-color:var(--mark-call);color:var(--on-mark)}
.chip.who{justify-self:start;font-size:11px}
.due{font-size:12px;font-weight:500;text-align:right;color:var(--ink-soft);white-space:nowrap;letter-spacing:0}
.due [data-ph],.chip.who [data-ph]{border-bottom:1px dashed var(--line-strong)}
.due.over{color:var(--bad);font-weight:600}
.due.soon{color:var(--warn)}
.due.later{color:var(--ink-soft)}
.biz .btn.sm{margin:10px 16px}
/* the "add a task" line at the top of the list. Always there — adding a task
   is everyday work, so it doesn't wait for Edit mode. The dashed box sits in
   the tick column so what you type lines up with the titles below it. */
.biz-add{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:var(--hair) solid var(--line);background:var(--paper-deep)}
.biz-add:focus-within{background:var(--card-raised)}
.biz-add .plus{width:22px;height:22px;margin-right:8px;flex:none;display:grid;place-items:center;border:1.5px dashed var(--line-strong);
  border-radius:7px;color:var(--ink-faint);font-size:14px;line-height:1}
.biz-add input{flex:1;min-width:0;border:none;background:transparent;font-family:var(--sans);font-size:14px;color:var(--ink);padding:5px 0}
.biz-add input::placeholder{color:var(--ink-faint)}
.biz-add input:focus{outline:none}
.biz-add .to{font-size:12px;letter-spacing:0;color:var(--ink-soft);white-space:nowrap;
  max-width:34%;overflow:hidden;text-overflow:ellipsis}
.biz .biz-add .btn.sm{margin:0;flex:none}
.biz-t [data-ph]{color:var(--ink-faint);font-style:italic}
/* the title and note take a click with Edit off, so they look like it when you're in one */
.biz [data-live]{cursor:text}
.biz [data-live]:focus{background:var(--card-raised);box-shadow:0 0 0 2px var(--accent);outline:none}
/* topic · urgency · importance sit under the title as small chips. Set ones always
   show; unset ones (and an empty note, below) wait until the row is under the pointer
   or holds the focus, the way Edit's week tools do, so sixty-odd rows don't carry 260
   placeholders. A touch screen has no pointer, so there they always show. They keep
   their room while hidden, so nothing moves when they appear, and they never print or
   export. */
.biz-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.chip.bz{cursor:pointer;line-height:1.35}
.chip.bz.empty{border-style:dashed;border-color:var(--line-strong);background:transparent;color:var(--ink-faint)}
.biz-row :is(.chip.bz.empty,.biz-note [data-ph]){opacity:0;transition:opacity .2s var(--ease-out)}
.biz-row:is(:hover,:focus-within,:has(.picking)) :is(.chip.bz.empty,.biz-note [data-ph]){opacity:1;transition-duration:0s}
@media (hover:none){.biz-row :is(.chip.bz.empty,.biz-note [data-ph]){opacity:1}}
.chip.topic{background:var(--brass-soft);border-color:transparent;color:var(--brass);font-weight:600}
/* the section an item belongs to — the list is flat, so this is the only place it shows */
.chip.sec{background:var(--paper-deep);border-color:transparent;color:var(--ink-soft);font-weight:600}
/* every row carries a note line; an empty one is a "+ note" that shows with the chips above */
.biz-note [data-ph]{color:var(--ink-faint);font-style:italic}
.biz-row.is-done .biz-note.empty{display:none}
.chip .lk{opacity:.72;font-weight:500}
/* 1 is the top of both scales, so 1 is the hottest colour and 5 the quietest */
.chip.lv1{background:var(--bad-bg);border-color:transparent;color:var(--bad);font-weight:600}
.chip.lv2{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
.chip.lv3{background:var(--warn-bg);border-color:transparent;color:var(--warn-ink);font-weight:600}
.chip.lv4{background:var(--paper-deep);border-color:transparent;color:var(--ink-soft)}
.chip.lv5{background:var(--card);color:var(--ink-faint)}
.chip.lvn{padding:2px 0;width:24px;text-align:center;flex:none}
.tb-row2{flex-basis:100%}
select.fsel{font-family:var(--sans);font-size:13px;line-height:18px;font-weight:500;letter-spacing:0;padding:6px 10px;border:1px solid transparent;
  border-radius:10px;background-color:var(--fill);color:var(--ink);max-width:220px;cursor:pointer}
select.fsel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring)}
/* the topic / urgency / importance picker — the popover shell is shared (see "popovers") */
#bizPop{z-index:320;width:236px;overflow:hidden}
#bizPop .pp-list{max-height:46vh}
#bizPop .pp-item.on{background:var(--paper-deep)}
#bizPop .pp-new{grid-template-columns:1fr auto}
#bizPop .pp-new .search{grid-column:auto;width:auto;min-width:0}

/* ═══════════ modal ═══════════ */
.scrim{position:fixed;inset:0;background:var(--dim);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);
  z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
.scrim.on{display:flex;animation:fadeIn .2s var(--ease-out)}
.modal{background:var(--card-raised);border:0;border-radius:16px;max-width:640px;width:100%;max-height:82vh;
  overflow:auto;padding:26px;box-shadow:var(--elev-3)}
.scrim.on .modal{animation:sheetIn var(--spring-dur) var(--spring)}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes fadeIn{from{opacity:0}}
.modal h3{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:7px;letter-spacing:-.015em}
.modal p{font-size:13px;color:var(--ink-soft);margin-bottom:14px;line-height:1.6}
.modal textarea{width:100%;height:240px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;border:1px solid var(--line);
  border-radius:10px;padding:12px;background:var(--paper);color:var(--ink);resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* toasts — what just happened, at the foot of the screen. A plain one goes by
   itself after 2.6 s. An error stays until you deal with it: tinted with the
   error colour, with Dismiss and (when there's something to redo) Retry. Errors
   stack above the plain one, and sit above the drawer's dimmed page. */
.toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:400;width:max-content;
  max-width:min(560px,calc(100vw - 32px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:13px;line-height:18px;font-weight:500;letter-spacing:0;
  padding:11px 20px;border-radius:12px;box-shadow:var(--elev-3);text-align:center;max-width:100%;
  animation:toastIn var(--spring-dur) var(--spring);transition:opacity .16s var(--ease-out),transform .16s var(--ease-out)}
.toast.out{opacity:0;transform:translateY(8px) scale(.98)}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.97)}}
.toast.err{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;text-align:left;padding:9px 9px 9px 14px;
  background:color-mix(in oklab,var(--bad) 9%,var(--card-raised));color:var(--ink);
  border:1px solid color-mix(in oklab,var(--bad) 34%,transparent)}
.toast.err .t-msg{flex:1 1 240px;display:flex;gap:10px;align-items:flex-start;font-weight:500}
.toast.err .t-msg::before{content:"!";flex:none;width:18px;height:18px;border-radius:50%;background:var(--bad);color:var(--on-accent);
  font-size:12px;font-weight:700;line-height:18px;text-align:center}
.toast.err .t-acts{display:flex;gap:6px;margin-left:auto}
.toast.err .t-retry{background:var(--bad);color:var(--on-accent)}
.toast.err .t-retry:hover{background:color-mix(in oklab,var(--bad) 86%,var(--ink));color:var(--on-accent)}

footer{border-top:var(--hair) solid var(--line-strong);margin-top:64px;padding-top:20px;font-size:12px;
  letter-spacing:0;color:var(--ink-soft);display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--ink-soft)}

/* page entrance — replayed on tab switches only. A quick crossfade: switching
   tabs is navigation, not a show, so nothing slides or staggers in. */
@keyframes pageIn{from{opacity:0}}
#view.page-enter>*{animation:pageIn .2s var(--ease-out) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}
  /* not decoration: a spinner says something is happening, and the placeholder rows
     still wait out their 300 ms (they just appear instead of fading in) */
  .is-saving::after{animation:spin 1.4s linear infinite!important}
  #view .skel.wait,.skel.wait{animation:skelIn 0s var(--skel-wait,300ms) both!important}}

/* ═══════════ responsive ═══════════ */
@media (max-width:1024px){
  .wrap,.tabs-inner{padding:0 22px}
  .head-inner{padding:14px 22px 13px}
  .week{grid-template-columns:104px minmax(0,1fr);gap:14px}
}
@media (max-width:860px){
  .week{grid-template-columns:96px minmax(0,1fr)}
  .wk-right{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap;padding-top:0}
}
@media (max-width:760px){
  .wrap,.tabs-inner{padding:0 18px}
  .head-inner{padding:12px 18px 11px}
  .brand{gap:11px}
  .mark{width:36px;height:36px;font-size:18px;border-radius:9px}
  .brand h1{font-size:16px}
  .brand .sub{font-size:11px;margin-top:2px}
  .status #saveLabel{max-width:110px}
  .tab-primary{font-size:14px;margin-right:20px;padding:13px 2px 11px}
  .tab-sub{margin-right:18px}
  .tabs-primary,.tabs-sub{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .page-head{padding-top:32px}
  .page-head .lede{font-size:13px}
  .toolbar{padding:16px 0;gap:10px}
  .tb-filters{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
  .tb-filters::-webkit-scrollbar{display:none}
  .seg{flex:none}
  input.search{width:100%;flex:1 1 100%;min-width:0}
  .tb-actions{margin-left:0;width:100%}
  .stats{grid-template-columns:repeat(2,1fr);gap:12px 20px;margin-bottom:32px}
  .stat .val{font-size:28px}
  .season{margin-bottom:36px}
  .season-head h3{font-size:22px}
  .season-head .range{display:none}
  .week{margin:0;padding:13px 2px;border-radius:0}
  .biz-row{grid-template-columns:26px minmax(0,1fr) auto 20px;row-gap:6px}
  .biz-add .plus{margin-right:5px}                 /* the tick column is 26px here */
  .biz-add .to{display:none}                        /* the toast still names the section */
  .biz-main{grid-column:2 / 4}
  .chip.who{grid-column:2;grid-row:2;justify-self:start}
  .due{grid-column:3;grid-row:2;justify-self:start;text-align:left}
  .biz-row .del,.biz-row .del.always{grid-column:4;grid-row:1;justify-self:end}
}
@media (max-width:600px){
  .head-inner{flex-wrap:nowrap;gap:10px}
  .status #saveLabel{display:none}
  .head-right{gap:6px;flex-wrap:nowrap}
  header .btn{padding:7px 12px;font-size:12px;line-height:16px}
  .brand h1{font-size:16px;white-space:nowrap}
  /* the standing call time is already in the lede — only per-week overrides
     earn a line in the narrow date column */
  .wk-time:not(.custom){display:none}
}

/* ═══════════ print / PNG export ═══════════ */
.export-frame{background:var(--paper)}
body.exporting .no-export,body.exporting nav.tabs,body.exporting header{display:none!important}
body.exporting .week:hover{background:none}
body.exporting::before{display:none}
@media print{
  @page{size:letter portrait;margin:12mm}
  body{padding:0;background:#fff}
  body::before{display:none}
  header,nav.tabs,.toolbar,.no-print,.edit-banner,footer .no-print,.scrim,.toasts{display:none!important}
  .wrap{max-width:100%;padding:0}
  /* a season runs on across pages (holding a 17-week season together pushed each one to a
     fresh page and left page 1 with only the stats); a week never splits, and a season's
     heading (or a section's, like the Backlog's) never sits alone at the foot of a page */
  .week,.card,tr{break-inside:avoid}
  .season-head,.sec-title{break-after:avoid;break-inside:avoid}
  a{text-decoration:none;color:var(--ink)}
  .print-head{display:block!important}
  .week.open{background:none;border-left:3px solid var(--accent);padding-left:8px;margin:0;border-radius:0}
  .week{margin:0;border-radius:0}
  .stat,.card,.tbl,table.grid{box-shadow:none}
  .tbl{overflow:visible;border-radius:0}
  table.grid,#teamBoard table.grid{min-width:0}
  .export-frame{background:#fff}
}
.print-head{display:none;padding-bottom:14px;margin-bottom:18px;border-bottom:2px solid var(--ink)}
.print-head .t{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.015em}
.print-head .s{font-size:12px;color:var(--ink-soft);margin-top:5px;letter-spacing:0}

/* ── tiers: T1 The Dojo (green) · T2 The Path (rust) · T3 The Masters (indigo) ── */
.tierchip{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.01em;
  border-radius:999px;padding:1px 8px;border:1px solid;background:transparent;vertical-align:1px;white-space:nowrap}
button.tierchip{cursor:pointer;font:inherit;font-family:var(--sans);font-size:11px;font-weight:600}
button.tierchip:hover{filter:brightness(.85)}
.tierchip.t1{color:var(--good);border-color:var(--good)}
.tierchip.t2{color:var(--accent);border-color:var(--accent)}
.tierchip.t3{color:var(--tier3);border-color:var(--tier3)}
.tierchip.t0{color:var(--ink-faint);border-color:var(--line);border-style:dashed}
/* ── call slots: A's stacked layout + C's per-call times ── */
.slot{display:flex;gap:10px;align-items:baseline;padding:6px 10px;margin:2px 0;border-radius:8px;min-width:0}
.slot+.slot{border-top:1px dashed var(--line-soft)}
.slot .stime{font-size:12px;color:var(--ink-soft);flex:none;min-width:44px}
.slot .sday{font-size:12px;font-weight:600;color:var(--ink-soft);flex:none}
.slot .sdate{font-size:12px;font-weight:600;color:var(--ink-soft);flex:none;min-width:54px}
.slot .stag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;flex:none;min-width:60px;color:var(--ink-faint)}
.slot.second .stag{color:var(--accent-ink)}
.slot.hot .stag{color:var(--warn);min-width:78px}
.slot .stopic{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-.008em;min-width:0;flex:1;overflow-wrap:break-word}
.slot.second .stopic,.slot.hot .stopic{font-size:14px;font-weight:500}
.slot .stopic.empty{font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:0;color:var(--ink-faint)}
/* the tier is a dot in front of the topic, not a coloured rule down the slot's side */
.slot:is(.t1,.t2,.t3) .stopic:not(.empty)::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  margin:0 8px 0 0;vertical-align:.18em}
.slot.t1 .stopic::before{background:var(--good)}
.slot.t2 .stopic::before{background:var(--accent)}
.slot.t3 .stopic::before{background:var(--tier3)}
.slot.hot{background:linear-gradient(90deg,var(--warn-bg),transparent 72%)}
.slot-pick{border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:13px;padding:3px 6px;flex:none;border-radius:6px}
.slot-pick:hover{color:var(--accent);background:var(--accent-soft)}
.slot.guest{background:linear-gradient(90deg,var(--brass-soft),transparent 72%)}
.spk{font-size:12px;font-weight:500;color:var(--brass);flex:none;white-space:nowrap}
.typesel,.tiersel{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:0;
  border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink-soft);
  padding:5px 8px;flex:none;cursor:pointer;max-width:130px}
.tiersel.t1{color:var(--good);border-color:var(--good)}
.tiersel.t2{color:var(--accent);border-color:var(--accent)}
.tiersel.t3{color:var(--tier3);border-color:var(--tier3)}
.snote{display:flex;gap:8px;align-items:baseline;padding:2px 10px 2px 34px;font-size:13px;color:var(--ink-soft)}
.snote .ntag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);flex:none}
.snote .ntext{min-width:0;flex:1}
.week.off .wk-main{text-decoration:line-through;opacity:.45}
.week.off .wk-main .edit-only{text-decoration:none}
.week.off .wk-date b{text-decoration:line-through}
.count.offb{background:var(--paper-deep);color:var(--ink-soft);text-decoration:none;letter-spacing:0}
.count{font-size:12px;font-weight:600;letter-spacing:0;color:var(--accent-ink);
  background:var(--accent-soft);border-radius:999px;padding:1px 8px;display:inline-block;margin-top:5px}
/* (Topic Bank rows used to carry a tier stripe too; their tier chip already says it) */

/* ═══════════ popovers ═══════════
   One shell for every pop-up picker and menu: a frosted material, the menu
   elevation, and a spring that grows it out of whatever you clicked
   (--pop-x/--pop-y, set by popOrigin() when it opens). Closing is a quick fade,
   no shrink. .hidden keeps its layout, so the openers can still measure it. */
:is(#pickPop,#datePop,#timePop,#whoPop,#bizPop,#ciPop,#menuPop){position:fixed;max-width:94vw;
  background:color-mix(in oklab,var(--card-raised) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.8) blur(24px);backdrop-filter:saturate(1.8) blur(24px);
  border:0;border-radius:12px;box-shadow:var(--elev-2);
  transform-origin:var(--pop-x,50%) var(--pop-y,0);
  transition:opacity .16s var(--ease-out),transform var(--spring-dur) var(--spring)}
:is(#pickPop,#datePop,#timePop,#whoPop,#bizPop,#ciPop,#menuPop).hidden{
  visibility:hidden;opacity:0;transform:scale(.94);pointer-events:none;
  transition:opacity .12s ease-in,visibility 0s .12s,transform 0s .12s}
/* a menu: the toolbar's rare actions, and Edit's per-week add / off / clear */
#menuPop{z-index:320;min-width:200px;padding:5px}
#menuPop .mi{display:block;width:100%;text-align:left;background:none;border:0;border-radius:7px;cursor:pointer;
  font-family:var(--sans);font-size:13px;line-height:18px;font-weight:500;padding:7px 10px;color:var(--ink);white-space:nowrap}
#menuPop .mi:hover,#menuPop .mi:focus-visible{background:var(--accent);color:var(--on-accent);outline:none}
#menuPop .mi[disabled]{opacity:.45;pointer-events:none}
#menuPop .mi.danger{color:var(--bad)}
#menuPop .mi.danger:hover{background:var(--bad);color:var(--on-accent)}
#menuPop hr{border:0;border-top:var(--hair) solid var(--line-strong);margin:5px 8px}

/* ── topic picker popover ── */
#pickPop{z-index:300;width:380px;display:flex;flex-direction:column}
/* ═══════════ the date picker — every date on the board is clicked, not typed ═══════════ */
#datePop{z-index:320;width:272px;overflow:hidden}
.dp-head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:var(--hair) solid var(--line-strong)}
.dp-head .m{flex:1;text-align:center;font-family:var(--serif);font-size:14px;font-weight:600}
.dp-nav{border:0;background:var(--fill);border-radius:8px;cursor:pointer;font:inherit;
  font-size:13px;line-height:1;padding:7px 10px;color:var(--ink-soft)}
.dp-nav:hover{background:var(--fill-hover);color:var(--ink)}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px 8px 4px}
.dp-dow{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  text-align:center;color:var(--ink-faint);padding:2px 0}
.dp-d{border:1px solid transparent;background:none;border-radius:8px;cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:500;padding:6px 0;color:var(--ink)}
.dp-d:hover{background:var(--paper-deep)}
.dp-d.out{color:var(--ink-faint)}
.dp-d.wk{background:var(--accent-soft)}
.dp-d.today{border-color:var(--accent)}
.dp-d.on{background:var(--accent);color:var(--on-accent);font-weight:700;border-color:var(--accent)}
.dp-hint{font-size:12px;color:var(--ink-soft);text-align:center;padding:2px 10px 8px}
.dp-foot{display:flex;gap:6px;padding:8px 10px;border-top:var(--hair) solid var(--line-strong);flex-wrap:wrap}
/* the time picker — every call time is Central, so the popup says so once */
#timePop{z-index:320;width:178px;overflow:hidden}
.tp-list{overflow:auto;max-height:46vh;padding:5px}
.tp-item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;
  border-radius:7px;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:500;padding:6px 10px;color:var(--ink)}
.tp-item:hover{background:var(--hover)}
.tp-item.hour{font-weight:700}
.tp-item.on{background:var(--accent);color:var(--on-accent);font-weight:700}
/* who's on the call — the same shell again, listing chips instead of times */
#whoPop{z-index:320;width:236px;overflow:hidden}
#whoPop .pp-list{max-height:46vh}
#whoPop .pp-item.on{background:var(--paper-deep)}
/* the thing you click to open it — a dashed outline says "this is settable" */
.dpick{font:inherit;color:inherit;background:none;border:1px dashed transparent;border-radius:6px;
  cursor:pointer;padding:1px 5px;text-align:left}
.dpick:not(.chip):hover,.dpick:not(.chip):focus-visible{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.chip.dpick{cursor:pointer;line-height:1.35}
.chip.dpick:hover,.chip.dpick:focus-visible{filter:brightness(.93)}
body.editing .chip.dpick.empty{border-style:dashed;border-color:var(--line-strong)}
body.editing .dpick,.dpick.always{border-color:var(--line)}
.dpick.empty{color:var(--ink-faint)}
/* ═══════════ assignments tab ═══════════ */
table.aboard{min-width:0}
table.aboard th.ah{text-align:center;max-width:120px;white-space:normal;vertical-align:bottom;padding:10px 6px 8px}
table.aboard th.ah .at{font-family:var(--sans);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
table.aboard th.ah small{display:block;font-size:11px;color:var(--ink-faint);margin-top:3px;letter-spacing:0;text-transform:none}
table.aboard td.an{white-space:nowrap}
/* the name column holds at the left edge when the board scrolls sideways (on a phone, or
   with a long list), as the check-in boards' does, so a row's squares never lose its name.
   Paper and the PNG don't scroll: there it's the plain column it always was. */
table.aboard th.mentee,table.aboard td.an{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--line)}
table.aboard th.mentee{z-index:2}
table.aboard tbody tr:hover td.an{background:var(--paper-deep)}
.png-holder table.aboard :is(th.mentee,td.an),body.exporting table.aboard :is(th.mentee,td.an){position:static!important;background:none!important;box-shadow:none!important}
@media print{table.aboard :is(th.mentee,td.an){position:static!important;background:none!important;box-shadow:none!important}}
/* on a phone a name's chips (rep ID, "former") go on a line under it, as on the check-ins board,
   so the frozen column is ~130px of the board, not ~210, and ~4 squares show beside it. Screen only,
   and never in what's exported: Print and the PNG's measuring run under body.exporting, and the
   PNG's copy sits outside #view, so there the chips stay on the name's line */
@media screen and (max-width:640px){
  body:not(.exporting) #view table.aboard td.an .an-sub{display:flex;gap:5px;margin-top:4px}
  body:not(.exporting) #view table.aboard td.an .an-sub .chip{font-size:11px;padding:2px 7px}
}
table.aboard td.ac{text-align:center;padding:6px}
table.aboard tr.agrp td{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);padding:14px 14px 6px;background:var(--paper-deep)}
table.aboard td.tot{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.sq{position:relative;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;border:none;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:600;line-height:1;color:var(--on-mark)}
.sq.open{background:var(--mark-open);color:var(--mark-open-ink)}       /* cream on this yellow was 1.85:1; this is 6.4:1 */
.sq.late{background:var(--mark-missed)}
.sq.na{background:var(--mark-off);box-shadow:inset 0 0 0 1px var(--mark-off-ring)}
.sq.waiting,.sq.revise,.sq.approved{background:var(--mark-call)}
.alegend{display:flex;flex-wrap:wrap;gap:12px 20px;margin:12px 2px 0;font-size:13px;color:var(--ink-soft)}
.alegend span{display:inline-flex;align-items:center;gap:7px}
.alegend .sq{width:16px;height:16px;border-radius:4px;font-size:11px;cursor:default}
.alegend .sq:hover{transform:none;box-shadow:none}
.apill{display:inline-block;font-size:12px;letter-spacing:0;border-radius:999px;padding:1px 9px;font-weight:600}
.apill.open{background:var(--warn-bg);color:var(--warn-ink)}
.apill.late{background:var(--bad-bg);color:var(--bad)}
.apill.waiting,.apill.revise,.apill.approved{background:var(--good-bg);color:var(--good)}
.apill.na{background:var(--line-soft);color:var(--ink-faint)}
.ainstr{font-size:12px;color:var(--ink-soft);margin-top:2px;max-width:52ch}
.aform{background:var(--card);border:1px solid var(--line-strong);border-radius:10px;padding:14px;display:grid;gap:10px;margin-bottom:12px}
.aform textarea,.ad-form textarea{width:100%;min-height:110px;font-family:var(--sans);font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);resize:vertical}
.aform input[type=date],.ad-form input[type=date]{font-family:var(--monof);font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.ad-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ad-sub{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);display:inline-flex;gap:8px;align-items:center}
/* review drawer — a sheet: it comes in on the iOS sheet curve over a dimmed page,
   and clicking the dimmed page closes it (unless that would lose what you typed:
   then the drawer shakes instead — see drawerScrimClick) */
/* closed, it's hidden outright once it has slid away — parked just off the right
   edge, its shadow used to shade the page's right side on screen and in print */
.adrawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:96vw;background:var(--card-raised);border-left:0;box-shadow:var(--elev-3);z-index:320;display:flex;flex-direction:column;
  transform:translateX(102%);visibility:hidden;transition:transform .3s var(--ease-sheet),visibility 0s .3s}
.adrawer.on{transform:none;visibility:visible;transition:transform .5s var(--ease-sheet),visibility 0s}
@media print{.adrawer,#menuPop{display:none!important}}
@keyframes nope{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.adrawer.nope{animation:nope .4s var(--ease-out)}
body::before{content:"";position:fixed;inset:0;z-index:310;background:var(--dim-soft);opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease-out)}
body:has(#adrawer.on)::before{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.adrawer{transition:none}}
.ad-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ad-head .t{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.015em}
.ad-head .s{font-size:13px;color:var(--ink-soft);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ad-body{padding:16px 20px;overflow:auto;flex:1;min-height:0;display:grid;gap:12px;align-content:start}
.ad-ver{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;background:var(--card)}
.ad-ver .vh{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
.ad-ver .vt{white-space:pre-wrap}
.ad-fb{margin-top:8px;border-left:3px solid var(--accent);padding:6px 10px;background:var(--accent-soft);border-radius:0 8px 8px 0}
.ad-form{display:grid;gap:8px}
details.ad-more{border-top:1px solid var(--line);padding-top:10px}
details.ad-more summary{cursor:pointer;font-family:var(--monof);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.pp-head{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.pp-head .search{flex:1}
.pp-list{overflow:auto;max-height:44vh;padding:6px}
.pp-cat{font-family:var(--monof);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-faint);padding:9px 8px 3px}
.pp-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;
  border:none;border-radius:8px;padding:6px 8px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.pp-item:hover{background:var(--hover)}
.pp-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.pp-dot.t1{background:var(--good)} .pp-dot.t2{background:var(--accent)} .pp-dot.t3{background:var(--tier3)}
.pp-tier{margin-left:auto;font-size:11px;font-weight:600}
.pp-tier.t1{color:var(--good)} .pp-tier.t2{color:var(--accent)} .pp-tier.t3{color:var(--tier3)}
.pp-new{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;padding:10px;border-top:var(--hair) solid var(--line-strong)}
.pp-new .search{grid-column:1 / -1}
.pp-new select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;
  background:var(--paper);color:var(--ink);padding:4px 6px;max-width:150px}

/* ── Automations switches (Mentees tab) ── */
.sw-card{background:var(--card);border:0;border-radius:var(--radius);padding:14px 18px;margin:0 0 16px}
.sw-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.sw-title{font-weight:600;font-size:14px}
.sw-hint{font-size:12px;color:var(--ink-soft);line-height:1.5}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 28px}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-top:var(--hair) solid var(--line)}
.sw-name{font-size:13px;font-weight:600}
/* a real switch: the knob travels on a spring, stretches under the press, and the
   track fills green. ON/OFF stays written beside it, because OFF is the exception. */
.sw-toggle{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:2px 0;cursor:pointer;font:inherit}
.sw-toggle .sw-knob{position:relative;width:38px;height:22px;border-radius:11px;background:var(--fill-strong);
  transition:background-color .2s var(--ease-out)}
.sw-toggle .sw-knob::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:9px;background:var(--knob);
  box-shadow:0 1px 2px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.06);
  transition:transform var(--spring-dur) var(--spring),width .2s var(--ease-out)}
.sw-toggle.on .sw-knob{background:var(--mark-call)}
.sw-toggle.on .sw-knob::after{transform:translateX(16px)}
.sw-toggle:active .sw-knob::after{width:22px}
.sw-toggle.on:active .sw-knob::after{transform:translateX(12px)}
.sw-toggle[disabled] .sw-knob{animation:pulse .8s ease-in-out infinite alternate}   /* saving */
@keyframes pulse{to{opacity:.55}}
.sw-toggle .sw-state{font-size:12px;font-weight:600;letter-spacing:0;color:var(--ink-soft);min-width:24px;text-align:left}
.sw-toggle.on .sw-state{color:var(--good)}
.sw-toggle[disabled]{cursor:default}
.sw-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* per-mentee switches (Mentees rows): three small pills. OFF is the exception, so OFF is the loud one */
.rsw-col{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.rsw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;background:transparent;
  padding:2px 9px 2px 6px;cursor:pointer;font:inherit;font-size:12px;color:var(--ink-soft);white-space:nowrap}
.rsw .rsw-dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.rsw .rsw-state{font-size:11px;font-weight:700;letter-spacing:0}
.rsw.off{border-color:var(--bad);color:var(--bad);background:var(--paper-deep)}
.rsw.off .rsw-dot{background:var(--bad)}
.rsw[disabled]{opacity:.55;cursor:default}
.rsw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw-per{grid-column:1/-1;border-top:var(--hair) solid var(--line);padding-top:9px}
/* what a mentee pays (Mentees rows): a chip you click, then presets or an amount of your own */
.pay{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card);
  padding:3px 10px;cursor:pointer;font-family:var(--monof);font-size:12px;color:var(--ink);white-space:nowrap}
.pay:hover{border-color:var(--ink-faint)}
.pay.empty{border-style:dashed;background:transparent;color:var(--ink-faint)}
.pay.odd{border-style:dashed;background:var(--warn-bg);color:var(--warn-ink)}
.pay.cur{cursor:default}
.pay.cur:hover{border-color:var(--line)}
.pay.opt.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pay[disabled]{opacity:.55;cursor:default}
.pay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pay-ed{display:flex;flex-direction:column;gap:6px;margin-top:7px;min-width:190px}
.pay-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pay-ed input.search{width:78px;flex:0 0 78px;min-width:0;padding:5px 8px;font-size:13px}
.pay-ed select.btn{padding:4px 6px}
.pay-links{gap:12px;font-size:12px}
.pay-links a{color:var(--ink-soft)}
.pay-err{font-size:12px;color:var(--bad)}

/* ── Dojo rows: no coach picker, just the rule ── */
.nocoach{font-size:12px;color:var(--ink-faint);white-space:nowrap}
.chip.stale{border-style:dashed;background:transparent;color:var(--ink-faint)}
/* ── labelled filter groups (Mentees) + grouped board rows ── */
.fgroup{display:flex;align-items:center;gap:7px}
.flab{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap}
table.grid tr.grp td{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);padding:14px 14px 6px;background:var(--paper-deep)}
table.grid tr.grp td .n{color:var(--ink-faint);letter-spacing:0}
table.grid tr.grp:hover td{background:var(--paper-deep)}
/* A group's label spans every lane, so a board scrolled sideways (to this week, say)
   used to slide it out of view and leave an empty band. It holds at the left edge
   instead, where it sits unscrolled (the cell's 14px padding). Paper doesn't scroll. */
:is(table.grid tr.grp,table.aboard tr.agrp) td .glab{position:sticky;left:14px;display:inline-block}
.png-holder .glab,body.exporting .glab{position:static!important}
@media print{.glab{position:static!important}}

/* ═══════════ weekly check-ins ═══════════
   green = call · purple = 1-1 call · blue = voice note / texts · red = missed ·
   black = not needed. Blank squares are outlined; a past blank goes dashed. */
#ciBoard table.grid{min-width:0}
/* every week is its own bordered lane — the labels had 6px between them and
   read as one run-on string. The current week's lane is tinted top to bottom. */
table.ciboard th.cw{text-align:center;padding:10px 7px 9px;min-width:56px;border-left:1px solid var(--line-soft);vertical-align:bottom}
table.ciboard th.cw .wn{display:block;font-size:11px;font-weight:600;color:var(--ink-faint);letter-spacing:.04em}
table.ciboard th.cw .wd{display:block;font-size:12px;font-weight:500;color:var(--ink);letter-spacing:0;text-transform:none;margin-top:4px}
table.ciboard th.cw.cur,table.ciboard th.cw.cur.m1{background:var(--accent-tint);box-shadow:inset 0 3px 0 var(--accent)}
table.ciboard th.cw.cur .wn,table.ciboard th.cw.cur .wd{color:var(--accent);font-weight:600}
table.ciboard th.tt,table.ciboard td.tot{border-left:1px solid var(--line-soft)}
table.ciboard th.mentee,table.ciboard td.an{position:sticky;left:0;z-index:1;background:var(--card);box-shadow:1px 0 0 var(--line)}
table.ciboard th.mentee{vertical-align:bottom;z-index:2}
/* month bands: a heavier rule where a Vector month starts, alternate months faintly shaded */
table.ciboard tr.mrow th.mb{text-align:center;font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);
  padding:10px 8px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ciboard tr.mrow th.mb small{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;margin-left:7px}
table.ciboard th.mstart,table.ciboard td.cc.mstart{border-left:2px solid var(--line-strong)}
table.ciboard th.m1,table.ciboard td.cc.m1{background:var(--band)}
table.ciboard tbody tr:hover td.an{background:var(--paper-deep)}
table.ciboard td.an{white-space:nowrap;padding-right:18px}
table.ciboard td.an .an-sub{display:flex;gap:5px;margin-top:4px}
table.ciboard td.an .an-sub .chip{font-size:11px;padding:2px 7px}
table.ciboard td.cc{text-align:center;padding:7px 5px;border-left:1px solid var(--line-soft)}
.ci-scroll{font-size:12px;letter-spacing:0;color:var(--ink-soft);text-align:right;margin-top:6px;min-height:14px}
/* a PNG export widens to fit the whole board; paper can't, so it compresses the lanes instead */
body.exporting .tbl{overflow:visible}
@media print{
  table.ciboard th.cw{padding:6px 3px;min-width:0}
  table.ciboard th.cw .wd{font-size:11px}
  table.ciboard td.cc{padding:3px 2px}
  table.ciboard td.an{padding-right:8px}
  table.ciboard tr.mrow th.mb{font-size:12px;padding:6px 3px 4px}
}
table.ciboard td.cc.cur,table.ciboard td.cc.cur.m1{background:var(--accent-tint)}
table.ciboard td.tot{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.ci{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;border:1.5px solid transparent;cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:600;line-height:1;color:var(--on-mark);background:var(--line-soft);padding:0}
.ci.yes{background:var(--mark-call)}
.ci.one{background:var(--mark-1on1)}
.ci.text{background:var(--mark-text)}
.ci.no{background:var(--mark-missed)}
.ci.off{background:var(--mark-off);box-shadow:inset 0 0 0 1px var(--mark-off-ring)}
.ci.blank{background:var(--card-raised);border-color:var(--line)}
.ci.blank.due{border-style:dashed;border-color:var(--ink-faint)}
.ci.blank.fut{opacity:.5}
.ci.blank.cur{border-color:var(--accent)}
.cilegend{display:flex;flex-wrap:wrap;gap:10px 20px;margin:12px 2px 0;font-size:13px;color:var(--ink-soft)}
.cilegend span{display:inline-flex;align-items:center;gap:7px}
.cilegend .ci{width:16px;height:16px;border-radius:4px;font-size:11px;cursor:default}
.cilegend .ci:hover{transform:none;box-shadow:none}
#ciPop{z-index:300;width:264px;padding:8px}   /* the shell is shared — see "popovers" */
.cp-head{font-size:12px;letter-spacing:0;color:var(--ink-soft);padding:6px 8px 8px;border-bottom:var(--hair) solid var(--line-strong);margin-bottom:4px}
.cp-head b{display:block;font-family:var(--sans);font-size:14px;letter-spacing:0;color:var(--ink);font-weight:600;margin-bottom:2px}
.cp-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;border-radius:8px;
  padding:7px 8px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink);line-height:1.3}
.cp-opt:hover{background:var(--hover)}
.cp-opt.on{background:var(--accent-soft)}
.cp-opt:focus-visible{outline-offset:-2px}            /* the ring inside the row, round its corners */
.cp-opt:not(.on):focus-visible{background:var(--hover)}
.cp-opt .ci{width:20px;height:20px;border-radius:5px;font-size:11px;flex:none}
.cp-opt .ci:hover{transform:none;box-shadow:none}
.cp-opt small{display:block;font-size:12px;color:var(--ink-soft)}
@media (max-width:760px){.fgroup{flex:none}}
@media print{.ci{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ═══════════ call attendance ═══════════
   The check-in board's squares, one lane per call instead of per week. The
   extra shapes: a dot for "not expected on that call", a ringed green for a
   drop-in, and a small corner badge for how the replay is going. */
#atBoard table.grid{min-width:0}
table.atboard th.call{text-align:left;padding:9px 8px 8px;min-width:96px;max-width:118px;border-left:1px solid var(--line-soft);vertical-align:bottom}
table.atboard th.call .wn{display:block;font-size:11px;font-weight:600;color:var(--ink-faint);letter-spacing:.04em}
table.atboard th.call .ct{display:block;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink);letter-spacing:0;text-transform:none;
  margin:4px 0 5px;white-space:normal;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
table.atboard th.call .tl{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
table.atboard th.call .tally{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink);letter-spacing:0;text-transform:none}
table.atboard th.call .tally small{color:var(--good);margin-left:3px}
table.atboard th.call .tierchip{font-size:11px;padding:1px 5px}
table.atboard th.call button.rollhd{all:unset;cursor:pointer;display:block;border-radius:6px}
table.atboard th.call button.rollhd:hover .ct{color:var(--accent)}
table.atboard th.call button.rollhd:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table.atboard th.call .take{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:0;color:var(--accent);text-transform:none}
table.atboard th.call.cur{background:var(--accent-tint);box-shadow:inset 0 3px 0 var(--accent)}
table.atboard th.call.cur .wn{color:var(--accent);font-weight:600}
table.atboard th.call.fut{opacity:.45}
table.atboard td.cc.cur{background:var(--accent-tint)}
table.atboard td.an .flag2{margin-left:6px}
.ci{position:relative}
.ci.na{background:transparent;border:none;cursor:default}
.ci.na::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--line)}
.ci.na:hover{transform:none;box-shadow:none}
.ci.drop{background:var(--mark-call);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--mark-call)}
.ci.blank.pend{border-style:dashed;border-color:var(--accent)}
.mu{display:inline-block;min-width:16px;height:16px;border-radius:8px;padding:0 3px;font-style:normal;font-family:var(--sans);font-size:11px;line-height:16px;
  text-align:center;font-weight:700;color:var(--on-mark);background:var(--mark-none);box-shadow:0 0 0 1.5px var(--card)}
.ci .mu{position:absolute;top:-8px;right:-9px}
.mu.late{background:var(--mark-missed)}
.mu.waiting{background:var(--seal)}
.mu.revise{background:var(--mark-brass)}
.mu.approved{background:var(--mark-call)}
.mu.unsent{background:var(--card-raised);color:var(--ink-soft);box-shadow:0 0 0 1.5px var(--line-strong)}
.flag2{font-size:12px;font-weight:600;letter-spacing:0;color:var(--bad);background:var(--bad-bg);border-radius:999px;padding:1px 8px;white-space:nowrap}
.at-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 14px;padding:10px 14px;
  border:1px solid var(--warn);background:var(--warn-bg);border-radius:10px;font-size:13px}
.at-banner.err{border-color:var(--bad);background:var(--bad-bg)}
/* the roll-call drawer */
.rc-exp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.rc-tally{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rc-tally .chip{font-size:12px;padding:4px 10px}
.rc-actions{display:flex;gap:8px;align-items:center}
.rc-actions .search{flex:1;min-width:0;width:auto}
.rc-sec{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);margin-top:6px}
.rc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.rc-row.on{border-color:var(--mark-call);background:color-mix(in oklab,var(--mark-call) 9%,var(--card))}
.rc-row.ex{background:var(--paper-deep)}
.rc-name{min-width:0}
.rc-name b{font-size:14px}
.rc-name .an-sub{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.rc-name .chip{font-size:11px;padding:2px 7px}
.rc-seg{display:flex;gap:4px;flex-shrink:0}
.rc-seg button{font-family:var(--sans);font-size:13px;font-weight:500;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card-raised);color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.rc-seg button:disabled{opacity:.5;cursor:default}
.rc-seg button.here.on{background:var(--mark-call);border-color:var(--mark-call);color:var(--on-mark);font-weight:600}
.rc-seg button.exc.on{background:var(--mark-off);border-color:var(--mark-off);color:var(--on-mark);box-shadow:inset 0 0 0 1px var(--mark-off-ring)}
.rc-guest{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px dashed var(--line-strong);border-radius:10px}
.rc-guest .step{display:flex;align-items:center;gap:10px;font-family:var(--monof);font-size:16px}
.rc-guest small,.rc-mu small{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.45}
.rc-mu{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.rc-mu .ad-row input{flex:1;min-width:0;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.rc-mu .who{display:flex;gap:5px;flex-wrap:wrap}
.rc-msg{font-size:13px;color:var(--good)}
.rc-msg.err{color:var(--bad)}
.rc-msg.busy{color:var(--ink-soft)}
.rc-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft)}
.rc-add{font-family:var(--sans);font-size:13px;padding:7px 9px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--card-raised);color:var(--ink-soft);justify-self:start;max-width:100%}
/* the calendar's roll chip — counts only, never names; the names are behind the coach key */
.chip.roll{background:var(--good-bg);border-color:transparent;color:var(--good);font-weight:600;cursor:pointer}
.chip.rollopen{background:transparent;border-color:var(--accent);color:var(--accent);font-weight:600;cursor:pointer}
.chip.rollopen:hover{background:var(--accent);color:var(--on-accent)}

/* ═══════════ phones — the campaign calendar as a stack, not a two-column ledger ═══════════
   On a 390px screen the desktop row (96px date column + time + type + host, then
   the topic in whatever is left) squeezed the topic into a sliver one letter wide.
   Under 640px every week becomes a stack: a one-line date header, the topic on
   its own full-width line, then a small row of time · type · host beneath it. */
@media (max-width:640px){
  .wrap,.tabs-inner{padding:0 16px}
  .page-head{padding-top:26px;gap:16px}
  .page-head .lede{margin-top:8px;max-width:none}
  .next-call{padding:12px 15px 13px}
  .toolbar{margin-bottom:22px}
  .stats{gap:12px 16px;margin-bottom:26px}
  .stat .val{font-size:22px}
  .season{margin-bottom:30px}
  .season-head{gap:10px;padding-bottom:9px}
  .season-head h3{font-size:18px}
  .season-head .fill{font-size:12px}

  .week{grid-template-columns:minmax(0,1fr);gap:7px;padding:14px 0}
  /* the date column turns into one header line: Jan 6 · Tue · WK 01 · [2 calls] */
  .wk-date{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 9px;padding-top:0;font-size:13px}
  .wk-date b{display:inline;order:-1;font-size:16px}
  .wk-date .wknum{order:1}
  .wk-date .count{order:1;margin-top:0}
  .wk-date .del{order:2;margin-left:auto}
  .wk-date .dpick{padding:1px 4px;margin-left:-4px}

  /* a call slot wraps: topic first and full width, then its meta row */
  .slot{flex-wrap:wrap;align-items:center;gap:4px 10px;padding:8px 10px 9px}
  .slot .stopic{flex:1 1 0;min-width:50%;order:-3;font-size:16px;line-height:1.3}
  .slot .slot-pick,.slot>.del{order:-2}               /* Edit's bank picker and delete stay beside the topic */
  /* a zero-height, full-width break after the topic line, so a short topic never
     gets the time or the host pulled up beside it */
  .slot:not(.ghost)::before{content:"";flex:0 0 100%;order:-1;height:0}
  .slot.second .stopic,.slot.hot .stopic{font-size:16px}
  .slot .stopic.empty{font-size:13px}
  .slot .stime,.slot .sdate,.slot .stag{min-width:0}
  /* the host hugs the right edge of the meta row — with Edit off. Edit adds a
     picker and a delete after it, and the row reads better flowing left */
  body:not(.editing) .slot .chip{margin-left:auto}
  .slot .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .wk-meta .chip{white-space:normal;line-height:1.4}    /* a long week note wraps instead of widening the page */
  /* an open week has nothing to type-tag yet — "GROUP" alone on a line is just noise */
  .slot:has(.stopic.empty) span.stag{display:none}
  .snote{padding-left:10px}
  body.editing .wk-date .wk-tools{order:3;margin:0 0 0 -4px}
  .wk-detail{max-width:none}
  .wk-sub{gap:8px;padding-left:10px}
  .wk-sub .tag{padding-top:3px}
  .sec-title{margin-top:26px;flex-wrap:wrap}

  /* ── plain tables become stacked cards: the roster, the call archive, the
     guest bench and the assignment catalog. Each row is a card, each cell a
     line, and the few cells a header row used to explain get a small label.
     The check-in and assignment BOARDS stay grids — a grid is the point of
     them, and they already scroll sideways with a sticky first column. ── */
  #teamBoard table.grid,.tbl table.grid:not(.ciboard):not(.aboard){min-width:0}
  .tbl table.grid:not(.ciboard):not(.aboard) thead{display:none}
  .tbl table.grid:not(.ciboard):not(.aboard) tbody,
  .tbl table.grid:not(.ciboard):not(.aboard) tr,
  .tbl table.grid:not(.ciboard):not(.aboard) td{display:block;width:auto;white-space:normal}
  .tbl table.grid:not(.ciboard):not(.aboard) tr{position:relative;padding:11px 14px 12px;border-bottom:var(--hair) solid var(--line)}
  .tbl table.grid:not(.ciboard):not(.aboard) tr:last-child{border-bottom:none}
