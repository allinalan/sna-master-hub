    </div><button class="btn sm" data-roll="close">Close</button></div><div class="ad-body">`;

  if(c.date > today){
    h += emptyState("This call hasn't happened yet", "The roll opens on the night.", "", "sm") + `</div>`;
    return h + rollFoot();
  }
  if(roll && roll.skip){
    h += `<div class="rc-mu"><div><b>No roll for this call.</b> It doesn't count for or against anyone, and nobody owes a replay.</div>
      <button class="btn" data-roll="unskip">Take the roll after all</button></div></div>`;
    return h + rollFoot();
  }

  h += `<div class="rc-exp"><span class="flab">The call was for</span><div class="seg">${Object.keys(AT_FOR).map(v =>
    `<button class="${f === v ? "on" : ""}" data-rollfor="${v}"${dis}>${AT_FOR[v]}</button>`).join("")}</div></div>`;
  h += `<div class="rc-tally"><span class="chip roll">${n.on} of ${n.expected} on the call</span>${
    n.drop ? `<span class="chip roll">+${n.drop} dropped in</span>` : ""}${
    n.excused ? `<span class="chip">${n.excused} excused</span>` : ""}${
    n.unmarked ? `<span class="chip note">${n.unmarked} ${done ? "missed" : "not marked yet"}</span>` : ""}${
    n.guests ? `<span class="chip count">${n.guests} guest${n.guests === 1 ? "" : "s"}</span>` : ""}</div>`;
  h += `<div class="rc-actions"><input class="search" id="rollQ" placeholder="Find a name…" value="${esc(AT.q)}" autocomplete="off">
    <button class="btn sm" data-roll="all"${dis} title="Tick everyone who isn't marked yet">✓ Everyone on</button></div>`;

  const row = (r, isFor) => {
    const id = String(r.RepID), m = marks[id] || "", prog = programOf(r);
    return `<div class="rc-row${m === "on" ? " on" : m === "x" ? " ex" : ""}" data-rep="${esc(id)}">
      <div class="rc-name"><b>${esc(r.Name)}</b><div class="an-sub">${prog ? `<span class="chip">${esc(prog)}</span>` : ""}${coachChip(r)}${r.Active === false ? `<span class="chip">former</span>` : ""}${isFor ? rollMuChip(c, r) : ""}</div></div>
      <div class="rc-seg">${isFor
        ? `<button class="here${m === "on" ? " on" : ""}" data-rollmark="${esc(id)}|on"${dis}>✓ On</button><button class="exc${m === "x" ? " on" : ""}" data-rollmark="${esc(id)}|x"${dis}>– Excused</button>`
        : `<button class="here on" disabled>✓ On</button><button data-rollmark="${esc(id)}|" title="Take them off this call"${dis}>×</button>`}</div></div>`;
  };
  const expRows = expIds.map(person).filter(match).sort(byName);
  h += `<div class="rc-sec">For ${esc(atForName(f))} · ${expIds.length}</div>`;
  h += expRows.length ? expRows.map(r => row(r, true)).join("")
       : emptyState(q ? "No name matches" : "Nobody on the roster is in " + esc(atForName(f)), "", "", "sm");

  const dropIds = Object.keys(marks).filter(id => marks[id] === "on" && !expIds.includes(id));
  const others = atRoster().filter(r => !expIds.includes(String(r.RepID)) && marks[String(r.RepID)] !== "on").sort(byName);
  h += `<div class="rc-sec">Dropped in · on it without the call being for them</div>`;
  h += dropIds.map(person).sort(byName).map(r => row(r, false)).join("");
  h += others.length ? `<select class="rc-add" data-rolladd${dis}><option value="">+ someone the call wasn't for…</option>${
         others.map(r => `<option value="${esc(r.RepID)}">${esc(r.Name)}${programOf(r) ? " · " + esc(programOf(r)) : ""}</option>`).join("")}</select>`
       : (dropIds.length ? "" : `<div style="font-size:12px;color:var(--ink-faint)">Everyone on the roster was expected on this one.</div>`);

  h += `<div class="rc-sec">Guests</div><div class="rc-guest"><div><b style="font-size:13px">Prospects &amp; visitors</b>
      <small>A count only — names never go in the shared copy.</small></div>
    <div class="step"><button class="btn sm" data-rollguests="-1"${n.guests ? dis : " disabled"}>−</button><b>${n.guests}</b><button class="btn sm" data-rollguests="1"${dis}>+</button></div></div>`;

  h += `<div class="rc-sec">Make-ups</div>` + rollMakeupHtml(c, roll);
  if(!roll || (!done && !Object.keys(marks).length))
    h += `<button class="btn sm" data-roll="skip" style="justify-self:start" title="Nobody took a roll on this one — it won't count for or against anyone"${dis}>No roll for this call</button>`;
  h += `</div>`;
  return h + rollFoot();
}
function rollFoot(){
  const other = whoAmI() === "Ben" ? "Alan" : whoAmI() === "Alan" ? "Ben" : "the other coach";
  return `<div class="rc-foot"><span>Saves as you tap · shared with ${esc(other)}</span><button class="btn primary" data-roll="close">Done</button></div>`;
}
function rollMuChip(c, r){
  const roll = rollOf(c.cid);
  if(!roll || !roll.done || !atOwes(roll).includes(String(r.RepID))) return "";
  const s = atMakeup(c, r);
  if(!s) return "";
  const m = AT_MU[s.state] || AT_MU.open;
  return `<span class="chip ${m.c}">${esc(m.t)}</span>`;
}
function rollMakeupHtml(c, roll){
  const due = atDueFriday(c.date), dueTxt = `${WEEKDAYS[parseDate(due).getDay()]} ${fmtDate(due)} at midnight`;
  const a = atMakeupRow(roll), dis = AT.busy ? " disabled" : "";
  const url = AT.url != null ? AT.url : (a ? String(a.MaterialsURL || "") : "");
  const status = AT.busy ? `<div class="rc-msg busy">${esc(AT.note || "Working…")}</div>`
               : AT.err ? `<div class="rc-msg err">${esc(AT.err)}</div>`
               : AT.note ? `<div class="rc-msg">${esc(AT.note)}</div>` : "";
  /* once a make-up is out, the link gets its own Save — typing doesn't repaint the drawer */
  const link = `<div class="ad-row"><input id="rollUrl" type="url" placeholder="Recording link — https://… (now or later)" value="${esc(url)}"${dis}>${
    roll && roll.done && a && atLive(a) ? `<button class="btn sm" data-roll="sync"${dis} title="Put this link on the make-up">Save link</button>` : ""}</div>`;
  if(!roll || !roll.done){
    const k = roll ? atCount(roll).unmarked + atCount(roll).excused : atExpectedNow(atCallFor(c)).length;
    return `<div class="rc-mu"><div>When everyone's marked, put the roll in. Anyone the call was for who isn't on it — excused
        included — gets a make-up on their dashboard, due ${esc(dueTxt)}.
        <small>They watch the recording, post takeaways in the GroupMe, then answer: did you post them, and what was it?</small></div>
      ${link}<button class="btn primary" data-roll="in"${dis}>Roll's in${k ? ` · send ${k} make-up${k === 1 ? "" : "s"}` : " · everyone was on"}</button>${status}</div>`;
  }
  const owe = atOwes(roll), byId = new Map((TEAM.rows || []).map(r => [String(r.RepID), r]));
  let h = owe.length
    ? `<div><b>${owe.length} owe${owe.length === 1 ? "s" : ""} the replay</b>, due ${esc(dueTxt)}.</div>`
    : `<div>Everyone the call was for was on it — nothing to make up.</div>`;
  if(owe.length || a) h += link;
  if(!ASSIGN.rows) h += `<div class="rc-msg${ASSIGN.err ? " err" : " busy"}">${ASSIGN.err ? esc(ASSIGN.err) : "Loading the make-ups…"}</div>`;
  else if(atNeedsSync(c, AT.url != null ? AT.url.trim() : null))
    h += `<button class="btn primary" data-roll="sync"${dis}>${a && atLive(a) ? "Update make-ups" : owe.length ? `Send ${owe.length} make-up${owe.length === 1 ? "" : "s"}` : "Take the make-up down"}</button>`;
  else if(owe.length && !status) h += `<div class="rc-msg">On their dashboards ✓</div>`;
  h += status;
  if(!a && !AT.busy) h += `<button class="btn sm" data-roll="undo" style="justify-self:start">Not in yet — keep marking</button>`;
  return `<div class="rc-mu">${h}</div>`;
}

/* ── make-ups: bring a call's replay assignment in line with its roll ── */
const atSleep = ms => new Promise(r => setTimeout(r, ms));
async function atFresh(){
  while(ASSIGN.loading) await atSleep(150);
  await assignLoad(true);
  if(!ASSIGN.rows) throw new Error(ASSIGN.err || "Couldn't load the assignments sheet.");
}
/* /exec sometimes answers with a Google error page instead of JSON — ride
   that out. A real "no" from the script stops at once. */
async function atWrite(body, tries){
  for(let attempt = 1; ; attempt++){
    let out;
    try{ out = await teamCall(Object.assign({by:whoAmI()}, body)); }
    catch(e){
      if(attempt >= (tries || 3)) throw new Error("Couldn't reach the assignments sheet — try again in a minute.");
      await atSleep(attempt * 2000); continue;
    }
    if(out && out.ok) return out;
    throw new Error("The assignments sheet said no: " + ((out && out.error) || "no reason given"));
  }
}
function atFind(want){
  const linked = new Set(Object.values(DATA.attendance || {}).map(r => String(r && r.makeup || "")));
  const hits = (ASSIGN.rows.assignments || []).filter(a => a.AssignmentID && atSame(a.Title, want.title) && atSame(a.Campaign, want.campaign));
  return hits.filter(a => !linked.has(String(a.AssignmentID))).pop() || hits.pop() || null;
}
/* A create is never blindly retried: if the reply is lost, look for the row
   before trying again, so one call never grows two make-ups. */
async function atCreate(row, want){
  const idOf = out => String(out.id || out.assignmentId || out.AssignmentID || (out.assignment && out.assignment.AssignmentID) || "");
  try{ return idOf(await atWrite({action:"saveAssignment", a:row}, 1)); }
  catch(e){
    if(/said no/.test(e.message)) throw e;
    await atFresh();
    const hit = atFind(want);
    if(hit) return String(hit.AssignmentID);
    return idOf(await atWrite({action:"saveAssignment", a:row}, 1));
  }
}
async function atSync(cid, link){
  if(AT.busy) return;
  const c = atCalls().find(x => x.cid === cid), r0 = rollOf(cid);
  if(!c || !r0 || !r0.done || r0.skip) return;
  if(whoAmI() === "someone") askWho(true);
  AT.busy = true; AT.err = ""; AT.note = "Checking the assignments sheet…"; render();
  try{
    await atFresh();
    let a = atMakeupRow(rollOf(cid));
    const url = link != null ? link : (a ? String(a.MaterialsURL || "") : "");
    const want = atWant(c, url);
    let plan = atPlan(atOwes(rollOf(cid)), atReps(), a, ASSIGN.rows.overrides, want);
    if(plan.archive){
      AT.note = "Nobody owes this one any more — taking the make-up down…"; render();
      await atWrite({action:"saveAssignment", a:Object.assign(editingFrom(a), {active:false})});
      AT.note = "Nobody owes a replay — make-up taken down ✓";
    } else if(plan.create || plan.ops.length || plan.save){
      if(plan.create){
        a = atFind(want);                                   // the other coach may have just sent it
        if(!a){
          AT.note = "Creating the make-up…"; render();
          /* made switched off, so nobody sees it until the overrides are in */
          const id = await atCreate(Object.assign({id:""}, plan.save, {active:false}), want);
          await atFresh();
          a = (id && (ASSIGN.rows.assignments || []).find(x => String(x.AssignmentID) === id)) || atFind(want);
          if(!a) throw new Error("The make-up was made, but the sheet isn't showing it yet — press Send again in a minute.");
        }
        if(String(rollOf(cid).makeup || "") !== String(a.AssignmentID)) setRoll(cid, "makeup", String(a.AssignmentID));
        plan = atPlan(atOwes(rollOf(cid)), atReps(), a, ASSIGN.rows.overrides, want);
      }
      const id = String(a.AssignmentID);
      /* one at a time — the check-in script writes the overrides tab row by row */
      for(let i = 0; i < plan.ops.length; i++){
        AT.note = `Setting who owes it · ${i + 1} of ${plan.ops.length}`; render();
        await atWrite({action:"setOverride", repId:plan.ops[i].repId, assignmentId:id, dueDate:plan.ops[i].dueDate});
      }
      if(plan.save){ AT.note = "Putting it on their dashboards…"; render(); await atWrite({action:"saveAssignment", a:Object.assign({id}, plan.save)}); }
      const k = atOwes(rollOf(cid)).length;
      AT.note = `${k} make-up${k === 1 ? "" : "s"} on their dashboard${k === 1 ? "" : "s"} · due ${fmtDay(want.dueDate)} ${fmtDate(want.dueDate)} at midnight ✓`;
    } else AT.note = "The make-ups already match the roll ✓";
    if(link != null && AT.open === cid) AT.url = null;
    await atFresh();
  }catch(e){
    AT.err = (e && e.message) || "Something went wrong — try again."; AT.note = "";
  }finally{
    AT.busy = false; render();
  }
}
async function atSyncAll(){
  const t = todayISO();
  for(const c of atCalls().filter(c => c.date <= t)){
    if(AT.err) break;
    if(atNeedsSync(c, null)) await atSync(c.cid, null);
  }
}
/* The one change made without asking: anyone who can see a make-up they
   don't owe — a mentee who joined after the call, or someone the roll now has
   on it — has it taken off their dashboard. Handing a make-up out always waits
   for a coach to press the button. */
async function atTidy(){
  if(AT.busy || !ASSIGN.rows || !TEAM.key) return;
  const work = [], today = todayISO();
  for(const c of atCalls()){
    const roll = rollOf(c.cid), a = atMakeupRow(roll);
    if(!roll || !roll.done || roll.skip || !a || !atLive(a)) continue;
    const owe = new Set(atOwes(roll));
    for(const r of atReps()){
      if(owe.has(String(r.RepID))) continue;
      if(assignState({id:String(r.RepID), tier:r.Tier}, a, ASSIGN.rows.overrides || [], [], today).state !== "na")
        work.push({repId:String(r.RepID), id:String(a.AssignmentID)});
    }
  }
  if(!work.length) return;
  AT.busy = true; AT.note = `Taking ${work.length} make-up${work.length === 1 ? "" : "s"} off dashboards that don't owe them…`; render();
  try{
    for(const w of work) await atWrite({action:"setOverride", repId:w.repId, assignmentId:w.id, dueDate:"NA"});
    AT.note = "";
    await atFresh();
  }catch(e){ AT.err = "Couldn't tidy the make-ups: " + e.message; AT.note = ""; }
  finally{ AT.busy = false; render(); }
}

/* ── clicks, typing, keys — document-level, so they survive re-renders ── */
function atReadUrl(){
  if(AT.url == null) return null;
  const v = AT.url.trim();
  if(v && !/^https?:\/\//i.test(v)){ toast("The recording link needs to start with http:// or https://"); return false; }
  return v;
}
document.addEventListener("click", e => {
  const open = e.target.closest("[data-rollopen]");
  if(open){
    e.preventDefault();
    if(TAB !== "attend"){ TAB = "attend"; location.hash = TAB; UI.q = ""; render(); window.scrollTo(0, 0); }
    openRoll(open.dataset.rollopen);
    return;
  }
  const cell = e.target.closest("[data-atcell]");
  if(cell){
    const [cid, repId] = cell.dataset.atcell.split("|");
    const roll = rollOf(cid), a = atMakeupRow(roll);
    /* a replay with something to read goes straight to the review drawer */
    if(a && atOwes(roll).includes(repId) && (ASSIGN.rows.reps || []).some(r => String(r.RepID) === repId)){
      closeRoll(); openCell(repId, String(a.AssignmentID)); return;
    }
    openRoll(cid, repId); return;
  }
  const sync = e.target.closest("[data-atsync]");
  if(sync){ if(sync.dataset.atsync === "clear"){ AT.err = ""; render(); } else atSyncAll(); return; }

  if(!AT.open || !e.target.closest("#adrawer")) return;
  const c = atCalls().find(x => x.cid === AT.open);
  if(!c) return;
  const mk = e.target.closest("[data-rollmark]"), fr = e.target.closest("[data-rollfor]"), gs = e.target.closest("[data-rollguests]"), act = e.target.closest("[data-roll]");
  if(mk){
    const [rep, v] = mk.dataset.rollmark.split("|");
    atStart(c);
    const cur = (rollOf(c.cid).marks || {})[rep] || "";
    setRoll(c.cid, "mark", cur === v ? "" : v, rep);
    render(); return;
  }
  if(fr){
    const v = fr.dataset.rollfor;
    if(v === atCallFor(c)) return;
    atStart(c);
    setRoll(c.cid, "for", v); setRoll(c.cid, "expected", atExpectedNow(v));
    render(); return;
  }
  if(gs){
    atStart(c);
    const g = Math.max(0, Number(rollOf(c.cid).guests || 0) + Number(gs.dataset.rollguests));
    setRoll(c.cid, "guests", g || ""); render(); return;
  }
  if(!act) return;
  const k = act.dataset.roll;
  if(k === "close"){ closeRoll(); return; }
  if(k === "all"){
    atStart(c);
    const roll = rollOf(c.cid);
    for(const id of roll.expected || []) if(!roll.marks[id]) setRoll(c.cid, "mark", "on", id);
    render(); return;
  }
  if(k === "skip"){ setRoll(c.cid, "skip", true); render(); return; }
  if(k === "unskip"){
    const f = atCallFor(c);
    setRoll(c.cid, "skip", ""); setRoll(c.cid, "expected", atExpectedNow(f)); setRoll(c.cid, "for", f);
    render(); return;
  }
  if(k === "undo"){ setRoll(c.cid, "done", ""); AT.note = ""; AT.err = ""; render(); return; }
  if(k === "in" || k === "sync"){
    const url = atReadUrl();
    if(url === false) return;
    if(k === "in"){ atStart(c); setRoll(c.cid, "done", true); }
    atSync(c.cid, url);
  }
});

/* the calendar's roll chip: a count once the roll is in — never names, the

function atChip(cid, date){

   Income, expenses and settle-ups between Alan and Ben. Every entry carries its

/*MONEY_MATH_BEGIN*/
/* The arithmetic, free of the page so tests/money-math.test.js can run it
   under node. Money is counted in whole cents. SNA-Money.gs is the authority
   on what an entry may be; mCheck() says the same things in the same words so
   the drawer can answer before anything is sent, and a test holds the two
   together. */
/* Before any change on the Splits tab: the contract's year 1–2 split, Ben 62.5 ·
   Alan 37.5 — the year the Money tab started in. Later years go on the Splits tab. */
const M_FIRST_SPLIT = {from:"", benPct:62.5};
const M_CAMPAIGN_RE = /^(Spring|Summer|Fall) \d{4}$/;
const M_WHO_LABEL = {income:"Received by", expense:"Paid by", settle:"From"};

/* "$1,200.50" reads as 1200.5, blank as null, anything else not a plain
   number as NaN — exactly how the script reads a number. */
function mNum(v){
  if(v === null || v === undefined || v === "") return null;
  if(typeof v === "number") return isFinite(v) ? v : NaN;
  const s = String(v).trim().replace(/^\$/, "").replace(/,/g, "");
  if(s === "") return null;
  return /^\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
}
function mCents(n){ return Math.round(Number((Number(n) * 100).toFixed(4))); }
/* base × rate% in dollars is base × rate in cents */
function mPctCents(base, rate){ return Math.round(Number((Number(base) * Number(rate)).toFixed(4))); }
function mFmt(cents){
  const c = Math.round(Math.abs(cents));
  return (cents < 0 ? "−" : "") + "$" + String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+$)/g, ",") + "." + String(c % 100).padStart(2, "0");
}
/* Ben's share rounds; Alan's is the rest, so the two always add back up to the entry. */
function mShares(e){
  const c = mCents(e.amount), ben = Math.round(c * Number(e.benPct) / 100);
  return {Ben:ben, Alan:c - ben};
}

/* Campaigns are calendar thirds, like the hub's campaignLabelOf(). */
function mCampaignOf(iso){
  const m = Number(String(iso).slice(5, 7));
  return (m <= 4 ? "Spring" : m <= 8 ? "Summer" : "Fall") + " " + String(iso).slice(0, 4);
}
function mCampaignEnd(label){
  const [season, year] = String(label).split(" ");
  return year + ({Spring:"-04-30", Summer:"-08-31", Fall:"-12-31"}[season] || "-12-31");
}
function mCampaignKey(label){
  const [season, year] = String(label).split(" ");
  return Number(year) * 3 + ({Spring:0, Summer:1, Fall:2}[season] || 0);
}

/* The totals for a list of entries, in cents. share = what each of you has
   earned (income share − expense share); holds = what each of you actually
   has in hand (income received − expenses paid ± settle-ups). The gap between
   them is who owes whom: owedToBen > 0 means Alan owes Ben. */
function mTally(entries){
  const t = {income:0, expense:0, profit:0, share:{Ben:0, Alan:0}, holds:{Ben:0, Alan:0}, owedToBen:0,
             count:0, settles:[], pcts:[]};      // pcts: every Ben's share in use
  for(const e of entries || []){
    if(e.status === "void") continue;
    t.count++;
    const c = mCents(e.amount);
    if(e.kind === "settle"){ t.holds[e.who] -= c; t.holds[e.to] += c; t.settles.push(e); continue; }
    const s = mShares(e), income = e.kind === "income";
    if(!t.pcts.includes(Number(e.benPct))) t.pcts.push(Number(e.benPct));
    t[e.kind] += c;
    t.share.Ben += income ? s.Ben : -s.Ben;
    t.share.Alan += income ? s.Alan : -s.Alan;
    t.holds[e.who] += income ? c : -c;
  }
  t.profit = t.income - t.expense;
  t.owedToBen = t.share.Ben - t.holds.Ben;
  t.settles.sort((a, b) => (a.date + (a.createdAt || "")).localeCompare(b.date + (b.createdAt || "")));
  return t;
}

/* What the settlement card says for one campaign. A problem row (one the sheet
   couldn't read) blocks its campaign — and every campaign, if its own campaign
   can't be read either. Checked in order; the first that matches wins. */
function mStatus(entries, problems, campaign, today){
  const blockers = (problems || []).filter(p => !M_CAMPAIGN_RE.test(p.campaign || "") || p.campaign === campaign);
  const t = mTally((entries || []).filter(e => e.campaign === campaign));
  const end = mCampaignEnd(campaign), last = t.settles[t.settles.length - 1] || null;
  const debtor = t.owedToBen > 0 ? "Alan" : "Ben";
  const s = {campaign, tally:t, end, ended:today > end, owed:Math.abs(t.owedToBen), debtor,
             creditor:debtor === "Alan" ? "Ben" : "Alan", last, blockers};
  s.state = blockers.length ? "blocked"
    : !t.count ? "empty"
    : t.owedToBen !== 0 ? (last ? "reopened" : s.ended ? "due" : "running")
    : last ? "settled" : "square";
  return s;
}
function mUnsettled(entries, problems, today){
  const camps = new Set((entries || []).map(e => e.campaign));
  for(const p of problems || []) if(M_CAMPAIGN_RE.test(p.campaign || "")) camps.add(p.campaign);
  return [...camps].map(c => mStatus(entries, problems, c, today))
    .filter(s => s.ended && ["due", "reopened", "blocked"].includes(s.state))
    .sort((a, b) => mCampaignKey(a.campaign) - mCampaignKey(b.campaign));
}

/* A payer's next income entry starts from their latest live one. */
function mLastPlan(entries, party, repId){
  const name = String(party || "").trim().toLowerCase();
  const mine = (entries || []).filter(e => e.kind === "income" && e.status !== "void" &&
    (repId && e.repId ? e.repId === repId : !!name && String(e.party || "").trim().toLowerCase() === name));
  if(!mine.length) return null;
  mine.sort((a, b) => (b.date + (b.createdAt || "")).localeCompare(a.date + (a.createdAt || "")));
  const e = mine[0];
  return {plan:e.plan, rate:e.plan === "pct" ? e.rate : null, amount:e.plan === "flat" ? e.amount : null};
}
/* the hub's who-am-I name ("alan h") as the name an entry is signed with */
function mPerson(name){
  const m = /^\s*(alan|ben)\b/i.exec(String(name || ""));
  return m ? (m[1].toLowerCase() === "alan" ? "Alan" : "Ben") : "";
}
function mSplitLabel(benPct){
  const b = Math.round(Number(benPct) * 100) / 100;
  return b === 100 ? "all Ben" : b === 0 ? "all Alan" : b + "/" + Math.round((100 - b) * 100) / 100;
}
/* the same, in words: "Ben 60 · Alan 40", "50 · 50", "All Ben" */
function mSplitName(benPct){
  const b = Math.round(Number(benPct) * 100) / 100;
  return b === 100 ? "All Ben" : b === 0 ? "All Alan" : b === 50 ? "50 · 50" : `Ben ${b} · Alan ${Math.round((100 - b) * 100) / 100}`;
}
/* The split a new entry in this campaign starts from, income and expenses
   alike: the latest change on the Splits tab at or before it, else
   M_FIRST_SPLIT. Changes are listed oldest first. */
function mSplitFor(splits, campaign){
  const k = mCampaignKey(campaign);
  let at = M_FIRST_SPLIT;
  for(const s of splits || []) if(mCampaignKey(s.from) <= k) at = s;
  return at;
}
/* The campaigns one split change covers: from its own up to the next change. */
function mSplitCovers(splits, from, campaign){
  const k = mCampaignKey(campaign), next = (splits || []).find(s => mCampaignKey(s.from) > mCampaignKey(from));
  return k >= mCampaignKey(from) && (!next || k < mCampaignKey(next.from));
}
/* What the Ben's share / Alan's share stats say under their figures: the
   split when every entry in view used one, "mixed splits" when they didn't.
   With nothing logged it's the campaign's split (fallback), or nothing. */
function mShareNote(t, person, fallback){
  const pcts = t.pcts.length ? t.pcts : fallback === null || fallback === undefined ? [] : [Number(fallback)];
  if(pcts.length > 1) return "mixed splits";
  if(!pcts.length) return "";
  return (person === "Ben" ? Math.round(pcts[0] * 100) / 100 : Math.round((100 - pcts[0]) * 100) / 100) + "%";
}
/* ── the buyout ──
   The contract lets the partner with the smaller share buy the rest of the
   bigger one's at a campaign's turn, for a multiple of that slice of the
   trailing twelve months' net income. The slice and the multiple live on the
   sheet's Buyout tab, never in this page (its code is public). Net income is
   profit — income − expenses — over the three campaigns ending at the turn,
   counted by campaign like everything else here. */
function mCampaignAt(key){ return ["Spring", "Summer", "Fall"][((key % 3) + 3) % 3] + " " + Math.floor(key / 3); }
function mAddDays(iso, n){ const [y, m, d] = String(iso).split("-").map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
/* A buyout happens within two weeks of a campaign ending or the next starting: two weeks either side of the turn. */
function mBuyoutWindow(campaign){ const end = mCampaignEnd(campaign); return {from:mAddDays(end, -14), to:mAddDays(end, 15)}; }
/* the turn a buyout would happen at today: the one whose window we're in, else the end of this campaign */
function mBuyoutAt(today){
  const cur = mCampaignOf(today), prev = mCampaignAt(mCampaignKey(cur) - 1);
  return today <= mBuyoutWindow(prev).to ? prev : cur;
}
/* The buyout at the end of `at`, in cents: the twelve months' net income, the
   slice of it, and the price (the slice × the multiple, so the lines shown
   multiply out). Whoever holds more than half sells; benPct is Ben's share at
   `at`. terms may be null (not set): the figures stop at net income. */
function mBuyout(entries, problems, at, terms, benPct, today){
  const k = mCampaignKey(at), camps = [k - 2, k - 1, k].map(mCampaignAt);
  const mine = (entries || []).filter(e => camps.includes(e.campaign)), t = mTally(mine);
  const b = {at, camps, income:t.income, expense:t.expense, profit:t.profit, window:mBuyoutWindow(at), complete:today > mCampaignEnd(at),
    per:camps.map(c => ({campaign:c, profit:mTally(mine.filter(e => e.campaign === c)).profit,
                         logged:mine.filter(e => e.campaign === c && e.status !== "void" && e.kind !== "settle").length})),
    blocked:(problems || []).some(p => !M_CAMPAIGN_RE.test(p.campaign || "") || camps.includes(p.campaign)),
    before:{Ben:Number(benPct), Alan:Math.round((100 - Number(benPct)) * 100) / 100}, seller:"", buyer:"",
    slice:null, price:null, after:null, beforeOpen:false};
  if(b.before.Ben !== 50){ b.seller = b.before.Ben > 50 ? "Ben" : "Alan"; b.buyer = b.seller === "Ben" ? "Alan" : "Ben"; }
  if(!terms) return b;
  const pct = Number(terms.slicePct), r = v => Math.round(v * 100) / 100;
  b.slice = Math.round(Number((t.profit * pct / 100).toFixed(4)));
  b.price = Math.round(Number((b.slice * Number(terms.multiple)).toFixed(4)));
  if(b.seller) b.after = {[b.seller]:r(b.before[b.seller] - pct), [b.buyer]:r(b.before[b.buyer] + pct)};
  b.beforeOpen = !!terms.opensWith && k + 1 < mCampaignKey(terms.opensWith);
  return b;
}
/* SNA-Money.gs buyoutTerms_(), in the same words (a typed %, × or x on the end is fine here: the page takes it off before sending) */
function mTermNum(v){ return mNum(String(v === null || v === undefined ? "" : v).replace(/\s*[%×xX]\s*$/, "")); }
function mBuyoutCheck(tm){
  const s = mTermNum(tm.slicePct), m = mTermNum(tm.multiple), o = String(tm.opensWith === null || tm.opensWith === undefined ? "" : tm.opensWith).trim();
  if(s === null || isNaN(s) || s <= 0 || s > 100) return "The slice must be more than 0% and no more than 100%";
  if(m === null || isNaN(m) || m <= 0 || m > 100) return "The multiple must be more than 0 and no more than 100";
  if(o && !M_CAMPAIGN_RE.test(o)) return 'Opens with must be a campaign like "Fall 2028", or left empty';
  return "";
}
/* SNA-Money.gs split_(), in the same words (a typed % sign is fine here: the page takes it off before sending) */
function mSplitCheck(benPct){
  const n = mNum(String(benPct === null || benPct === undefined ? "" : benPct).replace(/%/g, ""));
  return n !== null && !isNaN(n) && n >= 0 && n <= 100 ? "" : "Ben's share must be from 0 to 100%";
}

function mText(v, max){ return String(v === null || v === undefined ? "" : v).replace(/\s+/g, " ").trim().slice(0, max); }
function mWho(v){ const s = mText(v, 10).toLowerCase(); return s === "alan" ? "Alan" : s === "ben" ? "Ben" : ""; }
function mValidDay(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
  if(!m) return false;
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return d.getUTCFullYear() === +m[1] && d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3];
}
function mDollarsProblem(v, label, max){
  const n = mNum(v);
  if(n === null || isNaN(n)) return label + " must be a number";
  const c = mCents(n);
  if(c <= 0) return label + " must be more than $0.00";
  if(c > max * 100) return label + " can't be more than $" + String(max).replace(/\B(?=(\d{3})+$)/g, ",");
  return "";
}
/* SNA-Money.gs clean_(), question for question and word for word. */
function mCheck(e){
  const kind = mText(e.kind, 10), who = M_WHO_LABEL[kind];
  if(!who) return "Kind must be income, expense or settle";
  if(!mValidDay(mText(e.date, 10))) return "Date must be a real day, written YYYY-MM-DD";
  if(!M_CAMPAIGN_RE.test(mText(e.campaign, 20))) return 'Campaign must look like "Fall 2026"';
  if(!mWho(e.who)) return who + " must be Alan or Ben";
  if(kind === "settle"){
    const to = mWho(e.to);
    if(!to || to === mWho(e.who)) return "A settle-up goes from one of you to the other";
    return mDollarsProblem(e.amount, "Amount", 1000000);
  }
  if(!mText(e.party, 120)) return kind === "income" ? "Say who paid" : "Say what the expense was for";
  const share = mNum(e.benPct);
  if(share === null || isNaN(share) || share < 0 || share > 100) return "Ben's share must be from 0 to 100%";
  if(kind === "expense") return mDollarsProblem(e.amount, "Amount", 1000000);
  const plan = mText(e.plan, 4);
  if(plan === "flat") return mDollarsProblem(e.amount, "Amount", 1000000);
  if(plan !== "pct") return "Plan must be % of commission sales or flat";
  const base = mDollarsProblem(e.base, "Commission sales", 10000000);
  if(base) return base;
  const rate = mNum(e.rate);
  if(rate === null || isNaN(rate) || rate <= 0 || rate > 100) return "The rate must be more than 0% and no more than 100%";
  return mPctCents(mCents(mNum(e.base)) / 100, Math.round(rate * 10000) / 10000) > 0 ? "" : "That works out to $0.00";
}
function mEntryLine(e){
  const cents = e.kind === "income" && e.plan === "pct" ? mPctCents(mCents(mNum(e.base)) / 100, mNum(e.rate)) : mCents(mNum(e.amount));
  const what = e.kind === "settle" ? `${e.who} → ${e.to}` : `${e.party}, ${e.who} ${e.kind === "income" ? "received" : "paid"}`;
  const note = mText(e.note, 60);
  return `${e.date} · ${what} · ${mFmt(cents)}` + (e.kind === "settle" ? "" : ` · ${mSplitLabel(e.benPct)}`) +
         (note ? ` · “${note}”` : "") + (e.status === "void" ? " · void" : "");
}
/* minted before the first send, so a retried create finds its own row */
function mNewId(){ return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8).padEnd(6, "0"); }
/*MONEY_MATH_END*/

const MONEY_API  = "https://script.google.com/macros/s/AKfycbxnSsFut-0qq6oqWkJO1h9vIrypzHIcMiXh565a1GjG2DaOWkSjle591cON0to0FTk/exec";

/* Only the published hub reads and writes the real ledger. Any other copy of
   this page — this machine, a LAN address, a file opened from disk — uses the
   sheet's Test tab, so trying it out can never touch the books. */
const MONEY_BOOK = location.hostname === "allinalan.github.io" ? "live" : "test";
const MONEY = {entries:null, problems:[], sheetUrl:"", loading:false, err:"", loadedAt:0, triedAt:0,
               splits:null,        // the Splits tab's changes, oldest first; null until a list brings them (an older SNA-Money.gs never does)
               splitProblems:[],   // Splits rows the script couldn't read
               buyout:undefined,   // the buyout terms: null when none are set; undefined when the script is too old to say
               buyoutProblem:"",   // why the Buyout tab couldn't be read
               epoch:0,            // bumped as every write starts and ends — a list that crossed one is older than the page
               warn:"",            // saved, but something after the save didn't go through; stays until dismissed
               campaign:"", form:null, busy:false, formErr:"", receiptUrl:""};
const MONEY_CATEGORIES = ["Software", "Prizes & gifts", "Meals", "Events & venues", "Travel", "Marketing", "Fees", "Other"];
const MONEY_NOUN = {income:"income", expense:"expense", settle:"settle-up"};
const MONEY_SPLITS_TAB = MONEY_BOOK === "test" ? "Test Splits" : "Splits";     // the sheet tab this copy's split changes live on

/* ── talking to the sheet ── */
async function moneyCall(body){
  const res = await fetch(MONEY_API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, cache:"no-store",
    body:JSON.stringify(Object.assign({key:TEAM.key, book:MONEY_BOOK}, body))});
  return JSON.parse(await res.text());     // Apps Script's occasional HTML error page throws here, same as a dropped connection
}
async function moneyLoad(force){
  if(MONEY.loading || !TEAM.key || !MONEY_API) return;
  if(!force && MONEY.entries && Date.now() - MONEY.triedAt < 60000) return;
  MONEY.loading = true; MONEY.triedAt = MONEY.loadSince = Date.now(); render();
  if(!TEAM.rows && !TEAM.loading) teamLoad();   // the payer picker lists the roster — fetch it alongside the ledger, not after it
  /* /exec intermittently serves an error page instead of JSON (~1 in 5 on
     2026-08-24), so ride that out before bothering anyone. A save that starts
     or lands while a list is on its way makes that list older than the page —
     laid over the page it would hide the entry just saved — so read again. */
  let out = null, failure = null;
  for(let attempt = 1, rereads = 0; attempt <= 3; attempt++){
    const epoch = MONEY.epoch;
    try{ out = await moneyCall({action:"list"}); failure = null; }
    catch(e){
      out = null; failure = e;
      if(attempt < 3) await new Promise(r => setTimeout(r, attempt * 3000));
      continue;
    }
    if(out.ok && epoch !== MONEY.epoch && rereads++ < 3){ attempt--; continue; }
    break;
  }
  if(out && out.ok && !MONEY.busy){
    Object.assign(MONEY, {entries:out.entries || [], problems:out.problems || [], sheetUrl:out.sheetUrl || "", loadedAt:Date.now(), err:"",
                          splits:Array.isArray(out.splits) ? out.splits : null, splitProblems:out.splitProblems || [],
                          buyout:"buyout" in out ? out.buyout : undefined, buyoutProblem:out.buyoutProblem || ""});
  } else if(out && out.ok){
    MONEY.triedAt = 0;                             // a save is still on its way; the next render reads again once it lands
  } else if(out){
    await moneyRefused(out);
  } else {
    console.error("Money: the ledger didn't load", failure);
    MONEY.err = "Couldn't reach the Money sheet (3 tries). It's usually a passing Google hiccup — try again in a minute.";
  }
  MONEY.loading = false; render();
  if(MONEY.entries && TEAM.key && !TEAM.rows && !TEAM.loading) teamLoad();     // the payer picker lists the roster
}
/* The sheet said no. "bad key" is ambiguous — a mistyped key, or MONEY_KEY in
   the SNA Money script not matching the coach key — so ask the SharpNinja
   script, which checks the same key, before saying which it is. */
async function moneyRefused(out){
  if(out.error === "bad key"){
    const team = await teamCall({action:"getSettings"}).catch(() => null);
    if(team && team.error === "bad key"){
      TEAM.key = ""; TEAM.rows = null; ASSIGN.rows = null; MONEY.entries = null; MONEY.err = "";
      localStorage.removeItem("sna_coach_key");
      TEAM.err = "That key wasn't right — ask Alan for the current one.";
      return;
    }
    MONEY.err = team && team.ok
      ? "The Money sheet doesn't accept the coach key. Alan: in the SNA Money Apps Script, Project Settings ▸ Script properties, MONEY_KEY has to match the coach key exactly."
      : "The Money sheet didn't accept this key, and the roster feed couldn't be reached to check it. Try again in a minute.";
    return;
  }
  if(out.error === "key not set"){
    MONEY.err = "The Money sheet is set up but has no key yet. Alan: in the SNA Money Apps Script, Project Settings ▸ Script properties ▸ add MONEY_KEY with the coach key.";
    return;
  }
  MONEY.err = "The Money sheet said: " + (out.error || "no reason given");
}

/* ── the board ── */
/* Ben's share of a new entry in this campaign — income and expenses alike */
function moneySplit(camp){ return mSplitFor(MONEY.splits, camp).benPct; }
function moneyCampaigns(){
  const set = new Set([mCampaignOf(todayISO())]);
  for(const e of MONEY.entries || []) set.add(e.campaign);
  for(const p of MONEY.problems || []) if(M_CAMPAIGN_RE.test(p.campaign || "")) set.add(p.campaign);
  return [...set].sort((a, b) => mCampaignKey(b) - mCampaignKey(a));
}
function moneyViewCampaign(){ return MONEY.campaign || mCampaignOf(todayISO()); }       // one campaign, or "all"
function moneyNavCount(){
  if(!MONEY.entries) return "";
  const camp = mCampaignOf(todayISO());          // never dollars up here: the hub gets screen-shared
  return MONEY.entries.filter(e => e.status !== "void" && e.campaign === camp).length + " in " + camp.split(" ")[0];
}

function renderMoney(){

  let html = `<div class="page-head no-export no-print"><div>

      Ben unless you say otherwise, and ${MONEY.entries ? `in ${esc(ledeCamp)} every entry splits <b>${esc(mSplitName(moneySplit(ledeCamp)))}</b> unless it says otherwise`
      : "every entry carries its own split"}.
      It all lives in a private sheet behind the coach key.</div>
    ${MONEY_BOOK === "test" ? `<div class="mtest">Not the published hub · reads and writes the sheet's Test tab, never the real ledger</div>` : ""}
  </div></div>`;
  if(!MONEY_API) return html + emptyState("The Money sheet isn't connected", "<code>MONEY_API</code> in index.html is empty until SNA-Money.gs is deployed.");

    if(!MONEY.loading && !MONEY.err) setTimeout(() => moneyLoad(true), 0);

      ? emptyState("Couldn't load the ledger", esc(MONEY.err), `<button class="btn" data-moneyact="reload">Try again</button>`, "err")
      : skelTable(MONEY.loadSince, SKEL_LEDGER, "Loading the ledger…"));
  }
  /* over a minute since the last try: refresh quietly — but only after a
     success. A failed load waits for Try again rather than retrying in a loop. */
  if(!MONEY.loading && !MONEY.busy && !MONEY.err && Date.now() - MONEY.triedAt > 60000) setTimeout(() => moneyLoad(false), 0);
  if(MONEY.form && !(moneyDrawerMine() && $("#adrawer").classList.contains("on"))) setTimeout(paintMoneyForm, 0);   // back from another tab with an entry still open

  const today = todayISO(), all = MONEY.entries, camp = moneyViewCampaign(), isAll = camp === "all";
  const scope = isAll ? all : all.filter(e => e.campaign === camp);

  const cats = [...new Set(all.filter(e => e.kind === "expense" && e.category).map(e => e.category))].sort((a, b) => a.localeCompare(b));

  const opt = (v, l, on) => `<option value="${esc(v)}"${on ? " selected" : ""}>${esc(l)}</option>`;

  html += toolbar(`<div class="tb-filters">
      <select class="fsel" data-moneycampsel title="Which campaign">${moneyCampaigns().map(c => opt(c, c, c === camp)).join("")}${opt("all", "All campaigns", isAll)}</select>
      ${seg("moneyKind", [{v:"all",l:"All"},{v:"income",l:"Income"},{v:"expense",l:"Expenses"},{v:"settle",l:"Settle-ups"}], UI.moneyKind)}
      ${fgroup("Who", seg("moneyWho", [{v:"all",l:"Anyone"},{v:"Alan",l:"Alan",t:"Alan received, paid, or settled"},{v:"Ben",l:"Ben",t:"Ben received, paid, or settled"}], UI.moneyWho))}
      ${cats.length ? fgroup("Category", `<select class="fsel" data-moneycat title="Show one category">${opt("", "All", !UI.moneyCat)}${cats.map(c => opt(c, c, c === UI.moneyCat)).join("")}</select>`) : ""}
      <button class="btn sm ${UI.moneyVoid ? "on" : ""}" data-moneyact="voided" title="Voided entries stay in the sheet but count for nothing">Show voided</button>
    </div>
    <input class="search" id="q" placeholder="Search ${scope.length} entr${scope.length === 1 ? "y" : "ies"}…" value="${esc(UI.q)}">
    <div class="tb-actions">
      <button class="btn primary" data-moneyact="new" data-kind="income">+ Income</button>
      <button class="btn" data-moneyact="new" data-kind="expense">+ Expense</button>
      <button class="btn" data-moneyact="settle" data-camp="${esc(isAll ? mCampaignOf(today) : camp)}">Settle up</button>
      ${menuButton(MONEY.loading ? "Refreshing…" : "⋯", `
        <button data-moneyact="splits" title="The split new entries start from, campaign by campaign">Splits</button>
        <button data-moneyact="buyout" title="What the contract's buyout would cost at a campaign's turn">Buyout</button><hr>
        <button data-moneyact="reload" title="Pull the latest from the sheet"${MONEY.loading ? " disabled" : ""}>Refresh from the sheet</button>`,
        "btn", `aria-label="More: splits, buyout, refresh" title="Splits · Buyout · Refresh from the sheet"`)}
      ${exportButtons("moneyBoard", "Money · " + (isAll ? "All campaigns" : camp))}
    </div>`);

  if(MONEY.warn) html += `<div class="mlate no-export no-print"><span>${esc(MONEY.warn)}</span>
    <button class="btn sm" data-moneyact="dismisswarn">OK</button></div>`;
  const nsp = MONEY.splitProblems.length;
  if(nsp) html += `<div class="mlate no-export no-print"><span>${nsp === 1 ? "A row" : nsp + " rows"} on the sheet's ${MONEY_SPLITS_TAB} tab can't be read, so new
    entries may start from the wrong split until ${nsp === 1 ? "it's" : "they're"} fixed. Entries already saved aren't touched.</span>
    <button class="btn sm" data-moneyact="splits">See which</button></div>`;
  for(const s of mUnsettled(all, MONEY.problems, today)){
    if(s.campaign === camp) continue;
    html += `<div class="mlate no-export no-print"><span>${s.state === "blocked"
      ? `${esc(s.campaign)} can't be worked out — rows in the sheet need a look.`
      : `${esc(s.campaign)} isn't settled — <b>${esc(s.debtor)}</b> owes <b>${esc(s.creditor)}</b> ${esc(mFmt(s.owed))}.`}</span>
      <button class="btn sm" data-moneycamp="${esc(s.campaign)}">Open ${esc(s.campaign)}</button></div>`;
  }
  html += `<div id="moneyBoard" class="export-frame">`;
  html += printHead("Money · " + (isAll ? "All campaigns" : camp), `printed ${fmtFull(today)}`);
  /* These two travel with an export or a printout: a picture of stale or
     incomplete figures mustn't look like a current, complete one. */
  if(MONEY.err) html += `<div class="mlate"><span>${esc(MONEY.err)} These figures are as of ${esc(fmtStamp(new Date(MONEY.loadedAt).toISOString()))}.</span>
    <button class="btn sm no-export no-print" data-moneyact="reload">Try again</button></div>`;
  const np = MONEY.problems.length;
  if(np) html += `<div class="mproblems"><b>${np} row${np === 1 ? "" : "s"} in the sheet can't be read.</b>
      ${np === 1 ? "It isn't" : "They aren't"} in any figure here, and ${np === 1 ? "its campaign" : "their campaigns"} won't settle until fixed.
      <ul>${MONEY.problems.map(p => `<li>Row ${esc(p.row)}${p.campaign ? " · " + esc(p.campaign) : ""} — ${esc(p.error)}</li>`).join("")}</ul>
      ${MONEY.sheetUrl ? `<span class="no-export no-print"><a href="${esc(MONEY.sheetUrl)}" target="_blank" rel="noopener">Open the sheet ↗</a> — fix the row there, then Refresh.</span>` : ""}</div>`;
  /* a blocked campaign's totals would leave out the rows that can't be read, so show none */
  const blocked = isAll ? np > 0 : mStatus(all, MONEY.problems, camp, today).state === "blocked";
  const fig = cents => (blocked ? "—" : mFmt(cents));
  const payments = scope.filter(e => e.kind === "income" && e.status !== "void").length;
  html += `<div class="stats">
    ${statBox("Income", fig(t.income), blocked ? "rows need a look" : payments + " payment" + (payments === 1 ? "" : "s"))}
    ${statBox("Expenses", fig(t.expense), "")}
    ${statBox("Profit", fig(t.profit), "income − expenses", !blocked && t.profit < 0)}
    ${statBox("Ben's share", fig(t.share.Ben), blocked ? "" : mShareNote(t, "Ben", isAll ? null : moneySplit(camp)))}
    ${statBox("Alan's share", fig(t.share.Alan), blocked ? "" : mShareNote(t, "Alan", isAll ? null : moneySplit(camp)))}
  </div>`;
  html += isAll ? moneyAllHtml(today) : moneyCardHtml(mStatus(all, MONEY.problems, camp, today));
  html += moneyListHtml(scope, isAll);
  html += `</div>`;
  if(MONEY.sheetUrl) html += `<div class="sw-hint no-export no-print" style="margin-top:14px"><a href="${esc(MONEY.sheetUrl)}" target="_blank" rel="noopener">Open the sheet ↗</a>
    — every change is also on its History tab.</div>`;
  return html;
}

function moneyCardHtml(s){
  const card = (tone, head, sub, action) => `<div class="mcard ${tone}"><div class="mc-main"><div class="mc-head">${head}</div>${
    sub ? `<div class="mc-sub">${sub}</div>` : ""}</div>${action || ""}</div>`;
  const owes = `<b>${esc(s.debtor)}</b> owes <b>${esc(s.creditor)}</b> <span class="mc-amt">${esc(mFmt(s.owed))}</span>`;
  const button = (label, primary) => `<button class="btn${primary ? " primary" : ""} no-export no-print" data-moneyact="settle" data-camp="${esc(s.campaign)}">${label}</button>`;
  const c = esc(s.campaign), n = s.blockers.length;
  switch(s.state){
    case "blocked":  return card("bad", `Can't work out ${c} yet`, `${n} row${n === 1 ? "" : "s"} in the sheet can't be read — listed above. Nothing shows as owed until ${n === 1 ? "it's" : "they're"} fixed.`);
    case "empty":    return card("", `Nothing logged for ${c} yet`, "Add income or an expense above.");
    case "reopened": return card("warn", owes, `${c} was settled ${esc(fmtFull(s.last.date))}, but its entries have changed since — this is what's left.`, button("Record settle-up", true));
    case "running":  return card("", `So far: ${owes}`, `${c} settles after it ends on ${esc(fmtFull(s.end))}.`, button("Settle up now", false));
    case "due":      return card("warn", `${owes} for ${c}`, `The campaign ended ${esc(fmtFull(s.end))}.`, button("Record settle-up", true));
    case "settled":  return card("good", "Settled ✓", `${esc(s.last.who)} paid ${esc(s.last.to)} ${esc(mFmt(mCents(s.last.amount)))} on ${esc(fmtFull(s.last.date))}.`);
    default:         return card("good", "Square", `Nobody owes anything for ${c}.`);
  }
}

function moneyAllHtml(today){
  const camps = moneyCampaigns().filter(c => MONEY.entries.some(e => e.campaign === c) || MONEY.problems.some(p => p.campaign === c));
  if(!camps.length) return "";
  const says = s => ({blocked:"can't be worked out", empty:"nothing live", square:"square", settled:"settled ✓",
    running:`so far ${s.debtor} owes ${s.creditor} ${mFmt(s.owed)}`, due:`${s.debtor} owes ${s.creditor} ${mFmt(s.owed)}`,
    reopened:`reopened — ${s.debtor} owes ${s.creditor} ${mFmt(s.owed)}`}[s.state]);
  let h = `<div class="tbl" style="margin-bottom:26px"><table class="grid mcamps"><thead><tr><th>Campaign</th><th class="num">Income</th>
    <th class="num">Expenses</th><th class="num">Profit</th><th class="num">Ben</th><th class="num">Alan</th><th>Settlement</th></tr></thead><tbody>`;
  for(const c of camps){
    const s = mStatus(MONEY.entries, MONEY.problems, c, today), t = s.tally;
    const fig = cents => esc(s.state === "blocked" ? "—" : mFmt(cents));
    h += `<tr><td><button class="linkish" data-moneycamp="${esc(c)}">${esc(c)}</button></td>
      <td class="num">${fig(t.income)}</td><td class="num">${fig(t.expense)}</td><td class="num">${fig(t.profit)}</td>
      <td class="num">${fig(t.share.Ben)}</td><td class="num">${fig(t.share.Alan)}</td>
      <td class="mstate ${s.state}">${esc(says(s))}</td></tr>`;
  }
  return h + `</tbody></table></div>`;
}

function moneyRate(r){ return String(Math.round(Number(r) * 10000) / 10000); }
function moneyListHtml(scope, isAll){
  const q = UI.q.trim().toLowerCase();
  const rows = scope.filter(e => (UI.moneyVoid || e.status !== "void")
      && (UI.moneyKind === "all" || e.kind === UI.moneyKind)
      && (UI.moneyWho === "all" || e.who === UI.moneyWho || e.to === UI.moneyWho)
      && (!UI.moneyCat || e.category === UI.moneyCat)
      && (!q || [e.party, e.note, e.category, e.who, e.to, e.date, fmtFull(e.date), mFmt(mCents(e.amount)), MONEY_NOUN[e.kind]]
                  .join(" ").toLowerCase().includes(q)))
    .sort((a, b) => b.date.localeCompare(a.date) || String(b.createdAt).localeCompare(String(a.createdAt)));
  const hidden = UI.moneyVoid ? 0 : scope.filter(e => e.status === "void").length;
  const more = hidden ? `<div class="sw-hint no-export no-print" style="margin-top:8px">${hidden} voided entr${hidden === 1 ? "y" : "ies"} hidden — <a href="#" data-moneyact="voided">show</a></div>` : "";
  if(!rows.length){
    if(scope.length && (UI.q.trim() || UI.moneyKind !== "all" || UI.moneyWho !== "all" || UI.moneyCat))
      return emptyState("Nothing matches", "No entry fits these filters and the search.", clearFiltersBtn("money")) + more;
    if(scope.length) return emptyState("Everything here is voided", "Voided entries stay in the sheet but count for nothing.",
                                       `<button class="btn" data-moneyact="voided">Show voided</button>`);
    /* one campaign with nothing in it: the card above already says so */
    return isAll ? emptyState("Nothing logged yet", "Use + Income or + Expense above.") : "";
  }
  let h = `<div class="tbl"><table class="grid mledger"><thead><tr><th>Date</th><th>Entry</th><th>Who</th><th>Split</th>
    <th class="num">Amount</th>${isAll ? "<th>Campaign</th>" : ""}</tr></thead><tbody>`;
  for(const e of rows){
    const c = mCents(e.amount);
    const what = e.kind === "income"
        ? `<span class="chip mk income">income</span> <b>${esc(e.party)}</b><div class="msub">${e.plan === "pct"
            ? `${esc(moneyRate(e.rate))}% of ${esc(mFmt(mCents(e.base)))} commission sales` : "flat"}</div>`
      : e.kind === "expense"
        ? `<span class="chip mk expense">expense</span> <b>${esc(e.party)}</b>${e.category ? ` <span class="chip">${esc(e.category)}</span>` : ""}`
        : `<span class="chip mk settle">settle-up</span>`;
    const who = e.kind === "income" ? `${esc(e.who)} received` : e.kind === "expense" ? `${esc(e.who)} paid` : `${esc(e.who)} → ${esc(e.to)}`;
    const amount = (e.kind === "income" ? "+" : e.kind === "expense" ? "−" : "") + mFmt(c);
    h += `<tr class="mrow ${e.kind}${e.status === "void" ? " void" : ""}" data-moneyopen="${esc(e.id)}" tabindex="0" title="Open this entry">
      <td class="dt">${esc(fmtDate(e.date))}</td>
      <td>${what}${e.note ? `<div class="msub">${esc(e.note)}</div>` : ""}${e.receiptId ? `<span class="mclip">📎 receipt</span>` : ""}${e.status === "void" ? ` <span class="chip">void</span>` : ""}</td>
      <td class="mwho">${who}</td>
      <td class="msplit">${e.kind === "settle" ? "" : esc(mSplitLabel(e.benPct))}</td>
      <td class="num mamt">${esc(amount)}</td>${isAll ? `
      <td class="dt">${esc(e.campaign)}</td>` : ""}
    </tr>`;
  }
  return h + `</tbody></table></div>` + more;
}

/* the tab's own controls — the drawer's are further down */
document.addEventListener("change", e => {
  const t = e.target;
  if(!t.matches) return;
  if(t.matches("select[data-moneycampsel]")){ MONEY.campaign = t.value; UI.q = ""; render(); return; }
  if(t.matches("select[data-moneycat]")){ UI.moneyCat = t.value; render(); }
});
document.addEventListener("click", e => {
  const camp = e.target.closest("[data-moneycamp]");
  if(camp){ e.preventDefault(); MONEY.campaign = camp.dataset.moneycamp; UI.q = ""; render(); window.scrollTo(0, 0); return; }
  const act = e.target.closest('[data-moneyact="reload"],[data-moneyact="voided"],[data-moneyact="dismisswarn"]');
  if(!act) return;
  e.preventDefault();
  if(act.dataset.moneyact === "voided"){ UI.moneyVoid = !UI.moneyVoid; render(); return; }
  if(act.dataset.moneyact === "dismisswarn"){ MONEY.warn = ""; render(); return; }
  MONEY.err = "";
  if(!MONEY.entries) render();
  moneyLoad(true);
});

/* ── the drawer: add or change one entry ──
   Money never autosaves. Save sends the entry and the drawer closes only once
   the sheet said ok; until then everything typed stays put, with the reason in
   red if it didn't go. It reuses the Assignments drawer (#adrawer). */
function moneySeg(key, opts, cur){
  return `<div class="seg">` + opts.map(o => `<button type="button" data-mset="${key}:${esc(o.v)}" class="${
    String(cur) === String(o.v) ? "on" : ""}"${o.t ? ` title="${esc(o.t)}"` : ""}>${esc(o.l)}</button>`).join("") + `</div>`;
}
function moneyInput(id, label, val, affix, ph){
  return `<label class="mlab"><span class="mlt">${esc(label)}</span><span class="mmoney">${affix === "$" ? "<i>$</i>" : ""}` +
    `<input class="search" id="${id}" inputmode="decimal" autocomplete="off" value="${esc(val)}" placeholder="${esc(ph || "0.00")}">` +
    `${affix && affix !== "$" ? `<i>${esc(affix)}</i>` : ""}</span></label>`;
}
function moneyRoster(){
  return (TEAM.rows || []).filter(r => r.Active && String(r.Name || "").trim())
    .map(r => ({name:String(r.Name).trim(), repId:String(r.RepID)})).sort((a, b) => a.name.localeCompare(b.name));
}
/* who signs a change: the hub's who-am-I, asked for if it isn't Alan or Ben */
function moneySigner(){
  let by = mPerson(whoAmI());
  if(!by){ askWho(true); by = mPerson(whoAmI()); }
  return by;
}

function moneyNewForm(kind, over){
  const today = todayISO(), view = moneyViewCampaign() === "all" ? "" : moneyViewCampaign();
  const f = Object.assign({mode:"new", id:mNewId(), rev:0, kind, date:today,
    campaign:view || mCampaignOf(today), campAuto:!view,           // under All campaigns, the campaign follows the date until picked
    party:"", repId:"", partyOther:false, plan:"pct", base:"", rate:"", amount:"", autoRate:false, autoAmount:false,
    who:kind === "income" ? "Ben" : kind === "expense" ? mPerson(whoAmI()) : "",
    benPct:null, splitAuto:true, splitCustom:false, category:"", catNew:false, note:"",   // the split follows the campaign until picked
    receipt:null, removeReceipt:false, entry:null}, over || {});
  moneyFollowSplit(f);
  return f;
}
/* A new entry's split is its campaign's, until someone picks one by hand. */
function moneyFollowSplit(f){
  if(f.mode === "new" && f.splitAuto && f.kind !== "settle") Object.assign(f, {benPct:moneySplit(f.campaign), splitCustom:false});
}
function moneyEditForm(e){
  return {mode:"edit", id:e.id, rev:e.rev, kind:e.kind, date:e.date, campaign:e.campaign, campAuto:false,
    party:e.party || "", repId:e.repId || "", partyOther:false, plan:e.plan || "pct",
    base:e.base == null ? "" : String(e.base), rate:e.rate == null ? "" : String(e.rate),
    amount:e.amount == null ? "" : String(e.amount), autoRate:false, autoAmount:false, who:e.who,
    benPct:e.kind === "settle" ? null : e.benPct == null ? moneySplit(e.campaign) : e.benPct,
    splitAuto:false, splitCustom:false,                            // its own split is always one of the buttons
    category:e.category || "", catNew:false, note:e.note || "", receipt:null, removeReceipt:false, entry:e};
}
/* opened from the card: the debtor, the creditor, the exact amount — editable for a part payment */
function moneySettleForm(camp){
  const s = mStatus(MONEY.entries || [], MONEY.problems, camp, todayISO());
  const f = moneyNewForm("settle", {campaign:camp, campAuto:false});
  if(s.owed > 0){ f.who = s.debtor; f.amount = (s.owed / 100).toFixed(2); }
  return f;
}

function moneyPartyField(f){
  const roster = moneyRoster(), onRoster = new Set(roster.map(r => r.name.toLowerCase()));
  const names = [...new Set((MONEY.entries || []).filter(x => x.kind === "income").map(x => x.party))]
    .filter(n => n && !onRoster.has(n.toLowerCase())).sort((a, b) => a.localeCompare(b));
  const cur = f.partyOther ? "other:" : f.repId && roster.some(r => r.repId === f.repId) ? "rep:" + f.repId : f.party ? "name:" + f.party : "";
  if(cur.startsWith("name:") && !names.includes(f.party)) names.push(f.party);        // a payer on neither list still shows
  const opt = (v, l) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(l)}</option>`;
  let opts = opt("", "— who paid? —");
  if(roster.length) opts += `<optgroup label="Mentees">${roster.map(r => opt("rep:" + r.repId, r.name)).join("")}</optgroup>`;
  if(names.length) opts += `<optgroup label="Paid before">${names.map(n => opt("name:" + n, n)).join("")}</optgroup>`;
  opts += opt("other:", "Someone else…");
  return `<label class="mlab"><span class="mlt">From</span><select id="mfParty">${opts}</select></label>` +
    (f.partyOther ? `<input class="search" id="mfPartyOther" placeholder="Their name" value="${esc(f.party)}" autocomplete="off">` : "") +
    (TEAM.rows ? "" : `<div class="sw-hint">${TEAM.loading ? "Loading the roster…" : "The roster isn't loaded — pick someone who paid before, or Someone else."}</div>`);
}
function moneyCategoryField(f){
  const used = [...new Set((MONEY.entries || []).filter(x => x.kind === "expense" && x.category).map(x => x.category))];
  const list = MONEY_CATEGORIES.concat(used.filter(c => !MONEY_CATEGORIES.includes(c)).sort((a, b) => a.localeCompare(b)));
  if(f.category && !f.catNew && !list.includes(f.category)) list.push(f.category);
  const opt = (v, l, on) => `<option value="${esc(v)}"${on ? " selected" : ""}>${esc(l)}</option>`;
  return `<label class="mlab"><span class="mlt">Category</span><select id="mfCat">${opt("", "— none —", !f.category && !f.catNew)}${
      list.map(c => opt(c, c, !f.catNew && c === f.category)).join("")}${opt("__new", "New category…", f.catNew)}</select></label>` +
    (f.catNew ? `<input class="search" id="mfCatNew" placeholder="Category name" value="${esc(f.category)}" autocomplete="off">` : "");
}
function moneySize(n){ return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function moneyReceiptField(f){
  const e = f.entry, has = !!(e && e.receiptId) && !f.removeReceipt;
  let h = `<div class="mlab"><span class="mlt">Receipt</span><div class="mreceipt">`;
  if(has) h += `<span>📎 ${esc(e.receiptName || "receipt")}</span><button type="button" class="btn sm" data-moneyact="viewreceipt">View</button>` +
               `<button type="button" class="btn sm" data-moneyact="dropreceipt">Remove</button>`;
  if(e && e.receiptId && f.removeReceipt) h += `<span class="sw-hint">Comes off this entry when you save — the file stays in Drive.</span>` +
               `<button type="button" class="btn sm" data-moneyact="keepreceipt">Keep it</button>`;
  if(f.receiptBusy) h += `<span class="sw-hint">Attaching…</span>`;
  if(f.receipt) h += `<span>New: ${esc(f.receipt.name)} · ${esc(moneySize(f.receipt.size))}</span>` +
               `<button type="button" class="btn sm" data-moneyact="clearpick">Don't attach</button>`;
  h += `<label class="btn sm mfile">${has || f.receipt ? "Replace…" : "Attach a photo or PDF"}<input type="file" id="mfFile" accept="image/*,application/pdf"></label>`;
  return h + `</div><div id="mfViewer"></div></div>`;
}

/* the shared drawer is showing a Money entry — not an Assignments cell */
function moneyDrawerMine(){ return !!document.querySelector("#adrawer #mform"); }
function paintMoneyForm(){
  const f = MONEY.form, d = $("#adrawer");
  if(!f || !d || TAB !== "money") return;            // a save that finishes on another tab never takes over its drawer
  if(f.mode === "splits") return paintMoneySplits(f, d);
  if(f.mode === "buyout") return paintMoneyBuyout(f, d);
  const e = f.entry, dis = MONEY.busy ? " disabled" : "";
  const camps = new Set(moneyCampaigns()), now = mCampaignKey(mCampaignOf(todayISO()));
  for(let k = now - 3; k <= now + 1; k++) camps.add(["Spring", "Summer", "Fall"][k % 3] + " " + Math.floor(k / 3));
  camps.add(f.campaign);
  const campOpts = [...camps].filter(c => M_CAMPAIGN_RE.test(c)).sort((a, b) => mCampaignKey(b) - mCampaignKey(a))
    .map(c => `<option value="${esc(c)}"${c === f.campaign ? " selected" : ""}>${esc(c)}</option>`).join("");

  let body = "";
  if(f.mode === "new") body += moneySeg("kind", [{v:"income", l:"Income"}, {v:"expense", l:"Expense"}, {v:"settle", l:"Settle-up"}], f.kind);
  if(e && e.status === "void") body += `<div class="mvoid">This entry is <b>void</b> — it counts for nothing. Restore it to count it again.</div>`;
  body += `<div class="mrow2">
      <div class="mlab"><span class="mlt">Date</span>${dbtn("field", "", f.date, f.date ? fmtFull(f.date) : "", {id:"mfDate", cls:"always", ph:"pick a date"})}</div>
      <label class="mlab"><span class="mlt">Campaign</span><select id="mfCamp">${campOpts}</select></label>
    </div>`;
  if(f.kind === "income"){
    body += moneyPartyField(f);
    body += `<div class="mlab"><span class="mlt">Plan</span>${moneySeg("plan", [{v:"pct", l:"% of commission sales"}, {v:"flat", l:"Flat"}], f.plan)}</div>`;
    if(f.plan === "pct"){
      const base = mNum(f.base), rate = mNum(String(f.rate).replace(/%/g, ""));
      body += `<div class="mrow2">${moneyInput("mfBase", "Commission sales", f.base, "$")}${moneyInput("mfRate", "Rate", f.rate, "%", "e.g. 10")}</div>
        <div class="mcalc" id="mfCalc">${base > 0 && rate > 0 ? "= " + esc(mFmt(mPctCents(mCents(base) / 100, rate))) : ""}</div>`;
    } else {
      body += moneyInput("mfAmount", "Amount", f.amount, "$");
    }
    body += `<div class="mlab"><span class="mlt">Received by</span>${moneySeg("who", [{v:"Ben", l:"Ben"}, {v:"Alan", l:"Alan"}], f.who)}</div>`;
  } else if(f.kind === "expense"){

    if(mine !== null && !isNaN(mine) && mine !== def) body += `<div class="sw-hint" style="margin-top:-6px">Not the ${esc(f.campaign)} split, which is ${esc(mSplitName(def))}.</div>`;
    body += moneyReceiptField(f);
  }
  body += `<label class="mlab"><span class="mlt">Note</span><input class="search" id="mfNote" value="${esc(f.note)}" placeholder="optional" autocomplete="off"></label>`;
  body += `<div class="merr" id="mfErr" role="alert">${esc(MONEY.formErr)}</div>`;
  body += `<div class="ad-row">
      <button class="btn primary" data-moneyact="save"${dis}>${f.mode === "new" ? "Save" : "Save changes"}</button>
      <button class="btn" data-moneyact="close"${dis}>Cancel</button>${e ? `
      <span style="flex:1"></span><button class="btn" data-moneyact="${e.status === "void" ? "restore" : "void"}"${dis}>${e.status === "void" ? "Restore" : "Void"}</button>` : ""}
    </div>`;
  if(e) body += `<div class="maudit">Added by ${esc(e.createdBy || "?")} · ${fmtStamp(e.createdAt)}${
    e.rev > 1 ? ` · last changed by ${esc(e.updatedBy || "?")} · ${fmtStamp(e.updatedAt)}` : ""}</div>`;

  const noun = MONEY_NOUN[f.kind];
  const sub = f.mode === "new"
    ? (MONEY_BOOK === "test" ? "Test tab — only the published hub writes the real ledger" : "Nothing is saved until you press Save")
    : esc(mFmt(mCents(e.amount)) + " · " + fmtFull(e.date) + " · " + e.campaign);
  d.innerHTML = `<div class="ad-head"><div><div class="t">${f.mode === "new" ? "New " + noun : noun.charAt(0).toUpperCase() + noun.slice(1)}</div>
      <div class="s">${sub}</div></div><button class="btn sm" data-moneyact="close" title="Close"${dis}>✕</button></div>
    <div class="ad-body mform" id="mform">${body}</div>`;

/* While a save is on its way nothing in the drawer changes: an edit made now wouldn't
   be in what was sent. The form keeps its full strength, though; only the button you
   pressed changes, to a spinner the width of its label (MONEY.busyAct says which). */
function moneyBusyMark(d){
  if(!MONEY.busy) return;
  d.querySelectorAll("input, select, button, label.mfile").forEach(el => { el.disabled = true; el.classList.add("is-busy"); });
  const a = MONEY.busyAct || {act:"save"};
  const b = d.querySelector(`[data-moneyact="${a.act}"]` + (a.from ? `[data-from="${CSS.escape(a.from)}"]` : ""));
  if(b){ b.classList.add("is-saving"); b.setAttribute("aria-busy", "true"); }
}
function moneyCloseForm(){
