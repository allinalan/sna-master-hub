/* ═══════════ PNG EXPORT ═══════════
   Renders the board into an <svg><foreignObject> and paints it to a canvas.
   No libraries, no network — except an optional pass that inlines the web
   fonts so the image looks identical to the screen. If that fetch fails
   (offline, or the file opened straight off disk) it falls back to system
   fonts and still produces a clean image. */
let FONT_CSS = null;
async function inlineFonts(){
  if(FONT_CSS !== null) return FONT_CSS;
  FONT_CSS = "";
  try{
    const link = [...document.querySelectorAll("link[rel=stylesheet]")].find(l => l.href.includes("fonts.googleapis"));
    if(!link) return FONT_CSS;
    const css = await (await fetch(link.href)).text();
    const blocks = css.split("@font-face").slice(1)
      .filter(b => b.includes("U+0000-00FF"));           // latin subset only — keeps it small
    const out = [];
    for(const b of blocks){
      const m = b.match(/url\((https:[^)]+\.woff2)\)/);
      if(!m) continue;
      const buf = await (await fetch(m[1])).arrayBuffer();
      let bin = ""; const bytes = new Uint8Array(buf);
      for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      out.push("@font-face" + b.replace(m[1], "data:font/woff2;base64," + btoa(bin)));
    }
    FONT_CSS = out.join("\n");
  }catch(e){ console.warn("Font inlining skipped:", e); FONT_CSS = ""; }
  return FONT_CSS;
}

async function exportPNG(id, label){
  const node = document.getElementById(id);
  if(!node) return toast("Nothing to export here");
  const btn = document.querySelector(`[data-exportfor="${id}"]`);   // the Export button the menu opened from
  if(btn){ btn.disabled = true; btn.textContent = "Rendering…"; }
  document.body.classList.add("exporting");

  try{
    const fonts = await inlineFonts();
    const clone = node.cloneNode(true);
    clone.querySelectorAll(".no-export, [contenteditable]").forEach(n => {
      if(n.classList.contains("no-export")) n.remove(); else n.removeAttribute("contenteditable");
    });

    /* a board with a sideways-scrolling table (the check-ins lanes) exports at
       its full width rather than the slice that happened to be on screen */
    let width = Math.ceil(Math.max(node.getBoundingClientRect().width,
      ...[...node.querySelectorAll(".tbl")].map(t => t.scrollWidth)));
    const pageCSS = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");

    const holder = document.createElement("div");
    holder.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    /* .png-holder restates the light colours: inside the SVG image the page's dark
       tokens would otherwise apply, and an export is always the light board */
    holder.className = "png-holder";
    holder.style.cssText = `width:${width}px;background:#F3EFE6;padding:28px;color:#1C1712;font-family:"Hanken Grotesk",-apple-system,sans-serif`;
    const st = document.createElement("style");
    /* the clone has no body.exporting ancestor, so un-scroll its tables here */
    st.textContent = fonts + "\n" + pageCSS + "\n.print-head{display:block!important}.tbl{overflow:visible!important}";
    holder.appendChild(st);
    holder.appendChild(clone);

    /* measure the real height off-screen before serialising */
    const probe = document.createElement("div");
    probe.style.cssText = `position:fixed;left:-99999px;top:0;width:${width + 56}px`;
    probe.appendChild(holder.cloneNode(true));
    document.body.appendChild(probe);
    /* if the fonts rendered wider than the on-screen measurement (a fallback
       face, say), a table may still poke out — widen to the real extent and
       measure the height again so nothing gets clipped */
    const need = Math.ceil(probe.firstChild.scrollWidth) - 56;
    if(need > width){
      width = need;
      holder.style.width = width + "px";
      probe.style.width = (width + 56) + "px";
      probe.replaceChild(holder.cloneNode(true), probe.firstChild);
    }
    const height = Math.ceil(probe.firstChild.getBoundingClientRect().height);
    probe.remove();

    const xml = new XMLSerializer().serializeToString(holder);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width + 56}" height="${height}">` +
                `<foreignObject x="0" y="0" width="100%" height="100%">${xml}</foreignObject></svg>`;

    const scale = 2;
    const img = new Image();
    img.crossOrigin = "anonymous";
    await new Promise((ok, no) => {
      img.onload = ok; img.onerror = () => no(new Error("SVG render failed"));
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    });

    const canvas = document.createElement("canvas");
    canvas.width = (width + 56) * scale; canvas.height = height * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#F3EFE6"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.drawImage(img, 0, 0);

    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "SNA-" + String(label || "board").replace(/[^\w]+/g, "-") + "-" + todayISO() + ".png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("PNG saved to your Downloads");
  }catch(err){
    console.error(err);
    toast("The PNG didn't render — try again, or use Print / PDF.", {err:true, retry:() => exportPNG(id, label)});
  }finally{
    document.body.classList.remove("exporting");
    if(btn){ btn.disabled = false; btn.textContent = "Export"; }
  }
}

/* ═══════════ menus, the how-to fold, the drawer's dimmed page ═══════════ */
/* The menu copies its trigger's <template> buttons into #menuPop. Clicking one
   runs it through the ordinary handlers (registered above, so they go first),
   then this one closes the menu.
   From the keyboard: Enter, Space or an arrow on the trigger opens it with an item
   focused; Up / Down / Home / End move between the items, Enter or Space runs one,
   and Escape or Tab closes it and puts the focus back on the trigger. The mouse
   works as it always has: opening a menu with it leaves the focus where it was. */
let MENU_FOR = null;
const menuItems = () => [...$("#menuPop").querySelectorAll(".mi:not([disabled])")];
function openMenu(trigger, focusAt){
  const src = trigger.parentElement && trigger.parentElement.querySelector("template.menu-src");
  if(!src) return;
  const pop = $("#menuPop");
  pop.innerHTML = src.innerHTML;
  pop.querySelectorAll("button").forEach(b => {
    b.className = "mi" + (b.classList.contains("danger") ? " danger" : ""); b.setAttribute("role", "menuitem"); b.tabIndex = -1;
  });
  pop.classList.remove("hidden");
  popAt(pop, trigger);
  MENU_FOR = trigger; trigger.setAttribute("aria-expanded", "true");
  if(focusAt){ const items = menuItems(); if(items.length) items[focusAt === "last" ? items.length - 1 : 0].focus(); }
}
/* refocus: put the focus back on the trigger (a keyboard close). An item can leave the
   trigger unable to take it for a moment (Print hides the toolbar while it prints; Export
   is disabled while the PNG renders), so it keeps trying for a few seconds, and gives up
   if the trigger has gone (a render rebuilt it), a menu is open again, or something else
   has taken the focus. */
function closeMenu(refocus){
  if(!MENU_FOR) return;
  const trig = MENU_FOR, pop = $("#menuPop");
  pop.classList.add("hidden");
  trig.setAttribute("aria-expanded", "false"); MENU_FOR = null;
  if(refocus !== true) return;
  (function again(tries){
    const a = document.activeElement;
    if(MENU_FOR || !trig.isConnected || (a && a !== document.body && a !== trig && !pop.contains(a))) return;
    if(!trig.disabled) trig.focus();
    if(document.activeElement !== trig && tries < 80) setTimeout(() => again(tries + 1), 100);
  })(0);
}
document.addEventListener("click", e => {
  const trig = e.target.closest("[data-menu]");
  /* Enter or Space on a button is a click with no pointer behind it: detail 0 */
  if(trig){ const same = MENU_FOR === trig; closeMenu(); if(!same && !trig.disabled) openMenu(trig, e.detail === 0 && "first"); return; }
  /* an item ran (its own handler did the work), or the click was elsewhere. An item run
     from the keyboard hands the focus back to the trigger, unless what it did took it. */
  closeMenu(e.detail === 0 && $("#menuPop").contains(document.activeElement));
});
document.addEventListener("keydown", e => {
  const a = document.activeElement;
  if(!MENU_FOR){
    const trig = a && a.closest && a.closest("[data-menu]");
    if(trig && !trig.disabled && (e.key === "ArrowDown" || e.key === "ArrowUp")){
      e.preventDefault(); openMenu(trig, e.key === "ArrowUp" ? "last" : "first");
    }
    return;
  }
  const inMenu = $("#menuPop").contains(a), onTrig = a === MENU_FOR;
  if(e.key === "Escape"){ closeMenu(inMenu || onTrig); return; }
  if(!inMenu && !onTrig) return;
  if(e.key === "Tab"){
    if(inMenu){ e.preventDefault(); closeMenu(true); } else closeMenu();   // from the trigger, Tab carries on as usual
    return;
  }
  const items = menuItems(), at = items.indexOf(a);
  const to = {ArrowDown: at + 1, ArrowUp: at < 0 ? -1 : at - 1, Home: 0, End: -1}[e.key];
  if(to === undefined || !items.length) return;
  e.preventDefault();
  items[(to + items.length) % items.length].focus();
});
/* once the keyboard is in a menu, the pointer moves the focus with it, so only one item is lit */
$("#menuPop").addEventListener("mousemove", e => {
  const mi = e.target.closest(".mi:not([disabled])"), pop = e.currentTarget;
  if(mi && pop.contains(document.activeElement) && document.activeElement !== mi) mi.focus();
});
window.addEventListener("scroll", () => closeMenu(), {passive:true});

/* "How this works" — the how-to paragraphs stay folded until asked for */
function howToggle(){
  const open = document.body.classList.contains("how-open");
  return `<button class="btn sm plain how-toggle" data-howto aria-expanded="${open}">${open ? "Hide how this works" : "How this works"}</button>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-howto]");
  if(!b) return;
  const open = document.body.classList.toggle("how-open");
  b.textContent = open ? "Hide how this works" : "How this works"; b.setAttribute("aria-expanded", String(open));
});

/* The drawer (assignment review, roll call, money entry) sits over a dimmed page;
   a click on the dimmed page closes it — unless something in it has changed since
   it opened, or a save is in flight. Then nothing is thrown away: the drawer
   shakes and says how to leave. */
let DRAWER_SNAP = null;                          // {owner, state} from when its current contents first showed
function drawerOwner(){
  if(MONEY.form && moneyDrawerMine()) return "money:" + MONEY.form.mode + ":" + (MONEY.form.id || "");
  if(ASSIGN.open) return "cell:" + ASSIGN.open.repId + ":" + ASSIGN.open.aId;
  if(AT.open) return "roll:" + AT.open;
  return "";
}
function drawerState(){
  const d = $("#adrawer");
  if(MONEY.form && moneyDrawerMine()){ moneyHarvest(); return "m" + JSON.stringify(MONEY.form); }
  return [...d.querySelectorAll("input,textarea,select")].map(el =>
           el.type === "checkbox" || el.type === "radio" ? el.checked : el.type === "file" ? el.files.length : el.value)
         .concat([...d.querySelectorAll(".rc-row")].map(r => r.className)).join("\u0001");
}
new MutationObserver(() => {
  const d = $("#adrawer");
  if(!d.classList.contains("on")){ DRAWER_SNAP = null; return; }
  const owner = drawerOwner();
  if(!DRAWER_SNAP || DRAWER_SNAP.owner !== owner) DRAWER_SNAP = {owner, state: drawerState()};
}).observe($("#adrawer"), {attributes:true, attributeFilter:["class"], childList:true});
document.addEventListener("click", e => {
  const d = $("#adrawer");
  if(e.target !== document.body || !d.classList.contains("on")) return;   // the dimmed page is body::before
  const busy = MONEY.busy || ASSIGN.busy || AT.busy;
  const changed = DRAWER_SNAP && DRAWER_SNAP.owner === drawerOwner() && DRAWER_SNAP.state !== drawerState();
  if(busy || changed){
    d.classList.remove("nope"); void d.offsetWidth; d.classList.add("nope");
    toast(busy ? "Still saving — give it a second" : "You've changed something here — save it, or Cancel to throw it away");
    return;
  }
  if(MONEY.form && moneyDrawerMine()) moneyCloseForm();
  else if(ASSIGN.open) closeCell();
  else if(AT.open) closeRoll();
});
$("#adrawer").addEventListener("animationend", e => { if(e.animationName === "nope") e.currentTarget.classList.remove("nope"); });

/* ═══════════ DATA EXPORT / IMPORT ═══════════ */
function openData(){
  $("#mTitle").textContent = "Hub data";
  $("#mBody").innerHTML = "This is everything the hub knows, as JSON. <b>Copy</b> it and send it to the other " +
    "person — they paste it in here and hit <b>Load</b> to get your exact plan. <b>Download</b> saves a file you can " +
    "hand to Claude to commit back into the repo.";
  $("#mText").value = JSON.stringify(DATA, null, 2);
  $("#mActions").innerHTML = `
    <button class="btn" data-act="reset">Reset to seed</button>
    <span style="flex:1"></span>
    <button class="btn" data-act="copy">Copy</button>
    <button class="btn" data-act="download">Download</button>
    <button class="btn primary" data-act="load">Load pasted JSON</button>
    <button class="btn" data-act="close">Close</button>`;
  $("#scrim").classList.add("on");
}
$("#scrim").addEventListener("click", async e => {
  if(e.target.id === "scrim") return $("#scrim").classList.remove("on");
  const act = e.target.dataset && e.target.dataset.act;
  if(!act) return;
  if(act === "close") return $("#scrim").classList.remove("on");
  if(act === "copy"){
    try{ await navigator.clipboard.writeText($("#mText").value); toast("Copied"); }
    catch(err){ $("#mText").select(); document.execCommand("copy"); toast("Copied"); }
    return;
  }
  if(act === "download"){
    const blob = new Blob([$("#mText").value], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "sna-hub-data-" + todayISO() + ".json";
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Downloaded"); return;
  }
  if(act === "load"){
    try{
      const parsed = JSON.parse($("#mText").value);
      if(!parsed.calendar || !Array.isArray(parsed.calendar)) throw new Error("missing calendar");
      DATA = migrate(parsed); save(); render();
      $("#scrim").classList.remove("on"); toast("Loaded");
    }catch(err){ toast("Nothing loaded — that isn't valid hub JSON: " + err.message, {err:true}); }
    return;
  }
  if(act === "keepMine"){
    setRev(window._conflict.rev); push();
    $("#scrim").classList.remove("on"); toast("Your version is now the shared one"); return;
  }
  if(act === "takeTheirs"){
    DATA = migrate(window._conflict.data); DF = null;
    CI_JOURNAL = []; OTHER_EDITS = 0;
    localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
    setRev(window._conflict.rev);                  // after the copy — sibling tabs read the copy when this changes
    render(); $("#scrim").classList.remove("on");
    toast(window._conflict.by === whoAmI() ? "Loaded the other copy — redo your last change here" : "Loaded their version"); return;
  }
  if(act === "reset"){
    if(!confirm("Throw away your local edits and go back to the data pulled from the sheet?")) return;
    localStorage.removeItem(STORE_KEY);
    DATA = clone(SEED); DIRTY = false; DF = null; CI_JOURNAL = []; OTHER_EDITS = 0; paintSaveState(); render();
    $("#scrim").classList.remove("on"); toast("Back to seed data");
  }
});
document.addEventListener("keydown", e => { if(e.key === "Escape") $("#scrim").classList.remove("on"); });

/* ═══════════ boot ═══════════ */
$("#sheetLink").href = SEED.meta.sheetUrl;
/* the standalone dashboard now redirects coaches back here — link the tab instead */
$("#dashLink").href = "#perf";
$("#dashLink").removeAttribute("target");
$("#stamp").textContent = "sheet snapshot " + SEED.meta.snapshot;
if(!TABS.some(t => t.id === TAB)) TAB = TABS[0].id;
paintSaveState();
render();
pageIn();

/* shared mode: pull once on load, then keep an eye on the shared copy */
if(syncOn()){
  syncStatus("connecting…");
  askWho();                                    // once, at boot — never from inside a save
  $("#saveLabel").style.cursor = "pointer";
  $("#saveLabel").title = "Click to change the name your edits are labelled with";
  $("#saveLabel").addEventListener("click", () => askWho(true));
  pull(true);
  setInterval(() => { if(document.visibilityState === "visible") pull(); }, SYNC.pollMs);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") pull(); });
  /* Other tabs of this same browser. localStorage is shared between them, so
     the moment one tab's save lands (it writes :rev) its siblings adopt the
     copy it saved, instead of waiting for a poll they never run while hidden.
     A tab left open on another board can no longer fall behind and then
     collide with the tab you're actually working in. A tab holding unsynced
     edits of its own is left alone — its next save sorts that out. */
  window.addEventListener("storage", e => {
    if(e.key !== STORE_KEY + ":rev" || !e.newValue) return;
    const n = Number(e.newValue);
    if(!(n > REV) || PENDING || PUSHING || OTHER_EDITS || CI_JOURNAL.length) return;
    let d = null;
    try{ d = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if(d) d = migrate(d); }
    catch(err){ console.warn("sibling tab's copy unreadable", err); return; }
    if(!d || !Array.isArray(d.calendar)) return;
    DATA = d; DF = null; REV = n;
    REMOTE = {rev:n, by:"", updated:""};        // the next poll fills in who; "in sync" is never wrong
    render();
    syncStatus("shared · in sync");
  });
  window.addEventListener("beforeunload", e => {
    if(PENDING || PUSHING){ e.preventDefault(); e.returnValue = ""; }   // don't lose an in-flight save
  });
}
</script>
