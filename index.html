/* ═══════════════════════════════════════════════════════════════════════════
   TAB 5 — NEXT ORDERS OF BUSINESS
   A working list, not a document: add, rename, tick, assign and date without
   flipping into Edit mode. Edit mode is only needed to delete things.
   ═══════════════════════════════════════════════════════════════════════════ */
function dueState(item){
  if(item.done) return "done";
  if(!item.due) return "none";
  const today = todayISO();
  if(item.due < today) return "over";
  const soon = new Date(); soon.setDate(soon.getDate() + 14);
  return item.due <= soon.toISOString().slice(0,10) ? "soon" : "later";
}
/* ── urgency and importance: two 1–5 scales, 1 at the top ─────────────────
   Think of it as a countdown, not a score: 1 means "do it now / it really
   matters", 5 means "whenever / barely matters". Storing the number (not the
   name) means sorting ascending puts the sharpest items first, and the names
   can be reworded later without touching anyone's data. */
const BIZ_LEVELS = {
  urg:{label:"Urgency",    short:"Urg", names:["Now", "This week", "Soon", "Can wait", "Whenever"]},
  imp:{label:"Importance", short:"Imp", names:["Critical", "High", "Medium", "Low", "Minor"]}
};
function lvl(v){ const n = Number(v); return n >= 1 && n <= 5 ? Math.round(n) : 0; }   // 0 = unrated
/* A blank order of business. The "add a task" box pushes one of these — an
   object, never a bare string, or the row has nowhere to keep what you type. */
function newBizItem(){ return {t:"New item", note:"", who:"", due:"", done:false, topic:"", urg:"", imp:""}; }
/* every topic anyone has put on an item, so the picker and the filter offer
   the same list, spelled the way it already is */
function bizTopics(){
  const seen = new Set();
  for(const list of Object.values(DATA.business || {}))
    for(const it of list){ const t = String((it && it.topic) || "").trim(); if(t) seen.add(t); }
  return [...seen].sort((a, b) => a.localeCompare(b));
}
function bizFiltered(){
  return UI.bizView !== "all" || UI.presenter !== "all" || !!UI.bizSec || !!UI.bizTopic ||
         !!UI.bizDue || UI.bizUrg.length > 0 || UI.bizImp.length > 0 || !!UI.q.trim();
}
function bizClearFilters(){
  UI.bizView = "all"; UI.presenter = "all"; UI.bizDue = ""; UI.bizSec = ""; UI.bizTopic = "";
  UI.bizUrg = []; UI.bizImp = []; UI.q = "";
}
/* does this item pass the tab's filters? One function, shared by the render
   and by the "add a task" box (which drops the filters if the fresh row would
   be hidden — a task you can't see is a task that "didn't save"). */
function bizShows(i, g){
  if(UI.bizView === "open" && i.done) return false;
  if(UI.bizView === "done" && !i.done) return false;
  if(UI.bizSec && g !== UI.bizSec) return false;
  if(UI.presenter !== "all"){
    const w = String(i.who || "").toLowerCase();
    if(UI.presenter === "tbd"){ if(w.trim() !== "") return false; }
    else if(UI.presenter === "both"){ if(presenterClass(w) !== "both") return false; }
    else if(!w.includes(UI.presenter)) return false;      // "Alan" also matches "Alan & Ben"
  }
  if(UI.bizUrg.length && !UI.bizUrg.includes(String(lvl(i.urg)))) return false;
  if(UI.bizImp.length && !UI.bizImp.includes(String(lvl(i.imp)))) return false;
  if(UI.bizTopic){
    const tp = String(i.topic || "").trim();
    if(UI.bizTopic === "none" ? tp !== "" : tp !== UI.bizTopic) return false;
  }
  if(UI.bizDue){
    const due = String(i.due || "");
    const plus = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoOfDate(d); };
    if(UI.bizDue === "dated" && !due) return false;
    if(UI.bizDue === "none"  && due) return false;
    /* the windows include overdue: something due last Friday still needs
       doing this week, and hiding it would bury the most pressing thing */
    if(UI.bizDue === "over" && !(due && !i.done && due < todayISO())) return false;
    if(UI.bizDue === "7"    && !(due && !i.done && due <= plus(7))) return false;
    if(UI.bizDue === "14"   && !(due && !i.done && due <= plus(14))) return false;
  }
  const q = UI.q.toLowerCase().trim();
  if(q && !JSON.stringify(i).toLowerCase().includes(q)) return false;
  return true;
}
/* A new task lands in the section you're filtered to, else the first one; the
   section chip on its row moves it anywhere else. */
function bizAddSection(){ return UI.bizSec || Object.keys(DATA.business)[0] || "Action Items"; }
/* the "add a task" box: type, press Enter, and it's on the list — no Edit mode.
   The cursor stays in the box so the next one can go straight in. */
function bizQuickAdd(){
  const box = $("#bizAdd");
  const t = String(box ? box.value : UI.bizDraft).replace(/\s+/g, " ").trim();
  if(!t){ toast("Type the task first"); if(box) box.focus(); return; }
  const sec = bizAddSection();
  if(!Array.isArray(DATA.business[sec])) DATA.business[sec] = [];   // a board with no sections yet
  const item = newBizItem(); item.t = t;
  DATA.business[sec].push(item);
  let msg = "Added to " + sec;
  if(!bizShows(item, sec)){ bizClearFilters(); msg += " \u2014 filters cleared so it shows"; }
  UI.bizDraft = "";
  JUST_TOGGLED = "business." + sec + "." + (DATA.business[sec].length - 1);   // flash the new row
  save(); render();
  const again = $("#bizAdd"); if(again) again.focus();
  clearTimeout(FLASH_TIMER);
  FLASH_TIMER = setTimeout(() => { JUST_TOGGLED = null; render(); }, 2600);
  toast(msg);
}
/* the three small chips under an item. Each opens the picker (bizPop) — live,
   no Edit mode needed, same as the owner and the due date beside it. */
function bizChip(kind, p, i, sec){
  let cls, text, title, val;
  if(kind === "sec"){
    val = String(sec || "").trim();
    cls = val ? "sec" : "empty"; text = esc(val || "+ section"); title = "Move to another section";
  } else if(kind === "topic"){
    val = String(i.topic || "").trim();
    cls = val ? "topic" : "empty"; text = esc(val || "+ topic"); title = "Pick a topic";
  } else {
    const n = lvl(i[kind]), L = BIZ_LEVELS[kind];
    val = n ? String(n) : "";
    cls = n ? "lv" + n : "empty";
    text = n ? `<span class="lk">${L.short} ${n} ·</span> ${esc(L.names[n - 1])}` : L.label.toLowerCase();
    title = L.label + " — 1 is the most " + (kind === "urg" ? "urgent" : "important") + ", 5 the least";
  }
  const empty = cls === "empty";
  return `<button type="button" class="chip bz dpick ${cls}${empty ? " no-export no-print" : ""}" data-bizpick="${kind}"
    data-path="${esc(p + "." + kind)}" data-val="${esc(val)}" title="${esc(title)}">${text}</button>`;
}
function renderBusiness(){
  const groups = DATA.business;
  const all = Object.entries(groups).flatMap(([g, list]) => list.map((i, idx) => ({i, g, idx})));
  const open = all.filter(x => !x.i.done);
  const overdue = open.filter(x => dueState(x.i) === "over");
  const soon = open.filter(x => dueState(x.i) === "soon");
  const urgent = open.filter(x => lvl(x.i.urg) && lvl(x.i.urg) <= 2);
  const mine = who => open.filter(x => String(x.i.who||"").toLowerCase().includes(who)).length;
  const unassigned = open.filter(x => !String(x.i.who||"").trim()).length;
  const topics = bizTopics();
  if(UI.bizSec && !(UI.bizSec in groups)) UI.bizSec = "";                 // section renamed or deleted
  if(UI.bizTopic && UI.bizTopic !== "none" && !topics.includes(UI.bizTopic)) UI.bizTopic = "";
  const filtered = bizFiltered();

  /* One flat list. Open items first, done sunk to the bottom; then the chosen
     sort. "Priority" adds urgency and importance together (1+1 = 2 is the
     sharpest; an unrated scale counts as 6, so a half-rated item sits below a
     fully rated one but above the wholly unrated). Every sort falls through
     to the next tie-break, so two equal items never shuffle between renders:
       priority  → urgency → importance → due date
       urgency   → importance → due · importance → urgency → due
       due date  → priority …  · section → (sheet order) → priority … */
  const rank = (i, k) => lvl(i[k]) || 6;
  const pri = i => rank(i, "urg") + rank(i, "imp");
  const secIdx = Object.fromEntries(Object.keys(groups).map((n, k) => [n, k]));
  const byDue = (a, b) => (!!a.due !== !!b.due) ? (a.due ? -1 : 1) : (a.due || "").localeCompare(b.due || "");
  const byLevels = keys => (a, b) => { for(const k of keys) if(rank(a, k) !== rank(b, k)) return rank(a, k) - rank(b, k); return 0; };
  const byPri = (a, b) => (pri(a) - pri(b)) || byLevels(["urg", "imp"])(a, b) || byDue(a, b);
  const cmp = (a, b) => {
    if(a.i.done !== b.i.done) return a.i.done ? 1 : -1;
    switch(UI.bizSort){
      case "sec": return (secIdx[a.g] - secIdx[b.g]) || byPri(a.i, b.i);
      case "due": return byDue(a.i, b.i) || byPri(a.i, b.i);
      case "urg": return byLevels(["urg", "imp"])(a.i, b.i) || byDue(a.i, b.i);
      case "imp": return byLevels(["imp", "urg"])(a.i, b.i) || byDue(a.i, b.i);
      default:    return byPri(a.i, b.i);
    }
  };

  let html = `
  <div class="page-head no-export no-print">
    <div>
      <div class="eyebrow">Between the two of you</div>
      <div class="big serif">Next Orders of Business</div>
      <div class="lede">Everything you two still owe each other, one list, sharpest first.
        Add a task in the box at the top of the list, click its title to reword it, tick it,
        put a name on it (Alan, Ben, or both), give it a date, a note, a section, a topic, an
        urgency and an importance — no need to turn on Edit for any of that. Edit mode is only
        for deleting.
        On both scales <b>1 is the top</b> and 5 the bottom.</div>
    </div>
  </div>`;

  const levelOpts = kind => [{v:"", l:"Any"},
    ...[1, 2, 3, 4, 5].map(n => ({v:String(n), l:String(n), t:n + " · " + BIZ_LEVELS[kind].names[n - 1]})),
    {v:"0", l:"Unrated", t:"No " + BIZ_LEVELS[kind].label.toLowerCase() + " set"}];
  const opt = (v, l, cur) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(l)}</option>`;
  html += toolbar(`
    <div class="tb-filters">
      ${seg("bizView", [{v:"all",l:"Everything"},{v:"open",l:"Hide done"},{v:"done",l:"Done only"}], UI.bizView)}
      ${fgroup("Who", seg("presenter", [{v:"all",l:"Anyone"},{v:"alan",l:"Alan",t:"On Alan, alone or shared"},
        {v:"ben",l:"Ben",t:"On Ben, alone or shared"},{v:"both",l:"Both",t:"Shared between the two of you"},{v:"tbd",l:"Unassigned"}], UI.presenter))}
      ${fgroup("Due", seg("bizDue", [{v:"",l:"Any"},{v:"over",l:"Overdue",t:"Past its date and not done"},
        {v:"7",l:"7 days",t:"Overdue, or due in the next 7 days"},{v:"14",l:"14 days",t:"Overdue, or due in the next 14 days"},
        {v:"dated",l:"Dated",t:"Has a due date"},{v:"none",l:"Undated",t:"No due date yet"}], UI.bizDue))}
    </div>
    <input class="search" id="q" placeholder="Search ${all.length} items…" value="${esc(UI.q)}">
    ${fgroup("Sort", seg("bizSort", [{v:"pri",l:"Priority",t:"Urgency and importance together — 1+1 first"},
      {v:"urg",l:"Urgency",t:"Urgency, then importance"},{v:"imp",l:"Importance",t:"Importance, then urgency"},
      {v:"due",l:"Due date",t:"Soonest first, undated last"},{v:"sec",l:"Section",t:"Grouped by section, sharpest first within each"}], UI.bizSort))}
    <div class="tb-actions">
      ${exportButtons("bizBoard", "Next Orders of Business")}
    </div>
    <div class="tb-filters tb-row2">
      ${fgroup("Urgency", mseg("bizUrg", levelOpts("urg"), UI.bizUrg))}
      ${fgroup("Importance", mseg("bizImp", levelOpts("imp"), UI.bizImp))}
      ${fgroup("Section", `<select class="fsel" data-bizsel="bizSec" title="Show one section">${
        opt("", "All sections", UI.bizSec)}${Object.keys(groups).map(n => opt(n, n, UI.bizSec)).join("")}</select>`)}
      ${fgroup("Topic", `<select class="fsel" data-bizsel="bizTopic" title="Show one topic">${
        opt("", "All topics", UI.bizTopic)}${topics.map(t => opt(t, t, UI.bizTopic)).join("")}${opt("none", "No topic", UI.bizTopic)}</select>`)}
      ${filtered ? `<button class="btn sm" data-bizclear="1" title="Back to everything">Clear filters</button>` : ""}
    </div>`);

  html += `<div id="bizBoard" class="export-frame">`;
  html += printHead("Next Orders of Business",
    `${open.length} open · ${all.length - open.length} done · printed ${fmtFull(todayISO())}`);
  html += `<div class="stats">
    ${statBox("Still open", open.length, "of " + all.length + " total")}
    ${statBox("Overdue", overdue.length, overdue.length ? "past their date" : "nothing late", overdue.length > 0)}
    ${statBox("Due soon", soon.length, "next 14 days")}
    ${statBox("Urgent", urgent.length, "urgency 1–2, still open", urgent.length > 0)}
    ${statBox("On Alan", mine("alan"), "open items")}
    ${statBox("On Ben", mine("ben"), "open items")}
    ${statBox("Unassigned", unassigned, "nobody owns these", unassigned > 0)}
  </div>`;

  /* The sections are still there underneath (the sheet is keyed by them), but
     the board is one flat list: each row wears its section as a chip, the
     Section dropdown narrows to one, and the Section sort groups them. */
  const order = all.filter(x => bizShows(x.i, x.g)).sort(cmp);
  const addSec = bizAddSection();
  html += `<div class="biz">
    <div class="biz-add no-export no-print">
      <span class="plus" aria-hidden="true">+</span>
      <input id="bizAdd" type="text" value="${esc(UI.bizDraft)}" placeholder="Add a task and press Enter\u2026"
        autocomplete="off" enterkeyhint="done" aria-label="Add a task to ${esc(addSec)}">
      <span class="to" title="New tasks land here \u2014 move one with the section chip on its row, or pick a section in the filter above">\u2192 ${esc(addSec)}</span>
      <button class="btn sm primary" data-bizadd="1">Add</button>
    </div>`;
  for(const {i, idx, g} of order){
    const p = "business." + g + "." + idx;
    const st = dueState(i);
    const flash = (p === JUST_TOGGLED) ? " flash" : "";
    const note = String(i.note || "").trim();
    html += `<div class="biz-row ${i.done?"is-done":""}${flash}">
      <button class="tick ${i.done?"on":""}" data-check="${p}" title="${i.done?"Mark as still open":"Mark done"}" aria-pressed="${i.done}">${i.done?"✓":""}</button>
      <div class="biz-main">
        <div class="biz-t">${edLive(p+".t", i.t, "", "untitled")}</div>
        <div class="biz-note${note ? "" : " empty no-export no-print"}">${edLive(p+".note", note, "", "+ note")}</div>
        <div class="biz-meta">${bizChip("sec", p, i, g)}${bizChip("topic", p, i)}${bizChip("urg", p, i)}${bizChip("imp", p, i)}</div>
      </div>
      ${whoChip(p+".who", i.who, {kind:"who", live:true, cls:"who", ph:"assign"})}
      <span class="due ${st}">${dbtn("due", p+".due", i.due || "", i.due ? fmtDate(i.due) : "",
          {cls:"always", ph:"add date", title:"Set a due date"})}</span>
      ${i.done ? `<button class="del always" data-del="${p}" title="Delete this item">×</button>` : del(p, "this item")}
    </div>`;
  }
  if(!order.length) html += filtered ? emptyState("Nothing matches", "No item fits these filters and the search.", clearFiltersBtn("biz"))
                                    : emptyState("Nothing on the list", "Add a task in the box at the top.");
  html += `</div></div>`;
  return html;
}

/* ═══════════════════════════════════════════════════════════════════════════
   SHARED SYNC — so Alan and Ben see each other's edits
   ───────────────────────────────────────────────────────────────────────────
   The page is static (GitHub Pages), so the shared copy lives in a Google
   Sheet and a small Apps Script Web App reads and writes it. Same shape as
   the mentee dashboard's script. Setup is in README.md → "Turning on sync".

   Reads are a plain GET. Writes POST with Content-Type text/plain on purpose:
   anything else makes the browser send a CORS preflight, which Apps Script
   web apps don't answer.
   ═══════════════════════════════════════════════════════════════════════════ */
const SYNC = {
  url:   "https://script.google.com/macros/s/AKfycbyw7ngyqNuO9AHQnCeb1paTfoDRWX1sTkJMlhC2zB9BKDuo_O-SF9XWke2e1QiA_Y9A/exec",
         // ↑ Apps Script web app (SNA Hub Sync). Redeploy a NEW VERSION there
         //   after editing the .gs, or it keeps serving the old code.
  token: "sharpninja",// must match TOKEN in SharpNinja-Hub-Sync.gs
  pollMs: 25000
};

const syncOn = () => !!SYNC.url;
let REV = Number(localStorage.getItem(STORE_KEY + ":rev") || 0);
let REMOTE = {rev:0, by:"", updated:""};
let PUSH_TIMER = null, PUSHING = false, PENDING = false;
let LAST_SENT = "";   // the JSON the last push carried — how a rejected retry, or a poll, recognises our own save

/* Who's editing — only ever used to label a change. This must never block or
   throw: it sits in the save path, and a browser that suppresses dialogs (or a
   person who hits Cancel) would otherwise kill the save outright. */
function whoAmI(){ return (localStorage.getItem(STORE_KEY + ":who") || "").trim() || "someone"; }

/* Asking happens once at boot, well away from any save. */
function askWho(force){
  if(!force && localStorage.getItem(STORE_KEY + ":who")) return;
  try{
    const w = (prompt("Who's using this hub? (so edits get labelled)\n\nType Alan or Ben:",
                      localStorage.getItem(STORE_KEY + ":who") || "") || "").trim();
    if(w){ localStorage.setItem(STORE_KEY + ":who", w); syncStatus("shared · you're " + w); }
  }catch(e){ /* dialogs blocked — changes just get labelled "someone" */ }
}
function setRev(n){ REV = n; localStorage.setItem(STORE_KEY + ":rev", String(n)); }

function syncStatus(text, kind){
  const el = $("#saveLabel"), dot = $("#saveDot");
  if(!el) return;
  el.textContent = text;
  dot.className = "dot" + (kind === "warn" ? " edited" : "");
}
function ago(iso){
  if(!iso) return "";
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if(s < 60) return "just now";
  if(s < 3600) return Math.round(s/60) + "m ago";
  if(s < 86400) return Math.round(s/3600) + "h ago";
  return Math.round(s/86400) + "d ago";
}

/* ── pull ─────────────────────────────────────────────────────────────── */
async function pull(quiet){
  if(!syncOn()) return;
  try{
    const res = await fetch(SYNC.url + "?token=" + encodeURIComponent(SYNC.token) + "&t=" + Date.now());
    const body = await res.json();
    if(!body.ok) throw new Error(body.error || "refused");
    REMOTE = {rev:body.rev, by:body.by, updated:body.updated};

    if(body.rev > REV && body.data){
      /* someone else moved ahead of us */
      if(PENDING || PUSHING){
        /* Our own name on it is most likely this tab's in-flight save, and
           its reply settles that either way. Someone else's: warn — the save
           will ask before overwriting them. */
        if(body.by !== whoAmI())
          syncStatus(body.by + " also saved — " + (OTHER_EDITS ? "you'll be asked" : "merging marks"), "warn");
        return;
      }
      const own = !!LAST_SENT && JSON.stringify(body.data) === LAST_SENT;   // our save, whose reply we never got
      DATA = migrate(body.data); DF = null;
      /* marks a failed push left behind go back on top of the fresh copy;
         any other stranded edit is lost the way it always was */
      const replay = !OTHER_EDITS && CI_JOURNAL.length > 0;
      if(replay) for(const j of CI_JOURNAL) replayMark(j);
      else { CI_JOURNAL = []; OTHER_EDITS = 0; }
      localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
      setRev(body.rev);                            // after the copy — sibling tabs read the copy when this changes
      render();
      if(replay) scheduleSync();
      if(!quiet && !own) toast(body.by === whoAmI() ? "Your changes from another tab or device loaded"
                             : body.by ? body.by + "'s changes loaded" : "Updated from the shared copy");
    }
    if(!PENDING && !PUSHING) syncStatus("shared · " + (REMOTE.by ? REMOTE.by + " " + ago(REMOTE.updated) : "in sync"));
  }catch(e){
    console.warn("pull failed", e);
    syncStatus("offline — editing locally", "warn");
  }
}

/* ── push (debounced) ─────────────────────────────────────────────────── */
function scheduleSync(){
  if(!syncOn()) return;
  PENDING = true;
  syncStatus("saving…", "warn");
  clearTimeout(PUSH_TIMER);
  PUSH_TIMER = setTimeout(() => push(), 1200);   // no bare `push` — setTimeout would pass the timer id as `attempt`
}
async function push(attempt){
  if(!syncOn() || PUSHING) return;
  PUSHING = true; PENDING = false;
  const sentMarks = CI_JOURNAL.length, sentOther = OTHER_EDITS;   // what this push carries — edits can land while it's in flight
  try{
    const sent = LAST_SENT = JSON.stringify(DATA);                 // and exactly what went up — DATA can change while it's in flight
    const res = await fetch(SYNC.url, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},   // keeps it a simple request — no preflight
      body: `{"token":${JSON.stringify(SYNC.token)},"baseRev":${Number(REV) || 0},"by":${JSON.stringify(whoAmI())},"data":${sent}}`
    });
    const body = await res.json();
    if(body.conflict){
      REMOTE = {rev:body.rev, by:body.by, updated:body.updated};
      /* The Sheet already holds exactly what this push sent? Then it's our
         own save: it landed, but the reply was lost on the way back (a lid
         closed on "saving…", a WiFi blip, Google's redirect hop dying) and
         this is the retry. Nothing to resolve — take the new page number.
         Before this check, that retry read "Ben saved changes while you were
         editing" on Ben's own screen. */
      if(body.data && JSON.stringify(body.data) === sent){
        setRev(body.rev);
        CI_JOURNAL.splice(0, sentMarks); OTHER_EDITS = Math.max(0, OTHER_EDITS - sentOther);
        syncStatus("shared · saved just now");
        dismissToast("sync");
        return;
      }
      /* Only check-in or roll marks since our last sync? Take their copy, put
         our marks back on top, and push again — the two boards simply combine. */
      if(CI_JOURNAL.length && !OTHER_EDITS && body.data){
        DATA = migrate(body.data); DF = null;
        for(const j of CI_JOURNAL) replayMark(j);
        localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
        setRev(body.rev);                          // after the copy — sibling tabs read the copy when this changes
        render();
        syncStatus("merging with " + (body.by || "the other coach") + "…", "warn");
        PENDING = true;                              // finally{} schedules the re-push
        return;
      }
      showConflict(body);
      syncStatus("conflict with " + body.by, "warn");
      return;
    }
    if(!body.ok) throw new Error(body.error || "refused");
    setRev(body.rev);
    CI_JOURNAL.splice(0, sentMarks); OTHER_EDITS = Math.max(0, OTHER_EDITS - sentOther);   // what went up is now shared; later edits stay pending
    REMOTE = {rev:body.rev, by:whoAmI(), updated:new Date().toISOString()};
    syncStatus("shared · saved just now");
    dismissToast("sync");
  }catch(e){
    console.warn("push failed", e);
    /* Apps Script sleeps when idle and the first call after a while can die on
       the way up. One quiet retry covers that without bothering anyone. */
    if(!attempt){
      PUSHING = false;
      syncStatus("saving…", "warn");
      if(!PENDING) setTimeout(() => push(1), 2500);   // more edits waiting? finally{} re-sends those anyway — one push at a time
      return;
    }
    syncStatus("offline — saved on this computer only", "warn");
    /* the status line is small and a phone hides it: this one has to be seen */
    toast("Couldn't reach the shared copy — your changes are saved on this computer only, so the other coach won't see them yet.",
          {err:true, key:"sync", retry:() => push()});
  }finally{
    PUSHING = false;
    if(PENDING) scheduleSync();
  }
}

/* both sides edited the same version — let the human pick */
function showConflict(body){
  const mine = !!body.by && body.by === whoAmI();
  if(mine){
    /* Same name on both sides: another tab or device of yours saved, and this
       copy hadn't caught up before you edited it. The safe move is to take
       that copy and redo the one thing you just did here — keeping this one
       would silently overwrite everything the other copy saved since. */
    $("#mTitle").textContent = "You saved this from another tab or device";
    $("#mBody").innerHTML = `Another copy of the hub, signed <b>${esc(body.by)}</b>, saved changes ${esc(ago(body.updated))}, ` +
      `and this copy hadn't caught up before you edited it. Take that version and redo what you just changed here — ` +
      `keeping this one overwrites everything the other copy saved. The Google Sheet keeps a version history either way.`;
  } else {
    $("#mTitle").textContent = "Both of you edited this";
    $("#mBody").innerHTML = `<b>${esc(body.by || "The other person")}</b> saved changes ${esc(ago(body.updated))} while you were editing. ` +
      `Keeping yours overwrites theirs; taking theirs discards what you just changed. ` +
      `Either way the Google Sheet keeps a version history, so nothing is truly lost.`;
  }
  $("#mText").value = JSON.stringify(body.data, null, 2);
  $("#mActions").innerHTML = mine ? `
    <button class="btn" data-act="keepMine">Keep this copy</button>
    <span style="flex:1"></span>
    <button class="btn primary" data-act="takeTheirs">Take the other copy</button>` : `
    <button class="btn" data-act="takeTheirs">Take ${esc(body.by || "theirs")}</button>
    <span style="flex:1"></span>
    <button class="btn primary" data-act="keepMine">Keep mine</button>`;
  $("#scrim").classList.add("on");
  window._conflict = body;
}

/* ═══════════════════════════════════════════════════════════════════════════
   APP — routing, rendering, editing, export
   ═══════════════════════════════════════════════════════════════════════════ */
function currentTab(){ return TABS.find(t => t.id === TAB) || TABS[0]; }

function paintTabs(){
  const active = sectionOf(TAB);
  const primary = SECTIONS.map(sec =>
    `<button class="tab-primary ${sec.id===active?"on":""}" data-section="${sec.id}"><span class="tl" data-label="${esc(sec.label)}">${esc(sec.label)}</span>
       <span class="ct">${sec.count ? esc(sec.count()) : ""}</span></button>`).join("");

  const siblings = tabsIn(active);
  const sub = siblings.length < 2 ? "" : siblings.map(t =>
      `<button class="tab-sub ${t.id===TAB?"on":""}" data-tab="${t.id}"><span class="tl" data-label="${esc(t.sub || t.label)}">${esc(t.sub || t.label)}</span>
         <span class="ct">${t.count ? esc(t.count()) : ""}</span></button>`).join("");

  $("#tabBar").innerHTML = primary;
  $("#tabSubBar").innerHTML = sub;
  $("#tabsSub").hidden = !sub;
  placeInk($("#tabInk"), $("#tabBar .tab-primary.on"), "primary");
  placeInk($("#tabSubInk"), $("#tabSubBar .tab-sub.on"), active);
  /* on a phone the rows scroll sideways: a new tab (a link, the back button) is
     brought into view — only when the tab changes, so a render never undoes your own scrolling */
  if(paintTabs.shown !== TAB){
    paintTabs.shown = TAB;
    for(const [row, on] of [[".tabs-primary", "#tabBar .tab-primary.on"], [".tabs-sub", "#tabSubBar .tab-sub.on"]]){
      const r = $(row), b = $(on);
      if(!r || !b || r.scrollWidth <= r.clientWidth) continue;
      const box = r.getBoundingClientRect(), bb = b.getBoundingClientRect();
      if(bb.left < box.left || bb.right > box.right - 28) r.scrollLeft += bb.left - box.left - 24;
    }
  }
}
/* Each row has one underline, and paintTabs() never rebuilds it, so it's still
   under the tab you were on when the next one lights up: it slides across on the
   spring. Its first placing, a sub-row that belongs to another section (`group`),
   and a re-measure after the fonts land or the window resizes put it straight in
   place instead. */
function placeInk(ink, btn, group, jump){
  if(!ink) return;
  if(!btn){ ink.style.opacity = "0"; ink.dataset.group = ""; return; }
  jump = jump || ink.dataset.group !== group || ink.style.opacity !== "1";
  ink.classList.toggle("jump", !!jump);
  ink.style.width = btn.offsetWidth + "px";
  ink.style.transform = `translateX(${btn.offsetLeft}px)`;
  ink.style.opacity = "1";
  ink.dataset.group = group;
  if(jump){ void ink.offsetWidth; ink.classList.remove("jump"); }   // commit the jump before the slide comes back
}
/* each row re-measures only its own underline: the sub-row coming and going when you
   change section mustn't cut short the slide along the top row */
const inkPrimary = () => placeInk($("#tabInk"), $("#tabBar .tab-primary.on"), "primary", true);
const inkSub = () => placeInk($("#tabSubInk"), $("#tabSubBar .tab-sub.on"), sectionOf(TAB), true);
if(window.ResizeObserver){ new ResizeObserver(inkPrimary).observe($("#tabBar")); new ResizeObserver(inkSub).observe($("#tabSubBar")); }
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { inkPrimary(); inkSub(); });

/* Clicking straight from one field to the next used to swallow the second click:
   leaving field A saves and re-renders, which destroys field B before the click
   lands on it. mousedown fires first, so we note where the click is headed and
   put the cursor back there once the new DOM exists.
   It only lives until focus lands (focusin clears it). Left set, the next
   render — Enter finishing the field, or a sync pull — put the cursor back in
   the field you'd just finished, text all selected. A click inside the field
   you're already in, or on one that isn't editable, moves no focus: skip it.
   It also notes how many characters into the field the click fell, so the
   cursor goes back to that spot. The browser's own caret for the click lands
   in the destroyed field. Measured now, on the field you clicked: the re-render
   puts up a new one, and A's change can reflow it. */
let PENDING_FOCUS = null;                        // {path, offset} — offset null: the click missed the text
let JUST_TOGGLED = null, FLASH_TIMER = null;
document.addEventListener("mousedown", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  const moving = el && el !== document.activeElement && (EDITING || el.hasAttribute("data-live"));
  PENDING_FOCUS = moving ? {path: el.dataset.edit, offset: textOffsetAt(el, e.clientX, e.clientY)} : null;
});

/* replay the staggered page entrance — only on real tab switches, never on
   the re-render every keystroke causes. render() keeps it that way: it swaps
   #view's children, and new children under .page-enter play the entrance from
   the start, so every save used to fade and slide the whole board in again
   (fixed 2026-09-22). Once the entrance is over render() takes the class off
   and the new children land in place; mid-entrance they carry on from where
   the old ones had got to. */
function pageIn(){
  const v = $("#view");
  v.classList.remove("page-enter"); void v.offsetWidth;   // restart the animation
  v.classList.add("page-enter");
}
const entranceOf = v => [...v.children].flatMap(c => c.getAnimations()).filter(a => a.animationName === "pageIn");

/* A render builds #view afresh, and a fresh board starts scrolled back to its first column with
   the focus dropped to <body>: on a phone, marking Wk 11 on Weekly Check-ins threw you back to
   Wk 1 every time (fixed 2026-10-15). So render() notes where each board is scrolled sideways
   (a board is known by the frame it sits in and its table: another tab's board starts at its
   own beginning) and which square has the focus (known by what it marks: a check-in week, a
   call's roll, an assignment), and puts both back on the new board. The scroll goes back
   first, so the focusin nudge finds the square where it was and has nothing to do. */
const BOARD_SQUARE = ["data-ci", "data-atcell", "data-cell"];
function boardsOf(v){
  const seen = {};
  return [...v.querySelectorAll(".tbl")].map(t => {
    const k = (t.parentElement.closest("[id]") || v).id + " " + ((t.querySelector("table") || {}).className || "");
    seen[k] = (seen[k] || 0) + 1;
    return [k + " " + seen[k], t];
  });
}
function boardPlace(v){
  const a = document.activeElement, attr = a && v.contains(a) && BOARD_SQUARE.find(n => a.hasAttribute(n));
  return {scroll: new Map(boardsOf(v).filter(([, t]) => t.scrollLeft).map(([k, t]) => [k, t.scrollLeft])),
          square: attr ? `[${attr}="${CSS.escape(a.getAttribute(attr))}"]` : null};
}
function backInPlace(v, {scroll, square}, focusTaken){
  for(const [k, t] of boardsOf(v)) if(scroll.has(k)) t.scrollLeft = scroll.get(k);
  const sq = square && !focusTaken && v.querySelector(square);
  if(sq) sq.focus({preventScroll: true});
}

function render(){
  /* the search box, the "add a task" box and a Mentees row's Pay amount are
     rebuilt by every render (a sync, a flash fading out) — put the cursor back
     where it was */
  const act = document.activeElement;
  const focused = act && (act.id === "q" || act.id === "bizAdd" || act.id === "payAmt") ? act.id : null;
  const caret = focused ? act.selectionStart : null;
  paintTabs();
  if(TAB!=="assign"&&TAB!=="attend"&&ASSIGN.open)closeCell();   // a make-up's review opens from Call Attendance
  if(TAB !== "money" && MONEY.form){ if(MONEY.busy) moneyHideDrawer(); else moneyCloseForm(); }
  if(CI_OPEN) closeCiPop();
  const v = $("#view"), place = boardPlace(v);
  const mid = v.classList.contains("page-enter") && entranceOf(v).find(a => a.playState === "running");
  const at = mid ? mid.currentTime : null;       // read now: swapping the children cancels it
  if(!mid) v.classList.remove("page-enter");     // the entrance is over (see pageIn)
  v.innerHTML = editBanner() + currentTab().render();
  backInPlace(v, place, focused || PENDING_FOCUS);
  if(mid) entranceOf(v).forEach(a => { a.currentTime = at; });
  if(AT.open){ if(TAB === "attend") paintRoll(); else closeRoll(); }
  $("#dashWrap").style.display = TAB === "perf" ? "" : "none";
  applyEdit();
  if(TAB === "checkins") ciScrollHint();
  if(focused){
    const q = $("#" + focused);
    if(q){ q.focus(); try{ q.setSelectionRange(caret, caret); }catch(e){} }
  } else if(PENDING_FOCUS){
    const {path, offset} = PENDING_FOCUS; PENDING_FOCUS = null;
    focusPath(path, {offset});
  }
}
function editBanner(){
  return `<div class="edit-banner no-export no-print">
    <b>Edit mode.</b>
    <span class="grow">Click any field to change it. Everything saves to this browser as you go — use <b>Data ▸ Export</b> to hand the plan to the other person.</span>
    <button class="btn sm" data-toggle="edit">Done editing</button>
  </div>`;
}

/* put the cursor in a field. A field we just created comes up all selected, so
   typing replaces its stand-in text. With `click` (from PENDING_FOCUS) it's a
   plain caret at the character you clicked instead. Selecting all there meant
   your first keystroke wiped the field you'd clicked into (fixed 2026-09-22). */
function focusPath(path, click){
  const el = document.querySelector(`[data-edit="${CSS.escape(path)}"]`);
  if(!el) return;
  el.focus();                                    // focusin may blank a placeholder, so place the caret after this
  const r = document.createRange(); r.selectNodeContents(el);
  if(click){
    const spot = click.offset === null ? null : textSpot(el, click.offset);
    if(spot) r.setStart(spot.node, spot.offset);
    r.collapse(!!spot);                          // at the clicked character, or else the end (a blanked placeholder: inside it)
  }
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}
/* how many characters into el the point (x, y) falls; null when it isn't on el's text */
function textOffsetAt(el, x, y){
  let node = null, off = 0;
  if(document.caretPositionFromPoint){           // Firefox, Chrome 128+
    const p = document.caretPositionFromPoint(x, y);
    if(p){ node = p.offsetNode; off = p.offset; }
  } else if(document.caretRangeFromPoint){       // Safari, older Chrome
    const p = document.caretRangeFromPoint(x, y);
    if(p){ node = p.startContainer; off = p.startOffset; }
  }
  if(!node || !el.contains(node)) return null;
  const r = document.createRange(); r.setStart(el, 0); r.setEnd(node, off);
  return r.toString().length;
}
/* the text node and offset n characters into el; null past its end */
function textSpot(el, n){
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  for(let t; (t = w.nextNode()); n -= t.length) if(n <= t.length) return {node: t, offset: n};
  return null;
}

/* ── dot-path get/set into DATA ───────────────────────────────────────── */
function setPath(path, value){
  const parts = path.split(".");
  let node = DATA;
  for(let i = 0; i < parts.length - 1; i++) node = node[parts[i]];
  node[parts[parts.length - 1]] = value;
}

/* ── edit mode ────────────────────────────────────────────────────────── */
function applyEdit(){
  document.body.classList.toggle("editing", EDITING);
  document.querySelectorAll("[data-edit]").forEach(el => {
    if(EDITING || el.hasAttribute("data-live")) el.setAttribute("contenteditable", "plaintext-only");
    else el.removeAttribute("contenteditable");
  });
  $("#editBtn").classList.toggle("on", EDITING);
  $("#editBtn").textContent = EDITING ? "Done" : "Edit";
}
/* What the field held when you clicked in. The typing timer below saves over
   DATA mid-edit, so by blur getPath() may already read the new text. */
let EDIT_START = null;                             // {el, before}
document.addEventListener("focusin", e => {
  PENDING_FOCUS = null;                          // the click's cursor has landed — nothing left to put back
  const el = e.target.closest && e.target.closest("[data-edit]");
  if(!el || !(EDITING || el.hasAttribute("data-live"))) return;
  EDIT_START = {el, before: getPath(el.dataset.edit)};
  if(el.dataset.ph && el.textContent.trim() === el.dataset.ph){
    /* wiping the placeholder takes the caret's text node with it, and if a
       field was just saved (Enter, then click an empty "+ note") the caret
       isn't re-placed — the typing went nowhere. Put it in the field. */
    el.textContent = "";
    const r = document.createRange(); r.selectNodeContents(el); r.collapse(true);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
});
/* Optional fields disappear when emptied, rather than leaving a blank chip behind. */
const OPTIONAL_FIELDS = new Set(["track","note","second","secondPresenter","secondTime","detail","proposed","alt",
                                 "series","call","hotSeat","hotSeatPresenter","hotSeatTime","lastAsked","day","speaker"]);

/* Save while typing. Blur still does the tidy-up pass and re-renders, but the
   text is already safe by then — closing the tab mid-edit doesn't lose it. */
let INPUT_TIMER = null;
document.addEventListener("input", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if(!el || !(EDITING || el.hasAttribute("data-live"))) return;
  const path = el.dataset.edit;
  if(path.startsWith("__key.")) return;           // renaming only applies once you're done
  clearTimeout(INPUT_TIMER);
  INPUT_TIMER = setTimeout(() => {
    setPath(path, el.textContent.replace(/\s+/g, " ").trim());
    save();                                        // deliberately no render — keeps your cursor put
  }, 500);
});

document.addEventListener("focusout", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if(!el || !(EDITING || el.hasAttribute("data-live"))) return;
  clearTimeout(INPUT_TIMER);
  const val = el.textContent.replace(/\s+/g, " ").trim();
  const path = el.dataset.edit;
  if(path.startsWith("__key.")){                 // renaming a category / backlog list
    const rest = path.slice(6);
    const oldKey = rest.slice(rest.indexOf(".") + 1);
    const objPath = rest.slice(0, rest.indexOf("."));
    if(val === oldKey) return;                   // touched but not changed — leave the page alone
    if(!renameKey(objPath, oldKey, val)) { render(); return toast(val ? "That name is already used" : "A name is required"); }
  } else if(val === "" && /\.(mainNotes|notes)\.\d+$/.test(path)){
    removeAt(path);                                // an emptied note line disappears
  } else if(val === "" && OPTIONAL_FIELDS.has(path.split(".").pop())){
    removeAt(path);                                // emptied an optional field — drop it entirely
  } else {
    const before = String(getPath(path) ?? "");
    /* a topic renamed in the bank keeps its tier — the tier map is keyed by text.
       The old key is the text from when you clicked in, not `before`: after a
       pause the timer has already saved the new name, so `before` equals `val`.
       Typed back to where it started = nothing to move (and nothing to delete). */
    const was = String((EDIT_START && EDIT_START.el === el ? EDIT_START.before : before) ?? "").trim();
    const retier = path.startsWith("topicBank.") && was && was !== val
                   && DATA.topicTiers && DATA.topicTiers[was] !== undefined;
    if(before === val && !retier){
      /* THE CLICK-REFRESH FIX (2026-08-26): a focusout with nothing changed
         used to save + re-render the whole page, so every stray click in Edit
         mode looked like a refresh. Now: restore the placeholder if we blanked
         it on focus, and otherwise do nothing at all. */
      if(!val && el.dataset.ph) el.textContent = el.dataset.ph;
      return;
    }
    setPath(path, val);
    if(retier){
      DATA.topicTiers[val] = DATA.topicTiers[was];
      delete DATA.topicTiers[was];
    }
  }
  save();
  render();
});
document.addEventListener("keydown", e => {
  const live = el2 => el2 && (EDITING || el2.hasAttribute("data-live"));
  const el = e.target.closest && e.target.closest("[data-edit]");
  if(live(el) && e.key === "Enter"){ e.preventDefault(); el.blur(); }
  if(live(el) && e.key === "Escape" && !e.isComposing){ e.preventDefault(); cancelField(el); }
});
/* Escape: put the field back to what it held when you clicked in, then leave it
   the way Enter does. It used to only re-render, and the typing timer had
   already saved what you typed, or saved it straight after (fixed 2026-09-28).
   The text goes back too, so the blur finds nothing changed and does nothing. */
function cancelField(el){
  clearTimeout(INPUT_TIMER);
  const path = el.dataset.edit;
  if(path.startsWith("__key.")){                   // a list rename only lands on blur — nothing saved yet
    const rest = path.slice(6);
    el.textContent = rest.slice(rest.indexOf(".") + 1);
  } else if(EDIT_START && EDIT_START.el === el){
    const was = EDIT_START.before;
    if(getPath(path) !== was){                     // the timer saved some of it: take that back
      if(was === undefined) removeAt(path); else setPath(path, was);
      save();
    }
    el.textContent = String(was ?? "");
  }
  el.blur();
}

/* ── topic picker: plan a week straight from the bank ─────────────────────
   One floating panel, opened from a week row's "▾ pick from bank". Lives
   outside #view so a background sync render can't wipe it. Also the home of
   "add a new topic while planning": name + tier + category, lands in the bank
   AND on the week in one click. */
let PICK_IDX = null, PICK_FIELD = "topic";
function openPicker(idx, anchor, field){
  PICK_IDX = idx; PICK_FIELD = (field === "topic" || /^extra\.\d+$/.test(field || "")) ? field : "topic";
  const pop = $("#pickPop");
  let inner = `<div class="pp-head"><input id="ppq" class="search" placeholder="Search the bank…" autocomplete="off">
    <button class="btn sm" id="ppClose" title="Close">✕</button></div><div class="pp-list">`;
  for(const [name, list] of Object.entries(DATA.topicBank)){
    if(!list.length) continue;
    const sorted = list.slice().sort((a, b) => (tierOf(a) || 9) - (tierOf(b) || 9));
    inner += `<div class="pp-cat">${esc(name)}</div>`;
    for(const t of sorted){
      const ti = tierOf(t);
      inner += `<button class="pp-item" data-picktopic="${esc(t)}"><span class="pp-dot t${ti}"></span>${esc(t)}${
        ti ? `<span class="pp-tier t${ti}">T${ti}</span>` : ""}</button>`;
    }
  }
  inner += `</div><div class="pp-new">
    <input id="ppNewName" class="search" placeholder="…or type a new topic" autocomplete="off">
    <select id="ppNewTier"><option value="0">tier?</option><option value="1">T1 · The Dojo</option>
      <option value="2">T2 · The Path</option><option value="3">T3 · The Masters</option></select>
    <select id="ppNewCat">${Object.keys(DATA.topicBank).map(c => `<option>${esc(c)}</option>`).join("")}</select>
    <button class="btn sm primary" id="ppAdd">Add &amp; use</button>
  </div>`;
  pop.innerHTML = inner;
  pop.classList.remove("hidden");
  const r = anchor.getBoundingClientRect();
  pop.style.top  = Math.max(10, Math.min(window.innerHeight - pop.offsetHeight - 12, r.bottom + 6)) + "px";
  pop.style.left = Math.max(10, Math.min(window.innerWidth - pop.offsetWidth - 12, r.left)) + "px";
  popOrigin(pop, r);
  $("#ppq").focus();
}
function closePicker(){ $("#pickPop").classList.add("hidden"); PICK_IDX = null; }
function pickTopic(text){
  const row = DATA.calendar[PICK_IDX];
  if(!row){ closePicker(); return; }
  if(PICK_FIELD === "topic"){
    row.topic = text;
    if(row.status === "blocked") delete row.status;   // planning un-blocks the week
  } else {
    const j = Number(PICK_FIELD.split(".")[1]);
    if(!row.extra || !row.extra[j]){ closePicker(); return; }
    row.extra[j].topic = text;
  }
  const ti = tierOf(text);
  save(); closePicker(); render();
  toast("Planned: " + text + (ti ? ` · T${ti} ${TIERS[ti].name}` : ""));
}
document.addEventListener("click", e => {           // click-away closes the picker
  const pop = $("#pickPop");
  if(pop.classList.contains("hidden")) return;
  if(pop.contains(e.target) || e.target.closest("[data-pick]")) return;
  closePicker();
});

/* ═══════════════════════════════════════════════════════════════════════════
   THE DATE PICKER — one calendar for every date in the hub
   Dates are CLICKED, never typed. The grid's columns run Tuesday → Monday, so
   every row of it is a Vector week: moving a call inside its own week is one
   step sideways, and the call's week is banded so you can see where it ends.

   A button opens it by describing itself in data- attributes, so nothing holds
   a reference to a live object across a re-render or a sync:
     data-datepick  what the pick MEANS — week · extra · due · asked · field
     data-path      dot-path into DATA (every kind but `field`)
     data-iso       the date it's on now, "" for none
     data-anchor    the week's night, for the calls that hang off one
   ═══════════════════════════════════════════════════════════════════════════ */
let DP = null;                                     // {kind, path, iso, anchor, month, el}

function isoOfDate(d){
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
/* the button that opens it — this is what replaces every typed-in date field */
function dbtn(kind, path, iso, label, opts){
  const o = opts || {};
  return `<button type="button" class="dpick ${o.cls || ""}${label ? "" : " empty"}" data-datepick="${kind}"${
    path ? ` data-path="${esc(path)}"` : ""} data-iso="${esc(iso || "")}"${
    o.anchor ? ` data-anchor="${esc(o.anchor)}"` : ""}${o.id ? ` id="${o.id}"` : ""}${
    o.ph ? ` data-ph="${esc(o.ph)}"` : ""} title="${
    esc(o.title || "Pick a date")}">${esc(label || o.ph || "pick a date")}</button>`;
}
function openDatePicker(el){
  const iso = el.dataset.iso || "";
  DP = {kind:el.dataset.datepick, path:el.dataset.path || "", iso, anchor:el.dataset.anchor || "",
        month:(iso || el.dataset.anchor || todayISO()).slice(0, 7), el};
  paintDatePicker();
  popAt($("#datePop"), el);
}
/* park a popup under whatever was clicked, kept on screen */
function popAt(pop, el){
  const r = el.getBoundingClientRect();
  pop.style.top  = Math.max(10, Math.min(window.innerHeight - pop.offsetHeight - 12, r.bottom + 6)) + "px";
  pop.style.left = Math.max(10, Math.min(window.innerWidth  - pop.offsetWidth  - 12, r.left)) + "px";
  popOrigin(pop, r);
}
/* where a popup grows from: the middle of what was clicked, on the edge nearest
   it — the top edge when it opened below, the bottom when it had to sit above */
function popOrigin(pop, r){
  const left = parseFloat(pop.style.left) || 0, top = parseFloat(pop.style.top) || 0;
  pop.style.setProperty("--pop-x", Math.max(0, Math.min(pop.offsetWidth, r.left + r.width / 2 - left)) + "px");
  pop.style.setProperty("--pop-y", top >= r.top + r.height / 2 ? "0" : "100%");
}
function closeDatePicker(){ $("#datePop").classList.add("hidden"); DP = null; }

function paintDatePicker(){
  if(!DP) return;
  const [my, mm] = DP.month.split("-").map(Number);
  const first = new Date(my, mm - 1, 1), last = new Date(my, mm, 0);
  const today = todayISO();
  const wkOf = i => isoOfDate(weekStartOf(parseDate(i)));      // which Vector week a night belongs to
  const band = DP.anchor ? wkOf(DP.anchor) : null;             // ...the one this call already sits in

  let cells = "";
  for(const d of ["Tue","Wed","Thu","Fri","Sat","Sun","Mon"]) cells += `<div class="dp-dow">${d}</div>`;
  const end = new Date(last);
  end.setDate(end.getDate() + (6 - ((end.getDay() + 5) % 7)));   // out to the Monday that closes the last week
  for(let c = weekStartOf(first); c <= end; c.setDate(c.getDate() + 1)){
    const i = isoOfDate(c), cls = [
      c.getMonth() === mm - 1 ? "" : "out",
      band && wkOf(i) === band ? "wk" : "",
      i === today ? "today" : "",
      i === DP.iso ? "on" : ""].filter(Boolean).join(" ");
    cells += `<button type="button" class="dp-d ${cls}" data-dpday="${i}" title="${esc(fmtDay(i) + " " + fmtFull(i))}">${c.getDate()}</button>`;
  }

  const foot = [];
  if(DP.kind === "extra" && DP.iso && DP.anchor && DP.iso !== DP.anchor)
    foot.push(`<button class="btn sm" data-dpclear="1">On the week's night · ${esc(fmtDate(DP.anchor))}</button>`);
  if(["due","asked","field"].includes(DP.kind)){
    foot.push(`<button class="btn sm" data-dpday="${today}">Today</button>`);
    if(DP.iso) foot.push(`<button class="btn sm" data-dpclear="1">Clear</button>`);
  }

  const pop = $("#datePop");
  pop.innerHTML = `<div class="dp-head">
      <button class="dp-nav" data-dpmonth="-1" title="Previous month">\u2039</button>
      <span class="m">${MONTHS[mm - 1]} ${my}</span>
      <button class="dp-nav" data-dpmonth="1" title="Next month">\u203a</button>
      <button class="dp-nav" data-dpclose="1" title="Close">\u2715</button>
    </div>
    <div class="dp-grid">${cells}</div>
    <div class="dp-hint">rows are Vector weeks \u00b7 Tue \u2192 Mon</div>
    ${foot.length ? `<div class="dp-foot">${foot.join("")}</div>` : ""}`;
  pop.classList.remove("hidden");
}

/* what a pick MEANS, one branch per kind. "" clears. */
function applyDatePick(iso){
  const d = DP;
  if(!d) return;
  if(d.kind === "field"){                          // a form field — no board data behind it
    d.el.dataset.iso = iso;
    d.el.textContent = iso ? fmtFull(iso) : (d.el.dataset.ph || "pick a date");
    d.el.classList.toggle("empty", !iso);
    closeDatePicker();
    d.el.dispatchEvent(new Event("change", {bubbles:true}));   // the Money drawer moves the campaign with the date
    return;
  }
  const node = getPath(d.path.slice(0, d.path.lastIndexOf(".")));
  if(!node){ closeDatePicker(); return; }
  closeDatePicker();

  if(d.kind === "week"){
    if(!iso || iso === node.date) return;          // a week always has a night — nothing to clear
    return moveWeekTo(node, iso);
  }
  if(d.kind === "extra"){
    const week = getPath(d.path.slice(0, d.path.indexOf(".extra.")));
    if(!iso || iso === week.date){                 // back onto the week's night — no override to keep
      delete node.date; save(); render();
      return toast("Back on the week's night \u2014 " + fmtFull(week.date));
    }
    node.date = iso; save(); render();
    return toast("Moved to " + fmtFull(iso) + " (" + fmtDay(iso) + ")");
  }
  const key = d.path.slice(d.path.lastIndexOf(".") + 1);
  if(!iso) delete node[key]; else node[key] = iso;
  save(); render();
  return toast(iso ? (d.kind === "asked" ? "Last asked " : "Due ") + fmtFull(iso) : "Date cleared");
}
/* moving a whole week — its calls come with it unless they carry their own night */
function moveWeekTo(row, iso){
  const clash = DATA.calendar.some(r => r !== row && r.date === iso);
  row.date = iso;
  DATA.calendar.sort((a, b) => a.date.localeCompare(b.date));
  UI.year = Number(iso.slice(0, 4));                // follow the week if it crossed a year
  if(UI.season !== "all") UI.season = seasonOf(iso).key;   // ...and its campaign, or it vanishes behind the filter
  save(); render();
  toast("Moved to " + fmtFull(iso) + " (" + fmtDay(iso) + ")" +
        (clash ? " \u2014 heads up, there's already a call that night" : ""));
}

document.addEventListener("click", e => {
  const open = e.target.closest("[data-datepick]");
  if(open){ e.preventDefault(); openDatePicker(open); return; }
  const pop = $("#datePop");
  if(pop.classList.contains("hidden")) return;
  const day = e.target.closest("[data-dpday]");
  if(day){ applyDatePick(day.dataset.dpday); return; }
  if(e.target.closest("[data-dpclear]")){ applyDatePick(""); return; }
  const mv = e.target.closest("[data-dpmonth]");
  if(mv){
    const [y, m] = DP.month.split("-").map(Number);
    const n = new Date(y, m - 1 + Number(mv.dataset.dpmonth), 1);
    DP.month = n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0");
    paintDatePicker();
    return;
  }
  if(e.target.closest("[data-dpclose]") || !pop.contains(e.target)) closeDatePicker();
});

/* ═══════════════════════════════════════════════════════════════════════════
   THE TIME PICKER — every call time in the hub, in Central
   Same deal as the dates: a button says what it sets, you click a time off a
   list, nobody types anything. Quarter-hour steps around the clock, opened
   scrolled to the time it's on now.
   ═══════════════════════════════════════════════════════════════════════════ */
let TP = null;                                     // {path, val, fallback, night}

function tbtn(path, val, opts){
  const o = opts || {};
  const shown = val ? fmtTime(val, o.night) : "";
  const ghost = !shown && o.fallback ? fmtTime(o.fallback, o.night) : "";     // what it inherits, shown faintly
  return `<button type="button" class="dpick ${o.cls || ""}${shown ? "" : " empty"}" data-timepick="1"
    data-path="${esc(path)}" data-val="${esc(val || "")}"${o.fallback ? ` data-fallback="${esc(o.fallback)}"` : ""
    }${o.night ? ` data-night="${esc(o.night)}"` : ""
    } title="${esc(o.title || "Pick a time — all call times are Central")}">${esc(shown || ghost || o.ph || "time?")}</button>`;
}
function openTimePicker(el){
  TP = {path:el.dataset.path, val:el.dataset.val || "", fallback:el.dataset.fallback || "",
        night:el.dataset.night || ""};
  const cur = TP.val || TP.fallback || "09:00";
  let items = "";
  for(let m = 0; m < 24 * 60; m += 15){
    const v = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
    items += `<button type="button" class="tp-item${m % 60 === 0 ? " hour" : ""}${v === TP.val ? " on" : ""}" data-tpval="${v}">${esc(fmtClock(v))}</button>`;
  }
  /* what clearing MEANS depends on what the field falls back to: the main call
     inherits the standing time, an added call simply shows no time at all. */
  const foot = [];
  if(TP.val) foot.push(`<button class="btn sm" data-tpclear="1">${
    TP.path === "meta.callTime" ? "Clear"
      : TP.fallback ? "Standing time \u00b7 " + esc(fmtTime(TP.fallback, TP.night))
      : "No set time"}</button>`);

  const pop = $("#timePop");
  pop.innerHTML = `<div class="dp-head"><span class="m">Central time \u00b7 ${centralZone(TP.night)}</span>
      <button class="dp-nav" data-tpclose="1" title="Close">\u2715</button></div>
    <div class="tp-list">${items}</div>
    ${foot.length ? `<div class="dp-foot">${foot.join("")}</div>` : ""}`;
  pop.classList.remove("hidden");
  popAt(pop, el);
  const list = pop.querySelector(".tp-list");
  const sel  = pop.querySelector(".tp-item.on") || pop.querySelector(`[data-tpval="${cur}"]`);
  if(sel) list.scrollTop = sel.offsetTop - list.clientHeight / 2 + sel.offsetHeight / 2;
}
function closeTimePicker(){ $("#timePop").classList.add("hidden"); TP = null; }

function applyTimePick(v){
  const t = TP;
  if(!t) return;
  closeTimePicker();
  const {node, key} = parentOf(t.path);
  if(!node) return;
  /* the standing time is a real setting — it empties rather than disappearing,
     or migrate() would hand it back from the seed on the next load */
  if(!v && t.path === "meta.callTime") node[key] = "";
  else if(!v) delete node[key];
  else node[key] = v;
  save(); render();
  toast(v ? "Calls at " + fmtTime(v, t.night)
          : t.path === "meta.callTime" ? "Standing time cleared"
          : t.fallback ? "Back on the standing time \u2014 " + fmtTime(t.fallback, t.night)
          : "No time on this call now");
}

/* ═══════════════════════════════════════════════════════════════════════════
   WHO'S ON IT — the presenter picker
   Alan and Ben are the answer nearly every time, so those are one click. But
   the board has always carried the shades that matter — "Ben (no Alan)",
   "Alan (Ben tiny part)" — and a dropdown that only offered the tidy three
   would have quietly flattened them. So whatever is already in use on the
   board is listed underneath, one click away and spelled the way it already is.
   ═══════════════════════════════════════════════════════════════════════════ */
let WP = null;                                     // {path, kind, val}
const WHO_CORE = {presenter:["Alan", "Ben", "Alan & Ben"], who:["Alan", "Ben", "Alan & Ben"]};

function whoInUse(kind){
  const seen = new Set();
  if(kind === "who"){
    for(const list of Object.values(DATA.business || {})) for(const it of list) seen.add(String(it.who || "").trim());
  } else {
    for(const r of DATA.calendar || []){
      seen.add(String(r.presenter || "").trim());
      for(const x of (r.extra || [])) seen.add(String(x.presenter || "").trim());
    }
    for(const r of DATA.archive || []){
      seen.add(String(r.presenter || "").trim());
      seen.add(String(r.hotSeatPresenter || "").trim());
    }
  }
  for(const c of WHO_CORE[kind] || []) seen.delete(c);
  return [...seen].filter(Boolean).sort((a, b) => a.localeCompare(b));
}
/* the chip you click. In Edit (or always, where assigning IS the job) it opens
   the picker; otherwise it's the plain chip the board has always shown. */
function whoChip(path, val, opts){
  const o = opts || {}, kind = o.kind || "presenter";
  const set = String(val || "").trim();
  const cls = "chip " + presenterClass(val) + (o.cls ? " " + o.cls : "");
  if(!(EDITING || o.live)) return set ? `<span class="${cls}"${o.style ? ` style="${o.style}"` : ""}>${esc(set)}</span>` : "";
  return `<button type="button" class="dpick ${cls}${set ? "" : " empty"}" data-whopick="${kind}"
    data-path="${esc(path)}" data-val="${esc(set)}"${o.style ? ` style="${esc(o.style)}"` : ""} title="${
    esc(kind === "who" ? "Pick who owns this" : "Pick who's on this call")}">${esc(set || o.ph || "who?")}</button>`;
}
function openWhoPicker(el){
  WP = {path:el.dataset.path, kind:el.dataset.whopick, val:el.dataset.val || ""};
  const item = v => `<button type="button" class="pp-item${v === WP.val ? " on" : ""}" data-whoval="${esc(v)}"><span class="chip ${presenterClass(v)}">${esc(v)}</span></button>`;
  const used = whoInUse(WP.kind);
  let inner = `<div class="dp-head"><span class="m">${WP.kind === "who" ? "Who owns it" : "Who's on the call"}</span>
      <button class="dp-nav" data-whoclose="1" title="Close">\u2715</button></div><div class="pp-list">`;
  inner += (WHO_CORE[WP.kind] || WHO_CORE.presenter).map(item).join("");
  if(used.length) inner += `<div class="pp-cat">already on the board</div>` + used.map(item).join("");
  inner += `</div>`;

    const to = String(v || "").trim();
    if(!to){ toast("Type the section first"); return; }
    const parts = b.path.split(".");                    // "business.<section>.<idx>.sec"
    parts.pop();
    const idx = Number(parts.pop()), from = parts.slice(1).join(".");
    const list = DATA.business[from];

  const node = getPath(parts.join("."));

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if(!t) return;

  /* picker + tier controls first — they must win over anything below */
  if(t.dataset.pick !== undefined){ openPicker(Number(t.dataset.pick), t, t.dataset.pickfield); return; }
  if(t.id === "ppClose"){ closePicker(); return; }
  if(t.dataset.picktopic !== undefined){ pickTopic(t.dataset.picktopic); return; }
  if(t.id === "ppAdd"){
    const name = $("#ppNewName").value.trim();
    if(!name){ toast("Type the new topic's name first"); return; }
    const cat = $("#ppNewCat").value, ti = Number($("#ppNewTier").value);
    if(!DATA.topicBank[cat]) DATA.topicBank[cat] = [];
    if(!DATA.topicBank[cat].includes(name)) DATA.topicBank[cat].push(name);
    if(ti) setTier(name, ti);
    pickTopic(name);                                 // saves, closes, renders, toasts
    return;
  }
  if(t.dataset.addcall !== undefined){               // append a typed call to a week
    const [i, type] = t.dataset.addcall.split("|");
    const row = DATA.calendar[Number(i)];
    if(!Array.isArray(row.extra)) row.extra = [];
    row.extra.push({type, topic:"", presenter:"", time:"", speaker:"", notes:[]});
    save(); EDITING = true; render();
    focusPath(`calendar.${i}.extra.${row.extra.length - 1}.` + (type === "guest" ? "speaker" : "topic"));
    return;
  }
  if(t.dataset.addnote !== undefined){               // a fresh note line under a call
    const p2 = t.dataset.addnote;
    if(!Array.isArray(getPath(p2))) setPath(p2, []);
    getPath(p2).push("");
    save(); EDITING = true; render();
    focusPath(p2 + "." + (getPath(p2).length - 1));
    return;
  }
  if(t.dataset.offweek !== undefined){               // cross a week out / bring it back
    const row = getPath(t.dataset.offweek);
    if(row.status === "off") delete row.status; else row.status = "off";
    save(); render();
    toast(row.status === "off" ? "Marked as an off week" : "Back on the schedule");
    return;
  }

  if(t.dataset.section){                               // a bold tab — go to that section's first page
    const home = homeTabOf(t.dataset.section);
    if(sectionOf(TAB) !== t.dataset.section || TAB !== home){
      TAB = home; location.hash = TAB; UI.q = ""; UI.presenter = "all"; render(); pageIn(); window.scrollTo(0,0);
    }
    return;
  }
  if(t.dataset.tab){ TAB = t.dataset.tab; location.hash = TAB; UI.q = ""; UI.presenter = "all"; render(); pageIn(); window.scrollTo(0,0); return; }
  if(t.dataset.seg){
    UI[t.dataset.seg] = t.dataset.seg === "year" ? Number(t.dataset.val) : t.dataset.val;
    render(); return;
  }
  if(t.dataset.mseg){                                  // multi-select: toggle one, "All" (empty) clears
    const arr = UI[t.dataset.mseg] || (UI[t.dataset.mseg] = []);
    const v = t.dataset.val;
    if(!v) arr.length = 0;
    else{ const i = arr.indexOf(v); if(i < 0) arr.push(v); else arr.splice(i, 1); }
    render(); return;
  }
  if(t.dataset.toggle === "open"){ UI.open = !UI.open; render(); return; }
  if(t.dataset.toggle === "edit" || t.id === "editBtn"){ EDITING = !EDITING; render(); return; }
  if(t.dataset.png){ exportPNG(t.dataset.png, t.dataset.label); return; }
  if(t.dataset.print){ printBoard(t.dataset.print); return; }
  if(t.dataset.check){                                 // tick an order of business off
    const item = getPath(t.dataset.check);
    item.done = !item.done;
    if(item.done) item.doneOn = todayISO(); else delete item.doneOn;
    JUST_TOGGLED = t.dataset.check;                    // render highlights it so you can see where it went
    save(); render();
    clearTimeout(FLASH_TIMER);
    FLASH_TIMER = setTimeout(() => { JUST_TOGGLED = null; render(); }, 2600);
    toast(item.done ? "Ticked off — it's at the bottom of the list. Click the box again to undo."
                    : "Back on the list");
    return;
  }

  /* ── structural edits, all path-driven ── */
  if(t.dataset.add){                                   // append to a list (topic bank, backlog — bare strings)
    const path = t.dataset.add;
    addTo(path, "New item");
    save(); EDITING = true; render();
    focusPath(path + "." + (getPath(path).length - 1)); return;
  }
  if(t.dataset.bizadd){ bizQuickAdd(); return; }       // Orders of Business: the "add a task" box's button
  if(t.dataset.bizclear){ bizClearFilters(); render(); return; }
  if(t.dataset.clearfilters){ clearFilters(t.dataset.clearfilters); render(); return; }
  if(t.dataset.addrow){                                // append a table row
    const blanks = {speakers:{name:"New speaker", topic:"", lastAsked:""},
                    archive:{n:DATA.archive.length+1, date:todayISO(), topic:"New call",
                             campaign:DATA.archive.length ? DATA.archive[DATA.archive.length-1].campaign : "Archive"}};
    DATA[t.dataset.addrow].push(clone(blanks[t.dataset.addrow]));
    save(); EDITING = true; render();
    focusPath(t.dataset.addrow + "." + (DATA[t.dataset.addrow].length - 1) +
              (t.dataset.addrow === "speakers" ? ".name" : ".topic")); return;
  }
  if(t.dataset.addkey){                                // new named list (category / backlog list)
    const obj = getPath(t.dataset.addkey);
    let name = "New category", n = 2;
    while(name in obj) name = "New category " + n++;
    obj[name] = [];
    save(); EDITING = true; render();
    focusPath("__key." + t.dataset.addkey + "." + name); return;
  }
  if(t.dataset.addyear){                               // extend the calendar
    const y = Number(t.dataset.addyear);
    if(hasYear(DATA.calendar, y)) { UI.year = y; render(); return; }
    DATA.calendar.push(...blankYear(DATA.calendar, y));
    DATA.calendar.sort((a, b) => a.date.localeCompare(b.date));
    UI.year = y; save(); render();
    toast(y + " added — " + DATA.calendar.filter(r => r.date.startsWith(y + "-")).length + " call nights"); return;
  }
  if(t.dataset.setfield){                              // reveal an optional field on a week
    setPath(t.dataset.setfield, " ");
    save(); EDITING = true; render();
    focusPath(t.dataset.setfield); return;
  }
  if(t.dataset.clearweek){                             // wipe a week back to open
    const r = getPath(t.dataset.clearweek);
    const date = r.date;
    for(const k of Object.keys(r)) if(k !== "date") delete r[k];
    r.topic = ""; r.track = ""; r.presenter = ""; r.date = date;
    save(); render(); toast("Week cleared"); return;
  }
  if(t.dataset.del){
    const label = t.title || "this";
    if(!confirm("Delete " + label.replace(/^Delete /, "") + "?")) return;
    removeAt(t.dataset.del); save(); render(); toast("Deleted"); return;
  }
  if(t.id === "syncBtn"){ openData(); return; }
});
