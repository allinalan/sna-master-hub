async function teamLoad(){
  if(TEAM.loading || !TEAM.key) return;

    if(out.ok){ TEAM.rows = out.reps; TEAM.coaches = out.coaches || []; swLoad(); }

      TEAM.err = "That key wasn't right — ask Alan for the current one.";
    }
    else TEAM.err = out.error || "The roster feed said no.";

/* ── Automations switches — the private sheet's Settings tab, flippable here.
   Reads/writes via the coach-key-gated getSettings/setSetting doPost actions;
   every sender checks the sheet live, so a flip takes effect at the next send. ── */
async function swLoad(){
  TEAM.swErr = "";
  // /exec intermittently serves a Google error page instead of JSON (observed
  // ~1 in 5, 2026-08-24) — ride it out before bothering the coach with an error
  for(let attempt = 1; attempt <= 3; attempt++){
    try{
      const out = await teamCall({action: "getSettings"});
      if(out.ok){ TEAM.sw = out.switches; TEAM.swErr = ""; render(); return; }
      TEAM.swErr = out.error || "The switches feed said no.";
      break;                                   // a real server answer — don't retry
    }catch(e){
      TEAM.swErr = "Couldn't load the switches — retrying didn't help. It's usually temporary.";
      if(attempt < 3) await new Promise(r => setTimeout(r, attempt * 3000));
    }
  }
  render();
}

/* Career sales arrive as onboarding free text ("125k", "True: $230,710",
   "1200000", "109K, true career = 36K"). Normalize to one clean format:
   prefer the number after "true" when present, expand k/m suffixes, and
   render as $1,234,567. Unparseable text falls back to the raw value. */
function fmtCareer(v){
  const s = String(v || "").trim();
  if(!s) return "";
  const grab = t => {
    const m = String(t).match(/\$?\s*(\d[\d,.]*)\s*([kKmM])?/);
    if(!m) return null;
    let n = parseFloat(m[1].replace(/,/g, ""));
    if(isNaN(n)) return null;
    if(m[2]) n *= /k/i.test(m[2]) ? 1e3 : 1e6;
    return n;
  };
  const tr = s.match(/true[^0-9$]*(.*)/i);
  const n = (tr ? grab(tr[1]) : null) ?? grab(s);
  return n == null ? "" : "$" + Math.round(n).toLocaleString("en-US");
}

/* ── program / coach, normalised off the roster row ──
   The sheet's Program column is free text ("The Path", "Masters", …) and
   older rows only have Tier. One place decides which bucket a row is in. */
function programOf(r){
  const s = String(r.Program || r.Tier || "");
  return /dojo/i.test(s) ? "Dojo" : /master/i.test(s) ? "Masters" : /path/i.test(s) ? "Path" : "";
}
function coachOf(r){ return String(r.Coach || "").trim().split(" ")[0]; }
/* The Dojo doesn't get check-in calls, so nobody there is assigned a coach —
   that happens the day they graduate to The Path. Everyone else (Path,
   Masters, and anyone whose program is blank) is expected to have one. */
function needsCoach(r){ return programOf(r) !== "Dojo"; }

/* Program and coach filters are multi-select: an empty list means "everyone",
   two programs lit means "those two side by side". Coach "none" = unassigned. */
function passesFilters(r, progs, coaches){
  if(progs.length && !progs.includes(programOf(r))) return false;
  if(coaches.length){
    const c = coachOf(r);
    /* "Unassigned" means "needs a coach and hasn't got one" — a Dojo row
       without a coach is correct, not a gap, so it only shows under All */
    if(!(c ? coaches.includes(c) : coaches.includes("none") && needsCoach(r))) return false;
  }
  return true;
}
/* Split rows into labelled groups for the board. Coach order follows the
   coaches list (Alan, Ben, …), anyone else alphabetical, unassigned last. */
function groupRows(rows, mode){
  if(mode === "coach"){
    const known = coachNames();
    const dojo = rows.filter(r => !needsCoach(r)), rest = rows.filter(needsCoach);
    const names = [...new Set(rest.map(coachOf).filter(Boolean))]
      .sort((a, b) => (known.indexOf(a) + 1 || 99) - (known.indexOf(b) + 1 || 99) || a.localeCompare(b));
    const groups = names.map(n => ({label: n + "’s mentees", rows: rest.filter(r => coachOf(r) === n)}));
    groups.push({label: "Unassigned", rows: rest.filter(r => !coachOf(r))});
    groups.push({label: "The Dojo · no coach", rows: dojo});     // whatever the sheet says — the rule wins
    return groups.filter(g => g.rows.length);
  }
  if(mode === "program"){
    return ["Dojo", "Path", "Masters", ""].map(p => ({label: p ? "The " + p : "No program", rows: rows.filter(r => programOf(r) === p)}))
      .filter(g => g.rows.length);
  }
  return [{label: "", rows}];
}

/* ═══════════════════════════════════════════════════════════════════════════
   TAB — WEEKLY CHECK-INS (Mentees ▸ Weekly Check-ins)

   One square per mentee per week. The marks live in DATA.checkins — the
   shared hub data, synced like the calendar — keyed campaign → RepID → week,
   so every campaign starts from a clean board and the old ones stay readable
   from the picker. Only The Path and The Masters get check-in calls, so The
   Dojo isn't on this board at all. Names still come from the private roster
   behind the coach key; the shared blob only ever holds RepIDs and colours.
   ═══════════════════════════════════════════════════════════════════════════ */
const CI_STATES = {
  yes:  {label:"Check-in call",      hint:"Green · we called and talked",                      glyph:"✓"},
  one:  {label:"1-1 call",           hint:"Purple · had a one-on-one, so no check-in needed",  glyph:"1"},
  text: {label:"Voice note / texts", hint:"Blue · back-and-forth by voice note or text",       glyph:"✉"},
  no:   {label:"Missed",             hint:"Red · no check-in that week",                       glyph:"✕"},
  off:  {label:"Not needed",         hint:"Black · vacation, out of town, another reason",     glyph:"–"}
};
const CI_ORDER = ["yes", "one", "text", "no", "off"];
const CI_DONE  = new Set(["yes", "one", "text"]);      // all three count as "checked in"

/* ── weeks are Vector weeks: Tuesday through Monday. A week is keyed by its
   Tuesday and belongs to the campaign its Friday (the week's middle day)
   falls in, so the week straddling a campaign boundary lands on exactly one
   board. Fall 2026 therefore opens with Wk 1 = 9/1–9/7, and a campaign whose
   1st lands late in a week starts the following Tuesday. ── */
const isoOf = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function weekStartOf(d){                      // the Tuesday on or before d
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 5) % 7));
  return x;
}
function campaignLabelOf(d){ const m = d.getMonth(); return (m <= 3 ? "Spring" : m <= 7 ? "Summer" : "Fall") + " " + d.getFullYear(); }
function weekCampaign(tueISO){ const t = parseDate(tueISO); t.setDate(t.getDate() + 3); return campaignLabelOf(t); }
function campaignWeeks(label){
  const [season, y] = String(label).split(" ");
  const first = {Spring:0, Summer:4, Fall:8}[season], yr = Number(y);
  if(first === undefined || !yr) return [];
  const d = weekStartOf(new Date(yr, first, 1));
  if(weekCampaign(isoOf(d)) !== label) d.setDate(d.getDate() + 7);   // that week belongs to the campaign before
  const out = [];
  while(weekCampaign(isoOf(d)) === label){ out.push(isoOf(d)); d.setDate(d.getDate() + 7); }
  return out;
}
const thisWeekStart = () => isoOf(weekStartOf(new Date()));
const thisCampaign  = () => weekCampaign(thisWeekStart());
/* "9/1–9/7" — the way the campaign calendar is read out loud */
const fmtMD = d => (d.getMonth() + 1) + "/" + d.getDate();
function weekRange(tueISO){ const a = parseDate(tueISO), b = new Date(a); b.setDate(b.getDate() + 6); return fmtMD(a) + "–" + fmtMD(b); }
function weekLabel(camp, tueISO){ const i = campaignWeeks(camp).indexOf(tueISO); return (i < 0 ? "Week" : "Wk " + (i + 1)) + " · " + weekRange(tueISO); }

/* ── Vector months aren't calendar months. Each month of a campaign is four
   weeks and the campaign's last month takes whatever is left, so Fall 2026
   runs Sep · Wk 1–4, Oct · Wk 5–8, Nov · Wk 9–12, Dec · Wk 13–17 — even
   though Wk 13 starts on 11/24. MONTH_SPLIT is the one place to change that
   if the Vector calendar ever counts an 18-week campaign differently. ── */
const SEASON_MONTHS = {Spring:["January","February","March","April"], Summer:["May","June","July","August"], Fall:["September","October","November","December"]};
const MONTH_SPLIT = {17:[4,4,4,5], 18:[4,4,4,6]};
function campaignMonths(label){
  const weeks = campaignWeeks(label), names = SEASON_MONTHS[String(label).split(" ")[0]] || [];
  const split = MONTH_SPLIT[weeks.length] || [4, 4, 4, weeks.length - 12];
  const out = []; let at = 0;
  names.forEach((name, m) => {
    const n = m === names.length - 1 ? weeks.length - at : Math.max(0, split[m]);
    out.push({name, short: name.slice(0, 3), from: at + 1, to: at + n, weeks: weeks.slice(at, at + n)});
    at += n;
  });
  return out.filter(m => m.weeks.length);
}
/* week → {month, first-of-month, odd/even} lookup for the board */
function monthIndex(camp){
  const idx = {};
  campaignMonths(camp).forEach((m, i) => m.weeks.forEach((w, j) => { idx[w] = {m, i, first: j === 0}; }));
  return idx;
}

/* campaigns worth showing: the current one, plus any that have marks */
function ciCampaigns(){
  const set = new Set([thisCampaign(), ...Object.keys(DATA.checkins || {})]);
  return [...set].filter(c => campaignWeeks(c).length).sort((a, b) => campKeyHub(b) - campKeyHub(a));
}
function ciEligible(){
  return (TEAM.rows || []).filter(r => r.Active && (programOf(r) === "Path" || programOf(r) === "Masters"));
}
function getCheckin(camp, rep, week){
  const c = (DATA.checkins || {})[camp];
  return (c && c[rep] && c[rep][week]) || "";
}
function applyCheckin(camp, rep, week, state){
  if(!DATA.checkins) DATA.checkins = {};
  const c = DATA.checkins[camp] || (DATA.checkins[camp] = {});
  const p = c[rep] || (c[rep] = {});
  if(state) p[week] = state; else delete p[week];
  if(!Object.keys(p).length) delete c[rep];
  if(!Object.keys(c).length) delete DATA.checkins[camp];
}
function setCheckin(camp, rep, week, state){
  applyCheckin(camp, rep, week, state);
  CI_JOURNAL.push({camp, rep, week, state});   // replayed if the save collides with the other coach's
  save("checkin");
}
/* this week, everyone eligible, no filters — feeds the tab-bar count */
function ciWeekTally(){
  const mon = thisWeekStart(), camp = thisCampaign();
  let open = 0, done = 0;
  const rows = ciEligible();
  for(const r of rows){ const s = getCheckin(camp, r.RepID, mon); if(CI_DONE.has(s)) done++; else if(!s) open++; }
  return {total: rows.length, open, done};
}

function renderCheckins(){
  let html = `
  <div class="page-head no-export no-print">
    <div>
      <div class="eyebrow">Week by week</div>
      <div class="big serif">Weekly Check-ins</div>
      <div class="lede">One square per mentee per Vector week (Tuesday to Monday) — click it to say how that week's check-in went.
        Only The Path and The Masters get check-in calls, so The Dojo isn't on this board.
        The board starts clean every campaign; older campaigns stay in the picker.</div>
    </div>
  </div>`;

  const gate = teamGateHtml(html);
  if(gate) return gate;

  const todayMon = thisWeekStart(), nowCamp = thisCampaign();
  const camps = ciCampaigns();
  if(!camps.includes(UI.ciCampaign)) UI.ciCampaign = nowCamp;
  const camp = UI.ciCampaign, isNow = camp === nowCamp;
  const weeks = campaignWeeks(camp);
  const q = UI.q.toLowerCase();

  const eligible = ciEligible().sort((a, b) => a.Name.localeCompare(b.Name));
  const rows = eligible.filter(r => passesFilters(r, UI.ciProgs, UI.ciCoaches));
  const visible = rows.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
  const groups = groupRows(visible, UI.ciGroup);

  /* tallies over what's on screen. A past week left blank counts against
     coverage — it's a check-in nobody recorded, which is the thing to notice. */
  const elapsed = weeks.filter(w => w <= todayMon);
  let done = 0, missed = 0, open = 0, wkDone = 0, wkOpen = 0;
  for(const r of visible){
    for(const w of elapsed){
      const s = getCheckin(camp, r.RepID, w);
      if(CI_DONE.has(s)) done++; else if(s === "no") missed++; else if(!s) open++;
    }
    if(isNow){ const s = getCheckin(camp, r.RepID, todayMon); if(CI_DONE.has(s)) wkDone++; else if(!s) wkOpen++; }
  }
  const needed = done + missed + open;
  const pct = needed ? Math.round(done / needed * 100) : 0;
  const nPath = visible.filter(r => programOf(r) === "Path").length, nMasters = visible.length - nPath;

  html += toolbar(`
    <div class="tb-filters">
      <select class="btn sm" data-cicamp title="Which campaign's board" style="padding:5px 8px">${camps.map(x => `<option${x === camp ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>
      ${fgroup("Program", mseg("ciProgs", [{v:"",l:"All"},{v:"Path",l:"Path"},{v:"Masters",l:"Masters"}], UI.ciProgs))}
      ${fgroup("Coach", mseg("ciCoaches", coachFilterOpts(), UI.ciCoaches))}
      ${fgroup("Group", seg("ciGroup", [{v:"coach",l:"By coach"},{v:"program",l:"By program"},{v:"none",l:"None"}], UI.ciGroup))}
    </div>
    <input class="search" id="q" placeholder="Search ${rows.length} mentees…" value="${esc(UI.q)}">
    <div class="tb-actions">
      <button class="btn" data-teamact="reload" title="Re-pull the roster from the sheet">Refresh</button>
      ${exportButtons("ciBoard", "Check-ins " + camp)}
    </div>`);

  html += `<div id="ciBoard" class="export-frame">`;
  html += printHead("Weekly Check-ins · " + camp, `${visible.length} mentees · printed ${fmtFull(todayISO())}`);
  html += `<div class="stats">
    ${isNow ? statBox("This week", wkDone + "/" + visible.length, "checked in so far · " + weekLabel(camp, todayMon))
            : statBox("Campaign", camp, weeks.length + " weeks")}
    ${isNow ? statBox("Still open this week", wkOpen, wkOpen ? "no mark yet" : "everyone's marked", wkOpen > 0)
            : statBox("Checked in", done, "green, purple or blue")}
    ${statBox("Missed", missed, missed ? "red squares this campaign" : "none so far", missed > 0)}
    ${statBox("Coverage", pct + "%", `${done} of ${needed} weeks that needed one`)}
    ${statBox("On the board", visible.length, `${nPath} Path · ${nMasters} Masters`)}
  </div>`;

  if(!eligible.length) html += `<div class="empty-note">Nobody on The Path or The Masters is active right now — the board fills in the moment someone is.</div>`;
  else if(!visible.length) html += `<div class="empty-note">Nothing matches.</div>`;
  else{
    const months = campaignMonths(camp), mIdx = monthIndex(camp);
    const mcls = w => { const x = mIdx[w] || {}; return (x.first ? " mstart" : "") + (x.i % 2 ? " m1" : ""); };
    html += `<div class="tbl citbl"><table class="grid ciboard"><thead>
      <tr class="mrow"><th class="mentee" rowspan="2">Mentee</th>${months.map((m, i) =>
        `<th class="mb mstart${i % 2 ? " m1" : ""}" colspan="${m.weeks.length}" title="${esc(m.name)} on the Vector calendar · Wk ${m.from}–${m.to} · ${weekRange(m.weeks[0]).split("–")[0]} – ${weekRange(m.weeks[m.weeks.length - 1]).split("–")[1]}">${esc(m.name)} <small>Wk ${m.from}–${m.to}</small></th>`).join("")}<th class="tt" rowspan="2"></th></tr>
      <tr>${weeks.map((w, i) => {
      const d = parseDate(w), e = new Date(d); e.setDate(e.getDate() + 6);
      const mo = mIdx[w] ? mIdx[w].m.name : "";
      return `<th class="cw${w === todayMon ? " cur" : ""}${mcls(w)}" title="Week ${i + 1}${mo ? " · " + mo : ""} · ${fmtDay(w)} ${fmtDate(w)} – ${fmtDay(isoOf(e))} ${fmtDate(isoOf(e))}"><span class="wn">Wk ${i + 1}</span><span class="wd">${weekRange(w)}</span></th>`;
    }).join("")}</tr></thead><tbody>`;
    for(const g of groups){
      if(g.label) html += `<tr class="grp"><td colspan="${weeks.length + 2}">${esc(g.label)} <span class="n">· ${g.rows.length}</span></td></tr>`;
      for(const r of g.rows){
        let rd = 0, rn = 0;
        html += `<tr><td class="an"><b>${esc(r.Name)}</b><div class="an-sub"><span class="chip">${esc(programOf(r))}</span>${coachChip(r)}</div></td>`;
        for(const w of weeks){
          const s = getCheckin(camp, r.RepID, w);
          const cur = w === todayMon, past = w < todayMon;
          if(w <= todayMon){ if(CI_DONE.has(s)) rd++; if(s !== "off") rn++; }
          const cls = s ? s : "blank" + (cur ? " cur" : past ? " due" : " fut");
          const st = CI_STATES[s];
          html += `<td class="cc${cur ? " cur" : ""}${mcls(w)}"><button class="ci ${cls}" data-ci="${esc(camp)}|${esc(r.RepID)}|${w}"
            title="${esc(r.Name)} · ${weekLabel(camp, w)} · ${st ? st.label : "not marked yet"}">${st ? st.glyph : ""}</button></td>`;
        }
        html += `<td class="tot" title="checked in / weeks that needed one, so far">${rd}/${rn}</td></tr>`;
      }
    }
    html += `</tbody></table></div><div class="ci-scroll no-print no-export" id="ciScroll"></div>`;
    html += `<div class="cilegend">${CI_ORDER.map(k => `<span><i class="ci ${k}">${CI_STATES[k].glyph}</i> ${CI_STATES[k].label}</span>`).join("")}<span><i class="ci blank due"></i> not marked yet</span></div>`;
  }
  html += `</div>`;
  return html;
}

/* ── the pick-a-colour popover. Lives outside #view so a background sync
   render can't wipe it mid-click. ── */
function openCiPop(btn){
  const [camp, rep, week] = btn.dataset.ci.split("|");
  const row = (TEAM.rows || []).find(r => r.RepID === rep);
  if(!row) return;
  CI_OPEN = {camp, rep, week};
  const cur = getCheckin(camp, rep, week);
  const pop = $("#ciPop");
  pop.innerHTML = `<div class="cp-head"><b>${esc(row.Name)}</b>${esc(weekLabel(camp, week))} · ${esc(camp)}</div>` +
    CI_ORDER.map(k => `<button class="cp-opt${cur === k ? " on" : ""}" data-cistate="${k}"><i class="ci ${k}">${CI_STATES[k].glyph}</i><span>${CI_STATES[k].label}<small>${CI_STATES[k].hint}</small></span></button>`).join("") +
    `<button class="cp-opt" data-cistate=""><i class="ci blank"></i><span>Clear<small>back to not marked</small></span></button>`;
  pop.classList.remove("hidden");
  const r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  const left = Math.max(8, Math.min(r.left + r.width / 2 - pw / 2, innerWidth - pw - 8));
  let top = r.bottom + 8;
  if(top + ph > innerHeight - 8) top = Math.max(8, r.top - ph - 8);
  pop.style.left = left + "px"; pop.style.top = top + "px";
}
function closeCiPop(){ $("#ciPop").classList.add("hidden"); CI_OPEN = null; }
/* 17 lanes at a readable size are wider than the page, so the board scrolls
   sideways under the frozen name column. Say which weeks are in view so
   nobody wonders where Wk 16 went. */
function ciScrollHint(){
  const tbl = document.querySelector("#ciBoard .tbl.citbl"), cap = $("#ciScroll");
  if(!tbl || !cap) return;
  const ths = [...tbl.querySelectorAll("th.cw")];
  if(!ths.length) return;
  const box = tbl.getBoundingClientRect(), nameW = tbl.querySelector("th.mentee").getBoundingClientRect().width;
  const vis = ths.filter(t => { const r = t.getBoundingClientRect(); return r.left >= box.left + nameW - 2 && r.right <= box.right + 2; });
  if(!vis.length || vis.length === ths.length){ cap.textContent = ""; return; }
  const a = ths.indexOf(vis[0]) + 1, b = ths.indexOf(vis[vis.length - 1]) + 1;
  const mIdx = monthIndex(UI.ciCampaign), wk = i => ths[i - 1].querySelector(".wd") && Object.keys(mIdx)[i - 1];
  const ma = (mIdx[wk(a)] || {m:{}}).m.short, mb = (mIdx[wk(b)] || {m:{}}).m.short;
  cap.textContent = `Showing Wk ${a}–${b} of ${ths.length}${ma ? ` (${ma === mb ? ma : ma + "–" + mb})` : ""} · scroll sideways for the rest`;
}
document.addEventListener("scroll", e => { if(e.target && e.target.classList && e.target.classList.contains("citbl")) ciScrollHint(); }, true);
window.addEventListener("resize", ciScrollHint);
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-ci]");
  if(b){ e.preventDefault(); openCiPop(b); return; }
  const o = e.target.closest("button[data-cistate]");
  if(o && CI_OPEN){
    const {camp, rep, week} = CI_OPEN, st = o.dataset.cistate;
    const row = (TEAM.rows || []).find(r => r.RepID === rep);
    setCheckin(camp, rep, week, st);
    closeCiPop(); render();
    toast(`${row ? row.Name.split(" ")[0] : rep} · ${weekLabel(camp, week)} · ${st ? CI_STATES[st].label : "cleared"}`);
    return;
  }
  const pop = $("#ciPop");
  if(!pop.classList.contains("hidden") && !pop.contains(e.target)) closeCiPop();
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && CI_OPEN) closeCiPop(); });
document.addEventListener("change", e => {
  const s = e.target.closest("select[data-cicamp]");
  if(s){ UI.ciCampaign = s.value; render(); }
});

/* mentee-tab actions — document-level, so they survive re-renders */
document.addEventListener("click", async e => {
  const act = e.target.closest("[data-teamact]");
  if(!act) return;
  e.preventDefault();
  const kind = act.dataset.teamact;
  if(kind === "unlock"){
    const v = ($("#teamKey") || {}).value || "";
    if(!v.trim()) return;
    TEAM.key = v.trim(); localStorage.setItem("sna_coach_key", TEAM.key);
    TEAM.rows = null; ASSIGN.rows = null; teamLoad();
  }
  if(kind === "reload"){ TEAM.rows = null; teamLoad(); }
  if(kind === "swretry"){ TEAM.sw = null; TEAM.swErr = ""; swLoad(); }
  if(kind === "former"){ UI.teamFormer = !UI.teamFormer; render(); }
  if(kind === "lock"){
    TEAM.key = ""; TEAM.rows = null; ASSIGN.rows = null; localStorage.removeItem("sna_coach_key");
    render(); toast("Key forgotten on this device");

});
document.addEventListener("click", async e => {
  const a = e.target.closest("[data-repactive]");
  if(!a) return;
  e.preventDefault();
  const repId = a.dataset.repactive, on = a.dataset.to === "1";
  const row = (TEAM.rows || []).find(r => r.RepID === repId);
  if(!row) return;
  const name = row.Name.split(" ")[0];
  if(!confirm(on ? `Bring ${row.Name} back? They'll reappear on the dashboard, in the weekly texts, and in the form dropdowns.`
                 : `Mark ${row.Name} as former? They drop off the dashboard, the weekly texts, and both form dropdowns. Their history stays.`)) return;
  const before = row.Active;

  if(out.ok) toast(on ? `${name} is back` : `${name} marked former`);

    render(); toast("Couldn't save that — try again.");
  }
});
document.addEventListener("change", e => {

async function assignCoachUI(repId, coach){

  if(!TEAM.sw || TEAM.swBusy[k]) return;
  const before = !!TEAM.sw[k], to = !before;

/* ═══════════════════════════════════════════════════════════════════════════
   TAB — ASSIGNMENTS (coach-key gated; spec §7)
   Board: mentee × assignment cells coloured by assignState. Catalog: the
   per-program list the coaches edit. Drawer: read a thread, post feedback.
   Everything round-trips through the SharpNinja web app (TEAM_API).
   ═══════════════════════════════════════════════════════════════════════════ */
const ASSIGN={rows:null,loading:false,err:"",loadedAt:0,campaign:"",open:null,showArchived:false,editing:null,busy:false};
function currentCampaignLabel(){const d=new Date(),m=d.getMonth();return (m<=3?"Spring":m<=7?"Summer":"Fall")+" "+d.getFullYear();}
const campKeyHub=c=>{const a=String(c).split(" ");return (+a[1]||0)*3+({Spring:0,Summer:1,Fall:2}[a[0]]??0);};
async function assignLoad(force){
  if(ASSIGN.loading||!TEAM.key)return;
  if(!force&&ASSIGN.rows&&Date.now()-ASSIGN.loadedAt<60000)return;
  ASSIGN.loading=true;ASSIGN.err="";render();
  for(let attempt=1;attempt<=3;attempt++){
    try{
      const out=await teamCall({action:"assignmentBoard"});
      if(out.ok){ASSIGN.rows=out;ASSIGN.loadedAt=Date.now();if(!ASSIGN.campaign)ASSIGN.campaign=currentCampaignLabel();break;}
      if(out.error==="bad key"){TEAM.key="";localStorage.removeItem("sna_coach_key");TEAM.err="That key wasn't right — ask Alan for the current one.";break;}
      ASSIGN.err=out.error||"The assignments feed said no.";break;
    }catch(e){ASSIGN.err="Couldn't reach the assignments feed — it's usually temporary.";if(attempt<3)await new Promise(r=>setTimeout(r,attempt*3000));}
  }
  ASSIGN.loading=false;render();
  if(ASSIGN.open&&ASSIGN.rows)openCell(ASSIGN.open.repId,ASSIGN.open.aId);
}
function assignCampaigns(){const set=new Set([currentCampaignLabel()]);(ASSIGN.rows?ASSIGN.rows.assignments:[]).forEach(a=>{if(a.Campaign)set.add(String(a.Campaign).trim());});return [...set].sort((a,b)=>campKeyHub(b)-campKeyHub(a));}
const isArchived=a=>String(a.Active||"Y").toUpperCase()==="N";
function assignList(){   // catalog rows for the picked campaign, due-date order
  return (ASSIGN.rows.assignments||[]).filter(a=>a.AssignmentID&&String(a.Campaign||"").trim()===ASSIGN.campaign)
    .filter(a=>ASSIGN.showArchived||!isArchived(a))
    .sort((x,y)=>String(dueISO(x.DueDate)||"9999").localeCompare(String(dueISO(y.DueDate)||"9999"))||String(x.Title||"").localeCompare(String(y.Title||"")));
}
function assignReps(){return (ASSIGN.rows.reps||[]).filter(r=>r.Active).sort((a,b)=>tierRank(a.Tier)-tierRank(b.Tier)||a.Name.localeCompare(b.Name));}
function cellState(rep,a){return assignState({id:rep.RepID,tier:rep.Tier},a,ASSIGN.rows.overrides||[],ASSIGN.rows.submissions||[],todayISO());}
function assignCounts(){
  const c={waiting:0,late:0,week:0,approved:0}; if(!ASSIGN.rows)return c;
  const weekAgo=new Date(Date.now()-7*86400000).toISOString();
  const live=assignList().filter(a=>!isArchived(a));
  assignReps().forEach(r=>live.forEach(a=>{const s=cellState(r,a);
    if(s.state==="waiting")c.waiting++; if(s.state==="late")c.late++; if(s.state==="approved")c.approved++;
    s.versions.forEach(v=>{if(String(v.SubmittedAt||"")>=weekAgo)c.week++;});}));
  return c;
}
function fmtDueHub(iso){const p=String(iso||"").split("-");return p.length<3?String(iso||""):MONTHS[+p[1]-1]+" "+(+p[2]);}
const CELL_GLYPH={waiting:"●",revise:"✎",approved:"✓",open:"",late:"",na:""};
const CELL_TITLE={open:"not submitted",late:"overdue",waiting:"submitted · waiting on you",revise:"feedback posted · waiting on them",approved:"approved",na:"not applicable"};

function renderAssign(){
  let html=`<div class="page-head no-export no-print"><div>
    <div class="eyebrow">Homework, both directions</div><div class="big serif">Assignments</div>
    <div class="lede">What each program owes this campaign, who has turned it in, and your critiques. Mentees submit from their dashboard; everything you post here lands on theirs.</div></div></div>`;
  if(!TEAM.key)return html+keyGateHtml();
  if(!ASSIGN.rows){
    if(!ASSIGN.loading&&!ASSIGN.err)assignLoad(true);
    return html+(ASSIGN.err?`<div class="empty-note">${esc(ASSIGN.err)}<div style="margin-top:10px"><button class="btn" data-assignact="reload">Try again</button></div></div>`
                           :`<div class="empty-note">Fetching assignments…</div>`);
  }
  const c=assignCounts();
  html+=toolbar(`<div class="tb-filters">
      ${seg("assignView",[{v:"board",l:"Board"},{v:"catalog",l:"Catalog"}],UI.assignView)}
      <select class="btn sm" data-assigncamp style="padding:5px 8px">${assignCampaigns().map(x=>`<option${x===ASSIGN.campaign?" selected":""}>${esc(x)}</option>`).join("")}</select>
      ${seg("assignProg",[{v:"all",l:"All"},{v:"Dojo",l:"Dojo"},{v:"Path",l:"Path"},{v:"Masters",l:"Masters"}],UI.assignProg)}
    </div>
    <div class="tb-actions"><button class="btn" data-assignact="reload" title="Re-pull from the sheet">Refresh</button>${exportButtons("assignBoard","Assignments")}</div>`);
  html+=`<div id="assignBoard" class="export-frame">`;
  html+=printHead("Assignments · "+ASSIGN.campaign,`${c.waiting} waiting on a coach · printed ${fmtFull(todayISO())}`);
  html+=`<div class="stats">${statBox("Waiting on you",c.waiting,c.waiting?"open a cell to review":"inbox clear",c.waiting>0)}${statBox("Overdue",c.late,"not turned in, past due",c.late>0)}${statBox("Submitted this week",c.week,"")}${statBox("Approved",c.approved,ASSIGN.campaign)}</div>`;
  html+=UI.assignView==="board"?assignBoardHtml():assignCatalogHtml();
  html+=`</div>`;
  return html;
}
function assignBoardHtml(){
  const list=assignList().filter(a=>!isArchived(a)).filter(a=>UI.assignProg==="all"||assignPrograms(a).includes(UI.assignProg));
  const reps=assignReps().filter(r=>UI.assignProg==="all"||r.Tier===UI.assignProg);
  if(!list.length)return `<div class="empty-note">No assignments for ${esc(ASSIGN.campaign)} yet — switch to Catalog to add one.</div>`;
  let h=`<div class="tbl"><table class="grid aboard"><thead><tr><th>Mentee</th>${list.map(a=>{
      const d=dueISO(a.DueDate);
      return `<th class="ah" title="${esc(a.Title)} · ${esc(assignPrograms(a).join(", "))}${d?" · due "+esc(d):""}"><div class="at">${esc(a.Title)}</div><small>${esc(assignPrograms(a).map(p=>p[0]).join(""))} · ${d?esc(fmtDueHub(d)):"no date"}</small></th>`;}).join("")}<th></th></tr></thead><tbody>`;
  let lastTier="";
  reps.forEach(r=>{
    if(r.Tier!==lastTier){lastTier=r.Tier;h+=`<tr class="agrp"><td colspan="${list.length+2}">The ${esc(r.Tier)}</td></tr>`;}
    let inN=0,appN=0;
    h+=`<tr><td class="an"><b>${esc(r.Name)}</b> <span class="chip">${esc(r.RepID)}</span></td>`;
    list.forEach(a=>{
      const s=cellState(r,a); if(s.state!=="na")appN++; if(s.versions.length)inN++;
      h+=`<td class="ac"><button class="sq ${s.state}" data-cell="${esc(r.RepID)}|${esc(a.AssignmentID)}" title="${esc(r.Name)} · ${esc(a.Title)} · ${CELL_TITLE[s.state]}${s.due?(s.state==="late"?" since ":" · due ")+esc(fmtDueHub(s.due)):""}">${CELL_GLYPH[s.state]}</button></td>`;
    });
    h+=`<td class="tot">${inN}/${appN} in</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  h+=`<div class="alegend"><span><i class="sq open"></i> not due yet</span><span><i class="sq late"></i> overdue</span><span><i class="sq na"></i> not applicable</span><span><i class="sq waiting">●</i> waiting on you</span><span><i class="sq revise">✎</i> waiting on them</span><span><i class="sq approved">✓</i> approved</span></div>`;
  return h;
}
function assignBaseOf(progs){return progs.slice().sort((x,y)=>tierRank(x)-tierRank(y))[0]||"Path";}
function assignCatalogHtml(){
  const list=assignList().filter(a=>UI.assignProg==="all"||assignPrograms(a).includes(UI.assignProg));
  let h=`<div class="no-export no-print" style="display:flex;justify-content:flex-end;gap:8px;margin:-24px 0 8px"><button class="btn sm ${ASSIGN.showArchived?"on":""}" data-assignact="archived">Show archived</button></div>`;
  ["Dojo","Path","Masters"].forEach(p=>{
    const rows=list.filter(a=>assignBase(a)===p);
    h+=`<div class="sec-title">The ${p} <span class="n">${rows.length} assignment${rows.length===1?"":"s"}</span></div>`;
    if(ASSIGN.editing&&!ASSIGN.editing.id&&assignBaseOf(ASSIGN.editing.programs)===p)h+=assignFormHtml(ASSIGN.editing);
    if(rows.length){
      h+=`<div class="tbl"><table class="grid acat"><thead><tr><th>Assignment</th><th>Programs</th><th>Due</th><th>Materials</th><th class="no-print no-export"></th></tr></thead><tbody>`;

/* one write to the web app: optimistic-free, reload after, keep the drawer open */
async function assignWrite(body,okMsg,onOk){

  ASSIGN.busy=true; render(); if(ASSIGN.open)openCell(ASSIGN.open.repId,ASSIGN.open.aId);
  const out=await teamCall(Object.assign({by:whoAmI()},body)).catch(()=>({ok:false,error:"network"}));

/* ═══════════════════════════════════════════════════════════════════════════
   TAB 1 — CAMPAIGN CALENDAR
   ═══════════════════════════════════════════════════════════════════════════ */
function renderCalendar(){
  const years = yearsIn(DATA.calendar);
  if(!years.includes(UI.year)) UI.year = years.includes(new Date().getFullYear())
    ? new Date().getFullYear() : years[years.length - 1];
  const rows = DATA.calendar.filter(r => Number(r.date.slice(0,4)) === UI.year);

  /* the numbers follow the campaign you're looking at — so an exported
     "Fall III" board reports Fall's coverage, not the whole year's */
  const scope = UI.season === "all" ? rows : rows.filter(r => seasonOf(r.date).key === UI.season);
  const scopeName = (UI.season === "all" ? "" : UI.season + " ") + UI.year;
  const planned = scope.filter(r => isPlanned(r) && !isOff(r)).length;
  const blocked = scope.filter(r => isBlocked(r) || isOff(r)).length;
  const open    = scope.filter(r => !isPlanned(r) && !isBlocked(r) && !isOff(r)).length;
  /* every CALL in a live week, so the boxes add up call-by-call, not week-by-week */
  const callsOf = r => (isBlocked(r) || isOff(r)) ? [] :
    (isPlanned(r) ? [{pres:r.presenter, type:r.callType || "group"}] : [])
      .concat((r.extra || []).filter(isLiveCall).map(x => ({pres:x.presenter, type:x.type || "group"})));
  const allCalls = scope.flatMap(callsOf);
  const alan    = allCalls.filter(c => ["alan","both"].includes(presenterClass(c.pres))).length;
  const ben     = allCalls.filter(c => ["ben","both"].includes(presenterClass(c.pres))).length;
  const hotN    = allCalls.filter(c => c.type === "hotseat").length;
  const wkPres  = r => callsOf(r).map(c => c.pres).filter(v => String(v||"").trim());
  const tbd     = scope.filter(r => isPlanned(r) && !isOff(r) && presenterClass(r.presenter)==="tbd").length;

  const q = UI.q.toLowerCase();
  const visible = scope.filter(r => {
    if(UI.presenter !== "all"){
      if(UI.presenter === "tbd"){
        if(presenterClass(r.presenter) !== "tbd") return false;      // group call has no host
      } else {
        const cs = wkPres(r).map(presenterClass);                     // …on any of the week's calls
        if(!cs.some(c => c === UI.presenter || c === "both")) return false;
      }
    }
    if(UI.open && (isPlanned(r) || isBlocked(r) || isOff(r))) return false;
    if(UI.tier !== "all" && ![r.topic, ...(r.extra||[]).map(x => x.topic)].some(t => String(t||"").trim() && String(tierOf(t)) === UI.tier)) return false;
    if(q && !JSON.stringify(r).toLowerCase().includes(q)) return false;
    return true;
  });

  const nextYear = years[years.length - 1] + 1;

  let html = `
  <div class="page-head no-export no-print">
    <div>
      <div class="eyebrow">Group Calls</div>
      <div class="big serif">Campaign Calendar</div>
      <div class="lede">Every call night of the year. This year and next are always here —
        the board rolls itself forward, so Spring is plannable months ahead. Turn on
        <b>Edit</b> to plan straight into the page, then <b>Export PNG</b> for a clean image.</div>
      <div class="lede how" style="margin-top:6px">Calls run at <b>${
        EDITING ? tbtn("meta.callTime", callTime(), {ph:"set a time", title:"The standing time for every call (Central)"})
                : esc(fmtTime(callTime()) || "no set time")}</b>
        — in <b>Edit</b>, click it to move every call at once, or click any single call's
        time to give that one its own. Every time on this board is Central.</div>
      <div class="lede how" style="margin-top:6px">Nothing is stuck on a Tuesday. In <b>Edit</b>, every call
        on a week has its own date — <b>click it and pick the night off the calendar</b>. Each row of that
        calendar is a Vector week, Tue&nbsp;→&nbsp;Mon. The first call's date moves the whole week; any
        call under it moves on its own.</div>
    </div>${(() => {
      const next = upcomingCalls()[0];
      if(!next) return "";
      return `<div class="next-call">
        <div class="nc-lab">Next call night</div>
        <div class="nc-date">${fmtDay(next.date)} · ${fmtDate(next.date)}</div>
        <div class="nc-topic">${next.planned ? esc(next.topic) : `<span class="nc-open">open — nothing planned yet</span>`}</div>
        <div class="nc-meta">${(next.time || callTime()) ? `<span class="nc-time">${esc(fmtTime(next.time || callTime()))}</span>` : ""}${
          next.presenter ? `<span class="chip ${presenterClass(next.presenter)}">${esc(next.presenter)}</span>` : ""}</div>
      </div>`;
    })()}
  </div>`;

  html += toolbar(`
    <div class="tb-filters">
      ${seg("year", years.map(y => ({v:String(y), l:String(y)})), String(UI.year))}
      ${seg("season", [{v:"all",l:"All year"},{v:"Spring",l:"Spring I"},{v:"Summer",l:"Summer II"},{v:"Fall",l:"Fall III"}], UI.season)}
      ${seg("presenter", [{v:"all",l:"Everyone"},{v:"alan",l:"Alan"},{v:"ben",l:"Ben"},{v:"tbd",l:"No host"}], UI.presenter)}
      ${tierSeg()}
      <button class="btn ${UI.open?"on":""}" data-toggle="open">Open weeks only</button>
    </div>
    <input class="search" id="q" placeholder="Search topics, tracks, notes…" value="${esc(UI.q)}">
    <div class="tb-actions">
      <button class="btn" data-addyear="${nextYear}" title="Add every call night of ${nextYear}">+ ${nextYear}</button>
      ${exportButtons("calBoard", scopeName + " Campaign Calendar")}
    </div>`);

  html += `<div id="calBoard" class="export-frame">`;
  html += printHead(scopeName + " Campaign Calendar",
      `${planned} of ${scope.length} weeks planned · ${open} open${
        callTime() ? " · calls at " + esc(fmtTime(callTime())) : ""} · printed ${fmtFull(todayISO())}`);

  html += `<div class="stats">
    ${statBox("Weeks planned", planned + " / " + scope.length, Math.round(planned/(scope.length||1)*100) + "% of " + (UI.season==="all"? UI.year : UI.season))}
    ${statBox("Open weeks", open, open ? "still to fill" : "fully booked", open > 0)}
    ${statBox("Alan on", alan, "calls")}
    ${statBox("Ben on", ben, "calls")}
    ${statBox("Blocked / off", blocked, "NET, off weeks, etc.")}
    ${statBox("Host TBD", tbd, "planned, no host", tbd > 0)}
    ${statBox("Hot seats", hotN, "on this stretch")}
  </div>`;

  if(!visible.length){
    html += `<div class="empty-note">No weeks match those filters.</div>`;
  } else {
    for(const S of SEASONS){
      const group = visible.filter(r => seasonOf(r.date).key === S.key);
      if(!group.length) continue;
      const gAll = rows.filter(r => seasonOf(r.date).key === S.key);
      const gPlanned = gAll.filter(r => isPlanned(r) && !isOff(r)).length;
      html += `<section class="season">
        <div class="season-head">
          <span class="roman">${S.roman}</span>
          <h3>${S.key} ${UI.year}</h3>
          <span class="range">${S.range}</span>
          <span class="fill"><span class="meter"><i style="width:${Math.round(gPlanned/(gAll.length||1)*100)}%"></i></span>${gPlanned}/${gAll.length} planned</span>
        </div>`;
      for(const r of group) html += weekRow(r, DATA.calendar.indexOf(r), gAll.indexOf(r) + 1);
      html += `</section>`;
    }
  }

  /* backlog / parking lot */
  html += `<div class="sec-title serif">Backlog <span class="n">— ideas parked, not yet on a date</span>
    <button class="btn sm edit-only no-export no-print" data-addkey="backlog">+ list</button></div><div class="cols">`;
  for(const [name, list] of Object.entries(DATA.backlog)){
    html += `<div class="card"><h4>${ed("__key.backlog."+name, name)} <span class="n">${list.length}</span></h4><ul>`;
    list.forEach((item, i) => {
      const sched = findUses(item).future[0];
      html += `<li class="${sched?"sched":""}">${ed("backlog."+name+"."+i, item)}${
        sched ? `<span class="when sched">→ ${fmtDate(sched.date)}</span>` : ""}${del("backlog."+name+"."+i)}</li>`;
    });
    html += `</ul>${addBtn("backlog."+name, "idea")}</div>`;
  }
  html += `</div></div>`;
  return html;
}

/* one week row — a stack of typed CALLS (Group / Hot seat / Guest speaker),
   each with its own time, tier edge, presenter, notes, and bank picker.
   Call #1 lives in the legacy topic/presenter/time fields so every
   cross-reference keeps working; additional calls live in r.extra[]. */
function weekRow(r, idx, wkNum){
  const p = "calendar." + idx;
  const planned = isPlanned(r), blocked = isBlocked(r), off = isOff(r);
  const state = blocked ? "blocked" : off ? "off" : (planned ? "" : "open");
  const liveExtras = (r.extra || []).filter(isLiveCall);
  const nCalls = (planned ? 1 : 0) + liveExtras.length;

  const stime = (path, val, fallback) => {
    if(EDITING) return tbtn(path, val, {cls:"stime", fallback,
      title: fallback ? "Pick this call's time — blank means the standing " + fmtTime(fallback)
                      : "Pick this call's time (Central)"});
    const shown = fmtTime(val || fallback);
    return shown ? `<span class="stime">${esc(shown)}</span>` : "";
  };
  /* Every call gets its own night. In Edit mode each slot opens with a clickable
     date — the main call's IS the week's, so retyping it moves the week; an extra
     call keeps its own. With Edit off the chip only shows on a call that has
     broken away from the week's night, so the printed board stays clean. */
  const sdate = (path, iso, anchor) => {
    const shown = iso ? fmtDay(iso) + " " + fmtDate(iso) : "";
    if(!EDITING) return (shown && iso !== anchor) ? `<span class="sdate">${esc(shown)}</span>` : "";
    const own = /\.extra\.\d+\.date$/.test(path);
    return dbtn(own ? "extra" : "week", path, iso, shown, {cls:"sdate", anchor,
      title: own ? "Pick this call's night — only this call moves"
                 : "Pick the week's night — its calls move with it"});
  };
  const spick = field =>
    `<button class="slot-pick edit-only no-export no-print" data-pick="${idx}" data-pickfield="${field}" title="Pick from the topic bank">\u25be</button>`;
  const pchip = (path, val) => whoChip(path, val);
  /* the call type is a DROPDOWN in Edit mode, a plain tag otherwise */
  const stag = (path, type) =>
    EDITING ? `<select class="typesel no-export no-print" data-typesel="${path}">
        <option value="group"${type === "group" ? " selected" : ""}>Group</option>
        <option value="hotseat"${type === "hotseat" ? " selected" : ""}>Hot seat</option>
        <option value="guest"${type === "guest" ? " selected" : ""}>Guest speaker</option></select>`
      : `<span class="stag">${CALL_TYPES[type] || "Group"}</span>`;
  const spk = (path, type, val) =>
    (type === "guest") ? `<span class="spk">${ed(path, val || "", "", "speaker name?")}</span>` : "";
  /* per-call notes: as many as you want, each line editable + deletable */
  const noteLines = (arrPath, arr) =>
    (arr || []).map((n, i) =>
      `<div class="snote"><span class="ntag">note</span><span class="ntext">${ed(arrPath + "." + i, n, "", "type the note")}</span>${del(arrPath + "." + i, "note")}</div>`).join("") +
    `<button class="btn sm edit-only no-export no-print snote-add" data-addnote="${arrPath}">+ note</button>`;

  /* An additional call can land on any night, in or out of its own week — it
     carries its own date, and the week lists in the order it actually runs, so a
     call moved to the Monday before sits above the Tuesday one it was planned
     under. `day` is the old free-text chip; a scribble migrate() couldn't read as
     a date still shows beside the real one. */
  const sday = (path, val) =>
    EDITING ? `<span class="sday">${ed(path, val, "", "day?")}</span>`
            : (String(val||"").trim() ? `<span class="sday">${esc(val)}</span>` : "");

  let main = "";
  const slots = [];                                // {date, j, html} — j = -1 for the main call, so it leads its own night
  const mainType = r.callType || "group";
  if(planned){
    slots.push({date:r.date, j:-1, html:
      `<div class="slot main ${mainType} t${mainType === "hotseat" ? 0 : tierOf(r.topic)}">${sdate(p+".date", r.date, r.date)}${stime(p+".time", r.time, callTime())}${stag(p+".callType", mainType)}<span class="stopic">${ed(p+".topic", r.topic)}${mainType === "hotseat" ? "" : tierChip(r.topic)}</span>${spk(p+".speaker", mainType, r.speaker)}${pchip(p+".presenter", r.presenter)}${spick("topic")}</div>`
      + noteLines(p + ".mainNotes", r.mainNotes)});
  } else if(blocked){
    main += `<div class="wk-topic empty mono">${ed(p+".note", r.note || "blocked", "", "blocked")}</div>`;
  } else {
    slots.push({date:r.date, j:-1, html:
      `<div class="slot main">${sdate(p+".date", r.date, r.date)}${EDITING ? stime(p+".time", r.time, "") : ""}<span class="stag">Group</span><span class="stopic empty">${ed(p+".topic", "", "", "+ open \u2014 click to plan")}</span>${pchip(p+".presenter", r.presenter)}${spick("topic")}</div>`});
  }
  (r.extra || []).forEach((x, j) => {
    const xp = `${p}.extra.${j}`, xt = x.type || "group";
    slots.push({date:callDateOf(r, x), j, html:
      `<div class="slot xtra ${xt} t${xt === "hotseat" ? 0 : tierOf(x.topic)}">${sdate(xp+".date", callDateOf(r, x), r.date)}${x.day ? sday(xp+".day", x.day) : ""}${stime(xp+".time", x.time, "")}${stag(xp+".type", xt)}<span class="stopic">${ed(xp+".topic", x.topic || "", "", "topic?")}${xt === "hotseat" ? "" : tierChip(x.topic)}</span>${spk(xp+".speaker", xt, x.speaker)}${pchip(xp+".presenter", x.presenter)}${spick("extra." + j)}${del(xp, "this call")}</div>`
      + noteLines(xp + ".notes", x.notes)});
  });
  slots.sort((a, b) => a.date.localeCompare(b.date) || a.j - b.j);
  main += slots.map(sl => sl.html).join("");

  if(!blocked)
    main += `<div class="slot ghost edit-only no-export no-print">
      <button class="btn sm" data-addcall="${idx}|group">+ call</button>
      <button class="btn sm" data-addcall="${idx}|hotseat">+ \ud83d\udd25 hot seat</button>
      <button class="btn sm" data-addcall="${idx}|guest">+ \ud83c\udfa4 guest speaker</button>
    </div>`;

  if(r.detail) main += `<div class="wk-detail">${ed(p+".detail", r.detail)}</div>`;

  const meta = [];
  if(r.track) meta.push(`<span class="chip track">${ed(p+".track", r.track)}</span>`);
  if(r.note && !blocked) meta.push(`<span class="chip note">${ed(p+".note", r.note)}</span>`);
  if(meta.length) main += `<div class="wk-meta">${meta.join("")}</div>`;

  if(r.proposed) main += `<div class="wk-sub proposed"><span class="tag">proposed</span><span>${ed(p+".proposed", r.proposed)}</span></div>`;
  if(r.alt) main += `<div class="wk-sub alt no-export no-print"><span class="tag">alt draft</span><span>${ed(p+".alt", r.alt)}</span></div>`;

  /* in edit mode every week can gain the optional fields, or be wiped back to open */
  const extras = [];
  if(!r.track)  extras.push(`<button class="btn sm" data-setfield="${p}.track">+ track</button>`);
  if(!r.note)   extras.push(`<button class="btn sm" data-setfield="${p}.note">+ week note</button>`);
  if(!r.detail) extras.push(`<button class="btn sm" data-setfield="${p}.detail">+ detail</button>`);
  if(!blocked)  extras.push(`<button class="btn sm" data-offweek="${p}">${off ? "back on" : "off week"}</button>`);
  if(planned || blocked || r.note) extras.push(`<button class="btn sm" data-clearweek="${p}">clear</button>`);
  main += `<div class="wk-meta edit-only no-export no-print">${extras.join("")}</div>`;

  return `<div class="week ${state}">
    <div class="wk-date mono"><span class="wknum">WK ${String(wkNum).padStart(2,"0")}</span>
      <b>${EDITING ? dbtn("week", p+".date", r.date, fmtDate(r.date),
            {anchor:r.date, title:"Pick the week's night — its calls move with it"})
          : esc(fmtDate(r.date))}</b>${fmtDay(r.date)}${
        off ? `<span class="count offb">OFF WEEK</span>` :
        nCalls > 1 ? `<span class="count">${nCalls} calls</span>` : ""}${del(p, "this week")}</div>
    <div class="wk-main">${main}</div>
  </div>`;
}
function todayISO(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
/* the standing call time — one source for the lede, every week row, and the print header */
function callTime(){ return String((DATA.meta && DATA.meta.callTime) || "").trim(); }

/* ═══════════════════════════════════════════════════════════════════════════
   TAB 2 — TOPIC BANK
   Every topic is cross-checked against the archive and the 2026 calendar, so
   you can see at a glance what's been covered and what has never been run.
   ═══════════════════════════════════════════════════════════════════════════ */
function renderBank(){
  const cats = DATA.topicBank;
  const all = Object.values(cats).flat();
  let covered = 0, scheduled = 0;
  const marks = new Map();
  for(const t of all){
    const u = findUses(t);
    marks.set(t, u);
    if(u.past.length) covered++;
    if(u.future.length) scheduled++;
  }
  const q = UI.q.toLowerCase();

  let html = `
  <div class="page-head no-export no-print">
    <div>
      <div class="eyebrow">The full menu</div>
      <div class="big serif">Topic Bank</div>
      <div class="lede">Every topic we can teach, by category. A <b style="color:var(--good)">green</b> dot means
        we've run it before, <b style="color:var(--accent)">rust</b> means it's on the 2026 calendar, grey means untouched.</div>
    </div>
  </div>`;

  html += toolbar(`
    <div class="tb-filters">
      ${tierSeg()}
      <button class="btn ${UI.open?"on":""}" data-toggle="open">Never-run only</button>
    </div>
    <input class="search" id="q" placeholder="Search all ${all.length} topics…" value="${esc(UI.q)}">
    <div class="tb-actions">
      <button class="btn edit-only" data-addkey="topicBank">+ category</button>
      ${exportButtons("bankBoard", "Topic Bank")}
    </div>`);

  html += `<div id="bankBoard" class="export-frame">`;
  html += printHead("Topic Bank", `${all.length} topics across ${Object.keys(cats).length} categories · printed ${fmtFull(todayISO())}`);
  html += `<div class="stats">
    ${statBox("Topics", all.length, "in the bank")}
    ${statBox("Already run", covered, "found in the archive")}
    ${statBox("On 2026 calendar", scheduled, "scheduled")}
    ${statBox("Never run", all.length - covered, "fresh material", true)}
    ${statBox("Categories", Object.keys(cats).length, "")}
  </div><div class="cols">`;

  let shown = 0;
  for(const [name, list] of Object.entries(cats)){
    const items = list.map((t,i) => ({t, i})).filter(({t}) => {
      if(q && !t.toLowerCase().includes(q)) return false;
      if(UI.open && marks.get(t).past.length) return false;
      if(UI.tier !== "all" && String(tierOf(t)) !== UI.tier) return false;
      return true;
    });
    /* tiers read as separated: T1 first, then T2, T3, unassigned last */
    items.sort((a, b) => (tierOf(a.t) || 9) - (tierOf(b.t) || 9));
    /* an empty category still shows while you're editing — otherwise a category
       you just created would vanish before you could put anything in it */
    if(!items.length && !(EDITING && !q && !UI.open)) continue;
    shown += items.length;
    html += `<div class="card"><h4>${ed("__key.topicBank."+name, name)} <span class="n">${items.length}</span>${del("topicBank."+name, "category")}</h4><ul>`;
    for(const {t, i} of items){
      const u = marks.get(t);
      const last = u.past[0], next = u.future[0];
      const cls = next ? "sched" : (last ? "used" : "");
      let when = "";
      if(next) when = `<span class="when sched">${parseDate(next.date).getFullYear()} · ${fmtDate(next.date)}</span>`;
      else if(last) when = `<span class="when">last ${fmtDate(last.date)} '${String(parseDate(last.date).getFullYear()).slice(2)}</span>`;
      html += `<li class="${cls} tier-t${tierOf(t)}">${ed("topicBank."+name+"."+i, t)}${tierChip(t)}${when}${del("topicBank."+name+"."+i)}</li>`;
    }
    html += `</ul>${addBtn("topicBank."+name, "topic")}</div>`;
  }
  if(!shown) html += `<div class="empty-note">No topics match.</div>`;
  html += `</div></div>`;
  return html;
}

/* ═══════════════════════════════════════════════════════════════════════════
   TAB 3 — CALL ARCHIVE
   ═══════════════════════════════════════════════════════════════════════════ */
function renderArchive(){
  const rows = DATA.archive;
  const camps = [...new Set(rows.map(r => r.campaign))];
  const q = UI.q.toLowerCase();
  const visible = rows.filter(r => {
    if(UI.archCampaign !== "all" && r.campaign !== UI.archCampaign) return false;
    if(q && !JSON.stringify(r).toLowerCase().includes(q)) return false;
    return true;
  });
  /* like the calendar, the numbers follow the campaign you've selected */
  const scope = UI.archCampaign === "all" ? rows : rows.filter(r => r.campaign === UI.archCampaign);
  const held = scope.filter(r => r.status !== "nocall").length;
  const hotSeats = scope.filter(r => r.hotSeat).length;
  const scopeCamps = [...new Set(scope.map(r => r.campaign))];

  let html = `
  <div class="page-head no-export no-print">
    <div>
      <div class="eyebrow">What we've already run</div>
      <div class="big serif">Call Archive</div>
      <div class="lede">Every group call back to December 2024 — so we don't repeat a topic by accident,
        and so we can point a rep at the call that covers their gap.</div>
    </div>
  </div>`;

  html += toolbar(`
    <div class="tb-filters">
      ${seg("archCampaign", [{v:"all",l:"All"}].concat(camps.map(c => ({v:c, l:c}))), UI.archCampaign)}
    </div>
    <input class="search" id="q" placeholder="Search ${rows.length} calls…" value="${esc(UI.q)}">
    <div class="tb-actions">
      <button class="btn edit-only" data-addrow="archive">+ call</button>
      ${exportButtons("archBoard", "Call Archive")}
    </div>`);

  html += `<div id="archBoard" class="export-frame">`;
  html += printHead("Call Archive — " + (UI.archCampaign === "all" ? "all campaigns" : UI.archCampaign),
      `${held} calls held · printed ${fmtFull(todayISO())}`);
  html += `<div class="stats">
    ${statBox("Calls logged", scope.length, UI.archCampaign === "all" ? "since Dec 2024" : UI.archCampaign)}
    ${statBox("Actually held", held, (scope.length - held) + " skipped weeks")}
    ${statBox("Hot seats", hotSeats, "run alongside")}
    ${statBox("Campaigns", scopeCamps.length, scopeCamps.join(" · "))}
  </div>`;

  if(!visible.length) html += `<div class="empty-note">Nothing matches.</div>`;
  for(const c of camps){
    const group = visible.filter(r => r.campaign === c);
    if(!group.length) continue;
    html += `<div class="sec-title serif">${esc(c)} <span class="n">${group.length} calls</span></div>
      <div class="tbl"><table class="grid"><thead><tr>
        <th>#</th><th>Date</th><th>Topic</th><th>Series</th><th>Slot</th><th>Host</th><th>Hot seat</th><th class="edit-only"></th>
      </tr></thead><tbody>`;
    for(const r of group){
      const i = rows.indexOf(r), p = "archive." + i;
      html += `<tr class="${r.status==="nocall"?"nocall":""}">
        <td class="num">${r.n}</td>
        <td class="dt">${fmtDate(r.date)} '${String(parseDate(r.date).getFullYear()).slice(2)}</td>
        <td>${ed(p+".topic", r.topic)}${r.note?`<div style="font-size:11.5px;color:var(--ink-faint);margin-top:3px">${ed(p+".note", r.note)}</div>`:""}</td>
        <td>${r.series?`<span class="chip">${ed(p+".series", r.series)}</span>`:""}</td>
        <td>${r.call?`<span class="chip">${ed(p+".call", r.call)}</span>`:""}</td>
        <td>${whoChip(p+".presenter", r.presenter)}</td>
        <td>${r.hotSeat?`<div style="font-size:12px">${ed(p+".hotSeat", r.hotSeat)}</div>${
              whoChip(p+".hotSeatPresenter", r.hotSeatPresenter, {style:"margin-top:4px;display:inline-block"})}`:""}</td>
        <td class="edit-only">${del(p, "call")}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  return html;
}

/* ═══════════════════════════════════════════════════════════════════════════
   TAB 4 — GUEST SPEAKERS
   ═══════════════════════════════════════════════════════════════════════════ */
function renderSpeakers(){
  const rows = DATA.speakers;
  const q = UI.q.toLowerCase();
  const visible = rows.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
  const withTopic = rows.filter(r => String(r.topic||"").trim()).length;
  const asked = rows.filter(r => String(r.lastAsked||"").trim()).length;

  let html = `
  <div class="page-head no-export no-print">
    <div>
      <div class="eyebrow">The bench</div>
      <div class="big serif">Guest Speakers</div>
      <div class="lede">Who we can pull in, what they'd teach, and when we last asked — so the same
        two people don't get asked every time.</div>
    </div>
  </div>`;

  html += toolbar(`
    <input class="search" id="q" placeholder="Search names…" value="${esc(UI.q)}">
    <div class="tb-actions">
      <button class="btn edit-only" data-addrow="speakers">+ speaker</button>

  html += `<div id="spkBoard" class="export-frame">`;

  html += `<div class="stats">
    ${statBox("On the bench", rows.length, "")}

  for(const r of visible){

            {ph:"\u2014", title:"When did we last ask them?"})
          : esc(fmtMaybeDate(r.lastAsked) || "\u2014")}</td>
