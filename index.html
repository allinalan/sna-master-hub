/* ═══════════════════════════════════════════════════════════════════════════
   TAB 5 — NEXT ORDERS OF BUSINESS
   A working list, not a document: tick, assign and date without flipping into
   Edit mode. Edit mode is only needed to add or delete things.
   ═══════════════════════════════════════════════════════════════════════════ */
function dueState(item){
  if(item.done) return "done";
  if(!item.due) return "none";
  const today = todayISO();
  if(item.due < today) return "over";
  const soon = new Date(); soon.setDate(soon.getDate() + 14);
  return item.due <= soon.toISOString().slice(0,10) ? "soon" : "later";
}
function renderBusiness(){
  const groups = DATA.business;
  const all = Object.entries(groups).flatMap(([g, list]) => list.map((i, idx) => ({i, g, idx})));
  const open = all.filter(x => !x.i.done);
  const overdue = open.filter(x => dueState(x.i) === "over");
  const soon = open.filter(x => dueState(x.i) === "soon");
  const mine = who => open.filter(x => String(x.i.who||"").toLowerCase().includes(who)).length;
  const unassigned = open.filter(x => !String(x.i.who||"").trim()).length;

  const q = UI.q.toLowerCase();
  const show = x => {
    if(UI.bizView === "open" && x.i.done) return false;
    if(UI.bizView === "done" && !x.i.done) return false;
    if(UI.bizView === "dated" && (!x.i.due || x.i.done)) return false;
    if(UI.presenter !== "all"){
      const w = String(x.i.who||"").toLowerCase();
      if(UI.presenter === "tbd" ? w.trim() !== "" : !w.includes(UI.presenter)) return false;
    }
    if(q && !JSON.stringify(x.i).toLowerCase().includes(q)) return false;
    return true;
  };

  let html = `
  <div class="page-head no-export no-print">
    <div>
      <div class="eyebrow">Between the two of you</div>
      <div class="big serif">Next Orders of Business</div>
      <div class="lede">Everything you two still owe each other. Tick it, put a name on it,
        give it a date — no need to turn on Edit for any of that. Edit mode is only for
        adding or deleting.</div>
    </div>
  </div>`;

  html += toolbar(`
    <div class="tb-filters">
      ${seg("bizView", [{v:"all",l:"Everything"},{v:"open",l:"Hide done"},{v:"dated",l:"Has a date"},{v:"done",l:"Done only"}], UI.bizView)}
      ${seg("presenter", [{v:"all",l:"Anyone"},{v:"alan",l:"Alan"},{v:"ben",l:"Ben"},{v:"tbd",l:"Unassigned"}], UI.presenter)}
    </div>
    <input class="search" id="q" placeholder="Search ${all.length} items…" value="${esc(UI.q)}">
    <div class="tb-actions">
      <button class="btn edit-only" data-addkey="business">+ section</button>
      ${exportButtons("bizBoard", "Next Orders of Business")}
    </div>`);

  html += `<div id="bizBoard" class="export-frame">`;
  html += printHead("Next Orders of Business",
    `${open.length} open · ${all.length - open.length} done · printed ${fmtFull(todayISO())}`);
  html += `<div class="stats">
    ${statBox("Still open", open.length, "of " + all.length + " total")}
    ${statBox("Overdue", overdue.length, overdue.length ? "past their date" : "nothing late", overdue.length > 0)}
    ${statBox("Due soon", soon.length, "next 14 days")}
    ${statBox("On Alan", mine("alan"), "open items")}
    ${statBox("On Ben", mine("ben"), "open items")}
    ${statBox("Unassigned", unassigned, "nobody owns these", unassigned > 0)}
  </div>`;

  let shown = 0;
  for(const [name, list] of Object.entries(groups)){
    /* open first, then by due date, undated last, done sunk to the bottom */
    const order = list.map((i, idx) => ({i, idx, g:name})).filter(show).sort((a, b) => {
      if(a.i.done !== b.i.done) return a.i.done ? 1 : -1;
      if(!!a.i.due !== !!b.i.due) return a.i.due ? -1 : 1;
      return (a.i.due || "").localeCompare(b.i.due || "");
    });
    if(!order.length && !(EDITING && !q && UI.bizView === "all")) continue;
    shown += order.length;
    const openN = list.filter(i => !i.done).length;
    html += `<div class="sec-title serif">${ed("__key.business."+name, name)}
      <span class="n">${openN} open / ${list.length}</span>${del("business."+name, "section")}</div>
      <div class="biz">`;
    for(const {i, idx} of order){
      const p = "business." + name + "." + idx;
      const st = dueState(i);
      const flash = (p === JUST_TOGGLED) ? " flash" : "";
      html += `<div class="biz-row ${i.done?"is-done":""}${flash}">
        <button class="tick ${i.done?"on":""}" data-check="${p}" title="${i.done?"Mark as still open":"Mark done"}" aria-pressed="${i.done}">${i.done?"✓":""}</button>
        <div class="biz-main">
          <div class="biz-t">${ed(p+".t", i.t)}</div>
          ${i.note ? `<div class="biz-note">${ed(p+".note", i.note)}</div>` : ""}
        </div>
        ${whoChip(p+".who", i.who, {kind:"who", live:true, cls:"who", ph:"assign"})}
        <span class="due ${st}">${dbtn("due", p+".due", i.due || "", i.due ? fmtDate(i.due) : "",
            {cls:"always", ph:"add date", title:"Set a due date"})}</span>
        ${i.done ? `<button class="del always" data-del="${p}" title="Delete this item">×</button>` : del(p, "this item")}
      </div>`;
    }
    html += `${addBtn("business."+name, "item")}</div>`;
  }
  if(!shown) html += `<div class="empty-note">Nothing matches — try the <b>All</b> filter.</div>`;
  html += `</div>`;
  return html;
}

/* ═══════════════════════════════════════════════════════════════════════════
   SHARED SYNC — so Alan and Ben see each other's edits
   ───────────────────────────────────────────────────────────────────────────
   The page is static (GitHub Pages), so the shared copy lives in a Google
   Sheet and a small Apps Script Web App reads and writes it. Same shape as
   the mentee dashboard's script. Setup is in README.md → "Turning on sync".

   Reads are a plain GET. Writes POST with Content-Type text/plain on purpose:
   anything else makes the browser send a CORS preflight, which Apps Script
   web apps don't answer.
   ═══════════════════════════════════════════════════════════════════════════ */
const SYNC = {
  url:   "https://script.google.com/macros/s/AKfycbyw7ngyqNuO9AHQnCeb1paTfoDRWX1sTkJMlhC2zB9BKDuo_O-SF9XWke2e1QiA_Y9A/exec",
         // ↑ Apps Script web app (SNA Hub Sync). Redeploy a NEW VERSION there
         //   after editing the .gs, or it keeps serving the old code.
  token: "sharpninja",// must match TOKEN in SharpNinja-Hub-Sync.gs
  pollMs: 25000
};

const syncOn = () => !!SYNC.url;
let REV = Number(localStorage.getItem(STORE_KEY + ":rev") || 0);
let REMOTE = {rev:0, by:"", updated:""};
let PUSH_TIMER = null, PUSHING = false, PENDING = false;

/* Who's editing — only ever used to label a change. This must never block or
   throw: it sits in the save path, and a browser that suppresses dialogs (or a
   person who hits Cancel) would otherwise kill the save outright. */
function whoAmI(){ return (localStorage.getItem(STORE_KEY + ":who") || "").trim() || "someone"; }

/* Asking happens once at boot, well away from any save. */
function askWho(force){
  if(!force && localStorage.getItem(STORE_KEY + ":who")) return;
  try{
    const w = (prompt("Who's using this hub? (so edits get labelled)\n\nType Alan or Ben:",
                      localStorage.getItem(STORE_KEY + ":who") || "") || "").trim();
    if(w){ localStorage.setItem(STORE_KEY + ":who", w); syncStatus("shared · you're " + w); }
  }catch(e){ /* dialogs blocked — changes just get labelled "someone" */ }
}
function setRev(n){ REV = n; localStorage.setItem(STORE_KEY + ":rev", String(n)); }

function syncStatus(text, kind){
  const el = $("#saveLabel"), dot = $("#saveDot");
  if(!el) return;
  el.textContent = text;
  dot.className = "dot" + (kind === "warn" ? " edited" : "");
}
function ago(iso){
  if(!iso) return "";
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if(s < 60) return "just now";
  if(s < 3600) return Math.round(s/60) + "m ago";
  if(s < 86400) return Math.round(s/3600) + "h ago";
  return Math.round(s/86400) + "d ago";
}

/* ── pull ─────────────────────────────────────────────────────────────── */
async function pull(quiet){
  if(!syncOn()) return;
  try{
    const res = await fetch(SYNC.url + "?token=" + encodeURIComponent(SYNC.token) + "&t=" + Date.now());
    const body = await res.json();
    if(!body.ok) throw new Error(body.error || "refused");
    REMOTE = {rev:body.rev, by:body.by, updated:body.updated};

    if(body.rev > REV && body.data){
      /* someone else moved ahead of us */
      if(PENDING || PUSHING){
        syncStatus(body.by + " also edited — " + (OTHER_EDITS ? "yours will win on save" : "merging check-ins"), "warn");
        return;
      }
      DATA = migrate(body.data); DF = null; setRev(body.rev);
      /* marks a failed push left behind go back on top of the fresh copy;
         any other stranded edit is lost the way it always was */
      const replay = !OTHER_EDITS && CI_JOURNAL.length > 0;
      if(replay) for(const j of CI_JOURNAL) applyCheckin(j.camp, j.rep, j.week, j.state);
      else { CI_JOURNAL = []; OTHER_EDITS = 0; }
      localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
      render();
      if(replay) scheduleSync();
      if(!quiet) toast(body.by ? body.by + "'s changes loaded" : "Updated from the shared copy");
    }
    if(!PENDING && !PUSHING) syncStatus("shared · " + (REMOTE.by ? REMOTE.by + " " + ago(REMOTE.updated) : "in sync"));
  }catch(e){
    console.warn("pull failed", e);
    syncStatus("offline — editing locally", "warn");
  }
}

/* ── push (debounced) ─────────────────────────────────────────────────── */
function scheduleSync(){
  if(!syncOn()) return;
  PENDING = true;
  syncStatus("saving…", "warn");
  clearTimeout(PUSH_TIMER);
  PUSH_TIMER = setTimeout(() => push(), 1200);   // no bare `push` — setTimeout would pass the timer id as `attempt`
}
async function push(attempt){
  if(!syncOn() || PUSHING) return;
  PUSHING = true; PENDING = false;
  const sentMarks = CI_JOURNAL.length, sentOther = OTHER_EDITS;   // what this push carries — edits can land while it's in flight
  try{
    const res = await fetch(SYNC.url, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},   // keeps it a simple request — no preflight
      body: JSON.stringify({token: SYNC.token, baseRev: REV, by: whoAmI(), data: DATA})
    });
    const body = await res.json();
    if(body.conflict){
      REMOTE = {rev:body.rev, by:body.by, updated:body.updated};
      /* Only check-in marks since our last sync? Take their copy, put our
         marks back on top, and push again — the two boards simply combine. */
      if(CI_JOURNAL.length && !OTHER_EDITS && body.data){
        DATA = migrate(body.data); DF = null; setRev(body.rev);
        for(const j of CI_JOURNAL) applyCheckin(j.camp, j.rep, j.week, j.state);
        localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
        render();
        syncStatus("merging with " + (body.by || "the other coach") + "…", "warn");
        PENDING = true;                              // finally{} schedules the re-push
        return;
      }
      showConflict(body);
      syncStatus("conflict with " + body.by, "warn");
      return;
    }
    if(!body.ok) throw new Error(body.error || "refused");
    setRev(body.rev);
    CI_JOURNAL.splice(0, sentMarks); OTHER_EDITS -= sentOther;   // what went up is now shared; later edits stay pending
    REMOTE = {rev:body.rev, by:whoAmI(), updated:new Date().toISOString()};
    syncStatus("shared · saved just now");
  }catch(e){
    console.warn("push failed", e);
    /* Apps Script sleeps when idle and the first call after a while can die on
       the way up. One quiet retry covers that without bothering anyone. */
    if(!attempt){
      PUSHING = false;
      syncStatus("saving…", "warn");
      return setTimeout(() => push(1), 2500);
    }
    syncStatus("offline — saved on this computer only", "warn");
  }finally{
    PUSHING = false;
    if(PENDING) scheduleSync();
  }
}

/* both sides edited the same version — let the human pick */
function showConflict(body){
  $("#mTitle").textContent = "Both of you edited this";
  $("#mBody").innerHTML = `<b>${esc(body.by || "The other person")}</b> saved changes ${esc(ago(body.updated))} while you were editing. ` +
    `Keeping yours overwrites theirs; taking theirs discards what you just changed. ` +
    `Either way the Google Sheet keeps a version history, so nothing is truly lost.`;
  $("#mText").value = JSON.stringify(body.data, null, 2);
  $("#mActions").innerHTML = `
    <button class="btn" data-act="takeTheirs">Take ${esc(body.by || "theirs")}</button>
    <span style="flex:1"></span>
    <button class="btn primary" data-act="keepMine">Keep mine</button>`;
  $("#scrim").classList.add("on");
  window._conflict = body;
}

/* ═══════════════════════════════════════════════════════════════════════════
   APP — routing, rendering, editing, export
   ═══════════════════════════════════════════════════════════════════════════ */
function currentTab(){ return TABS.find(t => t.id === TAB) || TABS[0]; }

function paintTabs(){
  const active = sectionOf(TAB);
  const primary = SECTIONS.map(sec =>
    `<button class="tab-primary ${sec.id===active?"on":""}" data-section="${sec.id}">${esc(sec.label)}
       <span class="ct">${sec.count ? esc(sec.count()) : ""}</span></button>`).join("");

  const siblings = tabsIn(active);
  const sub = siblings.length < 2 ? "" :
    `<div class="tabs-sub">` + siblings.map(t =>
      `<button class="tab-sub ${t.id===TAB?"on":""}" data-tab="${t.id}">${esc(t.sub || t.label)}
         <span class="ct">${t.count ? esc(t.count()) : ""}</span></button>`).join("") + `</div>`;

  $("#tabBar").innerHTML = `<div class="tabs-primary">${primary}</div>${sub}`;
}

/* Clicking straight from one field to the next used to swallow the second click:
   leaving field A saves and re-renders, which destroys field B before the click
   lands on it. mousedown fires first, so we note where the click is headed and
   put the cursor back there once the new DOM exists. */
let PENDING_FOCUS = null;
let JUST_TOGGLED = null, FLASH_TIMER = null;
document.addEventListener("mousedown", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  PENDING_FOCUS = el ? el.dataset.edit : null;
});

/* replay the staggered page entrance — only on real tab switches, never on
   the re-render every keystroke causes */
function pageIn(){
  const v = $("#view");
  v.classList.remove("page-enter"); void v.offsetWidth;   // restart the animation
  v.classList.add("page-enter");
}

function render(){
  const focused = document.activeElement && document.activeElement.id === "q";
  const caret = focused ? document.activeElement.selectionStart : null;
  paintTabs();
  if(TAB!=="assign"&&ASSIGN.open)closeCell();
  if(CI_OPEN) closeCiPop();
  $("#view").innerHTML = editBanner() + currentTab().render();
  $("#dashWrap").style.display = TAB === "perf" ? "" : "none";
  applyEdit();
  if(TAB === "checkins") ciScrollHint();
  if(focused){
    const q = $("#q");
    if(q){ q.focus(); try{ q.setSelectionRange(caret, caret); }catch(e){} }
  } else if(PENDING_FOCUS){
    const target = PENDING_FOCUS; PENDING_FOCUS = null;
    focusPath(target);
  }
}
function editBanner(){
  return `<div class="edit-banner no-export no-print">
    <b>Edit mode.</b>
    <span class="grow">Click any field to change it. Everything saves to this browser as you go — use <b>Data ▸ Export</b> to hand the plan to the other person.</span>
    <button class="btn sm" data-toggle="edit">Done editing</button>
  </div>`;
}

/* put the cursor in a field we just created */
function focusPath(path){
  const el = document.querySelector(`[data-edit="${CSS.escape(path)}"]`);
  if(!el) return;
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

/* ── dot-path get/set into DATA ───────────────────────────────────────── */
function setPath(path, value){
  const parts = path.split(".");
  let node = DATA;
  for(let i = 0; i < parts.length - 1; i++) node = node[parts[i]];
  node[parts[parts.length - 1]] = value;
}

/* ── edit mode ────────────────────────────────────────────────────────── */
function applyEdit(){
  document.body.classList.toggle("editing", EDITING);
  document.querySelectorAll("[data-edit]").forEach(el => {
    if(EDITING || el.hasAttribute("data-live")) el.setAttribute("contenteditable", "plaintext-only");
    else el.removeAttribute("contenteditable");
  });
  $("#editBtn").classList.toggle("on", EDITING);
  $("#editBtn").textContent = EDITING ? "Done" : "Edit";
}
document.addEventListener("focusin", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if(!el || !(EDITING || el.hasAttribute("data-live"))) return;
  if(el.dataset.ph && el.textContent.trim() === el.dataset.ph) el.textContent = "";
});
/* Optional fields disappear when emptied, rather than leaving a blank chip behind. */
const OPTIONAL_FIELDS = new Set(["track","note","second","secondPresenter","secondTime","detail","proposed","alt",
                                 "series","call","hotSeat","hotSeatPresenter","hotSeatTime","lastAsked","day","speaker"]);

/* Save while typing. Blur still does the tidy-up pass and re-renders, but the
   text is already safe by then — closing the tab mid-edit doesn't lose it. */
let INPUT_TIMER = null;
document.addEventListener("input", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if(!el || !(EDITING || el.hasAttribute("data-live"))) return;
  const path = el.dataset.edit;
  if(path.startsWith("__key.")) return;           // renaming only applies once you're done
  clearTimeout(INPUT_TIMER);
  INPUT_TIMER = setTimeout(() => {
    setPath(path, el.textContent.replace(/\s+/g, " ").trim());
    save();                                        // deliberately no render — keeps your cursor put
  }, 500);
});

document.addEventListener("focusout", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if(!el || !(EDITING || el.hasAttribute("data-live"))) return;
  clearTimeout(INPUT_TIMER);
  const val = el.textContent.replace(/\s+/g, " ").trim();
  const path = el.dataset.edit;
  if(path.startsWith("__key.")){                 // renaming a category / backlog list
    const rest = path.slice(6);
    const oldKey = rest.slice(rest.indexOf(".") + 1);
    const objPath = rest.slice(0, rest.indexOf("."));
    if(val === oldKey) return;                   // touched but not changed — leave the page alone
    if(!renameKey(objPath, oldKey, val)) { render(); return toast(val ? "That name is already used" : "A name is required"); }
  } else if(val === "" && /\.(mainNotes|notes)\.\d+$/.test(path)){
    removeAt(path);                                // an emptied note line disappears
  } else if(val === "" && OPTIONAL_FIELDS.has(path.split(".").pop())){
    removeAt(path);                                // emptied an optional field — drop it entirely
  } else {
    const before = String(getPath(path) ?? "");
    if(before === val){
      /* THE CLICK-REFRESH FIX (2026-08-26): a focusout with nothing changed
         used to save + re-render the whole page, so every stray click in Edit
         mode looked like a refresh. Now: restore the placeholder if we blanked
         it on focus, and otherwise do nothing at all. */
      if(!val && el.dataset.ph) el.textContent = el.dataset.ph;
      return;
    }
    setPath(path, val);
    /* a topic renamed in the bank keeps its tier — the tier map is keyed by text */
    if(path.startsWith("topicBank.") && before && DATA.topicTiers && DATA.topicTiers[before] !== undefined){
      DATA.topicTiers[val] = DATA.topicTiers[before];
      delete DATA.topicTiers[before];
    }
  }
  save();
  render();
});
document.addEventListener("keydown", e => {
  const live = el2 => el2 && (EDITING || el2.hasAttribute("data-live"));
  const el = e.target.closest && e.target.closest("[data-edit]");
  if(live(el) && e.key === "Enter"){ e.preventDefault(); el.blur(); }
  if(live(el) && e.key === "Escape"){ e.preventDefault(); render(); }
});

/* ── topic picker: plan a week straight from the bank ─────────────────────
   One floating panel, opened from a week row's "▾ pick from bank". Lives
   outside #view so a background sync render can't wipe it. Also the home of
   "add a new topic while planning": name + tier + category, lands in the bank
   AND on the week in one click. */
let PICK_IDX = null, PICK_FIELD = "topic";
function openPicker(idx, anchor, field){
  PICK_IDX = idx; PICK_FIELD = (field === "topic" || /^extra\.\d+$/.test(field || "")) ? field : "topic";
  const pop = $("#pickPop");
  let inner = `<div class="pp-head"><input id="ppq" class="search" placeholder="Search the bank…" autocomplete="off">
    <button class="btn sm" id="ppClose" title="Close">✕</button></div><div class="pp-list">`;
  for(const [name, list] of Object.entries(DATA.topicBank)){
    if(!list.length) continue;
    const sorted = list.slice().sort((a, b) => (tierOf(a) || 9) - (tierOf(b) || 9));
    inner += `<div class="pp-cat">${esc(name)}</div>`;
    for(const t of sorted){
      const ti = tierOf(t);
      inner += `<button class="pp-item" data-picktopic="${esc(t)}"><span class="pp-dot t${ti}"></span>${esc(t)}${
        ti ? `<span class="pp-tier t${ti}">T${ti}</span>` : ""}</button>`;
    }
  }
  inner += `</div><div class="pp-new">
    <input id="ppNewName" class="search" placeholder="…or type a new topic" autocomplete="off">
    <select id="ppNewTier"><option value="0">tier?</option><option value="1">T1 · The Dojo</option>
      <option value="2">T2 · The Path</option><option value="3">T3 · The Masters</option></select>
    <select id="ppNewCat">${Object.keys(DATA.topicBank).map(c => `<option>${esc(c)}</option>`).join("")}</select>
    <button class="btn sm primary" id="ppAdd">Add &amp; use</button>
  </div>`;
  pop.innerHTML = inner;
  pop.classList.remove("hidden");
  const r = anchor.getBoundingClientRect();
  pop.style.top  = Math.max(10, Math.min(window.innerHeight - pop.offsetHeight - 12, r.bottom + 6)) + "px";
  pop.style.left = Math.max(10, Math.min(window.innerWidth - pop.offsetWidth - 12, r.left)) + "px";
  $("#ppq").focus();
}
function closePicker(){ $("#pickPop").classList.add("hidden"); PICK_IDX = null; }
function pickTopic(text){
  const row = DATA.calendar[PICK_IDX];
  if(!row){ closePicker(); return; }
  if(PICK_FIELD === "topic"){
    row.topic = text;
    if(row.status === "blocked") delete row.status;   // planning un-blocks the week
  } else {
    const j = Number(PICK_FIELD.split(".")[1]);
    if(!row.extra || !row.extra[j]){ closePicker(); return; }
    row.extra[j].topic = text;
  }
  const ti = tierOf(text);
  save(); closePicker(); render();
  toast("Planned: " + text + (ti ? ` · T${ti} ${TIERS[ti].name}` : ""));
}
document.addEventListener("click", e => {           // click-away closes the picker
  const pop = $("#pickPop");
  if(pop.classList.contains("hidden")) return;
  if(pop.contains(e.target) || e.target.closest("[data-pick]")) return;
  closePicker();
});

/* ═══════════════════════════════════════════════════════════════════════════
   THE DATE PICKER — one calendar for every date in the hub
   Dates are CLICKED, never typed. The grid's columns run Tuesday → Monday, so
   every row of it is a Vector week: moving a call inside its own week is one
   step sideways, and the call's week is banded so you can see where it ends.

   A button opens it by describing itself in data- attributes, so nothing holds
   a reference to a live object across a re-render or a sync:
     data-datepick  what the pick MEANS — week · extra · due · asked · field
     data-path      dot-path into DATA (every kind but `field`)
     data-iso       the date it's on now, "" for none
     data-anchor    the week's night, for the calls that hang off one
   ═══════════════════════════════════════════════════════════════════════════ */
let DP = null;                                     // {kind, path, iso, anchor, month, el}

function isoOfDate(d){
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
/* the button that opens it — this is what replaces every typed-in date field */
function dbtn(kind, path, iso, label, opts){
  const o = opts || {};
  return `<button type="button" class="dpick ${o.cls || ""}${label ? "" : " empty"}" data-datepick="${kind}"${
    path ? ` data-path="${esc(path)}"` : ""} data-iso="${esc(iso || "")}"${
    o.anchor ? ` data-anchor="${esc(o.anchor)}"` : ""}${o.id ? ` id="${o.id}"` : ""}${
    o.ph ? ` data-ph="${esc(o.ph)}"` : ""} title="${
    esc(o.title || "Pick a date")}">${esc(label || o.ph || "pick a date")}</button>`;
}
function openDatePicker(el){
  const iso = el.dataset.iso || "";
  DP = {kind:el.dataset.datepick, path:el.dataset.path || "", iso, anchor:el.dataset.anchor || "",
        month:(iso || el.dataset.anchor || todayISO()).slice(0, 7), el};
  paintDatePicker();
  popAt($("#datePop"), el);
}
/* park a popup under whatever was clicked, kept on screen */
function popAt(pop, el){
  const r = el.getBoundingClientRect();
  pop.style.top  = Math.max(10, Math.min(window.innerHeight - pop.offsetHeight - 12, r.bottom + 6)) + "px";
  pop.style.left = Math.max(10, Math.min(window.innerWidth  - pop.offsetWidth  - 12, r.left)) + "px";
}
function closeDatePicker(){ $("#datePop").classList.add("hidden"); DP = null; }

function paintDatePicker(){
  if(!DP) return;
  const [my, mm] = DP.month.split("-").map(Number);
  const first = new Date(my, mm - 1, 1), last = new Date(my, mm, 0);
  const today = todayISO();
  const wkOf = i => isoOfDate(weekStartOf(parseDate(i)));      // which Vector week a night belongs to
  const band = DP.anchor ? wkOf(DP.anchor) : null;             // ...the one this call already sits in

  let cells = "";
  for(const d of ["Tue","Wed","Thu","Fri","Sat","Sun","Mon"]) cells += `<div class="dp-dow">${d}</div>`;
  const end = new Date(last);
  end.setDate(end.getDate() + (6 - ((end.getDay() + 5) % 7)));   // out to the Monday that closes the last week
  for(let c = weekStartOf(first); c <= end; c.setDate(c.getDate() + 1)){
    const i = isoOfDate(c), cls = [
      c.getMonth() === mm - 1 ? "" : "out",
      band && wkOf(i) === band ? "wk" : "",
      i === today ? "today" : "",
      i === DP.iso ? "on" : ""].filter(Boolean).join(" ");
    cells += `<button type="button" class="dp-d ${cls}" data-dpday="${i}" title="${esc(fmtDay(i) + " " + fmtFull(i))}">${c.getDate()}</button>`;
  }

  const foot = [];
  if(DP.kind === "extra" && DP.iso && DP.anchor && DP.iso !== DP.anchor)
    foot.push(`<button class="btn sm" data-dpclear="1">On the week's night · ${esc(fmtDate(DP.anchor))}</button>`);
  if(["due","asked","field"].includes(DP.kind)){
    foot.push(`<button class="btn sm" data-dpday="${today}">Today</button>`);
    if(DP.iso) foot.push(`<button class="btn sm" data-dpclear="1">Clear</button>`);
  }

  const pop = $("#datePop");
  pop.innerHTML = `<div class="dp-head">
      <button class="dp-nav" data-dpmonth="-1" title="Previous month">\u2039</button>
      <span class="m">${MONTHS[mm - 1]} ${my}</span>
      <button class="dp-nav" data-dpmonth="1" title="Next month">\u203a</button>
      <button class="dp-nav" data-dpclose="1" title="Close">\u2715</button>
    </div>
    <div class="dp-grid">${cells}</div>
    <div class="dp-hint">rows are Vector weeks \u00b7 Tue \u2192 Mon</div>
    ${foot.length ? `<div class="dp-foot">${foot.join("")}</div>` : ""}`;
  pop.classList.remove("hidden");
}

/* what a pick MEANS, one branch per kind. "" clears. */
function applyDatePick(iso){
  const d = DP;
  if(!d) return;
  if(d.kind === "field"){                          // a form field — no board data behind it
    d.el.dataset.iso = iso;
    d.el.textContent = iso ? fmtFull(iso) : (d.el.dataset.ph || "pick a date");
    d.el.classList.toggle("empty", !iso);
    closeDatePicker();
    return;
  }
  const node = getPath(d.path.slice(0, d.path.lastIndexOf(".")));
  if(!node){ closeDatePicker(); return; }
  closeDatePicker();

  if(d.kind === "week"){
    if(!iso || iso === node.date) return;          // a week always has a night — nothing to clear
    return moveWeekTo(node, iso);
  }
  if(d.kind === "extra"){
    const week = getPath(d.path.slice(0, d.path.indexOf(".extra.")));
    if(!iso || iso === week.date){                 // back onto the week's night — no override to keep
      delete node.date; save(); render();
      return toast("Back on the week's night \u2014 " + fmtFull(week.date));
    }
    node.date = iso; save(); render();
    return toast("Moved to " + fmtFull(iso) + " (" + fmtDay(iso) + ")");
  }
  const key = d.path.slice(d.path.lastIndexOf(".") + 1);
  if(!iso) delete node[key]; else node[key] = iso;
  save(); render();
  return toast(iso ? (d.kind === "asked" ? "Last asked " : "Due ") + fmtFull(iso) : "Date cleared");
}
/* moving a whole week — its calls come with it unless they carry their own night */
function moveWeekTo(row, iso){
  const clash = DATA.calendar.some(r => r !== row && r.date === iso);
  row.date = iso;
  DATA.calendar.sort((a, b) => a.date.localeCompare(b.date));
  UI.year = Number(iso.slice(0, 4));                // follow the week if it crossed a year
  if(UI.season !== "all") UI.season = seasonOf(iso).key;   // ...and its campaign, or it vanishes behind the filter
  save(); render();
  toast("Moved to " + fmtFull(iso) + " (" + fmtDay(iso) + ")" +
        (clash ? " \u2014 heads up, there's already a call that night" : ""));
}

document.addEventListener("click", e => {
  const open = e.target.closest("[data-datepick]");
  if(open){ e.preventDefault(); openDatePicker(open); return; }
  const pop = $("#datePop");
  if(pop.classList.contains("hidden")) return;
  const day = e.target.closest("[data-dpday]");
  if(day){ applyDatePick(day.dataset.dpday); return; }
  if(e.target.closest("[data-dpclear]")){ applyDatePick(""); return; }
  const mv = e.target.closest("[data-dpmonth]");
  if(mv){
    const [y, m] = DP.month.split("-").map(Number);
    const n = new Date(y, m - 1 + Number(mv.dataset.dpmonth), 1);
    DP.month = n.getFullYear() + "-" + String(n.getMonth() + 1).padStart(2, "0");
    paintDatePicker();
    return;
  }
  if(e.target.closest("[data-dpclose]") || !pop.contains(e.target)) closeDatePicker();
});

/* ═══════════════════════════════════════════════════════════════════════════
   THE TIME PICKER — every call time in the hub, in Central
   Same deal as the dates: a button says what it sets, you click a time off a
   list, nobody types anything. Quarter-hour steps around the clock, opened
   scrolled to the time it's on now.
   ═══════════════════════════════════════════════════════════════════════════ */
let TP = null;                                     // {path, val, fallback}

function tbtn(path, val, opts){
  const o = opts || {};
  const shown = val ? fmtTime(val) : "";
  const ghost = !shown && o.fallback ? fmtTime(o.fallback) : "";     // what it inherits, shown faintly
  return `<button type="button" class="dpick ${o.cls || ""}${shown ? "" : " empty"}" data-timepick="1"
    data-path="${esc(path)}" data-val="${esc(val || "")}"${o.fallback ? ` data-fallback="${esc(o.fallback)}"` : ""
    } title="${esc(o.title || "Pick a time — all call times are Central")}">${esc(shown || ghost || o.ph || "time?")}</button>`;
}
function openTimePicker(el){
  TP = {path:el.dataset.path, val:el.dataset.val || "", fallback:el.dataset.fallback || ""};
  const cur = TP.val || TP.fallback || "09:00";
  let items = "";
  for(let m = 0; m < 24 * 60; m += 15){
    const v = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
    items += `<button type="button" class="tp-item${m % 60 === 0 ? " hour" : ""}${v === TP.val ? " on" : ""}" data-tpval="${v}">${esc(fmtTime(v))}</button>`;
  }
  /* what clearing MEANS depends on what the field falls back to: the main call
     inherits the standing time, an added call simply shows no time at all. */
  const foot = [];
  if(TP.val) foot.push(`<button class="btn sm" data-tpclear="1">${
    TP.path === "meta.callTime" ? "Clear"
      : TP.fallback ? "Standing time \u00b7 " + esc(fmtTime(TP.fallback))
      : "No set time"}</button>`);

  const pop = $("#timePop");
  pop.innerHTML = `<div class="dp-head"><span class="m">Central time</span>
      <button class="dp-nav" data-tpclose="1" title="Close">\u2715</button></div>
    <div class="tp-list">${items}</div>
    ${foot.length ? `<div class="dp-foot">${foot.join("")}</div>` : ""}`;
  pop.classList.remove("hidden");
  popAt(pop, el);
  const list = pop.querySelector(".tp-list");
  const sel  = pop.querySelector(".tp-item.on") || pop.querySelector(`[data-tpval="${cur}"]`);
  if(sel) list.scrollTop = sel.offsetTop - list.clientHeight / 2 + sel.offsetHeight / 2;
}
function closeTimePicker(){ $("#timePop").classList.add("hidden"); TP = null; }

function applyTimePick(v){
  const t = TP;
  if(!t) return;
  closeTimePicker();
  const {node, key} = parentOf(t.path);
  if(!node) return;
  /* the standing time is a real setting — it empties rather than disappearing,
     or migrate() would hand it back from the seed on the next load */
  if(!v && t.path === "meta.callTime") node[key] = "";
  else if(!v) delete node[key];
  else node[key] = v;
  save(); render();
  toast(v ? "Calls at " + fmtTime(v)
          : t.path === "meta.callTime" ? "Standing time cleared"
          : t.fallback ? "Back on the standing time \u2014 " + fmtTime(t.fallback)
          : "No time on this call now");
}

/* ═══════════════════════════════════════════════════════════════════════════
   WHO'S ON IT — the presenter picker
   Alan and Ben are the answer nearly every time, so those are one click. But
   the board has always carried the shades that matter — "Ben (no Alan)",
   "Alan (Ben tiny part)" — and a dropdown that only offered the tidy three
   would have quietly flattened them. So whatever is already in use on the
   board is listed underneath, one click away and spelled the way it already is.
   ═══════════════════════════════════════════════════════════════════════════ */
let WP = null;                                     // {path, kind, val}
const WHO_CORE = {presenter:["Alan", "Ben", "Alan & Ben"], who:["Alan", "Ben"]};

function whoInUse(kind){
  const seen = new Set();
  if(kind === "who"){
    for(const list of Object.values(DATA.business || {})) for(const it of list) seen.add(String(it.who || "").trim());
  } else {
    for(const r of DATA.calendar || []){
      seen.add(String(r.presenter || "").trim());
      for(const x of (r.extra || [])) seen.add(String(x.presenter || "").trim());
    }
    for(const r of DATA.archive || []){
      seen.add(String(r.presenter || "").trim());
      seen.add(String(r.hotSeatPresenter || "").trim());
    }
  }
  for(const c of WHO_CORE[kind] || []) seen.delete(c);
  return [...seen].filter(Boolean).sort((a, b) => a.localeCompare(b));
}
/* the chip you click. In Edit (or always, where assigning IS the job) it opens
   the picker; otherwise it's the plain chip the board has always shown. */
function whoChip(path, val, opts){
  const o = opts || {}, kind = o.kind || "presenter";
  const set = String(val || "").trim();
  const cls = "chip " + presenterClass(val) + (o.cls ? " " + o.cls : "");
  if(!(EDITING || o.live)) return set ? `<span class="${cls}"${o.style ? ` style="${o.style}"` : ""}>${esc(set)}</span>` : "";
  return `<button type="button" class="dpick ${cls}${set ? "" : " empty"}" data-whopick="${kind}"
    data-path="${esc(path)}" data-val="${esc(set)}"${o.style ? ` style="${esc(o.style)}"` : ""} title="${
    esc(kind === "who" ? "Pick who owns this" : "Pick who's on this call")}">${esc(set || o.ph || "who?")}</button>`;
}
function openWhoPicker(el){
  WP = {path:el.dataset.path, kind:el.dataset.whopick, val:el.dataset.val || ""};
  const item = v => `<button type="button" class="pp-item${v === WP.val ? " on" : ""}" data-whoval="${esc(v)}"><span class="chip ${presenterClass(v)}">${esc(v)}</span></button>`;
  const used = whoInUse(WP.kind);
  let inner = `<div class="dp-head"><span class="m">${WP.kind === "who" ? "Who owns it" : "Who's on the call"}</span>
      <button class="dp-nav" data-whoclose="1" title="Close">\u2715</button></div><div class="pp-list">`;
  inner += (WHO_CORE[WP.kind] || WHO_CORE.presenter).map(item).join("");
  if(used.length) inner += `<div class="pp-cat">already on the board</div>` + used.map(item).join("");
  inner += `</div>`;
  if(WP.val) inner += `<div class="dp-foot"><button class="btn sm" data-whoclear="1">${WP.kind === "who" ? "Unassigned" : "No host \u2014 TBD"}</button></div>`;
  const pop = $("#whoPop");
  pop.innerHTML = inner;
  pop.classList.remove("hidden");
  popAt(pop, el);
}
function closeWhoPicker(){ $("#whoPop").classList.add("hidden"); WP = null; }
function applyWhoPick(v){
  const w = WP;
  if(!w) return;
  closeWhoPicker();
  const {node, key} = parentOf(w.path);
  if(!node) return;
  node[key] = v;                                   // "" rather than gone — every board already stores it that way
  save(); render();
  toast(v ? (w.kind === "who" ? "Assigned to " + v : v + " on this call")
          : (w.kind === "who" ? "Unassigned" : "Host cleared \u2014 back to TBD"));
}
document.addEventListener("click", e => {
  const open = e.target.closest("[data-whopick]");
  if(open){ e.preventDefault(); openWhoPicker(open); return; }
  const pop = $("#whoPop");
  if(pop.classList.contains("hidden")) return;
  const hit = e.target.closest("[data-whoval]");
  if(hit){ applyWhoPick(hit.dataset.whoval); return; }
  if(e.target.closest("[data-whoclear]")){ applyWhoPick(""); return; }
  if(e.target.closest("[data-whoclose]") || !pop.contains(e.target)) closeWhoPicker();
});

document.addEventListener("click", e => {
  const open = e.target.closest("[data-timepick]");
  if(open){ e.preventDefault(); openTimePicker(open); return; }
  const pop = $("#timePop");
  if(pop.classList.contains("hidden")) return;
  const hit = e.target.closest("[data-tpval]");
  if(hit){ applyTimePick(hit.dataset.tpval); return; }
  if(e.target.closest("[data-tpclear]")){ applyTimePick(""); return; }
  if(e.target.closest("[data-tpclose]") || !pop.contains(e.target)) closeTimePicker();
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !$("#pickPop").classList.contains("hidden")) closePicker();
  if(e.key === "Escape" && !$("#datePop").classList.contains("hidden")) closeDatePicker();
  if(e.key === "Escape" && !$("#timePop").classList.contains("hidden")) closeTimePicker();
  if(e.key === "Escape" && !$("#whoPop").classList.contains("hidden")) closeWhoPicker();
});

/* ── clicks ───────────────────────────────────────────────────────────── */
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if(!t) return;

  /* picker + tier controls first — they must win over anything below */
  if(t.dataset.pick !== undefined){ openPicker(Number(t.dataset.pick), t, t.dataset.pickfield); return; }
  if(t.id === "ppClose"){ closePicker(); return; }
  if(t.dataset.picktopic !== undefined){ pickTopic(t.dataset.picktopic); return; }
  if(t.id === "ppAdd"){
    const name = $("#ppNewName").value.trim();
    if(!name){ toast("Type the new topic's name first"); return; }
    const cat = $("#ppNewCat").value, ti = Number($("#ppNewTier").value);
    if(!DATA.topicBank[cat]) DATA.topicBank[cat] = [];
    if(!DATA.topicBank[cat].includes(name)) DATA.topicBank[cat].push(name);
    if(ti) setTier(name, ti);
    pickTopic(name);                                 // saves, closes, renders, toasts
    return;
  }
  if(t.dataset.addcall !== undefined){               // append a typed call to a week
    const [i, type] = t.dataset.addcall.split("|");
    const row = DATA.calendar[Number(i)];
    if(!Array.isArray(row.extra)) row.extra = [];
    row.extra.push({type, topic:"", presenter:"", time:"", speaker:"", notes:[]});
    save(); EDITING = true; render();
    focusPath(`calendar.${i}.extra.${row.extra.length - 1}.` + (type === "guest" ? "speaker" : "topic"));
    return;
  }
  if(t.dataset.addnote !== undefined){               // a fresh note line under a call
    const p2 = t.dataset.addnote;
    if(!Array.isArray(getPath(p2))) setPath(p2, []);
    getPath(p2).push("");
    save(); EDITING = true; render();
    focusPath(p2 + "." + (getPath(p2).length - 1));
    return;
  }
  if(t.dataset.offweek !== undefined){               // cross a week out / bring it back
    const row = getPath(t.dataset.offweek);
    if(row.status === "off") delete row.status; else row.status = "off";
    save(); render();
    toast(row.status === "off" ? "Marked as an off week" : "Back on the schedule");
    return;
  }

  if(t.dataset.section){                               // a bold tab — go to that section's first page
    const home = homeTabOf(t.dataset.section);
    if(sectionOf(TAB) !== t.dataset.section || TAB !== home){
      TAB = home; location.hash = TAB; UI.q = ""; UI.presenter = "all"; render(); pageIn(); window.scrollTo(0,0);
    }
    return;
  }
  if(t.dataset.tab){ TAB = t.dataset.tab; location.hash = TAB; UI.q = ""; UI.presenter = "all"; render(); pageIn(); window.scrollTo(0,0); return; }
  if(t.dataset.seg){
    UI[t.dataset.seg] = t.dataset.seg === "year" ? Number(t.dataset.val) : t.dataset.val;
    render(); return;
  }
  if(t.dataset.mseg){                                  // multi-select: toggle one, "All" (empty) clears
    const arr = UI[t.dataset.mseg] || (UI[t.dataset.mseg] = []);
    const v = t.dataset.val;
    if(!v) arr.length = 0;
    else{ const i = arr.indexOf(v); if(i < 0) arr.push(v); else arr.splice(i, 1); }
    render(); return;
  }
  if(t.dataset.toggle === "open"){ UI.open = !UI.open; render(); return; }
  if(t.dataset.toggle === "edit" || t.id === "editBtn"){ EDITING = !EDITING; render(); return; }
  if(t.dataset.png){ exportPNG(t.dataset.png, t.dataset.label); return; }
  if(t.dataset.print){ printBoard(t.dataset.print); return; }
  if(t.dataset.check){                                 // tick an order of business off
    const item = getPath(t.dataset.check);
    item.done = !item.done;
    if(item.done) item.doneOn = todayISO(); else delete item.doneOn;
    JUST_TOGGLED = t.dataset.check;                    // render highlights it so you can see where it went
    save(); render();
    clearTimeout(FLASH_TIMER);
    FLASH_TIMER = setTimeout(() => { JUST_TOGGLED = null; render(); }, 2600);
    toast(item.done ? "Ticked off — it's at the bottom of the section. Click the box again to undo."
                    : "Back on the list");
    return;
  }

  /* ── structural edits, all path-driven ── */
  if(t.dataset.add){                                   // append to a list
    addTo(t.dataset.add, "New item");
    save(); EDITING = true; render();
    focusPath(t.dataset.add + "." + (getPath(t.dataset.add).length - 1)); return;
  }
  if(t.dataset.addrow){                                // append a table row
    const blanks = {speakers:{name:"New speaker", topic:"", lastAsked:""},
                    archive:{n:DATA.archive.length+1, date:todayISO(), topic:"New call",
                             campaign:DATA.archive.length ? DATA.archive[DATA.archive.length-1].campaign : "Archive"}};
    DATA[t.dataset.addrow].push(clone(blanks[t.dataset.addrow]));
    save(); EDITING = true; render();
    focusPath(t.dataset.addrow + "." + (DATA[t.dataset.addrow].length - 1) +
              (t.dataset.addrow === "speakers" ? ".name" : ".topic")); return;
  }
  if(t.dataset.addkey){                                // new named list (category / backlog list)
    const obj = getPath(t.dataset.addkey);
    let name = "New category", n = 2;
    while(name in obj) name = "New category " + n++;
    obj[name] = [];
    save(); EDITING = true; render();
    focusPath("__key." + t.dataset.addkey + "." + name); return;
  }
  if(t.dataset.addyear){                               // extend the calendar
    const y = Number(t.dataset.addyear);
    if(hasYear(DATA.calendar, y)) { UI.year = y; render(); return; }
    DATA.calendar.push(...blankYear(DATA.calendar, y));
    DATA.calendar.sort((a, b) => a.date.localeCompare(b.date));
    UI.year = y; save(); render();
    toast(y + " added — " + DATA.calendar.filter(r => r.date.startsWith(y + "-")).length + " call nights"); return;
  }
  if(t.dataset.setfield){                              // reveal an optional field on a week
    setPath(t.dataset.setfield, " ");
    save(); EDITING = true; render();
    focusPath(t.dataset.setfield); return;
  }
  if(t.dataset.clearweek){                             // wipe a week back to open
    const r = getPath(t.dataset.clearweek);
    const date = r.date;
    for(const k of Object.keys(r)) if(k !== "date") delete r[k];
    r.topic = ""; r.track = ""; r.presenter = ""; r.date = date;
    save(); render(); toast("Week cleared"); return;
  }
  if(t.dataset.del){
    const label = t.title || "this";
    if(!confirm("Delete " + label.replace(/^Delete /, "") + "?")) return;
    removeAt(t.dataset.del); save(); render(); toast("Deleted"); return;
  }
  if(t.id === "syncBtn"){ openData(); return; }
});
document.addEventListener("input", e => {
  if(e.target.id === "q"){ UI.q = e.target.value; clearTimeout(window._qt); window._qt = setTimeout(render, 160); }
  if(e.target.id === "ppq"){                     // live-filter the picker, no re-render
    const v = e.target.value.toLowerCase();
    document.querySelectorAll("#pickPop .pp-item").forEach(b =>
      b.style.display = b.textContent.toLowerCase().includes(v) ? "" : "none");
    document.querySelectorAll("#pickPop .pp-cat").forEach(c => {
      let sib = c.nextElementSibling, any = false;
      while(sib && sib.classList.contains("pp-item")){ if(sib.style.display !== "none") any = true; sib = sib.nextElementSibling; }
      c.style.display = any ? "" : "none";
    });
  }
});
window.addEventListener("hashchange", () => {

  if(id && id !== TAB && TABS.some(t => t.id === id)){ TAB = id; render(); pageIn(); }

/* ═══════════ PRINT ═══════════ */
function printBoard(id){
  document.querySelectorAll(".export-frame").forEach(n => { n.dataset.hide = (n.id !== id) ? "1" : ""; });
  const style = document.createElement("style");
  style.id = "printOnly";
  style.textContent = `@media print{ [data-hide="1"]{display:none!important} .page-head{display:none!important} }`;
  document.head.appendChild(style);
  document.body.classList.add("exporting");
  setTimeout(() => {
    window.print();
    document.body.classList.remove("exporting");
    style.remove();
  }, 60);
}

/* ═══════════ PNG EXPORT ═══════════
   Renders the board into an <svg><foreignObject> and paints it to a canvas.
   No libraries, no network — except an optional pass that inlines the web
   fonts so the image looks identical to the screen. If that fetch fails
   (offline, or the file opened straight off disk) it falls back to system
   fonts and still produces a clean image. */
let FONT_CSS = null;
async function inlineFonts(){
  if(FONT_CSS !== null) return FONT_CSS;
  FONT_CSS = "";
  try{
    const link = [...document.querySelectorAll("link[rel=stylesheet]")].find(l => l.href.includes("fonts.googleapis"));
    if(!link) return FONT_CSS;
    const css = await (await fetch(link.href)).text();
    const blocks = css.split("@font-face").slice(1)
      .filter(b => b.includes("U+0000-00FF"));           // latin subset only — keeps it small
    const out = [];
    for(const b of blocks){
      const m = b.match(/url\((https:[^)]+\.woff2)\)/);
      if(!m) continue;
      const buf = await (await fetch(m[1])).arrayBuffer();
      let bin = ""; const bytes = new Uint8Array(buf);
      for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      out.push("@font-face" + b.replace(m[1], "data:font/woff2;base64," + btoa(bin)));
    }
    FONT_CSS = out.join("\n");
  }catch(e){ console.warn("Font inlining skipped:", e); FONT_CSS = ""; }
  return FONT_CSS;
}

async function exportPNG(id, label){
  const node = document.getElementById(id);
  if(!node) return toast("Nothing to export here");
  const btn = document.querySelector(`[data-png="${id}"]`);
  if(btn){ btn.disabled = true; btn.textContent = "Rendering…"; }
  document.body.classList.add("exporting");

  try{
    const fonts = await inlineFonts();
    const clone = node.cloneNode(true);
    clone.querySelectorAll(".no-export, [contenteditable]").forEach(n => {
      if(n.classList.contains("no-export")) n.remove(); else n.removeAttribute("contenteditable");
    });

    /* a board with a sideways-scrolling table (the check-ins lanes) exports at
       its full width rather than the slice that happened to be on screen */
    let width = Math.ceil(Math.max(node.getBoundingClientRect().width,
      ...[...node.querySelectorAll(".tbl")].map(t => t.scrollWidth)));
    const pageCSS = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");

    const holder = document.createElement("div");
    holder.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    holder.style.cssText = `width:${width}px;background:#F3EFE6;padding:28px;font-family:"Hanken Grotesk",-apple-system,sans-serif`;
    const st = document.createElement("style");
    /* the clone has no body.exporting ancestor, so un-scroll its tables here */
    st.textContent = fonts + "\n" + pageCSS + "\n.print-head{display:block!important}.tbl{overflow:visible!important}";
    holder.appendChild(st);
    holder.appendChild(clone);

    /* measure the real height off-screen before serialising */
    const probe = document.createElement("div");
    probe.style.cssText = `position:fixed;left:-99999px;top:0;width:${width + 56}px`;
    probe.appendChild(holder.cloneNode(true));
    document.body.appendChild(probe);
    /* if the fonts rendered wider than the on-screen measurement (a fallback
       face, say), a table may still poke out — widen to the real extent and
       measure the height again so nothing gets clipped */
    const need = Math.ceil(probe.firstChild.scrollWidth) - 56;
    if(need > width){
      width = need;
      holder.style.width = width + "px";
      probe.style.width = (width + 56) + "px";
      probe.replaceChild(holder.cloneNode(true), probe.firstChild);
    }
    const height = Math.ceil(probe.firstChild.getBoundingClientRect().height);
    probe.remove();

    const xml = new XMLSerializer().serializeToString(holder);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width + 56}" height="${height}">` +
                `<foreignObject x="0" y="0" width="100%" height="100%">${xml}</foreignObject></svg>`;

    const scale = 2;
    const img = new Image();
    img.crossOrigin = "anonymous";
    await new Promise((ok, no) => {
      img.onload = ok; img.onerror = () => no(new Error("SVG render failed"));
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    });

    const canvas = document.createElement("canvas");
    canvas.width = (width + 56) * scale; canvas.height = height * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#F3EFE6"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.drawImage(img, 0, 0);

    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "SNA-" + String(label || "board").replace(/[^\w]+/g, "-") + "-" + todayISO() + ".png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("PNG saved to your Downloads");
  }catch(err){
    console.error(err);
    toast("PNG export failed — use Print / PDF instead");
  }finally{
    document.body.classList.remove("exporting");
    if(btn){ btn.disabled = false; btn.textContent = "Export PNG"; }
  }
}

/* ═══════════ DATA EXPORT / IMPORT ═══════════ */
function openData(){
  $("#mTitle").textContent = "Hub data";
  $("#mBody").innerHTML = "This is everything the hub knows, as JSON. <b>Copy</b> it and send it to the other " +
    "person — they paste it in here and hit <b>Load</b> to get your exact plan. <b>Download</b> saves a file you can " +
    "hand to Claude to commit back into the repo.";
  $("#mText").value = JSON.stringify(DATA, null, 2);
  $("#mActions").innerHTML = `
    <button class="btn" data-act="reset">Reset to seed</button>
    <span style="flex:1"></span>
    <button class="btn" data-act="copy">Copy</button>
    <button class="btn" data-act="download">Download</button>
    <button class="btn primary" data-act="load">Load pasted JSON</button>
    <button class="btn" data-act="close">Close</button>`;
  $("#scrim").classList.add("on");
}
$("#scrim").addEventListener("click", async e => {
  if(e.target.id === "scrim") return $("#scrim").classList.remove("on");
  const act = e.target.dataset && e.target.dataset.act;
  if(!act) return;
  if(act === "close") return $("#scrim").classList.remove("on");
  if(act === "copy"){
    try{ await navigator.clipboard.writeText($("#mText").value); toast("Copied"); }
    catch(err){ $("#mText").select(); document.execCommand("copy"); toast("Copied"); }
    return;
  }
  if(act === "download"){
    const blob = new Blob([$("#mText").value], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "sna-hub-data-" + todayISO() + ".json";
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Downloaded"); return;
  }
  if(act === "load"){
    try{
      const parsed = JSON.parse($("#mText").value);
      if(!parsed.calendar || !Array.isArray(parsed.calendar)) throw new Error("missing calendar");
      DATA = migrate(parsed); save(); render();
      $("#scrim").classList.remove("on"); toast("Loaded");
    }catch(err){ toast("That isn't valid hub JSON — " + err.message); }
    return;
  }
  if(act === "keepMine"){
    setRev(window._conflict.rev); push();
    $("#scrim").classList.remove("on"); toast("Your version is now the shared one"); return;
  }
  if(act === "takeTheirs"){
    DATA = migrate(window._conflict.data); DF = null; setRev(window._conflict.rev);
    CI_JOURNAL = []; OTHER_EDITS = 0;
    localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
    render(); $("#scrim").classList.remove("on"); toast("Loaded their version"); return;
  }
  if(act === "reset"){
    if(!confirm("Throw away your local edits and go back to the data pulled from the sheet?")) return;
    localStorage.removeItem(STORE_KEY);
    DATA = clone(SEED); DIRTY = false; DF = null; CI_JOURNAL = []; OTHER_EDITS = 0; paintSaveState(); render();
    $("#scrim").classList.remove("on"); toast("Back to seed data");
  }
});
document.addEventListener("keydown", e => { if(e.key === "Escape") $("#scrim").classList.remove("on"); });

/* ═══════════ boot ═══════════ */
$("#sheetLink").href = SEED.meta.sheetUrl;
/* the standalone dashboard now redirects coaches back here — link the tab instead */

$("#dashLink").removeAttribute("target");
$("#stamp").textContent = "sheet snapshot " + SEED.meta.snapshot;
if(!TABS.some(t => t.id === TAB)) TAB = TABS[0].id;
paintSaveState();
render();
pageIn();

/* shared mode: pull once on load, then keep an eye on the shared copy */
if(syncOn()){
  syncStatus("connecting…");
  askWho();                                    // once, at boot — never from inside a save
  $("#saveLabel").style.cursor = "pointer";
  $("#saveLabel").title = "Click to change the name your edits are labelled with";
  $("#saveLabel").addEventListener("click", () => askWho(true));
  pull(true);
  setInterval(() => { if(document.visibilityState === "visible") pull(); }, SYNC.pollMs);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") pull(); });
  window.addEventListener("beforeunload", e => {
    if(PENDING || PUSHING){ e.preventDefault(); e.returnValue = ""; }   // don't lose an in-flight save
  });
}
