  .tbl table.grid:not(.ciboard):not(.aboard) td{padding:1px 0;border-bottom:none;font-size:13px}
  .tbl table.grid:not(.ciboard):not(.aboard) td:empty{display:none}
  .tbl table.grid:not(.ciboard):not(.aboard) tr.grp{padding:0}
  .tbl table.grid:not(.ciboard):not(.aboard) tr.grp td{padding:12px 14px 6px}
  /* Edit's delete lives in the card's top-right corner instead of a column of its own */
  body.editing .tbl table.grid:not(.ciboard):not(.aboard) td.edit-only{display:block!important;position:absolute;top:6px;right:6px;width:auto;padding:0}
  /* the label a header row used to supply */
  #teamBoard td:nth-child(3)::before,#teamBoard td:nth-child(5)::before,#teamBoard td:nth-child(6)::before,#teamBoard td:nth-child(7)::before,
  #archBoard td:nth-child(7)::before,#spkBoard td:nth-child(3)::before,
  #assignBoard table.acat td:nth-child(3)::before,#assignBoard table.acat td:nth-child(4)::before{
    font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-right:8px}
  /* roster: name · program · then labelled lines · dashboard link last */
  #teamBoard td:nth-child(1){font-size:14px}
  #teamBoard td:nth-child(2){margin:4px 0 5px}
  #teamBoard td:nth-child(3)::before{content:"Career sales"}
  #teamBoard td:nth-child(4){margin:4px 0}
  #teamBoard td:nth-child(5)::before{content:"Manager"}
  #teamBoard td:nth-child(5) div{display:inline;color:var(--ink-soft)}
  #teamBoard td:nth-child(5) div::before{content:" · "}
  #teamBoard td:nth-child(6)::before{content:"Joined"}
  #teamBoard td:nth-child(7)::before{content:"Coach"}
  #teamBoard td:nth-child(7){margin-top:3px}
  #teamBoard td:nth-child(8){margin-top:8px;display:flex;align-items:center;gap:12px}
  #teamBoard td:nth-child(8) div{margin-top:0!important}
  /* archive: "#3 · Jan 27 '25" on one line, topic under it, chips in a row */
  #archBoard td.num,#archBoard td.dt{display:inline-block;padding:0;font-size:12px;margin-bottom:3px}
  #archBoard td.num{margin-right:8px}
  #archBoard td.num::before{content:"#"}
  #archBoard td:nth-child(3){font-size:14px;font-weight:500}
  #archBoard tr.nocall td:nth-child(3){font-weight:400}
  #archBoard td:nth-child(4),#archBoard td:nth-child(5),#archBoard td:nth-child(6){display:inline-block;margin:6px 6px 0 0;padding:0}
  #archBoard td:nth-child(7){margin-top:5px}
  #archBoard td:nth-child(7)::before{content:"Hot seat"}
  #archBoard td:nth-child(7) div{display:inline}
  /* guest bench: name, what they'd teach, when we last asked */

   and the button you pressed keeps its width and turns into a 14px spinner */
.adrawer .is-busy{opacity:1;cursor:progress}
.adrawer :is(input,select).is-busy{-webkit-text-fill-color:currentColor}
.mfile.is-busy{pointer-events:none}

.btn.primary.is-saving{--spin:var(--paper)}

.is-saving::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;

/* ═══════════ how things answer your hand ═══════════
   A press lands instantly and springs back on release; a hover lights up
   instantly and fades when you leave. Squares on the dense boards get a ring,
   not a grow, so their neighbours never jostle. */
:is(.btn,.seg button,.tick,.ci,.sq,.rsw,.pay,.chip.dpick,.dp-d,.tp-item,.rc-seg button){
  transition:background-color .2s var(--ease-out),color .2s var(--ease-out),box-shadow .2s var(--ease-out),transform var(--spring-dur) var(--spring)}
:is(.btn,.seg button,.tick,.ci,.sq,.rsw,.pay,.chip.dpick,.dp-d,.tp-item,.rc-seg button):hover{transition-duration:0s,0s,0s,var(--spring-dur)}
:is(.btn,.seg button,.tick,.ci,.sq,.rsw,.pay,.chip.dpick,.rc-seg button):active:not([disabled]){transform:scale(.96);transition-duration:0s}
:is(.ci,.sq):hover{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ring)}

/* hit areas: the small controls take a click a few pixels beyond what they draw,
   and on a touch screen a full 44pt. The Edit × keeps its own box — a stray
   tap on a delete is the one miss that costs something. */
:is(.slot-pick,.tick,.dpick,.chip.bz,.rsw,.pay,button.tierchip,.dp-nav){position:relative}
:is(.slot-pick,.tick,.dpick,.chip.bz,.rsw,.pay,button.tierchip,.dp-nav)::after{content:"";position:absolute;inset:-5px}
button:is(.ci,.sq):not(.na)::before{content:"";position:absolute;inset:-5px}
@media (pointer:coarse){
  :is(.slot-pick,.tick,.dpick,.chip.bz,.rsw,.pay,button.tierchip,.dp-nav,header .btn)::after{
    content:"";position:absolute;inset:auto;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
  header .btn{position:relative}
  button:is(.ci,.sq):not(.na)::before{inset:-9px}
  .btn{padding-top:13px;padding-bottom:13px}
  header .btn{padding-top:7px;padding-bottom:7px}
  .btn.sm{padding-top:10px;padding-bottom:10px}
  .seg button{padding-top:11px;padding-bottom:11px}
  .tab-sub{padding-top:13px;padding-bottom:13px}
  select.fsel{padding-top:12px;padding-bottom:12px}
  input.search{padding-top:12px;padding-bottom:12px}
  .del{padding:6px 8px}
}

/* ═══════════════════════════════════════════════════════════════════════════
   SHARP NINJA ACADEMY — MASTER HUB
   ───────────────────────────────────────────────────────────────────────────
   HOW TO ADD A NEW TAB (the whole point of this file's structure):

     1. Add your data under a new key in SEED (top of this script).
     2. Write a render function that returns an HTML string.
     3. Add ONE line to the TABS array below:
          {id:"notes", label:"Notes", count:()=>DATA.notes.length, render:renderNotes}
        Optional: printable:true   →  gives that tab Export PNG + Print buttons.

   Nothing else needs to change — the tab bar, routing, edit mode, localStorage,
   PNG export and printing all pick it up automatically.
   ═══════════════════════════════════════════════════════════════════════════ */

const STORE_KEY = "sna-master-hub-v1";

/* Month, day and weekday names sit up here because `let DATA = load()` on the
   next screen runs while this script is still being evaluated — migrate() reads
   old call dates, and a const declared further down wouldn't exist yet. */
const MONTHS   = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS     = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

/* ── state ────────────────────────────────────────────────────────────── */
let DATA = load();
let DIRTY = !!localStorage.getItem(STORE_KEY);
let EDITING = false;
let TAB = (location.hash || "#calendar").slice(1);
const UI = { year:new Date().getFullYear(), season:"all", presenter:"all", open:false,
             q:"", archCampaign:"all", bizView:"all",
             bizUrg:[], bizImp:[], bizDue:"", bizSec:"", bizTopic:"", bizSort:"pri",   // Orders of Business filters + sort
             bizDraft:"",                                        // what's typed in its "add a task" box — outlives a re-render
             tier:"all", assignView:"board", assignProg:"all", assignFormer:false,   // show ticked-off items too — hiding them reads as deletion
             teamProgs:[], teamCoaches:[], teamGroup:"none",      // Mentees ▸ Roster: multi-select filters + grouping
             ciProgs:[],   ciCoaches:[],   ciGroup:"coach", ciCampaign:"",     // Mentees ▸ Weekly Check-ins
             atProgs:[],   atCoaches:[],   atGroup:"coach", atCampaign:"",     // Mentees ▸ Call Attendance
             moneyKind:"all", moneyWho:"all", moneyCat:"", moneyVoid:false };  // Money filters
/* Check-in marks made since the last successful sync, and how many other
   kinds of edit happened alongside them. Two coaches marking the same board
   on the same call is the normal case, so a colliding save replays these on
   top of the other person's copy instead of asking who wins — see push(). */
let CI_JOURNAL = [], OTHER_EDITS = 0, CI_OPEN = null;

function load(){
  let saved = null;
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) saved = JSON.parse(raw);
  }catch(e){ console.warn("Saved copy is not readable JSON; starting from the seed:", e); }

  if(!saved) return migrate(clone(SEED));
  /* If the upgrade step ever fails, use their data as it stands. Falling back to
     the seed here would quietly wipe out someone's planning. */
  try{ return migrate(saved); }
  catch(e){ console.error("Couldn't upgrade the saved copy; using it unchanged:", e); return saved; }
}
/* keeps an older saved copy working when the seed gains new sections */
function migrate(d){
  const base = clone(SEED);
  for(const k of Object.keys(base)) if(!(k in d)) d[k] = base[k];
  /* calls model (2026-08-26): a week's additional calls live in r.extra =
     [{type:"group"|"hotseat"|"guest", topic, presenter, time, speaker, notes:[]}].
     Legacy flat fields (second/hotSeat + their presenter/time) convert on the
     way in, so a board saved by an older page — or an older page still open in
     Ben's browser — folds in cleanly instead of being dropped. */
  (d.calendar || []).forEach(r => {
    if(!Array.isArray(r.extra)) r.extra = [];
    if(String(r.second || "").trim())
      r.extra.push({type:"group", topic:r.second, presenter:r.secondPresenter || "", time:r.secondTime || "", speaker:"", notes:[]});
    if(String(r.hotSeat || "").trim())
      r.extra.push({type:"hotseat", topic:r.hotSeat, presenter:r.hotSeatPresenter || "", time:r.hotSeatTime || "", speaker:"", notes:[]});
    delete r.second; delete r.secondPresenter; delete r.secondTime;
    delete r.hotSeat; delete r.hotSeatPresenter; delete r.hotSeatTime;
    r.extra.forEach(x => { if(!Array.isArray(x.notes)) x.notes = []; });
    if(!Array.isArray(r.mainNotes)) r.mainNotes = [];
    /* per-call nights (2026-09-04): an additional call used to carry a free-text
       `day` chip ("Thu", "Oct 8") that nothing could sort, count or move. It
       becomes a real `date` wherever it reads as one; a scribble that doesn't
       parse stays on `day` so nobody's note vanishes. */
    r.extra.forEach(x => {
      if(x.date || !String(x.day || "").trim()) return;
      const iso = readCallDate(x.day, r.date);
      if(iso){ x.date = iso; delete x.day; }
    });
    /* canonical times (2026-09-04): "10AM Central Time" and "7PM" become
       "10:00" and "19:00". Anything that won't read as a time stays put. */
    for(const c of [r, ...r.extra]){
      const t = parseTimeText(c.time);
      if(t) c.time = t;
    }
  });
  // meta gains fields over time (callTime, …). It already exists on any saved
  // board, so the loop above skips it — backfill its new keys individually or a
  // board saved before a field existed comes back blank instead of defaulted.
  if(d.meta) for(const k of Object.keys(base.meta)) if(!(k in d.meta)) d.meta[k] = base.meta[k];
  if(d.meta){ const t = parseTimeText(d.meta.callTime); if(t) d.meta.callTime = t; }
  /* orders of business (2026-09-11): "+ item" used to push a bare string into a
     section, which rendered as a row nobody could type into — so a new task
     never saved. Any such string becomes a real item, so it can be renamed or
     binned. Items also gained topic / urg / imp; older rows read as unset. */
  for(const list of Object.values(d.business || {})){
    if(!Array.isArray(list)) continue;
    list.forEach((it, i) => {
      if(it && typeof it === "object") return;
      list[i] = Object.assign(newBizItem(), {t: String(it == null ? "" : it).trim() || "New item"});
    });
  }
  /* orders of business (2026-09-15): Ben wrote his notes on these five items
     into the topic chip (there was no note line to click on yet). Move each
     one into the note, once — if the note already has text, or the topic has
     since been cleared by hand, leave the item alone. */
  const TOPIC_WAS_NOTE = new Set(["One system for check-in call and 1-on-1 notes", "Onboarding — assignments",
                                  "Fix Calendly", "Contract for reps", "Revamp scripts — Tier 2"]);
  for(const list of Object.values(d.business || {})){
    if(!Array.isArray(list)) continue;
    for(const it of list){
      if(!it || !TOPIC_WAS_NOTE.has(String(it.t || "").trim())) continue;
      const topic = String(it.topic || "").trim();
      if(!topic || String(it.note || "").trim()) continue;
      it.note = topic; it.topic = "";
    }
  }
  ensureYears(d);
  ensureCids(d);
  return d;
}

/* ── every call has a cid ───────────────────────────────────────────────
   The roll has to stay attached to its call when the call moves to another
   night, and a night can hold two calls, so a date can't be the key. Each
   call (a week's main call, and every r.extra[] call) carries a cid instead.
   A missing one is made from the call's night and slot — the same on Alan's
   copy and Ben's — skipping any id already taken by a call or a roll, so a
   cleared-and-replanned week never inherits the old call's roll. save() runs
   this too, so a call added in the page has its id before it's shared. ── */
function ensureCids(d){
  if(!Array.isArray(d.calendar)) return;
  const taken = new Set(Object.keys(d.attendance || {}));
  d.calendar.forEach(r => { if(r.cid) taken.add(r.cid); (r.extra || []).forEach(x => { if(x && x.cid) taken.add(x.cid); }); });
  const fresh = base => { let id = base, n = 1; while(taken.has(id)) id = base + "." + (++n); taken.add(id); return id; };
  d.calendar.forEach(r => {
    if(!r.cid) r.cid = fresh("c" + r.date);
    (r.extra || []).forEach((x, j) => { if(x && !x.cid) x.cid = fresh("c" + r.date + "x" + (j + 1)); });
  });
}

/* ── the calendar rolls itself forward ──────────────────────────────────
   Always keep this year and next year on the board, so Spring of the coming
   year is plannable long before it arrives and nobody has to remember to add
   it. Generating is deterministic — same dates, same empty fields — so if
   Alan and Ben both generate a year, the copies are identical. ── */
function ensureYears(d){
  if(!Array.isArray(d.calendar)) return;
  const now = new Date().getFullYear();
  for(const y of [now, now + 1]) if(!hasYear(d.calendar, y)) d.calendar.push(...blankYear(d.calendar, y));
  d.calendar.sort((a, b) => a.date.localeCompare(b.date));
}
/* Declarations, not const arrows: ensureYears() runs while this script is still
   being evaluated, and a const wouldn't be initialised yet. */
function hasYear(cal, y){ return cal.some(r => r.date.startsWith(y + "-")); }
function yearsIn(cal){ return [...new Set(cal.map(r => Number(r.date.slice(0, 4))))].sort(); }

/* Which weekday are calls on? Read it off the existing rows rather than
   assuming Tuesday, so moving the call night doesn't break next year. */
function callWeekday(cal){
  const tally = {};
  for(const r of cal){ const d = parseDate(r.date).getDay(); tally[d] = (tally[d] || 0) + 1; }
  const best = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0];
  return best === undefined ? 2 : Number(best);   // 2 = Tuesday
}
function blankYear(cal, year){
  const want = callWeekday(cal);
  const d = new Date(year, 0, 1);
  while(d.getDay() !== want) d.setDate(d.getDate() + 1);
  const out = [];
  while(d.getFullYear() === year){
    out.push({date: year + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"),
              topic:"", track:"", presenter:""});
    d.setDate(d.getDate() + 7);
  }
  return out;
}
function save(kind){
  try{
    /* anything but a check-in mark or a roll mark still gets the conflict prompt */
    if(kind !== "checkin" && kind !== "roll") OTHER_EDITS++;
    ensureCids(DATA);
    localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
    DIRTY = true; DF = null; paintSaveState();   // topic weights are rebuilt from the edited data
    if(typeof scheduleSync === "function") scheduleSync();
  }catch(e){ toast("Couldn't save on this computer — export your JSON (Data) to be safe.", {err:true, retry:() => save(kind)}); }
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ── tiny helpers ─────────────────────────────────────────────────────── */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/*ASSIGN_STATE_BEGIN*/
/* Assignment state rules — ONE rule set, copied verbatim into the dashboard and
   the hub. $S/assign-state.test.js proves the two copies agree. Spec §5.5. */
const ASSIGN_RANK={dojo:1,path:2,masters:3};
function tierRank(t){return ASSIGN_RANK[String(t||"").trim().toLowerCase()]||2;}
function tierName(t){const k=String(t||"").trim().toLowerCase();return k==="dojo"?"Dojo":k==="masters"?"Masters":"Path";}
function assignPrograms(a){
  const out=[];
  String((a&&a.Programs)||"").split(",").map(s=>s.trim()).filter(Boolean).forEach(s=>{const n=tierName(s);if(out.indexOf(n)<0)out.push(n);});
  return out;
}
function assignBase(a){const ps=assignPrograms(a).slice().sort((x,y)=>tierRank(x)-tierRank(y));return ps[0]||"Path";}
function dueISO(v){
  if(v==null||v==="")return "";
  const pad=n=>String(n).padStart(2,"0");
  if(v instanceof Date)return isNaN(v)?"":v.getFullYear()+"-"+pad(v.getMonth()+1)+"-"+pad(v.getDate());
  const s=String(v).trim();
  if(/^na$/i.test(s))return "NA";
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[1]+"-"+m[2]+"-"+m[3];
  m=s.match(/^Date\((\d+),(\d+),(\d+)/); if(m)return m[1]+"-"+pad(+m[2]+1)+"-"+pad(+m[3]);
  const d=new Date(s); return isNaN(d)?"":d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function assignState(rep,a,overrides,subs,today){
  const tier=tierName(rep.tier);
  const ov=(overrides||[]).find(o=>String(o.AssignmentID)===String(a.AssignmentID)&&String(o.RepID)===String(rep.id))||null;
  const ovDue=ov?dueISO(ov.DueDate):"";
  const active=String(a.Active==null||a.Active===""?"Y":a.Active).trim().toUpperCase()!=="N";
  if(!active||assignPrograms(a).indexOf(tier)<0||ovDue==="NA")return {state:"na",due:null,versions:[],latest:null,override:ov};
  const due=ovDue||dueISO(a.DueDate)||null;
  const versions=(subs||[]).filter(s=>String(s.AssignmentID)===String(a.AssignmentID)&&String(s.RepID)===String(rep.id))
    .slice().sort((x,y)=>(+x.Version||0)-(+y.Version||0));
  const latest=versions[versions.length-1]||null;
  let state;
  if(!latest)state=(due&&today>due)?"late":"open";
  else{const st=String(latest.Status||"submitted").trim().toLowerCase();state=st==="approved"?"approved":st==="revise"?"revise":"waiting";}
  return {state,due,versions,latest,override:ov};
}
/*ASSIGN_STATE_END*/

const $  = s => document.querySelector(s);

function parseDate(iso){ const [y,m,d] = String(iso).split("-").map(Number); return new Date(y, m-1, d); }
function fmtDate(iso){ const d = parseDate(iso); return MONTHS[d.getMonth()] + " " + d.getDate(); }
function fmtDay(iso){ return DAYS[parseDate(iso).getDay()]; }
function fmtFull(iso){ const d = parseDate(iso); return MONTHS[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear(); }

/* ── reading a date the way a person would type it ──────────────────────
   A call moving nights shouldn't mean typing ISO format. All of these work:
     Jan 6 · January 6th · 6 Jan · 1/6 · 1/6/27 · 01-06-2027 · 2027-01-06
   A year is optional — leave it off and the week keeps the year it's already
   in, so nudging a 2027 call to "Jan 13" doesn't drag it back to this year. */
function makeISO(y, m, d){
  if(!(y >= 2000 && y <= 2100) || m < 1 || m > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, m - 1, d);
  if(dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;   // catches Feb 30 and friends
  return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}
function parseLooseDate(text, defaultYear){
  const t = String(text || "").trim().replace(/,/g, " ");
  if(!t) return null;
  let m;
  if((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return makeISO(+m[1], +m[2], +m[3]);
  if((m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/))){
    let y = m[3] ? Number(m[3]) : defaultYear;
    if(y < 100) y += 2000;
    return makeISO(y, +m[1], +m[2]);
  }
  let mi = -1, day = null, yr = null;
  for(const w of t.split(/\s+/)){
    const i = MONTHS.findIndex(x => w.toLowerCase().startsWith(x.toLowerCase()));
    if(i >= 0 && mi < 0){ mi = i; continue; }
    const n = Number(w.replace(/(st|nd|rd|th)$/i, ""));
    if(!isNaN(n) && w.trim() !== ""){
      if(w.replace(/\D/g, "").length === 4) yr = n;
      else if(day === null) day = n;
    }
  }
  if(mi >= 0 && day !== null) return makeISO(yr || defaultYear, mi + 1, day);
  return null;
}

/* A bare weekday lands inside the call's own VECTOR week — Tuesday through
   Monday, the same week the check-in board counts in, not a Mon–Sun one. So on
   a call sitting on Tue Sep 8, "Thursday" is Sep 10 and "Monday" is Sep 14: the
   Monday that CLOSES that week, six nights on, not the Sep 7 before it. Typing a
   real date always wins, and the toast names the full date it landed on. */
function parseWeekday(text, anchorISO){
  const t = String(text || "").trim().toLowerCase().replace(/\.$/, "");
  if(!t || !anchorISO) return null;
  const i = t.length >= 3 ? WEEKDAYS.findIndex(d => d.toLowerCase().startsWith(t)) : -1;   // mon · tues · thurs · saturday
  if(i < 0) return null;
  const a = parseDate(anchorISO);
  if(isNaN(a)) return null;
  const d = weekStartOf(a);                  // the one definition of a Vector week — the Tuesday on or before
  d.setDate(d.getDate() + ((i + 5) % 7));    // ...then out to the night asked for: Tue 0 · Wed 1 … Mon 6
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
/* Every call date typed anywhere on the board comes through here: a weekday
   name, or any of the loose formats, read against the night the call is on now. */
function readCallDate(text, anchorISO){
  return parseWeekday(text, anchorISO)
      || parseLooseDate(text, Number(String(anchorISO || todayISO()).slice(0, 4)));
}

/* ── which night a call runs ────────────────────────────────────────────
   A week row is anchored by r.date — the night its main call runs, and what the
   board sorts, numbers and groups by. Any additional call may carry its own
   `date` instead; blank means it rides along on the week's night. ── */
function callDateOf(r, x){ return (x && String(x.date || "").trim()) || r.date; }
/* A field that has held free text in the past ("last spring") reads as a date
   when it can and stays itself when it can't, so nobody's note is lost. */
function dateISO(v){ const i = dueISO(v); return i === "NA" ? "" : i; }

/* ── call times ────────────────────────────────────────────────────────
   Every call time in the hub is CENTRAL, and stored canonically as 24-hour
   "HH:MM" so two boards can't disagree about what "7PM" meant. Text that
   won't read as a time is kept exactly as written rather than thrown away. */
function parseTimeText(v){
  const s = String(v == null ? "" : v).trim().toLowerCase();
  const m = /^(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?\b/.exec(s);
  if(!m) return "";
  let h = Number(m[1]);
  const mi = m[2] ? Number(m[2]) : 0;
  const ap = (m[3] || "").replace(/\./g, "");
  if(ap === "pm" && h < 12) h += 12;
  if(ap === "am" && h === 12) h = 0;
  if(h > 23 || mi > 59) return "";
  return String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0");
}
/* Central is CST for part of the year and CDT for the rest, so the label is
   worked out from the call's own night rather than hard-coded — a 3:30 call in
   July is CDT, the same call in January is CST. US rule since 2007: daylight
   time runs from the second Sunday in March to the first Sunday in November.
   (Both switches happen at 2 AM; calls don't, so the day itself is enough.) */
function firstSundayOf(y, month){ return 1 + ((7 - new Date(y, month, 1).getDay()) % 7); }
function centralZone(iso){
  const d = iso ? parseDate(iso) : new Date();
  const y = d.getFullYear();
  const starts = new Date(y, 2, firstSundayOf(y, 2) + 7);          // 2nd Sunday, March
  const ends   = new Date(y, 10, firstSundayOf(y, 10));            // 1st Sunday, November
  d.setHours(0, 0, 0, 0);
  return d >= starts && d < ends ? "CDT" : "CST";
}
/* Always 12-hour with AM/PM — never the browser's clock preference, which was
   rendering "15:30" on phones set to a 24-hour clock. Nobody says that out loud.
   fmtClock is the bare face ("3:30PM") for lists that label the zone once at the
   top; fmtTime adds the zone, and `iso` is the night it falls on. */
function fmtClock(v){
  const m = /^(\d{2}):(\d{2})$/.exec(String(v == null ? "" : v).trim());
  if(!m) return "";                                 // not a canonical time
  const h = Number(m[1]);
  return (h % 12 || 12) + ":" + m[2] + (h < 12 ? "AM" : "PM");
}
function fmtTime(v, iso){
  const raw = String(v == null ? "" : v).trim();
  const face = fmtClock(raw);
  return face ? face + " " + centralZone(iso) : raw;   // free text stays as whoever wrote it meant it
}
function fmtMaybeDate(v){ const i = dateISO(v); return i ? fmtFull(i) : String(v == null ? "" : v); }
function isLiveCall(x){ return !!(String(x.topic || "").trim() || String(x.speaker || "").trim()); }

/* Spring = Jan–Apr (I) · Summer = May–Aug (II) · Fall = Sep–Dec (III) —
   the same split the mentee dashboard uses, so campaigns line up across tools. */
const SEASONS = [
  {key:"Spring", roman:"I",   range:"January – April",   test:m => m <= 3},
  {key:"Summer", roman:"II",  range:"May – August",      test:m => m >= 4 && m <= 7},
  {key:"Fall",   roman:"III", range:"September – December", test:m => m >= 8}
];
function seasonOf(iso){ const m = parseDate(iso).getMonth(); return SEASONS.find(s => s.test(m)); }

/* who's on the call — drives the colour of the presenter chip */
function presenterClass(p){
  const s = String(p||"").toLowerCase();
  const hasA = s.includes("alan"), hasB = s.includes("ben");
  const noA = /no alan|alan will not|alan not/.test(s), noB = /no ben|ben will not|ben not/.test(s);
  if(!s.trim()) return "tbd";
  if(hasA && hasB && !noA && !noB) return "both";
  if(hasA && !noA) return "alan";
  if(hasB && !noB) return "ben";
  if(hasA) return "alan";
  if(hasB) return "ben";
  return "tbd";
}
function isPlanned(r){ return !!String(r.topic||"").trim(); }
function isBlocked(r){ return r.status === "blocked"; }

/* ── topic cross-referencing: has this bank topic already been run? ─────
   Plain word overlap matched far too much — in this business almost every
   topic contains "closing" or "objections". So each word is weighted by how
   rare it is across all our topics (a document-frequency weight): "cookware"
   counts for a lot, "closing" counts for very little. Two topics are related
   when they share enough *distinctive* weight. ── */
const STOP = new Set("a an the and or of to in on at for with your you our my is it that this how not more less by from we us can".split(" "));
const stem = w => w.length > 3 && w.endsWith("s") ? w.slice(0, -1) : w;
function tokens(s){
  return [...new Set(String(s||"").toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/)
    .filter(w => w.length > 2 && !STOP.has(w)).map(stem))];
}
let DF = null;
function buildDF(){
  DF = new Map();
  const corpus = [...DATA.archive.map(r => r.topic), ...DATA.calendar.map(r => r.topic),
                  ...Object.values(DATA.topicBank).flat()].filter(Boolean);
  for(const t of corpus) for(const w of tokens(t)) DF.set(w, (DF.get(w) || 0) + 1);
}
const wt   = w => 1 / Math.sqrt((DF && DF.get(w)) || 1);
const mass = a => a.reduce((n, w) => n + wt(w), 0);

const SHARE_FLOOR = 0.45;   // needs genuinely distinctive overlap, not one common word
const SHARE_RATIO = 0.70;   // ...and it must cover most of the shorter topic

function related(a, b){
  if(!DF) buildDF();
  const A = tokens(a), B = tokens(b);
  if(!A.length || !B.length) return false;
  const inB = new Set(B);
  let shared = 0;
  for(const w of A) if(inB.has(w)) shared += wt(w);
  if(shared < SHARE_FLOOR) return false;
  return shared / Math.min(mass(A), mass(B)) >= SHARE_RATIO;
}
/* {past: already delivered, newest first · future: still on the calendar}
   A calendar week that has come and gone counts as delivered — otherwise a
   topic taught in March 2026 would still read as "scheduled" in 2027. */
/* ── tiers: T1 The Dojo · T2 The Path · T3 The Masters ─────────────────── */
const TIERS = {1:{name:"The Dojo"}, 2:{name:"The Path"}, 3:{name:"The Masters"}};
function tierOf(text){
  const t = DATA.topicTiers && DATA.topicTiers[String(text||"").trim()];
  return TIERS[t] ? t : 0;
}
function setTier(text, t){
  text = String(text||"").trim(); if(!text) return;
  if(!DATA.topicTiers) DATA.topicTiers = {};
  if(t) DATA.topicTiers[text] = t; else delete DATA.topicTiers[text];
}
/* the chip: a colored label when assigned; in Edit mode a button that cycles
   unset → T1 → T2 → T3 → unset, keyed by the topic TEXT so bank and calendar
   always agree */
function tierChip(text){
  const t = tierOf(text);
  if(EDITING) return ` <select class="tiersel t${t} no-export no-print" data-tiersel="${esc(text)}" title="Set this topic's tier">
    <option value="0"${t ? "" : " selected"}>tier?</option>
    <option value="1"${t === 1 ? " selected" : ""}>T1 · The Dojo</option>
    <option value="2"${t === 2 ? " selected" : ""}>T2 · The Path</option>
    <option value="3"${t === 3 ? " selected" : ""}>T3 · The Masters</option></select>`;
  return t ? ` <span class="tierchip t${t}">T${t} · ${TIERS[t].name}</span>` : "";
}
const isOff = r => r.status === "off";
const CALL_TYPES = {group:"Group", hotseat:"🔥 Hot seat", guest:"🎤 Guest speaker"};
const tierSeg = () => seg("tier", [{v:"all",l:"All tiers"},{v:"1",l:"T1 · Dojo"},{v:"2",l:"T2 · Path"},{v:"3",l:"T3 · Masters"}], UI.tier);

function findUses(topic){
  const today = todayISO();
  const done = DATA.calendar.filter(r => isPlanned(r) && !isOff(r) && r.date < today && related(topic, r.topic));
  const past = DATA.archive.filter(r => related(topic, r.topic)).concat(done)
                           .sort((a, b) => b.date.localeCompare(a.date));
  const future = DATA.calendar.filter(r => isPlanned(r) && r.date >= today && related(topic, r.topic))
                              .sort((a, b) => a.date.localeCompare(b.date));
  return {past, future};
}

/* Every call on a week, flattened, each with the night it actually runs. Once a
   call can break away from its week, "the next call" can't be read off the week
   dates any more — a Monday hot seat comes before its own week's Tuesday. */
function callsOn(r){
  if(isBlocked(r) || isOff(r)) return [];
  const out = [{date:r.date, topic:r.topic, presenter:r.presenter, time:r.time, planned:isPlanned(r)}];
  for(const x of (r.extra || [])) if(isLiveCall(x))
    out.push({date:callDateOf(r, x), topic:x.topic || x.speaker, presenter:x.presenter, time:x.time, planned:true});
  return out;
}
function upcomingCalls(){
  const today = todayISO();
  return DATA.calendar.flatMap(callsOn).filter(c => c.date >= today)
                      .sort((a, b) => a.date.localeCompare(b.date));
}

/* ── structural edits, all driven by the same dot-paths as the text fields ── */
function getPath(path){
  return path.split(".").reduce((n, k) => (n == null ? n : n[k]), DATA);
}
function parentOf(path){
  const parts = path.split(".");
  const key = parts.pop();
  return {node: parts.reduce((n, k) => n[k], DATA), key};
}
function removeAt(path){
  const {node, key} = parentOf(path);
  if(Array.isArray(node)) node.splice(Number(key), 1);
  else delete node[key];
}
function addTo(path, value){
  const target = getPath(path);
  if(Array.isArray(target)) target.push(value);
}
/* rename an object key while keeping its position in the list */
function renameKey(objPath, oldKey, newKey){
  const obj = getPath(objPath);
  if(!obj || !(oldKey in obj) || !newKey || newKey === oldKey) return false;
  if(newKey in obj) return false;
  const rebuilt = {};
  for(const k of Object.keys(obj)) rebuilt[k === oldKey ? newKey : k] = obj[k];
  const {node, key} = parentOf(objPath);
  node[key] = rebuilt;
  return true;
}

/* ── toast + save indicator ───────────────────────────────────────────── */
/* toast(msg) says what just happened and goes by itself after 2.6 s.
   toast(msg, {err:true, retry}) is for a save or a fetch that didn't go through,
   which must never vanish unseen: it stays, tinted, until Dismiss — or Retry,
   which closes it and runs retry() again (a failure there brings a fresh one).
   The same failure twice replaces its own toast instead of stacking (`key`
   defaults to the message), dismissToast(key) takes one away once it's fixed,
   and retryLabel renames the button when "Retry" isn't what it does. */
let toastTimer, toastNow = null;
function toastGo(t){ t.classList.add("out"); setTimeout(() => t.remove(), 170); }
function toast(msg, opt){
  if(opt && opt.err) return errToast(msg, opt);
  const box = $("#toasts");
  if(!toastNow || !toastNow.isConnected){
    toastNow = document.createElement("div"); toastNow.className = "toast"; box.appendChild(toastNow);
  }
  const t = toastNow; t.textContent = msg; t.classList.remove("out");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastGo(t); if(toastNow === t) toastNow = null; }, 2600);
}
function errToast(msg, {retry, retryLabel = "Retry", key = msg} = {}){
  const box = $("#toasts");
  const old = [...box.querySelectorAll(".toast.err")].find(n => n.dataset.key === key);
  const t = document.createElement("div");
  t.className = "toast err"; t.setAttribute("role", "alert"); t.dataset.key = key;
  t.innerHTML = `<span class="t-msg"></span><span class="t-acts">${retry ? `<button class="btn sm t-retry"></button>` : ""}<button class="btn sm t-x">Dismiss</button></span>`;
  t.querySelector(".t-msg").textContent = msg;
  if(retry){
    const b = t.querySelector(".t-retry");
    b.textContent = retryLabel;
    b.addEventListener("click", () => { toastGo(t); retry(); });
  }
  t.querySelector(".t-x").addEventListener("click", () => toastGo(t));
  if(old) old.replaceWith(t);
  else box.insertBefore(t, toastNow && toastNow.isConnected ? toastNow : null);   // errors above the passing one
}
function dismissToast(key){
  document.querySelectorAll("#toasts .toast.err").forEach(n => { if(n.dataset.key === key) toastGo(n); });
}
/* the same as clicking a tab: the sliding underline, the entrance, the top of the page */
function goTab(id){
  TAB = id; location.hash = TAB; UI.q = ""; UI.presenter = "all"; render(); pageIn(); window.scrollTo(0,0);
}
function paintSaveState(){
  if(typeof syncOn === "function" && syncOn()) return;   // sync owns the status line
  $("#saveDot").className = "dot" + (DIRTY ? " edited" : "");
  $("#saveLabel").textContent = DIRTY ? "your edits (saved locally)" : "seed data";
}


/* ═══════════════════════════════════════════════════════════════════════════
   TAB — MENTEES (live roster from the private SNA contacts sheet)

   Unlike every other tab, this one does NOT live in DATA / hub sync. It reads
   the Sharp Ninja Apps Script web app directly, gated by a coach key that is
   entered once and kept in localStorage — the key is deliberately NOT in this
   file, because this page is public GitHub Pages and the roster holds phones
   and emails. Coach assignments write straight back to the private sheet.
   ═══════════════════════════════════════════════════════════════════════════ */
const TEAM_API = "https://script.google.com/macros/s/AKfycbyNFDkgEAUT5IDNw4wvCHLQZoe70XxVwgAZmG8bNTmlkY8t0d-wL2eKa53kgke2AOCHPQ/exec";
const TEAM = {
  key: localStorage.getItem("sna_coach_key") || "",
  rows: null, coaches: [], loading: false, err: "",
  sw: null, swErr: "", swBusy: {}, repSwBusy: {},
  payPresets: {},                   // the one-click plans per program, as coachRoster hands them over
  payEdit: null, payBusy: {}        // the one row whose Pay editor is open ({repId, kind, amount, err}) · rows mid-save
};

async function teamCall(body){
  const res = await fetch(TEAM_API, {
    method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, cache: "no-store",
    body: JSON.stringify(Object.assign({key: TEAM.key, _t: Date.now()}, body))
  });
  return res.json();
}

async function teamLoad(){
  if(TEAM.loading || !TEAM.key) return;
  TEAM.loading = true; TEAM.loadSince = Date.now(); TEAM.err = ""; render();
  swLoad();   // the switches don't need the roster — ask for both at once (they used to wait for it, +2 s)
  try{
    const out = await teamCall({action: "coachRoster"});
    if(out.ok){ TEAM.rows = out.reps; TEAM.coaches = out.coaches || []; TEAM.payPresets = out.payPresets || {}; }
    else if(out.error === "bad key"){
      TEAM.key = ""; localStorage.removeItem("sna_coach_key");
      TEAM.err = "That key wasn't right — ask Alan for the current one.";
    }
    else TEAM.err = out.error || "The roster feed said no.";
  }catch(e){ TEAM.err = "Couldn't reach the roster feed — check your connection and retry."; }
  TEAM.loading = false; render();
}

/* ── Automations switches — the private sheet's Settings tab, flippable here.
   Reads/writes via the coach-key-gated getSettings/setSetting doPost actions;
   every sender checks the sheet live, so a flip takes effect at the next send. ── */
async function swLoad(){
  TEAM.swErr = "";
  // /exec intermittently serves a Google error page instead of JSON (observed
  // ~1 in 5, 2026-08-24) — ride it out before bothering the coach with an error
  for(let attempt = 1; attempt <= 3; attempt++){
    try{
      const out = await teamCall({action: "getSettings"});
      if(out.ok){ TEAM.sw = out.switches; TEAM.swErr = ""; render(); return; }
      TEAM.swErr = out.error || "The switches feed said no.";
      break;                                   // a real server answer — don't retry
    }catch(e){
      TEAM.swErr = "Couldn't load the switches — retrying didn't help. It's usually temporary.";
      if(attempt < 3) await new Promise(r => setTimeout(r, attempt * 3000));
    }
  }
  render();
}
const SW_META = [
  {k:"texts",    name:"Check-in texts",      hint:"Tuesday nudge + Wednesday last-call + the one-time dashboard-link text to reps"},
  {k:"digest",   name:"Coach digest",        hint:"Wednesday evening who's-missing text to the coaches"},
  {k:"emails",   name:"Rep emails",          hint:"Assignment feedback + reminder emails, the monthly booking reminder, the onboarding assignments email"},
  {k:"replinks", name:"Rep dashboard links", hint:"Each mentee’s personal dashboard page — when OFF, they see an “almost ready” screen"},
  {k:"assignments", name:"Assignment reminders", hint:"Texts a mentee the day before an assignment is due, and once more if it goes late"}
];
/* Career sales arrive as onboarding free text ("125k", "True: $230,710",
   "1200000", "109K, true career = 36K"). Normalize to one clean format:
   prefer the number after "true" when present, expand k/m suffixes, and
   render as $1,234,567. Unparseable text falls back to the raw value. */
function fmtCareer(v){
  const s = String(v || "").trim();
  if(!s) return "";
  const grab = t => {
    const m = String(t).match(/\$?\s*(\d[\d,.]*)\s*([kKmM])?/);
    if(!m) return null;
    let n = parseFloat(m[1].replace(/,/g, ""));
    if(isNaN(n)) return null;
    if(m[2]) n *= /k/i.test(m[2]) ? 1e3 : 1e6;
    return n;
  };
  const tr = s.match(/true[^0-9$]*(.*)/i);
  const n = (tr ? grab(tr[1]) : null) ?? grab(s);
  return n == null ? "" : "$" + Math.round(n).toLocaleString("en-US");
}

/* which switches are off on one roster row. [] when everything is on, and
   when the sheet's script predates the switches (no Switches at all) */
function repSwOff(r){
  const s = r && r.Switches;
  return s ? REP_SW.filter(m => s[m.k] === false).map(m => m.k) : [];

   mentee is sent nothing either way, so they never show up here. */

    .map(r => ({name: r.Name, kinds: repSwOff(r).map(k => REP_SW.find(m => m.k === k).what)}));

/*PAY_BEGIN*/
/* What a mentee pays (2026-10-06). The private Contacts sheet holds one
   PayPlan cell per mentee and coachRoster hands it over as
   r.Pay = {kind, amount, text}, or null when nothing is set:
     monthly  a flat amount every month           "$300/mo"
     full     a flat amount paid once (the Dojo)  "$120 in full"
     pct      a percent of sales, amount = rate   "6% of sales" · "% of sales" with no rate
     other    a cell typed by hand that doesn't read as a plan: shown as typed
   A coach sets it on the row (setPayPlan, coach key). It is a record, not a
   switch: nothing bills or sends off it.
   The one-click presets are each program's prices, and they are NOT in this
   file: this page is public, so they come with the roster (coachRoster's
   payPresets, {Dojo:[{kind, amount}, …], Path:[…], Masters:[…]}) from the
   private script. Any other amount goes in by hand. */
const PAY_KINDS = [
  {k:"monthly", name:"$ a month"},
  {k:"full",    name:"$ in full"},
  {k:"pct",     name:"% of sales"}
];
/* 300 → "300" · 34.5 → "34.50" · 1250 → "1,250" */
function payMoney(n){
  const cents = Math.round(n * 100), frac = cents % 100;
  const whole = String(Math.floor(cents / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return frac ? whole + "." + String(frac).padStart(2, "0") : whole;
}
/* the words on the chip. A plan the hub can't read shows the cell's own words. */
function payLabel(p){
  if(!p) return "";
  if(p.kind === "monthly" && p.amount > 0) return "$" + payMoney(p.amount) + "/mo";
  if(p.kind === "full" && p.amount > 0) return "$" + payMoney(p.amount) + " in full";
  if(p.kind === "pct") return (p.amount > 0 ? String(Math.round(p.amount * 100) / 100) : "") + "% of sales";
  return String(p.text || "");
}
/* one program's presets out of what the roster sent; anything that isn't a plan is dropped */
function payPresets(all, program){
  const list = all && Array.isArray(all[program]) ? all[program] : [];
  return list.filter(p => p && PAY_KINDS.some(x => x.k === p.kind) && (p.amount > 0 || (p.kind === "pct" && p.amount == null)))
             .map(p => ({kind: p.kind, amount: p.amount == null ? null : p.amount}));
}
/* the same plan? lights the preset a mentee is already on */
function paySame(a, b){
  return !!a && !!b && a.kind === b.kind && (a.amount == null ? null : a.amount) === (b.amount == null ? null : b.amount);
}
/* what the editor opens on: the plan they have, else the kind of their program's first preset */
function payDraft(pay, presets){
  if(pay && PAY_KINDS.some(x => x.k === pay.kind)) return {kind: pay.kind, amount: pay.amount == null ? "" : String(pay.amount)};
  return {kind: ((presets || [])[0] || {kind:"monthly"}).kind, amount: ""};
}
/* the typed line → {kind, amount} to send, or {error} saying why not. A percent
   may be left without a rate; a flat plan needs its dollars. */
function payEntry(kind, raw){
  if(!PAY_KINDS.some(x => x.k === kind)) return {error: "Pick a plan first."};
  const s = String(raw == null ? "" : raw).replace(/[$,%\s]/g, "");
  if(!s) return kind === "pct" ? {kind, amount: null} : {error: "Type the amount."};
  if(!/^(\d+\.?\d*|\.\d+)$/.test(s)) return {error: "That isn't a number."};
  const n = Math.round(parseFloat(s) * 100) / 100;
  if(!(n > 0)) return {error: "It has to be above zero."};
  if(kind === "pct" && n > 100) return {error: "A percent can't be over 100."};
  if(kind !== "pct" && n > 100000) return {error: "That's too large to be right."};
  return {kind, amount: n};
}
/*PAY_END*/

        title="${odd ? "Typed in the sheet, and not a plan the hub can read. " : ""}What ${first} pays. Click to change it.">${busy ? "…" : esc(payLabel(r.Pay))}</button>`;

        `<button class="pay opt${paySame(p, r.Pay) ? " on" : ""}" data-payset="${id}" data-kind="${p.kind}" data-amount="${p.amount == null ? "" : p.amount}">${esc(payLabel(p))}</button>`).join("")}</div>` : ""}
      <div class="pay-row">
        <input class="search" id="payAmt" inputmode="decimal" autocomplete="off" placeholder="amount" value="${esc(ed.amount)}"
          aria-label="Amount for ${esc(r.Name)}" title="Any other amount: type it, pick what it is, Save">
        <select class="btn sm" id="payKind" aria-label="What that amount is">${PAY_KINDS.map(x =>
          `<option value="${x.k}"${ed.kind === x.k ? " selected" : ""}>${x.name}</option>`).join("")}</select>
        <button class="btn sm primary" data-paysave="${id}">Save</button>
      </div>
      ${ed.err ? `<div class="pay-err">${esc(ed.err)}</div>` : ""}
      <div class="pay-row pay-links">${r.Pay ? `<a href="#" data-payclear="${id}">clear</a>` : ""}<a href="#" data-paycancel="1">cancel</a></div>
    </div>`;
}

/* the sheet stores Joined as a real datetime, so the feed stringifies it long
   ("Tue Aug 18 2026 19:21:06 GMT-0700 ...") — render it as a date, not a log line */
function fmtJoined(v){

  const d = new Date(t);
  return isNaN(d) ? esc(t.slice(0,10))
                  : esc(d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}));

function coachNames(){

/* "Clear filters" under a board that a filter or the search has emptied: back to
   everything on that board. The calendar's year is where you are, not a filter. */
const FILTERS_OF = {
  calendar:{season:"all", presenter:"all", open:false}, bank:{tier:"all", open:false}, archive:{archCampaign:"all"},
  team:{teamProgs:[], teamCoaches:[]}, checkins:{ciProgs:[], ciCoaches:[]}, attend:{atProgs:[], atCoaches:[]},
  money:{moneyKind:"all", moneyWho:"all", moneyCat:""}
};
function clearFilters(board){

  for(const [k, v] of Object.entries(FILTERS_OF[board] || {})) UI[k] = Array.isArray(v) ? [] : v;
  UI.q = "";
}
const clearFiltersBtn = board => `<button class="btn" data-clearfilters="${board}">Clear filters</button>`;
/* Placeholder rows for a board that's still loading, in its shape: one entry per
   column — a width ("60%", "52px"), "sq" for a board square, or {w, two:true} for a
   cell with a second line, {w, chip:true} for a chip. They wait out the first 300 ms
   of the load (`since` is when it began), so a quick one never flashes them, and a
   render partway through doesn't hide them again. */
function skelTable(since, cols, label, rows = 7){
  const waited = Date.now() - (since || Date.now());
  const vary = [1, .78, .92, .66, .86, .72, .95, .8];
  const col = c => typeof c === "string" ? {w:c} : c;
  const squares = cols.some(c => col(c).w === "sq");
  const head = cols.map(c => col(c).w === "sq" ? `<th></th>` : `<th><i class="sk"></i></th>`).join("");
  let body = "";
  for(let r = 0; r < rows; r++){
    body += "<tr>" + cols.map(c => {
      const o = col(c);
      if(o.w === "sq") return `<td class="cc"><i class="sk sq"></i></td>`;
      const w = /%$/.test(o.w) ? Math.round(parseFloat(o.w) * vary[r % vary.length]) + "%" : o.w;
      return `<td><i class="sk${o.chip ? " chip" : ""}" style="width:${w}"></i>${o.two ? `<i class="sk" style="width:55%"></i>` : ""}</td>`;
    }).join("") + "</tr>";
  }
  return `<div class="tbl skel${waited < 300 ? " wait" : ""}" style="--skel-wait:${Math.max(0, 300 - waited)}ms" aria-busy="true">` +
    `<span class="vh" role="status">${esc(label)}</span>` +
    `<table class="grid sk-table${squares ? " aboard" : ""}" aria-hidden="true"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const SKEL_ROSTER = [{w:"66%", two:true}, {w:"58px", chip:true}, {w:"64px", chip:true}, "60%", {w:"80%", two:true}, "64%", "52px", {w:"70px", chip:true}, {w:"76px", two:true}, "60px"];
const SKEL_BOARD = (n, nameTwo) => [{w:"72%", two:!!nameTwo}].concat(Array(n).fill("sq"), ["40px"]);
const SKEL_LEDGER = ["64px", {w:"76%", two:true}, "52px", "44px", "72px"];
/* ── program / coach, normalised off the roster row ──
   The sheet's Program column is free text ("The Path", "Masters", …) and
   older rows only have Tier. One place decides which bucket a row is in. */
function programOf(r){
  const s = String(r.Program || r.Tier || "");
  return /dojo/i.test(s) ? "Dojo" : /master/i.test(s) ? "Masters" : /path/i.test(s) ? "Path" : "";
}
function coachOf(r){ return String(r.Coach || "").trim().split(" ")[0]; }
/* The Dojo doesn't get check-in calls, so nobody there is assigned a coach —
   that happens the day they graduate to The Path. Everyone else (Path,
   Masters, and anyone whose program is blank) is expected to have one. */
function needsCoach(r){ return programOf(r) !== "Dojo"; }

/* Program and coach filters are multi-select: an empty list means "everyone",
   two programs lit means "those two side by side". Coach "none" = unassigned. */
function passesFilters(r, progs, coaches){
  if(progs.length && !progs.includes(programOf(r))) return false;
  if(coaches.length){
    const c = coachOf(r);
    /* "Unassigned" means "needs a coach and hasn't got one" — a Dojo row
       without a coach is correct, not a gap, so it only shows under All */
    if(!(c ? coaches.includes(c) : coaches.includes("none") && needsCoach(r))) return false;
  }
  return true;
}
/* Split rows into labelled groups for the board. Coach order follows the
   coaches list (Alan, Ben, …), anyone else alphabetical, unassigned last. */
function groupRows(rows, mode){
  if(mode === "coach"){
    const known = coachNames();
    const dojo = rows.filter(r => !needsCoach(r)), rest = rows.filter(needsCoach);
    const names = [...new Set(rest.map(coachOf).filter(Boolean))]
      .sort((a, b) => (known.indexOf(a) + 1 || 99) - (known.indexOf(b) + 1 || 99) || a.localeCompare(b));
    const groups = names.map(n => ({label: n + "’s mentees", rows: rest.filter(r => coachOf(r) === n)}));
    groups.push({label: "Unassigned", rows: rest.filter(r => !coachOf(r))});
    groups.push({label: "The Dojo · no coach", rows: dojo});     // whatever the sheet says — the rule wins
    return groups.filter(g => g.rows.length);
  }
  if(mode === "program"){
    return ["Dojo", "Path", "Masters", ""].map(p => ({label: p ? "The " + p : "No program", rows: rows.filter(r => programOf(r) === p)}))
      .filter(g => g.rows.length);
  }
  return [{label: "", rows}];
}
function coachChip(r){
  const c = coachOf(r);
  return c ? `<span class="chip ${esc(c.toLowerCase())}">${esc(c)}</span>` : "";
}

function coachCellHtml(r){
  const coach = String(r.Coach || "").trim();
  if(!needsCoach(r)){
    /* no picker to feel guilty about. A name still on the sheet from before
       the rule (or from someone who moved down) stays visible, with a way out. */
    return `<span class="nocoach" title="The Dojo doesn't get check-in calls — a coach is assigned the day they graduate to The Path">Dojo · no coach</span>${
      coach ? ` <span class="chip stale" title="Still on the sheet — clear it, or leave it until they graduate">${esc(coach.split(" ")[0])}</span>
      <a href="#" class="no-print no-export" data-coachclear="${esc(r.RepID)}" style="font-size:12px;color:var(--ink-faint)">clear</a>` : ""}`;
  }
  return `<select class="btn sm" data-coach="${esc(r.RepID)}" style="padding:3px 6px">
      <option value=""${coach ? "" : " selected"}>—</option>
      ${coachNames().map(n => `<option value="${esc(n)}"${coach.split(" ")[0] === n ? " selected" : ""}>${esc(n)}</option>`).join("")}
    </select>`;
}
function teamRowHtml(r){

/* ═══════════════════════════════════════════════════════════════════════════
   TAB — WEEKLY CHECK-INS (Mentees ▸ Weekly Check-ins)

   One square per mentee per week. The marks live in DATA.checkins — the
   shared hub data, synced like the calendar — keyed campaign → RepID → week,
   so every campaign starts from a clean board and the old ones stay readable
   from the picker. Only The Path and The Masters get check-in calls, so The
   Dojo isn't on this board at all. Names still come from the private roster
   behind the coach key; the shared blob only ever holds RepIDs and colours.
   ═══════════════════════════════════════════════════════════════════════════ */
const CI_STATES = {
  yes:  {label:"Check-in call",      hint:"Green · we called and talked",                      glyph:"✓"},
  one:  {label:"1-1 call",           hint:"Purple · had a one-on-one, so no check-in needed",  glyph:"1"},
  text: {label:"Voice note / texts", hint:"Blue · back-and-forth by voice note or text",       glyph:"✉"},
  no:   {label:"Missed",             hint:"Red · no check-in that week",                       glyph:"✕"},
  off:  {label:"Not needed",         hint:"Black · vacation, out of town, another reason",     glyph:"–"}
};
const CI_ORDER = ["yes", "one", "text", "no", "off"];
const CI_DONE  = new Set(["yes", "one", "text"]);      // all three count as "checked in"

/* ── weeks are Vector weeks: Tuesday through Monday. A week is keyed by its
   Tuesday and belongs to the campaign its Friday (the week's middle day)
   falls in, so the week straddling a campaign boundary lands on exactly one
   board. Fall 2026 therefore opens with Wk 1 = 9/1–9/7, and a campaign whose
   1st lands late in a week starts the following Tuesday. ── */
const isoOf = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
function weekStartOf(d){                      // the Tuesday on or before d
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 5) % 7));
  return x;
}
function campaignLabelOf(d){ const m = d.getMonth(); return (m <= 3 ? "Spring" : m <= 7 ? "Summer" : "Fall") + " " + d.getFullYear(); }
function weekCampaign(tueISO){ const t = parseDate(tueISO); t.setDate(t.getDate() + 3); return campaignLabelOf(t); }
function campaignWeeks(label){
  const [season, y] = String(label).split(" ");
  const first = {Spring:0, Summer:4, Fall:8}[season], yr = Number(y);
  if(first === undefined || !yr) return [];
  const d = weekStartOf(new Date(yr, first, 1));
  if(weekCampaign(isoOf(d)) !== label) d.setDate(d.getDate() + 7);   // that week belongs to the campaign before
  const out = [];
  while(weekCampaign(isoOf(d)) === label){ out.push(isoOf(d)); d.setDate(d.getDate() + 7); }
  return out;
}
const thisWeekStart = () => isoOf(weekStartOf(new Date()));
const thisCampaign  = () => weekCampaign(thisWeekStart());
/* "9/1–9/7" — the way the campaign calendar is read out loud */
const fmtMD = d => (d.getMonth() + 1) + "/" + d.getDate();
function weekRange(tueISO){ const a = parseDate(tueISO), b = new Date(a); b.setDate(b.getDate() + 6); return fmtMD(a) + "–" + fmtMD(b); }
function weekLabel(camp, tueISO){ const i = campaignWeeks(camp).indexOf(tueISO); return (i < 0 ? "Week" : "Wk " + (i + 1)) + " · " + weekRange(tueISO); }

/* ── Vector months aren't calendar months. Each month of a campaign is four
   weeks and the campaign's last month takes whatever is left, so Fall 2026
   runs Sep · Wk 1–4, Oct · Wk 5–8, Nov · Wk 9–12, Dec · Wk 13–17 — even
   though Wk 13 starts on 11/24. MONTH_SPLIT is the one place to change that
   if the Vector calendar ever counts an 18-week campaign differently. ── */
const SEASON_MONTHS = {Spring:["January","February","March","April"], Summer:["May","June","July","August"], Fall:["September","October","November","December"]};
const MONTH_SPLIT = {17:[4,4,4,5], 18:[4,4,4,6]};
function campaignMonths(label){
  const weeks = campaignWeeks(label), names = SEASON_MONTHS[String(label).split(" ")[0]] || [];
  const split = MONTH_SPLIT[weeks.length] || [4, 4, 4, weeks.length - 12];
  const out = []; let at = 0;
  names.forEach((name, m) => {
    const n = m === names.length - 1 ? weeks.length - at : Math.max(0, split[m]);
    out.push({name, short: name.slice(0, 3), from: at + 1, to: at + n, weeks: weeks.slice(at, at + n)});
    at += n;
  });
  return out.filter(m => m.weeks.length);
}
/* week → {month, first-of-month, odd/even} lookup for the board */
function monthIndex(camp){
  const idx = {};
  campaignMonths(camp).forEach((m, i) => m.weeks.forEach((w, j) => { idx[w] = {m, i, first: j === 0}; }));
  return idx;
}

/* campaigns worth showing: the current one, plus any that have marks */
function ciCampaigns(){
  const set = new Set([thisCampaign(), ...Object.keys(DATA.checkins || {})]);
  return [...set].filter(c => campaignWeeks(c).length).sort((a, b) => campKeyHub(b) - campKeyHub(a));
}
function ciEligible(){
  return (TEAM.rows || []).filter(r => r.Active && (programOf(r) === "Path" || programOf(r) === "Masters"));
}
function getCheckin(camp, rep, week){
  const c = (DATA.checkins || {})[camp];
  return (c && c[rep] && c[rep][week]) || "";
}
function applyCheckin(camp, rep, week, state){
  if(!DATA.checkins) DATA.checkins = {};
  const c = DATA.checkins[camp] || (DATA.checkins[camp] = {});
  const p = c[rep] || (c[rep] = {});
  if(state) p[week] = state; else delete p[week];
  if(!Object.keys(p).length) delete c[rep];
  if(!Object.keys(c).length) delete DATA.checkins[camp];
}
function setCheckin(camp, rep, week, state){
  applyCheckin(camp, rep, week, state);
  CI_JOURNAL.push({camp, rep, week, state});   // replayed if the save collides with the other coach's
  save("checkin");
}
/* one journaled mark, put back on top of the other coach's copy — a check-in
   square, or a change to a call's roll (Call Attendance) */
function replayMark(j){
  if(j.roll) applyRoll(j); else applyCheckin(j.camp, j.rep, j.week, j.state);
}
/* this week, everyone eligible, no filters — feeds the tab-bar count */
function ciWeekTally(){
  const mon = thisWeekStart(), camp = thisCampaign();
  let open = 0, done = 0;
  const rows = ciEligible();
  for(const r of rows){ const s = getCheckin(camp, r.RepID, mon); if(CI_DONE.has(s)) done++; else if(!s) open++; }
  return {total: rows.length, open, done};
}

function renderCheckins(){
  let html = `
  <div class="page-head no-export no-print">
    <div>
      <div class="eyebrow">Week by week</div>

    </div>
  </div>`;

  const gate = teamGateHtml(html, SKEL_BOARD(9, true));
  if(gate) return gate;

  const todayMon = thisWeekStart(), nowCamp = thisCampaign();
  const camps = ciCampaigns();
  if(!camps.includes(UI.ciCampaign)) UI.ciCampaign = nowCamp;
  const camp = UI.ciCampaign, isNow = camp === nowCamp;
  const weeks = campaignWeeks(camp);
  const q = UI.q.toLowerCase();

  const eligible = ciEligible().sort((a, b) => a.Name.localeCompare(b.Name));
  const rows = eligible.filter(r => passesFilters(r, UI.ciProgs, UI.ciCoaches));
  const visible = rows.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
  const groups = groupRows(visible, UI.ciGroup);

  /* tallies over what's on screen. A past week left blank counts against
     coverage — it's a check-in nobody recorded, which is the thing to notice. */
  const elapsed = weeks.filter(w => w <= todayMon);
  let done = 0, missed = 0, open = 0, wkDone = 0, wkOpen = 0;
  for(const r of visible){
    for(const w of elapsed){
      const s = getCheckin(camp, r.RepID, w);

    }
    if(isNow){ const s = getCheckin(camp, r.RepID, todayMon); if(CI_DONE.has(s)) wkDone++; else if(!s) wkOpen++; }
  }

  const pct = needed ? Math.round(done / needed * 100) : 0;
  const nPath = visible.filter(r => programOf(r) === "Path").length, nMasters = visible.length - nPath;

  html += toolbar(`
    <div class="tb-filters">
      <select class="btn sm" data-cicamp title="Which campaign's board" style="padding:5px 8px">${camps.map(x => `<option${x === camp ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>
      ${fgroup("Program", mseg("ciProgs", [{v:"",l:"All"},{v:"Path",l:"Path"},{v:"Masters",l:"Masters"}], UI.ciProgs))}

    </div>`);

  html += `<div id="ciBoard" class="export-frame">`;
  html += printHead("Weekly Check-ins · " + camp, `${visible.length} mentees · printed ${fmtFull(todayISO())}`);
  html += `<div class="stats">
    ${isNow ? statBox("This week", wkDone + "/" + visible.length, "checked in so far · " + weekLabel(camp, todayMon))
            : statBox("Campaign", camp, weeks.length + " weeks")}
    ${isNow ? statBox("Still open this week", wkOpen, wkOpen ? "no mark yet" : "everyone's marked", wkOpen > 0)
            : statBox("Checked in", done, "green, purple or blue")}
    ${statBox("Missed", missed, missed ? "red squares this campaign" : "none so far", missed > 0)}
    ${statBox("Coverage", pct + "%", `${done} of ${needed} weeks that needed one`)}
    ${statBox("On the board", visible.length, `${nPath} Path · ${nMasters} Masters`)}
  </div>`;

  if(!eligible.length) html += emptyState("No one to check in with", "Nobody on The Path or The Masters is active right now. The board fills in the moment someone is.");
  else if(!visible.length) html += emptyState("Nothing matches", "No mentee fits these filters and the search.", clearFiltersBtn("checkins"));
  else{
    const months = campaignMonths(camp), mIdx = monthIndex(camp);
    const mcls = w => { const x = mIdx[w] || {}; return (x.first ? " mstart" : "") + (x.i % 2 ? " m1" : ""); };
    html += `<div class="tbl citbl"><table class="grid ciboard"><thead>
      <tr class="mrow"><th class="mentee" rowspan="2">Mentee</th>${months.map((m, i) =>
        `<th class="mb mstart${i % 2 ? " m1" : ""}" colspan="${m.weeks.length}" title="${esc(m.name)} on the Vector calendar · Wk ${m.from}–${m.to} · ${weekRange(m.weeks[0]).split("–")[0]} – ${weekRange(m.weeks[m.weeks.length - 1]).split("–")[1]}">${esc(m.name)} <small>Wk ${m.from}–${m.to}</small></th>`).join("")}<th class="tt" rowspan="2"></th></tr>
      <tr>${weeks.map((w, i) => {
      const d = parseDate(w), e = new Date(d); e.setDate(e.getDate() + 6);

    }
    html += `</tbody></table></div><div class="ci-scroll no-print no-export" id="ciScroll"></div>`;
    html += `<div class="cilegend">${CI_ORDER.map(k => `<span><i class="ci ${k}">${CI_STATES[k].glyph}</i> ${CI_STATES[k].label}</span>`).join("")}<span><i class="ci blank due"></i> not marked yet</span></div>`;
  }
  html += `</div>`;
  return html;
}

/* ── the pick-a-colour popover. Lives outside #view so a background sync
   render can't wipe it mid-click.
   From the keyboard it works like a menu (see openMenu): Enter or Space on a square
   opens it with the focus on what the square is marked (or the first option); Up /
   Down / Home / End move, Enter or Space picks one, and Escape or Tab closes it.
   Each of those puts the focus back on the square, so Tab never leaves it open on
   the square before. A click opens it and leaves the focus where it was. ── */
const ciKey = o => [o.camp, o.rep, o.week].join("|");
const ciSquare = key => [...document.querySelectorAll("#view button[data-ci]")].find(b => b.dataset.ci === key);
const ciOpts = () => [...$("#ciPop").querySelectorAll(".cp-opt")];
function openCiPop(btn, fromKeys){
  const [camp, rep, week] = btn.dataset.ci.split("|");
  const row = (TEAM.rows || []).find(r => r.RepID === rep);
  if(!row) return;
  if(CI_OPEN){ const was = ciSquare(ciKey(CI_OPEN)); if(was) was.setAttribute("aria-expanded", "false"); }
  CI_OPEN = {camp, rep, week};
  const cur = getCheckin(camp, rep, week);
  const pop = $("#ciPop");
  pop.setAttribute("aria-label", `${row.Name} · ${weekLabel(camp, week)} · mark the check-in`);
  pop.innerHTML = `<div class="cp-head"><b>${esc(row.Name)}</b>${esc(weekLabel(camp, week))} · ${esc(camp)}</div>` +
    CI_ORDER.map(k => `<button class="cp-opt${cur === k ? " on" : ""}" data-cistate="${k}" tabindex="-1"${cur === k ? ' aria-current="true"' : ""}><i class="ci ${k}" aria-hidden="true">${CI_STATES[k].glyph}</i><span>${CI_STATES[k].label}<small>${CI_STATES[k].hint}</small></span></button>`).join("") +
    `<button class="cp-opt" data-cistate="" tabindex="-1"><i class="ci blank" aria-hidden="true"></i><span>Clear<small>back to not marked</small></span></button>`;
  pop.classList.remove("hidden");
  const r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;

/* refocus: put the focus back on the square. By default it does whenever the popover

   once any render has rebuilt it, unless something else has taken the focus by then. */
function closeCiPop(refocus = $("#ciPop").contains(document.activeElement)){

  const vis = ths.filter(t => { const r = t.getBoundingClientRect(); return r.left >= box.left + nameW - 2 && r.right <= box.right + 2; });
  if(!vis.length || vis.length === ths.length){ cap.textContent = ""; return; }

const ASSIGN={rows:null,loading:false,err:"",loadedAt:0,campaign:"",open:null,showArchived:false,editing:null,busy:false};
function currentCampaignLabel(){const d=new Date(),m=d.getMonth();return (m<=3?"Spring":m<=7?"Summer":"Fall")+" "+d.getFullYear();}
const campKeyHub=c=>{const a=String(c).split(" ");return (+a[1]||0)*3+({Spring:0,Summer:1,Fall:2}[a[0]]??0);};
async function assignLoad(force){
  if(ASSIGN.loading||!TEAM.key)return;
  if(!force&&ASSIGN.rows&&Date.now()-ASSIGN.loadedAt<60000)return;
  ASSIGN.loading=true;ASSIGN.loadSince=Date.now();ASSIGN.err="";render();
  for(let attempt=1;attempt<=3;attempt++){
    try{
      const out=await teamCall({action:"assignmentBoard"});
      if(out.ok){ASSIGN.rows=out;ASSIGN.loadedAt=Date.now();if(!ASSIGN.campaign)ASSIGN.campaign=currentCampaignLabel();break;}
      if(out.error==="bad key"){TEAM.key="";localStorage.removeItem("sna_coach_key");TEAM.err="That key wasn't right — ask Alan for the current one.";break;}

function assignCampaigns(){const set=new Set([currentCampaignLabel()]);(ASSIGN.rows?ASSIGN.rows.assignments:[]).forEach(a=>{if(a.Campaign)set.add(String(a.Campaign).trim());});return [...set].sort((a,b)=>campKeyHub(b)-campKeyHub(a));}

/* Former mentees drop off the board and out of every count above it. The roster

const isActiveFlag=v=>v!==false&&!/^(n|no|false|0)$/i.test(String(v==null?"":v).trim());

/* Only the Dojo is required to turn assignments in. So on this board only a Dojo

const ASSIGN_REQUIRED="Dojo";

/* the browser scrolls a square the keyboard lands on into view only when none of it is inside

/* ═══════════════════════════════════════════════════════════════════════════
   TAB — CALL ATTENDANCE (Mentees ▸ Call Attendance · coach-key gated)

   A roll for every group call. Tick who's on; once the roll is in, anyone the
   call was for who isn't ticked has missed it. Excused only means the absence
   isn't held against them: they still owe the replay. A replay never counts
   as being on the call.

   A call is for its own program: a T1 topic is for The Dojo, T2 for The Path,
   T3 for The Masters, and an untagged topic (a hot seat, say) for everyone.
   Someone from another program who joins is a drop-in and never owes a
   replay. The roll can set it for one call.

   The roll lives in DATA.attendance, keyed by the call's cid: RepIDs and marks
   only, like the check-in board. Names come from the private roster.

   A missed call becomes a make-up: one catalog assignment per call ("Replay ·
   topic · date", due the Friday after the call at midnight) that everyone in
   its programs who doesn't owe it has marked not applicable. So it lands only
   on the dashboards of the people who missed, with the Assignments tab's
   reminder texts and review drawer, and asks nothing new of the check-in
   script. Make-ups stay off the Assignments board; they're read here.
   ═══════════════════════════════════════════════════════════════════════════ */

/*ATTEND_MATH_BEGIN*/
/* The rules, free of the page so tests/attend-math.test.js can run them under
   node. Leans on the ASSIGN_STATE block (tierRank, tierName, assignPrograms,
   dueISO); the test loads the two together. */
/* who a call is for: "all", or one program. Its topic's tier sets it — T1 The
   Dojo, T2 The Path, T3 The Masters, untagged everyone — so a Masters mentee
   never owes the replay of a Path call. */
const AT_FOR = {all:"Everyone", Dojo:"Dojo", Path:"Path", Masters:"Masters"};
const AT_FOR_CHIP = {all:"t0", Dojo:"t1", Path:"t2", Masters:"t3"};
function atForOf(tier){ return {1:"Dojo", 2:"Path", 3:"Masters"}[Number(tier)] || "all"; }
function atExpects(forWhom, program){ return !AT_FOR[forWhom] || forWhom === "all" || tierName(program) === forWhom; }
const atForName = f => f === "all" || !AT_FOR[f] ? "everyone" : "The " + f;
/* a replay is due the Friday after the call, at midnight: a Tuesday call's is
   that Friday, a Friday call's the Friday after */
function atDueFriday(iso){
  const [y, m, d] = String(iso).split("-").map(Number), t = new Date(y, m - 1, d);
  t.setDate(t.getDate() + ((12 - t.getDay()) % 7 || 7));
  return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
}
/* on the call · excused · not marked, over the people the call was for; plus
   drop-ins (on it without being expected) and guests */
function atCount(roll){
  const exp = new Set((roll && roll.expected) || []), marks = (roll && roll.marks) || {};
  const c = {expected:exp.size, on:0, excused:0, unmarked:0, drop:0, guests:Number((roll && roll.guests) || 0)};
  for(const id of exp){ const m = marks[id]; if(m === "on") c.on++; else if(m === "x") c.excused++; else c.unmarked++; }
  for(const id of Object.keys(marks)) if(marks[id] === "on" && !exp.has(id)) c.drop++;
  return c;
}
/* who owes the replay: everyone the call was for who wasn't on it, excused
   included — once the roll is in, and never for a call marked "no roll" */
function atOwes(roll){
  if(!roll || !roll.done || roll.skip) return [];
  const marks = roll.marks || {};
  return (roll.expected || []).filter(id => marks[id] !== "on");
}
const atSame = (a, b) => String(a == null ? "" : a).replace(/\s+/g, " ").trim() === String(b == null ? "" : b).replace(/\s+/g, " ").trim();
const atLive = a => String(a.Active == null || a.Active === "" ? "Y" : a.Active).trim().toUpperCase() !== "N";
/* a mentee still on the program: the sheet writes Y/N, the roster true/false */
const atOn = r => !!r && r.Active !== false && !/^(n|no|false|0)$/i.test(String(r.Active == null ? "" : r.Active).trim());
/* What it takes for a call's make-up to match its roll. `a` is the catalog row
   (null until there is one), `want` how it should read. Its programs are the
   owers' programs, and everyone else in those programs gets a "not applicable"
   override: `ops` says whose to set, or to lift for someone who owes it after
   all. `create` / `save` / `archive` are what the row itself needs. Run ops
   before save, so a program is never added to a live row while people in it
   who don't owe the replay could still see it. */
function atPlan(owe, reps, a, overrides, want){
  const oweSet = new Set((owe || []).map(String));
  const live = (reps || []).filter(atOn);
  const owers = live.filter(r => oweSet.has(String(r.RepID)));
  if(!owers.length) return {create:false, archive:!!a && atLive(a), ops:[], save:null, programs:[]};
  const programs = [...new Set(owers.map(r => tierName(r.Tier)))].sort((x, y) => tierRank(x) - tierRank(y));
  const id = a ? String(a.AssignmentID) : "";
  /* first match wins, the way assignState reads overrides */

const AT = {open:null, url:null, q:"", busy:false, note:"", err:"", pending:null, tidied:0};
const AT_MU = {open:{g:"", t:"replay owed", c:""}, late:{g:"!", t:"replay overdue", c:"note"}, waiting:{g:"●", t:"takeaways in · waiting on you", c:"track"},

function applyRoll(j){

  if(!roll.marks) roll.marks = {};

/* every call on the calendar: its cid, night, topic, type and host */
function atCalls(){
  ensureCids(DATA);
  const out = [];
  DATA.calendar.forEach(r => {
    if(isBlocked(r) || isOff(r)) return;
    if(isPlanned(r)) out.push({cid:r.cid, date:r.date, topic:r.topic, type:r.callType || "group", presenter:r.presenter, time:r.time || callTime(), j:-1});
    (r.extra || []).forEach((x, j) => { if(isLiveCall(x))
      out.push({cid:x.cid, date:callDateOf(r, x), topic:x.topic || x.speaker, type:x.type || "group", presenter:x.presenter, time:x.time, j}); });
  });

}
const atCampOf = iso => weekCampaign(isoOf(weekStartOf(parseDate(iso))));
function atCallFor(c){ const roll = rollOf(c.cid); return roll && AT_FOR[roll.for] ? roll.for : atForOf(tierOf(c.topic)); }

function atIsFor(c, rep){

function atMakeupRow(roll){

/* make-ups stay off the Assignments board — they're read and approved here */
function atIsMakeup(a){

function atCampaigns(){

function atToTake(camp){
