/* Copy what's typed in the drawer back into MONEY.form before anything redraws it. */
function moneyHarvest(){
  const f = MONEY.form;
  if(!f) return;
  const val = id => { const el = document.getElementById(id); return el ? el.value : null; };
  if(f.mode === "splits" || f.mode === "buyout"){
    for(const [id, key] of [["mfFrom", "from"], ["mfSplitPct", "benPct"], ["mfBuyAt", "at"], ["mfSlice", "slicePct"], ["mfMult", "multiple"], ["mfOpens", "opensWith"]]){
      const v = val(id); if(v !== null) f[key] = v;
    }
    return;
  }
  const date = $("#mfDate"); if(date) f.date = date.dataset.iso || "";
  const camp = val("mfCamp"); if(camp !== null) f.campaign = camp;
  const party = val("mfParty");
  if(party !== null){
    if(party.startsWith("rep:")){
      const r = moneyRoster().find(x => x.repId === party.slice(4));
      Object.assign(f, {partyOther:false, repId:r ? r.repId : "", party:r ? r.name : ""});
    } else if(party.startsWith("name:")){
      Object.assign(f, {partyOther:false, repId:"", party:party.slice(5)});
    } else if(party === "other:"){
      if(!f.partyOther) f.party = "";
      Object.assign(f, {partyOther:true, repId:""});
      const other = val("mfPartyOther"); if(other !== null) f.party = other;
    } else Object.assign(f, {partyOther:false, repId:"", party:""});
  }
  const what = val("mfWhat"); if(what !== null) f.party = what;
  const cat = val("mfCat");
  if(cat !== null){
    if(cat === "__new"){ if(!f.catNew) f.category = ""; f.catNew = true; const typed = val("mfCatNew"); if(typed !== null) f.category = typed; }
    else Object.assign(f, {catNew:false, category:cat});
  }
  for(const [id, key] of [["mfBase", "base"], ["mfRate", "rate"], ["mfAmount", "amount"], ["mfNote", "note"]]){
    const v = val(id); if(v !== null) f[key] = v;
  }
  const share = val("mfBenPct"); if(share !== null && f.splitCustom) f.benPct = share;
}
function moneyEntryOf(f){
  const e = {id:f.id, kind:f.kind, date:f.date, campaign:f.campaign, who:f.who, note:String(f.note).trim(),
             status:f.entry ? f.entry.status : "live"};    // so a save can't quietly land on an entry the other person voided
  if(f.kind === "settle"){ e.to = f.who === "Alan" ? "Ben" : f.who === "Ben" ? "Alan" : ""; e.amount = f.amount; return e; }
  e.party = String(f.party).trim(); e.benPct = f.benPct;
  if(f.kind === "expense"){ e.category = String(f.category).trim(); e.amount = f.amount; return e; }
  e.repId = f.repId; e.plan = f.plan;
  if(f.plan === "pct"){
    e.base = f.base; e.rate = String(f.rate).replace(/%/g, "").trim();
    const c = mPctCents(mCents(mNum(e.base)) / 100, mNum(e.rate));
    e.amount = isFinite(c) ? (c / 100).toFixed(2) : "";           // shown in the conflict dialog; the script works it out itself
  } else e.amount = f.amount;
  return e;
}
function moneyApplyLastPlan(){
  const f = MONEY.form, last = mLastPlan(MONEY.entries || [], f.party, f.repId);
  if(!last) return;
  f.plan = last.plan;
  if(last.rate != null && (!f.rate || f.autoRate)) Object.assign(f, {rate:String(last.rate), autoRate:true});
  if(last.amount != null && (!f.amount || f.autoAmount)) Object.assign(f, {amount:String(last.amount), autoAmount:true});
}

/* ── writes ── */
/* A write is retried once when its reply goes missing: a create carries its own
   ID and the script recognises content it already holds, so a retry can't
   double an entry. Nothing here shows anything as saved; the caller does, and
   only on ok. */
async function moneyWrite(body){
  MONEY.epoch++;
  try{
    for(let attempt = 1; attempt <= 2; attempt++){
      try{ return await moneyCall(body); }
      catch(e){
        if(attempt === 2){ console.error("Money: " + body.action + " got no reply", e); return {ok:false, error:"network"}; }
        await new Promise(r => setTimeout(r, 2500));
      }
    }
  } finally { MONEY.epoch++; }
}
function moneyMerge(e){
  if(!MONEY.entries || !e) return;
  const i = MONEY.entries.findIndex(x => x.id === e.id);
  if(i < 0) MONEY.entries.push(e); else MONEY.entries[i] = e;
}
/* A filter or another campaign hiding what you just saved would read as it not having saved. */
function moneyReveal(e){
  const view = moneyViewCampaign();
  if(view !== "all" && view !== e.campaign) MONEY.campaign = e.campaign;
  if(UI.moneyKind !== "all" && UI.moneyKind !== e.kind) UI.moneyKind = "all";
  if(UI.moneyWho !== "all" && e.who !== UI.moneyWho && e.to !== UI.moneyWho) UI.moneyWho = "all";
  if(UI.moneyCat && e.category !== UI.moneyCat) UI.moneyCat = "";
  UI.q = "";
}
/* A lost reply doesn't mean the sheet didn't take it — it may have, so don't
   claim "nothing was saved". Sending again is safe: it can't go in twice. */
function moneyWhy(out, nothing, again){
  if(out.error === "network") return `Couldn't reach the sheet, so this may not have gone through. ${again} — it can't go in twice.`;
  if(out.error === "bad key" || out.error === "key not set") return `The sheet refused the key. ${nothing}. Close this and press Refresh to see why.`;
  if(out.error === "unknown action") return `${MONEY_OLD_SCRIPT} ${nothing}.`;
  return `The sheet said no: ${out.error || "no reason given"}. ${nothing}.`;
}

async function moneySave(){
  const f = MONEY.form;
  if(!f || MONEY.busy) return;
  moneyHarvest();
  if(f.receiptBusy){ MONEY.formErr = "One moment — the receipt is still attaching."; paintMoneyForm(); return; }
  const by = moneySigner();
  if(!by){ MONEY.formErr = "The hub doesn't know who you are — type Alan or Ben when it asks, so the entry is signed."; paintMoneyForm(); return; }
  const entry = moneyEntryOf(f), problem = mCheck(entry);
  if(problem){ MONEY.formErr = problem; paintMoneyForm(); return; }
  const body = {action:"save", by, entry, rev:f.rev || 0};
  if(f.receipt) body.receipt = {name:f.receipt.name, mime:f.receipt.mime, b64:f.receipt.b64};
  else if(f.removeReceipt) body.removeReceipt = true;
  MONEY.busy = true; MONEY.busyAct = {act:"save"}; MONEY.formErr = ""; paintMoneyForm();
  const out = await moneyWrite(body);
  MONEY.busy = false;
  if(out.ok){
    moneyMerge(out.entry); moneyReveal(out.entry); moneyCloseForm();
    if(out.warning) MONEY.warn = out.warning;
    render();
    toast(out.warning || (f.mode === "new" ? `Saved to the sheet ✓ ${MONEY_NOUN[out.entry.kind]} ${mFmt(mCents(out.entry.amount))}` : "Changes saved to the sheet ✓"));
    return;
  }
  if(TAB !== "money") toast("Money: that save didn't go through.", {err:true, retryLabel:"Open Money", retry:() => goTab("money")});
  if(out.conflict && out.entry) return moneyConflict(f, out.entry, entry);
  if(out.error === "network") f.uncertain = true;
  MONEY.formErr = moneyWhy(out, "Nothing was saved", "Press Save again");
  paintMoneyForm();
}
function moneyConflict(f, theirs, mine){
  moneyMerge(theirs); render();
  const who = theirs.updatedBy || "The other person";
  const keep = confirm(`${who} changed this entry ${ago(theirs.updatedAt)}, after you opened it.\n\n` +
    `Theirs:  ${mEntryLine(theirs)}\nYours:   ${mEntryLine(Object.assign({}, theirs, mine))}\n\n` +
    `OK saves yours over theirs. Cancel keeps theirs and closes this.` +
    (theirs.status === "void" && mine.status !== "void" ? `\n\n(${who} voided it — saving yours keeps it void; Restore brings it back.)` : ""));
  if(keep){ f.rev = theirs.rev; f.entry = theirs; paintMoneyForm(); return moneySave(); }
  moneyCloseForm(); toast(`Kept ${who}'s version`);
}
async function moneySetStatus(action){
  const f = MONEY.form;
  if(!f || !f.entry || MONEY.busy) return;
  const e = f.entry;
  if(action === "void" && !confirm(`Void this ${mFmt(mCents(e.amount))} ${MONEY_NOUN[e.kind]}? It stays in the list, crossed out, and stops counting. You can restore it.`)){
    toast("Left as it was — nothing voided"); return;
  }
  const by = moneySigner();
  if(!by){ MONEY.formErr = "The hub doesn't know who you are — type Alan or Ben when it asks."; paintMoneyForm(); return; }
  MONEY.busy = true; MONEY.busyAct = {act:action}; MONEY.formErr = ""; paintMoneyForm();
  const out = await moneyWrite({action, by, id:e.id, rev:e.rev});
  MONEY.busy = false;
  if(out.ok){
    moneyMerge(out.entry); moneyCloseForm();
    if(out.warning) MONEY.warn = out.warning;
    render();
    toast(out.warning || (action === "void" ? "Voided — it no longer counts" + (UI.moneyVoid ? "" : " (Show voided to see it)") : "Restored — it counts again"));
    return;
  }
  if(out.conflict && out.entry){
    moneyMerge(out.entry); render();
    MONEY.form = moneyEditForm(out.entry);
    MONEY.formErr = `${out.entry.updatedBy || "Someone"} changed this entry first — this is their version now. ${action === "void" ? "Void" : "Restore"} it again if you still mean to.`;
    paintMoneyForm();
    return;
  }
  if(out.error === "network") f.uncertain = true;
  MONEY.formErr = moneyWhy(out, "Nothing changed", `Press ${action === "void" ? "Void" : "Restore"} again`);
  paintMoneyForm();
}

/* ── splits: where new entries start, campaign by campaign ──
   One row per change on the sheet's Splits tab: "from this campaign on, Ben's
   share is X%", income and expenses alike. It only sets where a new entry
   starts — every entry keeps the split it was saved with, so a change never
   rewrites an entry or a campaign already settled. */
const MONEY_OLD_SCRIPT = "The SNA Money script on Google is older than this page, so it can't do this yet. Alan: paste the new " +
  "SNA-Money.gs into the SNA Money project, then Deploy ▸ Manage deployments ▸ edit ▸ New version, and press Refresh here.";
function moneySplitsForm(){
  const view = moneyViewCampaign(), from = view === "all" ? mCampaignOf(todayISO()) : view;
  return {mode:"splits", from, benPct:String(moneySplit(from)), typed:false};
}
function moneyPctIn(v){ const n = mNum(String(v === null || v === undefined ? "" : v).replace(/%/g, "")); return n === null || isNaN(n) ? null : Math.round(n * 100) / 100; }
/* "Alan gets 37.5%", as the box reads right now */
function moneyAlanLine(f){
  const b = moneyPctIn(f.benPct);
  return b === null || b < 0 || b > 100 ? "" : `Alan gets ${Math.round((100 - b) * 100) / 100}%`;
}
/* Entries this change would cover that were saved with another split. They keep it; say so before anyone wonders. */
function moneySplitKeepLine(f){
  const b = moneyPctIn(f.benPct);
  if(b === null || !M_CAMPAIGN_RE.test(f.from)) return "";
  const differ = (MONEY.entries || []).filter(e => e.status !== "void" && e.kind !== "settle" && mSplitCovers(MONEY.splits, f.from, e.campaign) &&
    Number(e.benPct) !== b);
  if(!differ.length) return "";
  const camps = [...new Set(differ.map(e => e.campaign))].sort((x, y) => mCampaignKey(x) - mCampaignKey(y));
  const where = camps.length === 1 ? camps[0] : camps.slice(0, -1).join(", ") + " and " + camps[camps.length - 1];
  return `${differ.length} entr${differ.length === 1 ? "y" : "ies"} already in ${where} ${differ.length === 1 ? "was" : "were"} saved with another split and ` +
    `${differ.length === 1 ? "keeps it" : "keep theirs"}. This only changes where new entries start — open an entry to change its own.`;
}
function paintMoneySplits(f, d){
  const dis = MONEY.busy ? " disabled" : "", splits = MONEY.splits || [], old = MONEY.splits === null;
  const nowCamp = mCampaignOf(todayISO()), nowAt = mSplitFor(splits, nowCamp);
  const camps = new Set(splits.map(x => x.from).concat(moneyCampaigns(), [f.from])), now = mCampaignKey(nowCamp);
  for(let k = now - 3; k <= now + 6; k++) camps.add(["Spring", "Summer", "Fall"][k % 3] + " " + Math.floor(k / 3));
  const fromOpts = [...camps].filter(c => M_CAMPAIGN_RE.test(c)).sort((a, b) => mCampaignKey(a) - mCampaignKey(b))
    .map(c => `<option value="${esc(c)}"${c === f.from ? " selected" : ""}>${esc(c)}${c === nowCamp ? " (now)" : ""}</option>`).join("");
  const nowChip = at => at === nowAt ? ` <span class="chip">now</span>` : "";

  let body = "";
  if(old) body += `<div class="mproblems">${esc(MONEY_OLD_SCRIPT)}</div>`;
  if(MONEY.splitProblems.length) body += `<div class="mproblems"><b>The sheet's ${MONEY_SPLITS_TAB} tab has ${MONEY.splitProblems.length === 1 ? "a row" : "rows"} it can't read.</b>
      ${MONEY.splitProblems.length === 1 ? "It's" : "They're"} left out, so the campaigns ${MONEY.splitProblems.length === 1 ? "it covers" : "they cover"} start from the change before.
      <ul>${MONEY.splitProblems.map(p => `<li>Row ${esc(p.row)}${p.from ? " · " + esc(p.from) : ""} — ${esc(p.error)}</li>`).join("")}</ul>
      ${MONEY.sheetUrl ? `<a href="${esc(MONEY.sheetUrl)}" target="_blank" rel="noopener">Open the sheet ↗</a> — fix it there, then Refresh.` : ""}</div>`;
  body += `<div class="mlab"><span class="mlt">Where new entries start</span><div class="msplitsbox"><table class="grid msplits"><thead><tr>
      <th>Campaigns</th><th>Split</th></tr></thead><tbody>
      <tr><td>${splits.length ? "Before " + esc(splits[0].from) : "Every campaign"}${nowChip(M_FIRST_SPLIT)}</td>
        <td>${esc(mSplitName(M_FIRST_SPLIT.benPct))}</td></tr>
      ${splits.map(x => `<tr><td>From ${esc(x.from)}${nowChip(x)}<div class="msub">${x.setBy ? `${esc(x.setBy)} · ${fmtStamp(x.setAt)} · ` : ""}<button type="button"
          class="linkish" data-moneyact="unsplit" data-from="${esc(x.from)}" title="Take this change out"${dis}>remove</button></div></td>
        <td>${esc(mSplitName(x.benPct))}</td></tr>`).join("")}
    </tbody></table></div></div>`;
  body += `<div class="mlt" style="margin-top:6px">Change it</div>
    <div class="mrow2"><label class="mlab"><span class="mlt">Starting with</span><select id="mfFrom">${fromOpts}</select></label>
      ${moneyInput("mfSplitPct", "Ben's share", f.benPct, "%", "e.g. 55")}</div>
    <div class="mcalc" id="mfAlan">${esc(moneyAlanLine(f))}</div>
    <div class="sw-hint" id="mfKeep">${esc(moneySplitKeepLine(f))}</div>`;
  body += `<div class="merr" id="mfErr" role="alert">${esc(MONEY.formErr)}</div>`;
  body += `<div class="ad-row">
      <button class="btn primary" data-moneyact="save"${dis || (old ? " disabled" : "")}>Save</button>
      <button class="btn" data-moneyact="close"${dis}>${old ? "Close" : "Cancel"}</button></div>`;
  body += `<div class="maudit">One split covers income and expenses alike. Every entry keeps the split it was saved with, so a change
    here never rewrites an entry or a campaign you've settled. Each change is also on the sheet's ${MONEY_SPLITS_TAB} and History tabs.</div>`;
  d.innerHTML = `<div class="ad-head"><div><div class="t">Splits</div>
      <div class="s">${MONEY_BOOK === "test" ? "Test tab — only the published hub changes the real splits" : "Who gets what share of new entries, campaign by campaign"}</div></div>
      <button class="btn sm" data-moneyact="close" title="Close"${dis}>✕</button></div>
    <div class="ad-body mform" id="mform">${body}</div>`;
  moneyBusyMark(d);
  d.classList.add("on"); d.setAttribute("aria-hidden", "false");
}
/* the box follows the campaign picked until someone types in it */
function moneySplitsPrefill(f){
  if(!f.typed) f.benPct = String(moneySplit(f.from));
}
async function moneySaveSplit(){
  const f = MONEY.form;
  if(!f || f.mode !== "splits" || MONEY.busy) return;
  moneyHarvest();
  if(MONEY.splits === null){ MONEY.formErr = MONEY_OLD_SCRIPT; paintMoneyForm(); return; }
  const problem = mSplitCheck(f.benPct);
  if(problem){ MONEY.formErr = problem; paintMoneyForm(); return; }
  const benPct = moneyPctIn(f.benPct);
  if(moneySplit(f.from) === benPct){ MONEY.formErr = `${f.from} already starts from ${mSplitName(benPct)} — nothing to change.`; paintMoneyForm(); return; }
  const by = moneySigner();
  if(!by){ MONEY.formErr = "The hub doesn't know who you are — type Alan or Ben when it asks, so the change is signed."; paintMoneyForm(); return; }
  const cur = MONEY.splits.find(x => x.from === f.from);
  MONEY.busy = true; MONEY.busyAct = {act:"save"}; MONEY.formErr = ""; paintMoneyForm();
  const out = await moneyWrite({action:"split", by, from:f.from, benPct, was:cur ? cur.benPct : null});
  MONEY.busy = false;
  if(out.ok){
    MONEY.splits = out.splits || MONEY.splits;
    moneyCloseForm();
    if(out.warning) MONEY.warn = out.warning;
    render();
    toast(out.warning || `New entries from ${f.from} on start at ${mSplitName(benPct)} ✓`);
    return;
  }
  if(TAB !== "money") toast("Money: that split didn't save.", {err:true, retryLabel:"Open Money", retry:() => goTab("money")});
  if(out.conflict && out.splits){
    MONEY.splits = out.splits; render();
    const theirs = out.splits.find(x => x.from === f.from);
    MONEY.formErr = theirs
      ? `${theirs.setBy || "The other person"} changed the ${f.from} split first — it's now ${mSplitName(theirs.benPct)}. Save again to put yours in its place.`
      : `The ${f.from} split was taken out while you had this open. Save again to set yours.`;
    paintMoneyForm();
    return;
  }
  if(out.error === "network") f.uncertain = true;
  MONEY.formErr = moneyWhy(out, "Nothing was changed", "Press Save again");
  paintMoneyForm();
}
async function moneyRemoveSplit(from){
  const f = MONEY.form, x = (MONEY.splits || []).find(s => s.from === from);
  if(!f || f.mode !== "splits" || !x || MONEY.busy) return;
  moneyHarvest();
  const back = mSplitFor(MONEY.splits.filter(s => s !== x), from).benPct;
  if(!confirm(`Take out the ${from} change? New entries in the campaigns it covered go back to ${mSplitName(back)}.\n\nEntries already saved keep their own split.`)){
    toast("Left as it was"); return;
  }
  const by = moneySigner();
  if(!by){ MONEY.formErr = "The hub doesn't know who you are — type Alan or Ben when it asks."; paintMoneyForm(); return; }
  MONEY.busy = true; MONEY.busyAct = {act:"unsplit", from}; MONEY.formErr = ""; paintMoneyForm();

  MONEY.busy = false;
  if(out.ok){
    MONEY.splits = out.splits || MONEY.splits;
    if(out.warning) MONEY.warn = out.warning;
    if(MONEY.form === f){ moneySplitsPrefill(f); MONEY.formErr = ""; }
    render(); paintMoneyForm();
    toast(out.warning || `Took out the ${from} change`);
    return;
  }
  if(out.conflict && out.splits){
    MONEY.splits = out.splits; render();
    MONEY.formErr = `The ${from} split changed while you had this open — here it is as it stands. Remove it again if you still mean to.`;

  MONEY.formErr = moneyWhy(out, "Nothing was changed", "Press Remove again");
  paintMoneyForm();
}

async function moneySaveBuyout(){
  const f = MONEY.form;

  const problem = mBuyoutCheck({slicePct:f.slicePct, multiple:f.multiple, opensWith:f.opensWith});
  if(problem){ MONEY.formErr = problem; paintMoneyForm(); return; }
  const want = moneyTermsOf(f), cur = MONEY.buyout;
  if(moneySameTerms(want, cur)){ MONEY.formErr = "Those are the terms already — nothing to change."; paintMoneyForm(); return; }
  const by = moneySigner();
  if(!by){ MONEY.formErr = "The hub doesn't know who you are — type Alan or Ben when it asks, so the change is signed."; paintMoneyForm(); return; }
  MONEY.busy = true; MONEY.busyAct = {act:"save"}; MONEY.formErr = ""; paintMoneyForm();
  const out = await moneyWrite({action:"buyout", by, terms:want, was:cur ? {slicePct:cur.slicePct, multiple:cur.multiple, opensWith:cur.opensWith} : null});
  MONEY.busy = false;
  const words = t => `${t.slicePct}% at ${t.multiple}×${t.opensWith ? ", opening with " + t.opensWith : ""}`;
  if(out.ok){
    MONEY.buyout = out.buyout;
    if(out.warning) MONEY.warn = out.warning;
    if(MONEY.form === f) Object.assign(f, {slicePct:String(out.buyout.slicePct), multiple:String(out.buyout.multiple), opensWith:out.buyout.opensWith, typed:false});
    MONEY.formErr = "";
    render(); paintMoneyForm();
    toast(out.warning || "Buyout terms saved ✓");
    return;
  }
  if(TAB !== "money") toast("Money: the buyout terms didn't save.", {err:true, retryLabel:"Open Money", retry:() => goTab("money")});
  if(out.conflict && "buyout" in out){
    MONEY.buyout = out.buyout; render();
    MONEY.formErr = out.buyout
      ? `${out.buyout.setBy || "The other person"} changed the terms first — they're now ${words(out.buyout)}. Save again to put yours in their place.`
      : "The terms were cleared while you had this open. Save again to set yours.";
    paintMoneyForm();
    return;
  }
  if(out.error === "network") f.uncertain = true;
  MONEY.formErr = moneyWhy(out, "Nothing was changed", "Press Save terms again");
  paintMoneyForm();
}

/* ── receipts ── */
const MONEY_MAX_RECEIPT = 5 * 1024 * 1024;
async function moneyReadReceipt(file){
  let mime = file.type || (/\.pdf$/i.test(file.name) ? "application/pdf" : /\.(heic|heif)$/i.test(file.name) ? "image/heic" : "");
  if(!/^(image\/(jpeg|png|gif|webp|heic|heif)|application\/pdf)$/.test(mime)) throw new Error("A receipt has to be a photo or a PDF.");
  let blob = file, name = file.name || "receipt";
  if(/^image\/(jpeg|png|webp|gif)$/.test(mime)){
    const small = await moneyShrink(file).catch(() => null);
    if(small){ blob = small; mime = "image/jpeg"; name = name.replace(/\.[a-z0-9]+$/i, "") + ".jpg"; }
  }
  if(blob.size > MONEY_MAX_RECEIPT) throw new Error("That file is too big — 5 MB max.");
  const b64 = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1] || "");
    r.onerror = () => reject(new Error("Couldn't read that file — try attaching it again."));
    r.readAsDataURL(blob);
  });
  return {name, mime, b64, size:blob.size};
}
/* Phone photos arrive at 3–6 MB. Anything over 1.5 MB or 2000 px on its long
   edge is redrawn as a 2000 px JPEG; null means the original is fine as it is. */
async function moneyShrink(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = url; });
    const long = Math.max(img.naturalWidth, img.naturalHeight);
    if(file.size <= 1.5 * 1024 * 1024 && long <= 2000) return null;
    const k = Math.min(1, 2000 / long), c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);         // a transparent PNG would turn black as a JPEG
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(resolve => c.toBlob(b => resolve(b), "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
async function moneyViewReceipt(){
  const f = MONEY.form;
  if(!f || !f.entry || !f.entry.receiptId) return;
  const box = () => (MONEY.form === f ? $("#mfViewer") : null);
  if(box()) box().innerHTML = `<div class="sw-hint">Fetching the receipt…</div>`;
  let out = null;
  for(let attempt = 1; attempt <= 2 && !out; attempt++){
    try{ out = await moneyCall({action:"receipt", id:f.entry.id}); }
    catch(e){ if(attempt === 2) out = {ok:false, error:"network"}; }
  }
  const el = box();
  if(!el) return;
  if(!out.ok){ el.innerHTML = `<div class="merr">${esc(out.error === "network" ? "Couldn't reach the sheet — try again." : "Couldn't fetch it: " + out.error)}</div>`; return; }
  let bytes;
  try{
    const bin = atob(out.b64);
    bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  }catch(err){
    console.error("Money: receipt didn't decode", err);
    el.innerHTML = `<div class="merr">The receipt came back damaged — try View again.</div>`;
    return;
  }
  if(MONEY.receiptUrl) URL.revokeObjectURL(MONEY.receiptUrl);
  const url = MONEY.receiptUrl = URL.createObjectURL(new Blob([bytes], {type:out.mime}));
  const shown = /^image\/(jpeg|png|gif|webp)$/.test(out.mime) ? `<img src="${url}" alt="Receipt">`
    : out.mime === "application/pdf" ? `<iframe src="${url}" title="Receipt"></iframe>`
    : `<div class="sw-hint">This browser can't show ${esc(out.mime)} files — download it instead.</div>`;
  el.innerHTML = `${shown}<div class="ad-row" style="margin-top:8px"><a class="btn sm" href="${url}" target="_blank" rel="noopener">Open in a new tab</a>` +
    `<a class="btn sm" href="${url}" download="${esc(out.name)}">Download</a></div>`;
}

  }

  if(set && MONEY.form){
    e.preventDefault();
    if(MONEY.busy) return;
    moneyHarvest();
    const f = MONEY.form, raw = set.dataset.mset, i = raw.indexOf(":"), key = raw.slice(0, i), v = raw.slice(i + 1);
    if(key === "kind"){ if(v !== f.kind) MONEY.form = moneyNewForm(v, {id:f.id, date:f.date, campaign:f.campaign, campAuto:f.campAuto, note:f.note, amount:f.amount}); }

  if(!act) return;
  const k = act.dataset.moneyact;
  if(k === "reload" || k === "voided" || k === "dismisswarn") return;   // the board's own controls, handled above
  e.preventDefault();
  if(k === "new"){ if(!MONEY.busy){ MONEY.formErr = ""; MONEY.form = moneyNewForm(act.dataset.kind); paintMoneyForm(); } return; }
  if(k === "splits"){ if(!MONEY.busy){ MONEY.formErr = ""; MONEY.form = moneySplitsForm(); paintMoneyForm(); } return; }
  if(k === "buyout"){ if(!MONEY.busy){ MONEY.formErr = ""; MONEY.form = moneyBuyoutForm(); paintMoneyForm(); } return; }
  if(k === "settle"){
    if(MONEY.busy) return;
    if(mStatus(MONEY.entries || [], MONEY.problems, act.dataset.camp, todayISO()).state === "blocked"){
      toast("Fix the rows the sheet can't read first — they're listed in red"); return;

    MONEY.formErr = ""; MONEY.form = moneySettleForm(act.dataset.camp); paintMoneyForm();

  if(k === "viewreceipt") return moneyViewReceipt();

  if(k === "clearpick") MONEY.form.receipt = null;
  paintMoneyForm();
});

/* ═══════════════════════════════════════════════════════════════════════════
   NAV REGISTRY — two levels.

   SECTIONS are the bold tabs across the top. TABS are the pages; each one names
   the section it belongs to. A section with more than one page grows a row of
   sub-tabs underneath it automatically.

   TO ADD A PAGE:
     1. Add your data under a new key in SEED (top of this script).
     2. Write a render function that returns an HTML string.
     3. Add ONE line to TABS:
          {id:"notes", label:"Notes", section:"business", count:()=>…, render:renderNotes}
        Give it `section:"calendar"` or `section:"business"` to nest it, or add a
        new entry to SECTIONS to give it a bold tab of its own.

   Routing, the tab bar, edit mode, saving, PNG export and printing all follow.
   ═══════════════════════════════════════════════════════════════════════════ */
const SECTIONS = [

   count:()=>{ const y = DATA.calendar.filter(r => Number(r.date.slice(0,4)) === UI.year);
               return y.filter(isPlanned).length + "/" + y.length; }},
  {id:"perf", label:"Performance", count:()=>"live"},
  {id:"team", label:"Mentees",
   count:()=>TEAM.rows ? TEAM.rows.filter(r => r.Active).length + " active" : ""},
  {id:"assign", label:"Assignments"},
  {id:"business", label:"Orders of Business",
   count:()=>Object.values(DATA.business).flat().filter(i => !i.done).length + " open"},
  {id:"money", label:"Money", count:moneyNavCount}
];

const TABS = [
  {id:"calendar", label:"Campaign Calendar", sub:"The Calendar", section:"calendar", printable:true,
   count:()=>{ const y = DATA.calendar.filter(r => Number(r.date.slice(0,4)) === UI.year);
               return y.filter(isPlanned).length + "/" + y.length; },
   render:renderCalendar},

  {id:"bank", label:"Topic Bank", sub:"Topic Bank", section:"calendar", printable:true,
   count:()=>Object.values(DATA.topicBank).reduce((n,a)=>n+a.length,0),
   render:renderBank},

  {id:"archive", label:"Call Archive", sub:"Call Archive", section:"calendar", printable:true,
   count:()=>DATA.archive.length,
   render:renderArchive},

  {id:"speakers", label:"Guest Speakers", sub:"Guest Speakers", section:"calendar", printable:true,
   count:()=>DATA.speakers.length,
   render:renderSpeakers},

  {id:"business", label:"Orders of Business", sub:"", section:"business", printable:true,
   count:()=>Object.values(DATA.business).flat().filter(i => !i.done).length + " open",

  {id:"perf", label:"Performance", sub:"", section:"perf",

   render:renderTeam},

const tabsIn     = sec => TABS.filter(t => t.section === sec);
const sectionOf  = id  => (TABS.find(t => t.id === id) || TABS[0]).section;
const homeTabOf  = sec => tabsIn(sec)[0].id;

/* ═══════════ shared bits every tab can use ═══════════ */

/* an editable field. path is a dot-path into DATA, e.g. "calendar.3.topic" */
function ed(path, value, cls, placeholder){
  const empty = !String(value||"").trim();
  return `<span class="${cls||""}" data-edit="${path}"${empty && placeholder ? ` data-ph="${esc(placeholder)}"` : ""}>${esc(value||(empty&&placeholder?placeholder:""))}</span>`;
}
/* Same as ed(), but stays editable with Edit mode off. Assigning an owner and
   setting a due date is the whole point of the Orders tab — making people flip
   a mode first would just be in the way. */
function edLive(path, value, cls, placeholder){
  return ed(path, value, cls, placeholder).replace("<span ", "<span data-live ");
}
function toolbar(inner){ return `<div class="toolbar no-export no-print">${inner}</div>`; }
/* exporting is the rarest thing on a page, so it's one quiet button with a menu,
   not the page's loudest pair */
function exportButtons(id, label){
  return menuButton("Export", `<button data-png="${id}" data-label="${esc(label)}">Save as PNG</button>
          <button data-print="${id}">Print or save as PDF</button>`, "btn", `data-exportfor="${id}"`);
}
/* A button that opens a small menu of other buttons. The menu's buttons keep their
   data-* attributes, so the document click handlers that ran them as toolbar
   buttons run them from the menu too. They wait in a <template>, which is inert:
   nothing on the page can find or click them until the menu copies them out. */
function menuButton(label, items, cls = "btn", attrs = ""){
  return `<span class="menu-wrap"><button class="${cls}" data-menu aria-haspopup="menu" aria-expanded="false" ${attrs}>${label}</button><template class="menu-src">${items}</template></span>`;
}
function printHead(title, sub){
  return `<div class="print-head"><div class="t">Sharp Ninja Academy — ${esc(title)}</div><div class="s">${esc(sub)}</div></div>`;
}
function seg(name, opts, current){
  return `<div class="seg">` + opts.map(o =>
    `<button data-seg="${name}" data-val="${esc(o.v)}" class="${current===o.v?"on":""}"${o.t ? ` title="${esc(o.t)}"` : ""}>${esc(o.l)}</button>`
  ).join("") + `</div>`;
}
/* Same look, but several buttons can be lit at once. UI[name] is an array;
   the empty-valued option ("All") is lit when nothing is picked and clears
   the set when clicked. */
function mseg(name, opts, picked){
  const on = v => v === "" ? !picked.length : picked.includes(v);
  return `<div class="seg">` + opts.map(o =>
    `<button data-mseg="${name}" data-val="${esc(o.v)}" class="${on(o.v)?"on":""}"${o.t ? ` title="${esc(o.t)}"` : ""}>${esc(o.l)}</button>`
  ).join("") + `</div>`;
}
function fgroup(label, inner){ return `<div class="fgroup"><span class="flab">${esc(label)}</span>${inner}</div>`; }
/* edit-mode affordances. They only appear while Edit is on (CSS .edit-only). */
function del(path, label){
  return ` <button class="del edit-only no-export no-print" data-del="${path}" title="Delete${label?" "+esc(label):""}">×</button>`;
}
function addBtn(path, noun){
  return `<button class="btn sm edit-only no-export no-print" data-add="${path}">+ ${esc(noun)}</button>`;
}
function statBox(lab, val, meta, alert){
  return `<div class="stat${alert?" alert":""}"><div class="lab">${esc(lab)}</div><div class="val">${esc(val)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:""}</div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   TAB 1 — CAMPAIGN CALENDAR
   ═══════════════════════════════════════════════════════════════════════════ */
function renderCalendar(){
  ensureCids(DATA);
  const years = yearsIn(DATA.calendar);
  if(!years.includes(UI.year)) UI.year = years.includes(new Date().getFullYear())
    ? new Date().getFullYear() : years[years.length - 1];
  const rows = DATA.calendar.filter(r => Number(r.date.slice(0,4)) === UI.year);

  /* the numbers follow the campaign you're looking at — so an exported
     "Fall III" board reports Fall's coverage, not the whole year's */
  const scope = UI.season === "all" ? rows : rows.filter(r => seasonOf(r.date).key === UI.season);
  const scopeName = (UI.season === "all" ? "" : UI.season + " ") + UI.year;
  const planned = scope.filter(r => isPlanned(r) && !isOff(r)).length;
  const blocked = scope.filter(r => isBlocked(r) || isOff(r)).length;
  const open    = scope.filter(r => !isPlanned(r) && !isBlocked(r) && !isOff(r)).length;
  /* every CALL in a live week, so the boxes add up call-by-call, not week-by-week */
  const callsOf = r => (isBlocked(r) || isOff(r)) ? [] :
    (isPlanned(r) ? [{pres:r.presenter, type:r.callType || "group"}] : [])
      .concat((r.extra || []).filter(isLiveCall).map(x => ({pres:x.presenter, type:x.type || "group"})));
  const allCalls = scope.flatMap(callsOf);
  const alan    = allCalls.filter(c => ["alan","both"].includes(presenterClass(c.pres))).length;
  const ben     = allCalls.filter(c => ["ben","both"].includes(presenterClass(c.pres))).length;
  const hotN    = allCalls.filter(c => c.type === "hotseat").length;
  const wkPres  = r => callsOf(r).map(c => c.pres).filter(v => String(v||"").trim());
  const tbd     = scope.filter(r => isPlanned(r) && !isOff(r) && presenterClass(r.presenter)==="tbd").length;

  const q = UI.q.toLowerCase();
  const visible = scope.filter(r => {
    if(UI.presenter !== "all"){
      if(UI.presenter === "tbd"){
        if(presenterClass(r.presenter) !== "tbd") return false;      // group call has no host
      } else {
        const cs = wkPres(r).map(presenterClass);                     // …on any of the week's calls
        if(!cs.some(c => c === UI.presenter || c === "both")) return false;
      }
    }
    if(UI.open && (isPlanned(r) || isBlocked(r) || isOff(r))) return false;
    if(UI.tier !== "all" && ![r.topic, ...(r.extra||[]).map(x => x.topic)].some(t => String(t||"").trim() && String(tierOf(t)) === UI.tier)) return false;
    if(q && !JSON.stringify(r).toLowerCase().includes(q)) return false;
    return true;
  });

  const nextYear = years[years.length - 1] + 1;

  let html = `
  <div class="page-head no-export no-print">
    <div>
      <div class="eyebrow">Group Calls</div>
      <div class="big serif">Campaign Calendar</div>
      <div class="lede">Every call night of the year. This year and next are always here —
        the board rolls itself forward, so Spring is plannable months ahead. Turn on
        <b>Edit</b> to plan straight into the page, then <b>Export</b> for a clean image.</div>
      ${howToggle()}
      <div class="lede how" style="margin-top:6px">Calls run at <b>${
        EDITING ? tbtn("meta.callTime", callTime(), {ph:"set a time", title:"The standing time for every call (Central)"})
                : esc(fmtTime(callTime()) || "no set time")}</b>
        — in <b>Edit</b>, click it to move every call at once, or click any single call's
        time to give that one its own. Every time on this board is Central.</div>
      <div class="lede how" style="margin-top:6px">Nothing is stuck on a Tuesday. In <b>Edit</b>, every call
        on a week has its own date — <b>click it and pick the night off the calendar</b>. Each row of that
        calendar is a Vector week, Tue&nbsp;→&nbsp;Mon. The first call's date moves the whole week; any
        call under it moves on its own.</div>
    </div>${(() => {
      const next = upcomingCalls()[0];
      if(!next) return "";
      return `<div class="next-call">
        <div class="nc-lab">Next call night</div>
        <div class="nc-date">${fmtDay(next.date)} · ${fmtDate(next.date)}</div>
        <div class="nc-topic">${next.planned ? esc(next.topic) : `<span class="nc-open">open — nothing planned yet</span>`}</div>
        <div class="nc-meta">${(next.time || callTime()) ? `<span class="nc-time">${esc(fmtTime(next.time || callTime(), next.date))}</span>` : ""}${
          next.presenter ? `<span class="chip ${presenterClass(next.presenter)}">${esc(next.presenter)}</span>` : ""}</div>
      </div>`;
    })()}
  </div>`;

  html += toolbar(`
    <div class="tb-filters">
      ${seg("year", years.map(y => ({v:String(y), l:String(y)})), String(UI.year))}
      ${seg("season", [{v:"all",l:"All year"},{v:"Spring",l:"Spring I"},{v:"Summer",l:"Summer II"},{v:"Fall",l:"Fall III"}], UI.season)}
      ${seg("presenter", [{v:"all",l:"Everyone"},{v:"alan",l:"Alan"},{v:"ben",l:"Ben"},{v:"tbd",l:"No host"}], UI.presenter)}
      ${tierSeg()}
      <button class="btn ${UI.open?"on":""}" data-toggle="open">Open weeks only</button>
    </div>
    <input class="search" id="q" placeholder="Search topics, tracks, notes…" value="${esc(UI.q)}">
    <div class="tb-actions">
      <button class="btn" data-addyear="${nextYear}" title="Add every call night of ${nextYear}">+ ${nextYear}</button>
      ${exportButtons("calBoard", scopeName + " Campaign Calendar")}
    </div>`);

  html += `<div id="calBoard" class="export-frame">`;
  html += printHead(scopeName + " Campaign Calendar",
      `${planned} of ${scope.length} weeks planned · ${open} open${
        callTime() ? " · calls at " + esc(fmtTime(callTime())) : ""} · printed ${fmtFull(todayISO())}`);

  html += `<div class="stats">
    ${statBox("Weeks planned", planned + " / " + scope.length, Math.round(planned/(scope.length||1)*100) + "% of " + (UI.season==="all"? UI.year : UI.season))}
    ${statBox("Open weeks", open, open ? "still to fill" : "fully booked", open > 0)}
    ${statBox("Alan on", alan, "calls")}
    ${statBox("Ben on", ben, "calls")}
    ${statBox("Blocked / off", blocked, "NET, off weeks, etc.")}
    ${statBox("Host TBD", tbd, "planned, no host", tbd > 0)}
    ${statBox("Hot seats", hotN, "on this stretch")}
  </div>`;

  if(!visible.length){
    html += emptyState("No weeks match", "Nothing in this stretch fits these filters and the search.", clearFiltersBtn("calendar"));
  } else {
    for(const S of SEASONS){
      const group = visible.filter(r => seasonOf(r.date).key === S.key);
      if(!group.length) continue;
      const gAll = rows.filter(r => seasonOf(r.date).key === S.key);
      const gPlanned = gAll.filter(r => isPlanned(r) && !isOff(r)).length;
      html += `<section class="season">
        <div class="season-head">
          <span class="roman">${S.roman}</span>
          <h3>${S.key} ${UI.year}</h3>
          <span class="range">${S.range}</span>
          <span class="fill"><span class="meter"><i style="width:${Math.round(gPlanned/(gAll.length||1)*100)}%"></i></span>${gPlanned}/${gAll.length} planned</span>
        </div>`;
      for(const r of group) html += weekRow(r, DATA.calendar.indexOf(r), gAll.indexOf(r) + 1);
      html += `</section>`;
    }
  }

  /* backlog / parking lot */
  html += `<div class="sec-title serif">Backlog <span class="n">— ideas parked, not yet on a date</span>
    <button class="btn sm edit-only no-export no-print" data-addkey="backlog">+ list</button></div><div class="cols">`;
  for(const [name, list] of Object.entries(DATA.backlog)){
    html += `<div class="card"><h4>${ed("__key.backlog."+name, name)} <span class="n">${list.length}</span></h4><ul>`;
    list.forEach((item, i) => {
      const sched = findUses(item).future[0];
      html += `<li class="${sched?"sched":""}">${ed("backlog."+name+"."+i, item)}${
        sched ? `<span class="when sched">→ ${fmtDate(sched.date)}</span>` : ""}${del("backlog."+name+"."+i)}</li>`;
    });
    html += `</ul>${addBtn("backlog."+name, "idea")}</div>`;
  }
  html += `</div></div>`;
  return html;
}

/* one week row — a stack of typed CALLS (Group / Hot seat / Guest speaker),
   each with its own time, tier edge, presenter, notes, and bank picker.
   Call #1 lives in the legacy topic/presenter/time fields so every
   cross-reference keeps working; additional calls live in r.extra[]. */
function weekRow(r, idx, wkNum){
  const p = "calendar." + idx;
  const planned = isPlanned(r), blocked = isBlocked(r), off = isOff(r);
  const state = blocked ? "blocked" : off ? "off" : (planned ? "" : "open");
  const liveExtras = (r.extra || []).filter(isLiveCall);
  const nCalls = (planned ? 1 : 0) + liveExtras.length;

  const stime = (path, val, fallback, night) => {
    if(EDITING) return tbtn(path, val, {cls:"stime", fallback, night,
      title: fallback ? "Pick this call's time — blank means the standing " + fmtTime(fallback, night)
                      : "Pick this call's time (Central)"});
    const shown = fmtTime(val || fallback, night);
    return shown ? `<span class="stime">${esc(shown)}</span>` : "";
  };
  /* Every call gets its own night. In Edit mode each slot opens with a clickable
     date — the main call's IS the week's, so retyping it moves the week; an extra
     call keeps its own. With Edit off the chip only shows on a call that has
     broken away from the week's night, so the printed board stays clean. */
  const sdate = (path, iso, anchor) => {
    const shown = iso ? fmtDay(iso) + " " + fmtDate(iso) : "";
    if(!EDITING) return (shown && iso !== anchor) ? `<span class="sdate">${esc(shown)}</span>` : "";
    const own = /\.extra\.\d+\.date$/.test(path);
    return dbtn(own ? "extra" : "week", path, iso, shown, {cls:"sdate", anchor,
      title: own ? "Pick this call's night — only this call moves"
                 : "Pick the week's night — its calls move with it"});
  };
  const spick = field =>
    `<button class="slot-pick edit-only no-export no-print" data-pick="${idx}" data-pickfield="${field}" title="Pick from the topic bank">\u25be</button>`;
  const pchip = (path, val) => whoChip(path, val);
  /* the call type is a DROPDOWN in Edit mode, a plain tag otherwise */
  const stag = (path, type) =>
    EDITING ? `<select class="typesel no-export no-print" data-typesel="${path}">
        <option value="group"${type === "group" ? " selected" : ""}>Group</option>
        <option value="hotseat"${type === "hotseat" ? " selected" : ""}>Hot seat</option>
        <option value="guest"${type === "guest" ? " selected" : ""}>Guest speaker</option></select>`
      : `<span class="stag">${CALL_TYPES[type] || "Group"}</span>`;
  const spk = (path, type, val) =>
    (type === "guest") ? `<span class="spk">${ed(path, val || "", "", "speaker name?")}</span>` : "";
  /* per-call notes: as many as you want, each line editable + deletable. Adding
     one is an item in the week's Edit menu ("Add a note under …"), not a button
     under every call. */
  const noteAdds = [];
  const callName = (topic, type) => {
    const s = String(topic || "").trim();
    return s ? "“" + (s.length > 30 ? s.slice(0, 29) + "…" : s) + "”"
             : "the " + String(CALL_TYPES[type] || "group").toLowerCase() + " call";
  };
  const noteLines = (arrPath, arr, name) => {
    noteAdds.push(`<button data-addnote="${arrPath}">Add a note under ${esc(name)}</button>`);
    return (arr || []).map((n, i) =>
      `<div class="snote"><span class="ntag">note</span><span class="ntext">${ed(arrPath + "." + i, n, "", "type the note")}</span>${del(arrPath + "." + i, "note")}</div>`).join("");
  };

  /* An additional call can land on any night, in or out of its own week — it
     carries its own date, and the week lists in the order it actually runs, so a
     call moved to the Monday before sits above the Tuesday one it was planned
     under. `day` is the old free-text chip; a scribble migrate() couldn't read as
     a date still shows beside the real one. */
  const sday = (path, val) =>
    EDITING ? `<span class="sday">${ed(path, val, "", "day?")}</span>`
            : (String(val||"").trim() ? `<span class="sday">${esc(val)}</span>` : "");

  let main = "";
  const slots = [];                                // {date, j, html} — j = -1 for the main call, so it leads its own night
  const mainType = r.callType || "group";
  if(planned){
    slots.push({date:r.date, j:-1, html:
      `<div class="slot main ${mainType} t${mainType === "hotseat" ? 0 : tierOf(r.topic)}">${sdate(p+".date", r.date, r.date)}${stime(p+".time", r.time, callTime(), r.date)}${stag(p+".callType", mainType)}<span class="stopic">${ed(p+".topic", r.topic)}${mainType === "hotseat" ? "" : tierChip(r.topic)}</span>${spk(p+".speaker", mainType, r.speaker)}${pchip(p+".presenter", r.presenter)}${spick("topic")}</div>`
      + (off ? "" : atChip(r.cid, r.date)) + noteLines(p + ".mainNotes", r.mainNotes, callName(r.topic, mainType))});
  } else if(blocked){
    main += `<div class="wk-topic empty mono">${ed(p+".note", r.note || "blocked", "", "blocked")}</div>`;
  } else {
    slots.push({date:r.date, j:-1, html:
      `<div class="slot main">${sdate(p+".date", r.date, r.date)}${EDITING ? stime(p+".time", r.time, "", r.date) : ""}<span class="stag">Group</span><span class="stopic empty">${ed(p+".topic", "", "", "+ open \u2014 click to plan")}</span>${pchip(p+".presenter", r.presenter)}${spick("topic")}</div>`});
  }
  (r.extra || []).forEach((x, j) => {
    const xp = `${p}.extra.${j}`, xt = x.type || "group";
    slots.push({date:callDateOf(r, x), j, html:
      `<div class="slot xtra ${xt} t${xt === "hotseat" ? 0 : tierOf(x.topic)}">${sdate(xp+".date", callDateOf(r, x), r.date)}${x.day ? sday(xp+".day", x.day) : ""}${stime(xp+".time", x.time, "", callDateOf(r, x))}${stag(xp+".type", xt)}<span class="stopic">${ed(xp+".topic", x.topic || "", "", "topic?")}${xt === "hotseat" ? "" : tierChip(x.topic)}</span>${spk(xp+".speaker", xt, x.speaker)}${pchip(xp+".presenter", x.presenter)}${spick("extra." + j)}${del(xp, "this call")}</div>`
      + (isLiveCall(x) && !off && !blocked ? atChip(x.cid, callDateOf(r, x)) : "") + noteLines(xp + ".notes", x.notes, callName(x.topic, xt))});
  });
  slots.sort((a, b) => a.date.localeCompare(b.date) || a.j - b.j);
  main += slots.map(sl => sl.html).join("");

  if(r.detail) main += `<div class="wk-detail">${ed(p+".detail", r.detail)}</div>`;

  const meta = [];
  if(r.track) meta.push(`<span class="chip track">${ed(p+".track", r.track)}</span>`);
  if(r.note && !blocked) meta.push(`<span class="chip note">${ed(p+".note", r.note)}</span>`);
  if(meta.length) main += `<div class="wk-meta">${meta.join("")}</div>`;

  if(r.proposed) main += `<div class="wk-sub proposed"><span class="tag">proposed</span><span>${ed(p+".proposed", r.proposed)}</span></div>`;
  if(r.alt) main += `<div class="wk-sub alt no-export no-print"><span class="tag">alt draft</span><span>${ed(p+".alt", r.alt)}</span></div>`;

  /* in edit mode one menu per week holds every way to add to it, take it off the
     schedule, or wipe it back to open — and it shows under the pointer, not on all
     fifty-two weeks at once */
  const adds = [], fields = [], week = [];
  if(!blocked)  adds.push(`<button data-addcall="${idx}|group">Add a call</button>`,
                          `<button data-addcall="${idx}|hotseat">Add a 🔥 hot seat</button>`,
                          `<button data-addcall="${idx}|guest">Add a 🎤 guest speaker</button>`);
  if(!r.track)  fields.push(`<button data-setfield="${p}.track">Add a track</button>`);
  if(!r.note)   fields.push(`<button data-setfield="${p}.note">Add a week note</button>`);
  if(!r.detail) fields.push(`<button data-setfield="${p}.detail">Add a detail</button>`);
  if(!blocked)  week.push(`<button data-offweek="${p}">${off ? "Back on the schedule" : "Mark as an off week"}</button>`);
  if(planned || blocked || r.note) week.push(`<button class="danger" data-clearweek="${p}">Clear this week</button>`);
  const items = [adds, noteAdds, fields, week].filter(g => g.length).map(g => g.join("")).join("<hr>");
  /* it sits in the date column, which has room to spare, so it never adds a line to the week */
  const tools = EDITING && items ? `<div class="wk-tools edit-only no-export no-print">${menuButton("+ Add…", items, "btn sm plain",
    `title="Add a call, a note or a detail to this week, or take it off the schedule"`)}</div>` : "";

  return `<div class="week ${state}">
    <div class="wk-date mono"><span class="wknum">WK ${String(wkNum).padStart(2,"0")}</span>
      <b>${EDITING ? dbtn("week", p+".date", r.date, fmtDate(r.date),
            {anchor:r.date, title:"Pick the week's night — its calls move with it"})
          : esc(fmtDate(r.date))}</b>${fmtDay(r.date)}${
        off ? `<span class="count offb">Off week</span>` :
        nCalls > 1 ? `<span class="count">${nCalls} calls</span>` : ""}${del(p, "this week")}${tools}</div>
    <div class="wk-main">${main}</div>
  </div>`;
}
function todayISO(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
/* the standing call time — one source for the lede, every week row, and the print header */
function callTime(){ return String((DATA.meta && DATA.meta.callTime) || "").trim(); }

/* ═══════════════════════════════════════════════════════════════════════════
   TAB 2 — TOPIC BANK
   Every topic is cross-checked against the archive and the 2026 calendar, so
   you can see at a glance what's been covered and what has never been run.
   ═══════════════════════════════════════════════════════════════════════════ */
function renderBank(){
  const cats = DATA.topicBank;
  const all = Object.values(cats).flat();
  let covered = 0, scheduled = 0;
  const marks = new Map();
  for(const t of all){
    const u = findUses(t);
    marks.set(t, u);
    if(u.past.length) covered++;
    if(u.future.length) scheduled++;
  }
  const q = UI.q.toLowerCase();

  let html = `
  <div class="page-head no-export no-print">
    <div>
      <div class="eyebrow">The full menu</div>
      <div class="big serif">Topic Bank</div>
      <div class="lede">Every topic we can teach, by category. A <b style="color:var(--good)">green</b> dot means
        we've run it before, <b style="color:var(--accent)">rust</b> means it's on the 2026 calendar, grey means untouched.</div>
    </div>
  </div>`;

  html += toolbar(`
    <div class="tb-filters">
      ${tierSeg()}
      <button class="btn ${UI.open?"on":""}" data-toggle="open">Never-run only</button>
    </div>
    <input class="search" id="q" placeholder="Search all ${all.length} topics…" value="${esc(UI.q)}">
    <div class="tb-actions">
      <button class="btn edit-only" data-addkey="topicBank">+ category</button>
      ${exportButtons("bankBoard", "Topic Bank")}
    </div>`);

  html += `<div id="bankBoard" class="export-frame">`;
  html += printHead("Topic Bank", `${all.length} topics across ${Object.keys(cats).length} categories · printed ${fmtFull(todayISO())}`);
  html += `<div class="stats">
    ${statBox("Topics", all.length, "in the bank")}
    ${statBox("Already run", covered, "found in the archive")}
    ${statBox("On 2026 calendar", scheduled, "scheduled")}
    ${statBox("Never run", all.length - covered, "fresh material", true)}
    ${statBox("Categories", Object.keys(cats).length, "")}
  </div><div class="cols">`;

  let shown = 0;
  for(const [name, list] of Object.entries(cats)){
    const items = list.map((t,i) => ({t, i})).filter(({t}) => {
      if(q && !t.toLowerCase().includes(q)) return false;
      if(UI.open && marks.get(t).past.length) return false;
      if(UI.tier !== "all" && String(tierOf(t)) !== UI.tier) return false;
      return true;
    });
    /* tiers read as separated: T1 first, then T2, T3, unassigned last */
    items.sort((a, b) => (tierOf(a.t) || 9) - (tierOf(b.t) || 9));
    /* an empty category still shows while you're editing — otherwise a category
       you just created would vanish before you could put anything in it */
    if(!items.length && !(EDITING && !q && !UI.open)) continue;
    shown += items.length;
    html += `<div class="card"><h4>${ed("__key.topicBank."+name, name)} <span class="n">${items.length}</span>${del("topicBank."+name, "category")}</h4><ul>`;
    for(const {t, i} of items){
      const u = marks.get(t);
      const last = u.past[0], next = u.future[0];
      const cls = next ? "sched" : (last ? "used" : "");
      let when = "";
      if(next) when = `<span class="when sched">${parseDate(next.date).getFullYear()} · ${fmtDate(next.date)}</span>`;
      else if(last) when = `<span class="when">last ${fmtDate(last.date)} '${String(parseDate(last.date).getFullYear()).slice(2)}</span>`;
      html += `<li class="${cls} tier-t${tierOf(t)}">${ed("topicBank."+name+"."+i, t)}${tierChip(t)}${when}${del("topicBank."+name+"."+i)}</li>`;
    }
    html += `</ul>${addBtn("topicBank."+name, "topic")}</div>`;
  }
  if(!shown) html += emptyState("No topics match", "Nothing in the bank fits this tier and the search.", clearFiltersBtn("bank"));
  html += `</div></div>`;
  return html;
}
