<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sharp Ninja Academy — Master Hub</title>
<meta name="description" content="One place for the Sharp Ninja Academy program: campaign calendar, topic bank, call archive, and guest speakers.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23F7F5F0' stroke='%2316140F' stroke-width='4'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' font-family='Hiragino Mincho ProN,Yu Mincho,serif' fill='%2316140F'%3E忍%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════ tokens — same palette as the SNA mentee dashboard ═══════════ */
:root{
  --paper:#F7F5F0; --ink:#16140F; --ink-soft:#5A554B; --ink-faint:#8B8579;
  --line:#DED9CE; --line-soft:#EBE7DD;
  --accent:#B4451F; --accent-soft:#F0E2D8;
  --good:#3E6B4B; --good-bg:#DFEAE0;
  --warn:#C99700; --warn-bg:#F7ECCF;
  --bad:#B4451F;  --bad-bg:#F3DBD2;
  --alan:#2F5D8C; --alan-bg:#DEE8F2;
  --ben:#7A4A8C;  --ben-bg:#EADEF2;
  --card:#FFFFFF;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:"Geist",-apple-system,"Helvetica Neue",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 90px}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.serif{font-family:"Fraunces",Georgia,serif}
::selection{background:var(--accent-soft)}
a{color:var(--accent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}

/* ═══════════ header ═══════════ */
header{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:40}
.head-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:1180px;margin:0 auto;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:20px;flex:none;line-height:1}
.brand h1{font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.brand .sub{font-size:11px;color:var(--ink-soft);letter-spacing:.04em}
.head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.dot.edited{background:var(--warn)}

/* ═══════════ buttons ═══════════ */
.btn{font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer;letter-spacing:.03em;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--ink-faint);background:var(--line-soft)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:#000}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.on:hover{background:#9d3b1a}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:11px}

/* ═══════════ tab bar ═══════════ */
nav.tabs{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:67px;z-index:35}
.tabs-inner{display:flex;gap:2px;max-width:1180px;margin:0 auto;padding:0 24px;overflow-x:auto;scrollbar-width:none}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{font-family:"Geist Mono",ui-monospace,monospace;font-size:12.5px;letter-spacing:.02em;padding:13px 16px;border:none;background:none;cursor:pointer;color:var(--ink-soft);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .ct{color:var(--ink-faint);font-size:11px;margin-left:5px}

/* ═══════════ page title + toolbar ═══════════ */
.page-head{padding:26px 0 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.page-head .big{font-family:"Fraunces",Georgia,serif;font-size:clamp(26px,4.4vw,38px);font-weight:600;letter-spacing:-.02em;line-height:1.05}
.page-head .lede{font-size:13px;color:var(--ink-soft);margin-top:7px;max-width:62ch}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:18px 0 6px;border-bottom:1px solid var(--line-soft);margin-bottom:18px}
.toolbar .grow{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;padding:7px 13px;border:none;background:none;cursor:pointer;color:var(--ink-soft);letter-spacing:.03em}
.seg button.on{background:var(--ink);color:var(--paper)}
input.search{font-family:"Geist",sans-serif;font-size:13px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);min-width:200px}
input.search::placeholder{color:var(--ink-faint)}

/* ═══════════ stat strip ═══════════ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
.stat .lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.stat .val{font-family:"Fraunces",Georgia,serif;font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:5px;line-height:1}
.stat .meta{font-size:11px;color:var(--ink-faint);margin-top:4px}
.stat.alert .val{color:var(--accent)}

/* ═══════════ campaign sections ═══════════ */
.season{margin-bottom:34px;break-inside:avoid}
.season-head{display:flex;align-items:baseline;gap:12px;padding:0 0 10px;border-bottom:1.5px solid var(--ink);margin-bottom:2px;flex-wrap:wrap}
.season-head h3{font-family:"Fraunces",Georgia,serif;font-size:20px;font-weight:600;letter-spacing:-.01em}
.season-head .roman{font-family:"Geist Mono",monospace;font-size:11px;color:var(--paper);background:var(--ink);padding:3px 8px;border-radius:999px;letter-spacing:.08em}
.season-head .range{font-size:12px;color:var(--ink-soft)}
.season-head .fill{margin-left:auto;font-size:11.5px;color:var(--ink-soft);font-family:"Geist Mono",monospace}

/* ═══════════ week rows ═══════════ */
.week{display:grid;grid-template-columns:92px 1fr 150px;gap:16px;padding:13px 4px;border-bottom:1px solid var(--line-soft);align-items:start;break-inside:avoid;position:relative}
.week:hover{background:rgba(255,255,255,.55)}
.week.open{background:repeating-linear-gradient(135deg,transparent,transparent 9px,rgba(180,69,31,.035) 9px,rgba(180,69,31,.035) 18px)}
.week.blocked{opacity:.62}
.wk-date{font-family:"Geist Mono",monospace;font-size:12px;color:var(--ink-soft);padding-top:2px;line-height:1.45}
.wk-date b{display:block;color:var(--ink);font-size:14px;font-weight:600}
.wk-date .wknum{font-size:10px;color:var(--ink-faint);letter-spacing:.06em}
.wk-main{min-width:0}
.wk-topic{font-family:"Fraunces",Georgia,serif;font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.wk-topic.empty{font-family:"Geist Mono",monospace;font-size:12.5px;font-weight:400;color:var(--accent);letter-spacing:.03em}
.wk-detail{font-size:12.5px;color:var(--ink-soft);margin-top:5px;line-height:1.5;max-width:74ch}
.wk-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-items:center}
.wk-right{display:flex;flex-direction:column;gap:6px;align-items:flex-end;padding-top:1px}

/* ═══════════ chips ═══════════ */
.chip{font-family:"Geist Mono",monospace;font-size:10.5px;letter-spacing:.05em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);white-space:nowrap}
.chip.track{background:var(--accent-soft);border-color:transparent;color:#7d3115}
.chip.note{background:var(--warn-bg);border-color:transparent;color:#7a5c00}
.chip.alan{background:var(--alan-bg);border-color:transparent;color:var(--alan);font-weight:600}
.chip.ben{background:var(--ben-bg);border-color:transparent;color:var(--ben);font-weight:600}
.chip.both{background:linear-gradient(100deg,var(--alan-bg) 50%,var(--ben-bg) 50%);border-color:transparent;color:var(--ink);font-weight:600}
.chip.tbd{border-style:dashed;color:var(--ink-faint)}
.chip.second{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.big{font-size:11.5px;padding:5px 11px}
.chip.count{background:var(--line-soft);border-color:transparent}

/* second call / proposed / alt lines under a week */
.wk-sub{display:flex;gap:8px;align-items:baseline;margin-top:9px;padding-left:11px;border-left:2px solid var(--line);font-size:12.5px;color:var(--ink-soft)}
.wk-sub .tag{font-family:"Geist Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);flex:none;padding-top:2px}
.wk-sub.proposed{border-left-color:var(--accent);color:var(--accent)}
.wk-sub.alt{border-left-style:dashed}

/* ═══════════ generic cards / columns ═══════════ */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;break-inside:avoid}
.card h4{font-family:"Fraunces",Georgia,serif;font-size:15.5px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:9px;border-bottom:1px solid var(--line-soft);margin-bottom:10px}
.card h4 .n{font-family:"Geist Mono",monospace;font-size:11px;color:var(--ink-faint);font-weight:400}
.card ul{list-style:none}
.card li{font-size:13px;line-height:1.45;padding:6px 0 6px 15px;position:relative;border-bottom:1px solid var(--line-soft)}
.card li:last-child{border-bottom:none}
.card li::before{content:"";position:absolute;left:2px;top:13px;width:4px;height:4px;border-radius:50%;background:var(--ink-faint)}
.card li.used::before{background:var(--good)}
.card li .when{font-family:"Geist Mono",monospace;font-size:10px;color:var(--good);margin-left:6px;white-space:nowrap}
.card li.sched::before{background:var(--accent)}
.card li .when.sched{color:var(--accent)}

/* ═══════════ tables ═══════════ */
table.grid{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table.grid th{text-align:left;font-family:"Geist Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;padding:11px 13px;border-bottom:1px solid var(--line);background:var(--line-soft);white-space:nowrap}
table.grid td{padding:10px 13px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.grid tr:last-child td{border-bottom:none}
table.grid tbody tr:hover{background:var(--line-soft)}
table.grid td.num{font-family:"Geist Mono",monospace;color:var(--ink-faint);font-size:11.5px;width:34px}
table.grid td.dt{font-family:"Geist Mono",monospace;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;width:96px}
table.grid tr.nocall td{color:var(--ink-faint);font-style:italic}
.sec-title{font-family:"Fraunces",Georgia,serif;font-size:17px;font-weight:600;margin:26px 0 11px;display:flex;align-items:baseline;gap:9px}
.sec-title .n{font-family:"Geist Mono",monospace;font-size:11px;color:var(--ink-faint);font-weight:400}
.empty-note{font-size:13px;color:var(--ink-faint);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}

/* ═══════════ editing ═══════════ */
[data-edit]{border-radius:4px;transition:background .1s,box-shadow .1s}
body.editing [data-edit]{cursor:text;box-shadow:inset 0 -1px 0 var(--line);min-height:1.2em;display:inline-block;min-width:44px}
body.editing [data-edit]:hover{background:var(--warn-bg)}
body.editing [data-edit]:focus{background:#fff;box-shadow:0 0 0 2px var(--accent);outline:none}
body.editing .wk-topic.empty{color:var(--ink-faint)}
.edit-banner{display:none;background:var(--warn-bg);border:1px solid #E4CE8E;border-radius:var(--radius);padding:11px 15px;font-size:12.5px;color:#6d5300;margin-bottom:16px;align-items:center;gap:12px;flex-wrap:wrap}
body.editing .edit-banner{display:flex}
.edit-banner b{font-weight:600}

/* controls that only exist while Edit is on */
.edit-only{display:none!important}
body.editing .edit-only{display:inline-block!important}
body.editing th.edit-only,body.editing td.edit-only{display:table-cell!important;width:28px}
.del{border:none;background:none;color:var(--ink-faint);cursor:pointer;font-size:15px;line-height:1;padding:0 4px;border-radius:4px;vertical-align:middle}
.del:hover{background:var(--bad-bg);color:var(--bad)}
.card h4 .del{margin-left:auto}
.card li .del{float:right;opacity:.5}
.card li:hover .del{opacity:1}
body.editing .wk-meta .btn.sm{font-size:10px;padding:3px 8px;color:var(--ink-faint)}
.edit-banner .grow{flex:1}

/* ═══════════ orders of business ═══════════ */
.biz{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:6px}
.biz-row{display:grid;grid-template-columns:30px 1fr 108px 92px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.biz-row:last-of-type{border-bottom:none}
.biz-row:hover{background:var(--line-soft)}
.biz-row.is-done{opacity:.5}
.biz-row.is-done .biz-t{text-decoration:line-through}
.biz-main{min-width:0}
.biz-t{font-size:13.5px;line-height:1.4}
.biz-note{font-size:11.5px;color:var(--ink-faint);margin-top:2px;line-height:1.4}
.tick{width:20px;height:20px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;
      display:grid;place-items:center;font-size:12px;color:transparent;padding:0;line-height:1;transition:.12s}
.tick:hover{border-color:var(--good)}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.chip.who{justify-self:start;font-size:10.5px}
.due{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;text-align:right;color:var(--ink-faint);white-space:nowrap}
.due.over{color:var(--bad);font-weight:600}
.due.soon{color:var(--warn)}
.due.later{color:var(--ink-soft)}
.biz .btn.sm{margin:9px 14px}
@media (max-width:700px){
  .biz-row{grid-template-columns:26px 1fr;row-gap:6px}
  .chip.who,.due{grid-column:2;justify-self:start;text-align:left}
}

/* ═══════════ modal ═══════════ */
.scrim{position:fixed;inset:0;background:rgba(22,20,15,.45);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
.scrim.on{display:flex}
.modal{background:var(--card);border-radius:18px;max-width:640px;width:100%;max-height:82vh;overflow:auto;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.24)}
.modal h3{font-family:"Fraunces",Georgia,serif;font-size:20px;font-weight:600;margin-bottom:6px}
.modal p{font-size:13px;color:var(--ink-soft);margin-bottom:14px;line-height:1.6}
.modal textarea{width:100%;height:240px;font-family:"Geist Mono",monospace;font-size:11px;line-height:1.5;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper);color:var(--ink);resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);font-family:"Geist Mono",monospace;font-size:12px;padding:11px 20px;border-radius:999px;opacity:0;transition:opacity .2s,transform .2s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

footer{border-top:1px solid var(--line);margin-top:44px;padding-top:18px;font-size:11.5px;color:var(--ink-faint);display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}

/* ═══════════ responsive ═══════════ */
@media (max-width:760px){
  .week{grid-template-columns:74px 1fr;gap:12px}
  .wk-right{grid-column:2;flex-direction:row;align-items:center;flex-wrap:wrap;padding-top:0}
  .head-inner{padding:12px 16px}
  .wrap,.tabs-inner{padding:0 16px}
  nav.tabs{top:63px}
}

/* ═══════════ print / PNG export ═══════════ */
.export-frame{background:var(--paper)}
body.exporting .no-export,body.exporting nav.tabs,body.exporting header{display:none!important}
body.exporting .week:hover{background:none}
@media print{
  @page{size:letter portrait;margin:12mm}
  body{padding:0;background:#fff}
  header,nav.tabs,.toolbar,.no-print,.edit-banner,footer .no-print,.scrim,.toast{display:none!important}
  .wrap{max-width:100%;padding:0}
  .week,.season,.card,tr{break-inside:avoid}
  .season-head{break-after:avoid}
  a{text-decoration:none;color:var(--ink)}
  .print-head{display:block!important}
  .week.open{background:none;border-left:3px solid var(--accent);padding-left:8px}
  .stat,.card,table.grid{box-shadow:none}
}
.print-head{display:none;padding-bottom:14px;margin-bottom:18px;border-bottom:1.5px solid var(--ink)}
.print-head .t{font-family:"Fraunces",Georgia,serif;font-size:24px;font-weight:600}
.print-head .s{font-size:11.5px;color:var(--ink-soft);margin-top:4px;font-family:"Geist Mono",monospace}
body.exporting .print-head{display:block}
</style>
</head>
<body>
<header class="no-export">
  <div class="head-inner">
    <div class="brand">
      <div class="mark">忍</div>
      <div>
        <h1>Sharp Ninja Academy</h1>
        <div class="sub">Master Hub · Alan &amp; Ben</div>
      </div>
    </div>
    <div class="head-right">
      <div class="status"><span class="dot" id="saveDot"></span><span id="saveLabel">seed data</span></div>
      <button class="btn" id="editBtn" title="Turn on click-to-edit for every field on this page">Edit</button>
      <button class="btn" id="syncBtn" title="Export or import the hub's data as JSON">Data</button>
    </div>
  </div>
</header>

<nav class="tabs no-export"><div class="tabs-inner" id="tabBar"></div></nav>

<main class="wrap" id="view"></main>

<div class="wrap no-export">
  <footer>
    <span>Source of truth: <a href="#" id="sheetLink" target="_blank" rel="noopener">Group Calls 2026</a> · mentee performance: <a href="#" id="dashLink" target="_blank" rel="noopener">SNA Dashboard</a></span>
    <span class="mono" id="stamp"></span>
  </footer>
</div>

<div class="scrim" id="scrim">
  <div class="modal">
    <h3 id="mTitle">Data</h3>
    <p id="mBody"></p>
    <textarea id="mText" spellcheck="false"></textarea>
    <div class="modal-actions" id="mActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   SEED DATA — mirrored from the Google Sheet "Group Calls 2026"
   https://docs.google.com/spreadsheets/d/1-GS8NfuURZFTqLI9qSjT6TcBj4VeTFr79j1gPYt8HsA
   Owner: sharpninjaben@gmail.com · snapshot taken 2026-08-18

   This is the fallback / starting point. Once you edit inside the hub, your
   copy lives in localStorage and this seed is only used on a fresh browser
   or after you hit "Reset to seed".
   ══════════════════════════════════════════════════════════════════════════ */
const SEED = {
  meta: {
    title: "Sharp Ninja Academy",
    subtitle: "Master Hub",
    sheetName: "Group Calls 2026",
    sheetUrl: "https://docs.google.com/spreadsheets/d/1-GS8NfuURZFTqLI9qSjT6TcBj4VeTFr79j1gPYt8HsA/edit",
    dashboardUrl: "https://allinalan.github.io/sna-dashboard/",
    snapshot: "2026-08-18"
  },

  /* ── Tab 1: the 2026 group-call calendar ──────────────────────────────
     one row per Tuesday. `alt` = the earlier 2026 draft that lives at the
     bottom of the archive tab, kept alongside so both plans are visible. */

          {id:"money", label:"Money", count:()=>DATA.money.length, render:renderMoney}
        Optional: printable:true   →  gives that tab Export PNG + Print buttons.

   Nothing else needs to change — the tab bar, routing, edit mode, localStorage,
   PNG export and printing all pick it up automatically.
   ═══════════════════════════════════════════════════════════════════════════ */

const STORE_KEY = "sna-master-hub-v1";

/* ── state ────────────────────────────────────────────────────────────── */
let DATA = load();
let DIRTY = !!localStorage.getItem(STORE_KEY);
let EDITING = false;
let TAB = (location.hash || "#calendar").slice(1);
const UI = { season:"all", presenter:"all", open:false, q:"", archCampaign:"all" };

function load(){
  let saved = null;
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) saved = JSON.parse(raw);
  }catch(e){ console.warn("Saved copy is not readable JSON; starting from the seed:", e); }

  if(!saved) return migrate(clone(SEED));
  /* If the upgrade step ever fails, use their data as it stands. Falling back to
     the seed here would quietly wipe out someone's planning. */
  try{ return migrate(saved); }
  catch(e){ console.error("Couldn't upgrade the saved copy; using it unchanged:", e); return saved; }
}
/* keeps an older saved copy working when the seed gains new sections */
function migrate(d){
  const base = clone(SEED);
  for(const k of Object.keys(base)) if(!(k in d)) d[k] = base[k];
  ensureYears(d);
  return d;
}

/* ── the calendar rolls itself forward ──────────────────────────────────
   Always keep this year and next year on the board, so Spring of the coming
   year is plannable long before it arrives and nobody has to remember to add
   it. Generating is deterministic — same dates, same empty fields — so if
   Alan and Ben both generate a year, the copies are identical. ── */
function ensureYears(d){
  if(!Array.isArray(d.calendar)) return;
  const now = new Date().getFullYear();
  for(const y of [now, now + 1]) if(!hasYear(d.calendar, y)) d.calendar.push(...blankYear(d.calendar, y));
  d.calendar.sort((a, b) => a.date.localeCompare(b.date));
}
/* Declarations, not const arrows: ensureYears() runs while this script is still
   being evaluated, and a const wouldn't be initialised yet. */
function hasYear(cal, y){ return cal.some(r => r.date.startsWith(y + "-")); }
function yearsIn(cal){ return [...new Set(cal.map(r => Number(r.date.slice(0, 4))))].sort(); }

/* Which weekday are calls on? Read it off the existing rows rather than
   assuming Tuesday, so moving the call night doesn't break next year. */
function callWeekday(cal){
  const tally = {};
  for(const r of cal){ const d = parseDate(r.date).getDay(); tally[d] = (tally[d] || 0) + 1; }
  const best = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0];
  return best === undefined ? 2 : Number(best);   // 2 = Tuesday
}
function blankYear(cal, year){
  const want = callWeekday(cal);
  const d = new Date(year, 0, 1);
  while(d.getDay() !== want) d.setDate(d.getDate() + 1);
  const out = [];
  while(d.getFullYear() === year){
    out.push({date: year + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"),
              topic:"", track:"", presenter:""});
    d.setDate(d.getDate() + 7);
  }
  return out;
}
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
    DIRTY = true; DF = null; paintSaveState();   // topic weights are rebuilt from the edited data
    if(typeof scheduleSync === "function") scheduleSync();
  }catch(e){ toast("Couldn't save locally — export your JSON to be safe"); }
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ── tiny helpers ─────────────────────────────────────────────────────── */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $  = s => document.querySelector(s);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function parseDate(iso){ const [y,m,d] = String(iso).split("-").map(Number); return new Date(y, m-1, d); }
function fmtDate(iso){ const d = parseDate(iso); return MONTHS[d.getMonth()] + " " + d.getDate(); }
function fmtDay(iso){ return DAYS[parseDate(iso).getDay()]; }
function fmtFull(iso){ const d = parseDate(iso); return MONTHS[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear(); }

/* ── reading a date the way a person would type it ──────────────────────
   A call moving nights shouldn't mean typing ISO format. All of these work:
     Jan 6 · January 6th · 6 Jan · 1/6 · 1/6/27 · 01-06-2027 · 2027-01-06
   A year is optional — leave it off and the week keeps the year it's already
   in, so nudging a 2027 call to "Jan 13" doesn't drag it back to this year. */
function makeISO(y, m, d){
  if(!(y >= 2000 && y <= 2100) || m < 1 || m > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, m - 1, d);
  if(dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;   // catches Feb 30 and friends
  return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}
function parseLooseDate(text, defaultYear){
  const t = String(text || "").trim().replace(/,/g, " ");
  if(!t) return null;
  let m;
  if((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return makeISO(+m[1], +m[2], +m[3]);
  if((m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/))){
    let y = m[3] ? Number(m[3]) : defaultYear;
    if(y < 100) y += 2000;
    return makeISO(y, +m[1], +m[2]);
  }
  let mi = -1, day = null, yr = null;
  for(const w of t.split(/\s+/)){
    const i = MONTHS.findIndex(x => w.toLowerCase().startsWith(x.toLowerCase()));
    if(i >= 0 && mi < 0){ mi = i; continue; }
    const n = Number(w.replace(/(st|nd|rd|th)$/i, ""));
    if(!isNaN(n) && w.trim() !== ""){
      if(w.replace(/\D/g, "").length === 4) yr = n;
      else if(day === null) day = n;
    }
  }
  if(mi >= 0 && day !== null) return makeISO(yr || defaultYear, mi + 1, day);
  return null;
}

/* Spring = Jan–Apr (I) · Summer = May–Aug (II) · Fall = Sep–Dec (III) —
   the same split the mentee dashboard uses, so campaigns line up across tools. */
const SEASONS = [
  {key:"Spring", roman:"I",   range:"January – April",   test:m => m <= 3},
  {key:"Summer", roman:"II",  range:"May – August",      test:m => m >= 4 && m <= 7},
  {key:"Fall",   roman:"III", range:"September – December", test:m => m >= 8}
];
function seasonOf(iso){ const m = parseDate(iso).getMonth(); return SEASONS.find(s => s.test(m)); }

/* who's on the call — drives the colour of the presenter chip */
function presenterClass(p){
  const s = String(p||"").toLowerCase();
  const hasA = s.includes("alan"), hasB = s.includes("ben");
  const noA = /no alan|alan will not|alan not/.test(s), noB = /no ben|ben will not|ben not/.test(s);
  if(!s.trim()) return "tbd";
  if(hasA && hasB && !noA && !noB) return "both";
  if(hasA && !noA) return "alan";
  if(hasB && !noB) return "ben";
  if(hasA) return "alan";
  if(hasB) return "ben";
  return "tbd";
}
function isPlanned(r){ return !!String(r.topic||"").trim(); }
function isBlocked(r){ return r.status === "blocked"; }

/* ── topic cross-referencing: has this bank topic already been run? ─────
   Plain word overlap matched far too much — in this business almost every
   topic contains "closing" or "objections". So each word is weighted by how
   rare it is across all our topics (a document-frequency weight): "cookware"
   counts for a lot, "closing" counts for very little. Two topics are related
   when they share enough *distinctive* weight. ── */
const STOP = new Set("a an the and or of to in on at for with your you our my is it that this how not more less by from we us can".split(" "));
const stem = w => w.length > 3 && w.endsWith("s") ? w.slice(0, -1) : w;
function tokens(s){
  return [...new Set(String(s||"").toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/)
    .filter(w => w.length > 2 && !STOP.has(w)).map(stem))];
}
let DF = null;
function buildDF(){
  DF = new Map();
  const corpus = [...DATA.archive.map(r => r.topic), ...DATA.calendar.map(r => r.topic),
                  ...Object.values(DATA.topicBank).flat()].filter(Boolean);
  for(const t of corpus) for(const w of tokens(t)) DF.set(w, (DF.get(w) || 0) + 1);
}
const wt   = w => 1 / Math.sqrt((DF && DF.get(w)) || 1);
const mass = a => a.reduce((n, w) => n + wt(w), 0);

const SHARE_FLOOR = 0.45;   // needs genuinely distinctive overlap, not one common word
const SHARE_RATIO = 0.70;   // ...and it must cover most of the shorter topic

function related(a, b){
  if(!DF) buildDF();
  const A = tokens(a), B = tokens(b);
  if(!A.length || !B.length) return false;
  const inB = new Set(B);
  let shared = 0;
  for(const w of A) if(inB.has(w)) shared += wt(w);
  if(shared < SHARE_FLOOR) return false;
  return shared / Math.min(mass(A), mass(B)) >= SHARE_RATIO;
}
/* {past: already delivered, newest first · future: still on the calendar}
   A calendar week that has come and gone counts as delivered — otherwise a
   topic taught in March 2026 would still read as "scheduled" in 2027. */
function findUses(topic){
  const today = todayISO();
  const done = DATA.calendar.filter(r => isPlanned(r) && r.date < today && related(topic, r.topic));
  const past = DATA.archive.filter(r => related(topic, r.topic)).concat(done)
                           .sort((a, b) => b.date.localeCompare(a.date));
  const future = DATA.calendar.filter(r => isPlanned(r) && r.date >= today && related(topic, r.topic))
                              .sort((a, b) => a.date.localeCompare(b.date));
  return {past, future};
}

/* ── structural edits, all driven by the same dot-paths as the text fields ── */
function getPath(path){
  return path.split(".").reduce((n, k) => (n == null ? n : n[k]), DATA);
}
function parentOf(path){
  const parts = path.split(".");
  const key = parts.pop();
  return {node: parts.reduce((n, k) => n[k], DATA), key};
}
function removeAt(path){
  const {node, key} = parentOf(path);
  if(Array.isArray(node)) node.splice(Number(key), 1);
  else delete node[key];
}
function addTo(path, value){
  const target = getPath(path);
  if(Array.isArray(target)) target.push(value);
}
/* rename an object key while keeping its position in the list */
function renameKey(objPath, oldKey, newKey){
  const obj = getPath(objPath);
  if(!obj || !(oldKey in obj) || !newKey || newKey === oldKey) return false;
  if(newKey in obj) return false;
  const rebuilt = {};
  for(const k of Object.keys(obj)) rebuilt[k === oldKey ? newKey : k] = obj[k];
  const {node, key} = parentOf(objPath);
  node[key] = rebuilt;
  return true;
}

/* ── toast + save indicator ───────────────────────────────────────────── */
let toastTimer;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
}
function paintSaveState(){
  if(typeof syncOn === "function" && syncOn()) return;   // sync owns the status line
  $("#saveDot").className = "dot" + (DIRTY ? " edited" : "");
  $("#saveLabel").textContent = DIRTY ? "your edits (saved locally)" : "seed data";
}

/* ═══════════════════════════════════════════════════════════════════════════
   TAB REGISTRY — add a tab here and everything else wires itself up.
   ═══════════════════════════════════════════════════════════════════════════ */
const TABS = [
  {id:"calendar", label:"Campaign Calendar", printable:true,
   count:()=>{ const y = DATA.calendar.filter(r => Number(r.date.slice(0,4)) === UI.year);
               return y.filter(isPlanned).length + "/" + y.length; },
   render:renderCalendar},

  {id:"bank",     label:"Topic Bank", printable:true,
   count:()=>Object.values(DATA.topicBank).reduce((n,a)=>n+a.length,0),
   render:renderBank},

  {id:"archive",  label:"Call Archive", printable:true,
   count:()=>DATA.archive.length,
   render:renderArchive},

  {id:"business", label:"Orders of Business", printable:true,
   count:()=>{ const all = Object.values(DATA.business).flat();
               return all.filter(i => !i.done).length + " open"; },
   render:renderBusiness},

  {id:"speakers", label:"Guest Speakers", printable:true,
   count:()=>DATA.speakers.length,
   render:renderSpeakers}
];

/* ═══════════ shared bits every tab can use ═══════════ */

/* an editable field. path is a dot-path into DATA, e.g. "calendar.3.topic" */
function ed(path, value, cls, placeholder){
  const empty = !String(value||"").trim();
  return `<span class="${cls||""}" data-edit="${path}"${empty && placeholder ? ` data-ph="${esc(placeholder)}"` : ""}>${esc(value||(empty&&placeholder?placeholder:""))}</span>`;
}
/* Same as ed(), but stays editable with Edit mode off. Assigning an owner and
   setting a due date is the whole point of the Orders tab — making people flip
   a mode first would just be in the way. */
function edLive(path, value, cls, placeholder){
  return ed(path, value, cls, placeholder).replace("<span ", "<span data-live ");
}
function toolbar(inner){ return `<div class="toolbar no-export no-print">${inner}</div>`; }
function exportButtons(id, label){
  return `<button class="btn primary" data-png="${id}" data-label="${esc(label)}">Export PNG</button>
          <button class="btn" data-print="${id}">Print / PDF</button>`;
}
function printHead(title, sub){
  return `<div class="print-head"><div class="t">Sharp Ninja Academy — ${esc(title)}</div><div class="s">${esc(sub)}</div></div>`;
}
function seg(name, opts, current){
  return `<div class="seg">` + opts.map(o =>
    `<button data-seg="${name}" data-val="${esc(o.v)}" class="${current===o.v?"on":""}">${esc(o.l)}</button>`
  ).join("") + `</div>`;
}
/* edit-mode affordances. They only appear while Edit is on (CSS .edit-only). */
function del(path, label){
  return ` <button class="del edit-only no-export no-print" data-del="${path}" title="Delete${label?" "+esc(label):""}">×</button>`;
}
function addBtn(path, noun){
  return `<button class="btn sm edit-only no-export no-print" data-add="${path}">+ ${esc(noun)}</button>`;
}
function statBox(lab, val, meta, alert){
  return `<div class="stat${alert?" alert":""}"><div class="lab">${esc(lab)}</div><div class="val">${esc(val)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:""}</div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   TAB 1 — CAMPAIGN CALENDAR
   ═══════════════════════════════════════════════════════════════════════════ */
function renderCalendar(){
  const years = yearsIn(DATA.calendar);
  if(!years.includes(UI.year)) UI.year = years.includes(new Date().getFullYear())
    ? new Date().getFullYear() : years[years.length - 1];
  const rows = DATA.calendar.filter(r => Number(r.date.slice(0,4)) === UI.year);

  /* the numbers follow the campaign you're looking at — so an exported
     "Fall III" board reports Fall's coverage, not the whole year's */
  const scope = UI.season === "all" ? rows : rows.filter(r => seasonOf(r.date).key === UI.season);
  const scopeName = (UI.season === "all" ? "" : UI.season + " ") + UI.year;
  const planned = scope.filter(isPlanned).length;
  const blocked = scope.filter(isBlocked).length;
  const open    = scope.filter(r => !isPlanned(r) && !isBlocked(r)).length;
  const alan    = scope.filter(r => ["alan","both"].includes(presenterClass(r.presenter))).length;
  const ben     = scope.filter(r => ["ben","both"].includes(presenterClass(r.presenter))).length;
  const tbd     = scope.filter(r => isPlanned(r) && presenterClass(r.presenter)==="tbd").length;

  const q = UI.q.toLowerCase();
  const visible = scope.filter(r => {
    if(UI.presenter !== "all"){
      const c = presenterClass(r.presenter);
      if(UI.presenter === "tbd" ? c !== "tbd" : !(c === UI.presenter || c === "both")) return false;
    }
    if(UI.open && (isPlanned(r) || isBlocked(r))) return false;
    if(q && !JSON.stringify(r).toLowerCase().includes(q)) return false;
    return true;
  });

  const nextYear = years[years.length - 1] + 1;

  let html = `
  <div class="page-head no-export no-print">
    <div>
      <div class="eyebrow">Group Calls</div>
      <div class="big serif">Campaign Calendar</div>
      <div class="lede">Every call night of the year. This year and next are always here —
        the board rolls itself forward, so Spring is plannable months ahead. Turn on
        <b>Edit</b> to plan straight into the page, then <b>Export PNG</b> for a clean image.</div>
    </div>
  </div>`;

  html += toolbar(`
    ${seg("year", years.map(y => ({v:String(y), l:String(y)})), String(UI.year))}
    ${seg("season", [{v:"all",l:"All year"},{v:"Spring",l:"Spring I"},{v:"Summer",l:"Summer II"},{v:"Fall",l:"Fall III"}], UI.season)}
    ${seg("presenter", [{v:"all",l:"Everyone"},{v:"alan",l:"Alan"},{v:"ben",l:"Ben"},{v:"tbd",l:"No host"}], UI.presenter)}
    <button class="btn ${UI.open?"on":""}" data-toggle="open">Open weeks only</button>
    <input class="search" id="q" placeholder="Search topics, tracks, notes…" value="${esc(UI.q)}">
    <span class="grow"></span>
    <button class="btn" data-addyear="${nextYear}" title="Add every call night of ${nextYear}">+ ${nextYear}</button>
    ${exportButtons("calBoard", scopeName + " Campaign Calendar")}`);

  html += `<div id="calBoard" class="export-frame">`;
  html += printHead(scopeName + " Campaign Calendar",
      `${planned} of ${scope.length} weeks planned · ${open} open · printed ${fmtFull(todayISO())}`);

  html += `<div class="stats">
    ${statBox("Weeks planned", planned + " / " + scope.length, Math.round(planned/(scope.length||1)*100) + "% of " + (UI.season==="all"? UI.year : UI.season))}
    ${statBox("Open weeks", open, open ? "still to fill" : "fully booked", open > 0)}
    ${statBox("Alan on", alan, "calls")}
    ${statBox("Ben on", ben, "calls")}
    ${statBox("Blocked", blocked, "NET, wedding, etc.")}
    ${statBox("Host TBD", tbd, "planned, no host", tbd > 0)}
  </div>`;

  if(!visible.length){
    html += `<div class="empty-note">No weeks match those filters.</div>`;
  } else {
    for(const S of SEASONS){
      const group = visible.filter(r => seasonOf(r.date).key === S.key);
      if(!group.length) continue;
      const gAll = rows.filter(r => seasonOf(r.date).key === S.key);
      const gPlanned = gAll.filter(isPlanned).length;
      html += `<section class="season">
        <div class="season-head">
          <span class="roman">${S.roman}</span>
          <h3>${S.key} ${UI.year}</h3>
          <span class="range">${S.range}</span>
          <span class="fill">${gPlanned}/${gAll.length} planned</span>
        </div>`;
      for(const r of group) html += weekRow(r, DATA.calendar.indexOf(r), gAll.indexOf(r) + 1);
      html += `</section>`;
    }
  }

  /* backlog / parking lot */
  html += `<div class="sec-title serif">Backlog <span class="n">— ideas parked, not yet on a date</span>
    <button class="btn sm edit-only no-export no-print" data-addkey="backlog">+ list</button></div><div class="cols">`;
  for(const [name, list] of Object.entries(DATA.backlog)){
    html += `<div class="card"><h4>${ed("__key.backlog."+name, name)} <span class="n">${list.length}</span></h4><ul>`;
    list.forEach((item, i) => {
      const sched = findUses(item).future[0];
      html += `<li class="${sched?"sched":""}">${ed("backlog."+name+"."+i, item)}${
        sched ? `<span class="when sched">→ ${fmtDate(sched.date)}</span>` : ""}${del("backlog."+name+"."+i)}</li>`;
    });
    html += `</ul>${addBtn("backlog."+name, "idea")}</div>`;
  }
  html += `</div></div>`;
  return html;
}

/* one week row */
function weekRow(r, idx, wkNum){
  const p = "calendar." + idx;
  const cls = presenterClass(r.presenter);
  const planned = isPlanned(r), blocked = isBlocked(r);
  const state = blocked ? "blocked" : (planned ? "" : "open");

  let main = "";
  if(planned) main = `<div class="wk-topic serif">${ed(p+".topic", r.topic)}</div>`;
  else if(blocked) main = `<div class="wk-topic empty mono">${ed(p+".note", r.note || "blocked", "", "blocked")}</div>`;
  else main = `<div class="wk-topic empty mono">${ed(p+".topic", "", "", "+ open — click to plan")}</div>`;

  if(r.detail) main += `<div class="wk-detail">${ed(p+".detail", r.detail)}</div>`;

  const meta = [];
  if(r.track) meta.push(`<span class="chip track">${ed(p+".track", r.track)}</span>`);
  if(r.note && !blocked) meta.push(`<span class="chip note">${ed(p+".note", r.note)}</span>`);
  if(meta.length) main += `<div class="wk-meta">${meta.join("")}</div>`;

  if(r.second) main += `<div class="wk-sub"><span class="tag">2nd call</span><span>${ed(p+".second", r.second)}${
    r.secondPresenter ? ` <span class="chip second">${ed(p+".secondPresenter", r.secondPresenter)}</span>` : ""}</span></div>`;
  if(r.proposed) main += `<div class="wk-sub proposed"><span class="tag">proposed</span><span>${ed(p+".proposed", r.proposed)}</span></div>`;
  if(r.alt) main += `<div class="wk-sub alt no-export no-print"><span class="tag">alt draft</span><span>${ed(p+".alt", r.alt)}</span></div>`;

  /* in edit mode every week can gain the optional fields, or be wiped back to open */
  const extras = [];
  if(!r.track)  extras.push(`<button class="btn sm" data-setfield="${p}.track">+ track</button>`);
  if(!r.second) extras.push(`<button class="btn sm" data-setfield="${p}.second">+ 2nd call</button>`);
  if(!r.note)   extras.push(`<button class="btn sm" data-setfield="${p}.note">+ note</button>`);
  if(!r.detail) extras.push(`<button class="btn sm" data-setfield="${p}.detail">+ detail</button>`);
  if(planned || blocked || r.note) extras.push(`<button class="btn sm" data-clearweek="${p}">clear</button>`);
  main += `<div class="wk-meta edit-only no-export no-print">${extras.join("")}</div>`;

  return `<div class="week ${state}">
    <div class="wk-date mono"><span class="wknum">WK ${String(wkNum).padStart(2,"0")}</span>
      <b>${ed(p+".date", fmtDate(r.date))}</b>${fmtDay(r.date)}${del(p, "this week")}</div>
    <div class="wk-main">${main}</div>
    <div class="wk-right"><span class="chip ${cls} big">${ed(p+".presenter", r.presenter, "", "who?")}</span></div>
  </div>`;
}
function todayISO(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* ═══════════════════════════════════════════════════════════════════════════
   TAB 2 — TOPIC BANK
   Every topic is cross-checked against the archive and the 2026 calendar, so
   you can see at a glance what's been covered and what has never been run.
   ═══════════════════════════════════════════════════════════════════════════ */
function renderBank(){
  const cats = DATA.topicBank;
  const all = Object.values(cats).flat();
  let covered = 0, scheduled = 0;
  const marks = new Map();
  for(const t of all){
    const u = findUses(t);
    marks.set(t, u);
    if(u.past.length) covered++;
    if(u.future.length) scheduled++;
  }
  const q = UI.q.toLowerCase();

  let html = `
  <div class="page-head no-export no-print">
    <div>
      <div class="eyebrow">The full menu</div>
      <div class="big serif">Topic Bank</div>
      <div class="lede">Every topic we can teach, by category. A <b style="color:var(--good)">green</b> dot means
        we've run it before, <b style="color:var(--accent)">rust</b> means it's on the 2026 calendar, grey means untouched.</div>
    </div>
  </div>`;

  html += toolbar(`
    <button class="btn ${UI.open?"on":""}" data-toggle="open">Never-run only</button>
    <input class="search" id="q" placeholder="Search all ${all.length} topics…" value="${esc(UI.q)}">
    <span class="grow"></span>
    <button class="btn edit-only" data-addkey="topicBank">+ category</button>
    ${exportButtons("bankBoard", "Topic Bank")}`);

  html += `<div id="bankBoard" class="export-frame">`;
  html += printHead("Topic Bank", `${all.length} topics across ${Object.keys(cats).length} categories · printed ${fmtFull(todayISO())}`);
  html += `<div class="stats">
    ${statBox("Topics", all.length, "in the bank")}
    ${statBox("Already run", covered, "found in the archive")}
    ${statBox("On 2026 calendar", scheduled, "scheduled")}
    ${statBox("Never run", all.length - covered, "fresh material", true)}
    ${statBox("Categories", Object.keys(cats).length, "")}
  </div><div class="cols">`;

  let shown = 0;
  for(const [name, list] of Object.entries(cats)){
    const items = list.map((t,i) => ({t, i})).filter(({t}) => {
      if(q && !t.toLowerCase().includes(q)) return false;
      if(UI.open && marks.get(t).past.length) return false;
      return true;
    });
    /* an empty category still shows while you're editing — otherwise a category
       you just created would vanish before you could put anything in it */
    if(!items.length && !(EDITING && !q && !UI.open)) continue;
    shown += items.length;
    html += `<div class="card"><h4>${ed("__key.topicBank."+name, name)} <span class="n">${items.length}</span>${del("topicBank."+name, "category")}</h4><ul>`;
    for(const {t, i} of items){
      const u = marks.get(t);
      const last = u.past[0], next = u.future[0];
      const cls = next ? "sched" : (last ? "used" : "");
      let when = "";
      if(next) when = `<span class="when sched">${parseDate(next.date).getFullYear()} · ${fmtDate(next.date)}</span>`;
      else if(last) when = `<span class="when">last ${fmtDate(last.date)} '${String(parseDate(last.date).getFullYear()).slice(2)}</span>`;
      html += `<li class="${cls}">${ed("topicBank."+name+"."+i, t)}${when}${del("topicBank."+name+"."+i)}</li>`;
    }
    html += `</ul>${addBtn("topicBank."+name, "topic")}</div>`;
  }
  if(!shown) html += `<div class="empty-note">No topics match.</div>`;
  html += `</div></div>`;
  return html;
}

/* ═══════════════════════════════════════════════════════════════════════════
   TAB 5 — NEXT ORDERS OF BUSINESS
   A working list, not a document: tick, assign and date without flipping into
   Edit mode. Edit mode is only needed to add or delete things.
   ═══════════════════════════════════════════════════════════════════════════ */
function dueState(item){
  if(item.done) return "done";
  if(!item.due) return "none";
  const today = todayISO();
  if(item.due < today) return "over";
  const soon = new Date(); soon.setDate(soon.getDate() + 14);
  return item.due <= soon.toISOString().slice(0,10) ? "soon" : "later";
}
function renderBusiness(){
  const groups = DATA.business;
  const all = Object.entries(groups).flatMap(([g, list]) => list.map((i, idx) => ({i, g, idx})));
  const open = all.filter(x => !x.i.done);
  const overdue = open.filter(x => dueState(x.i) === "over");
  const soon = open.filter(x => dueState(x.i) === "soon");
  const mine = who => open.filter(x => String(x.i.who||"").toLowerCase().includes(who)).length;
  const unassigned = open.filter(x => !String(x.i.who||"").trim()).length;

  const q = UI.q.toLowerCase();
  const show = x => {
    if(UI.bizView === "open" && x.i.done) return false;
    if(UI.bizView === "done" && !x.i.done) return false;
    if(UI.bizView === "dated" && (!x.i.due || x.i.done)) return false;
    if(UI.presenter !== "all"){
      const w = String(x.i.who||"").toLowerCase();
      if(UI.presenter === "tbd" ? w.trim() !== "" : !w.includes(UI.presenter)) return false;
    }
    if(q && !JSON.stringify(x.i).toLowerCase().includes(q)) return false;
    return true;
  };

  let html = `
  <div class="page-head no-export no-print">
    <div>
      <div class="eyebrow">Between the two of you</div>
      <div class="big serif">Next Orders of Business</div>
      <div class="lede">Everything you two still owe each other. Tick it, put a name on it,
        give it a date — no need to turn on Edit for any of that. Edit mode is only for
        adding or deleting.</div>
    </div>
  </div>`;

  html += toolbar(`
    ${seg("bizView", [{v:"open",l:"Open"},{v:"dated",l:"Has a date"},{v:"done",l:"Done"},{v:"all",l:"All"}], UI.bizView)}
    ${seg("presenter", [{v:"all",l:"Anyone"},{v:"alan",l:"Alan"},{v:"ben",l:"Ben"},{v:"tbd",l:"Unassigned"}], UI.presenter)}
    <input class="search" id="q" placeholder="Search ${all.length} items…" value="${esc(UI.q)}">
    <span class="grow"></span>
    <button class="btn edit-only" data-addkey="business">+ section</button>
    ${exportButtons("bizBoard", "Next Orders of Business")}`);

  html += `<div id="bizBoard" class="export-frame">`;
  html += printHead("Next Orders of Business",
    `${open.length} open · ${all.length - open.length} done · printed ${fmtFull(todayISO())}`);
  html += `<div class="stats">
    ${statBox("Still open", open.length, "of " + all.length + " total")}
    ${statBox("Overdue", overdue.length, overdue.length ? "past their date" : "nothing late", overdue.length > 0)}
    ${statBox("Due soon", soon.length, "next 14 days")}
    ${statBox("On Alan", mine("alan"), "open items")}
    ${statBox("On Ben", mine("ben"), "open items")}
    ${statBox("Unassigned", unassigned, "nobody owns these", unassigned > 0)}
  </div>`;

  let shown = 0;
  for(const [name, list] of Object.entries(groups)){
    /* open first, then by due date, undated last, done sunk to the bottom */
    const order = list.map((i, idx) => ({i, idx, g:name})).filter(show).sort((a, b) => {
      if(a.i.done !== b.i.done) return a.i.done ? 1 : -1;
      if(!!a.i.due !== !!b.i.due) return a.i.due ? -1 : 1;
      return (a.i.due || "").localeCompare(b.i.due || "");
    });
    if(!order.length && !(EDITING && !q && UI.bizView === "all")) continue;
    shown += order.length;
    const openN = list.filter(i => !i.done).length;
    html += `<div class="sec-title serif">${ed("__key.business."+name, name)}
      <span class="n">${openN} open / ${list.length}</span>${del("business."+name, "section")}</div>
      <div class="biz">`;
    for(const {i, idx} of order){
      const p = "business." + name + "." + idx;
      const st = dueState(i);
      html += `<div class="biz-row ${i.done?"is-done":""}">
        <button class="tick ${i.done?"on":""}" data-check="${p}" title="${i.done?"Mark as still open":"Mark done"}" aria-pressed="${i.done}">${i.done?"✓":""}</button>
        <div class="biz-main">
          <div class="biz-t">${ed(p+".t", i.t)}</div>
          ${i.note ? `<div class="biz-note">${ed(p+".note", i.note)}</div>` : ""}
        </div>
        <span class="chip ${presenterClass(i.who)} who">${edLive(p+".who", i.who, "", "assign")}</span>
        <span class="due ${st}">${edLive(p+".due", i.due ? fmtDate(i.due) : "", "", "add date")}</span>
        ${del(p, "this item")}
      </div>`;
    }
    html += `${addBtn("business."+name, "item")}</div>`;
  }
  if(!shown) html += `<div class="empty-note">Nothing matches — try the <b>All</b> filter.</div>`;
  html += `</div>`;
  return html;
}

/* ═══════════════════════════════════════════════════════════════════════════
   SHARED SYNC — so Alan and Ben see each other's edits
   ───────────────────────────────────────────────────────────────────────────
   The page is static (GitHub Pages), so the shared copy lives in a Google
   Sheet and a small Apps Script Web App reads and writes it. Same shape as
   the mentee dashboard's script. Setup is in README.md → "Turning on sync".

   Reads are a plain GET. Writes POST with Content-Type text/plain on purpose:
   anything else makes the browser send a CORS preflight, which Apps Script
   web apps don't answer.
   ═══════════════════════════════════════════════════════════════════════════ */
const SYNC = {
  url:   "https://script.google.com/macros/s/AKfycbyw7ngyqNuO9AHQnCeb1paTfoDRWX1sTkJMlhC2zB9BKDuo_O-SF9XWke2e1QiA_Y9A/exec",
         // ↑ Apps Script web app (SNA Hub Sync). Redeploy a NEW VERSION there
         //   after editing the .gs, or it keeps serving the old code.
  token: "sharpninja",// must match TOKEN in SharpNinja-Hub-Sync.gs
  pollMs: 25000
};

const syncOn = () => !!SYNC.url;
let REV = Number(localStorage.getItem(STORE_KEY + ":rev") || 0);
let REMOTE = {rev:0, by:"", updated:""};
let PUSH_TIMER = null, PUSHING = false, PENDING = false;

/* who's editing — asked once, only used to label changes */
function whoAmI(){
  let w = localStorage.getItem(STORE_KEY + ":who");
  if(!w){
    w = (prompt("Who's using this hub? (so edits are labelled)\n\nType Alan or Ben:", "") || "").trim();
    if(w) localStorage.setItem(STORE_KEY + ":who", w);
  }
  return w || "someone";
}
function setRev(n){ REV = n; localStorage.setItem(STORE_KEY + ":rev", String(n)); }

function syncStatus(text, kind){
  const el = $("#saveLabel"), dot = $("#saveDot");
  if(!el) return;
  el.textContent = text;
  dot.className = "dot" + (kind === "warn" ? " edited" : "");
}
function ago(iso){
  if(!iso) return "";
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if(s < 60) return "just now";
  if(s < 3600) return Math.round(s/60) + "m ago";
  if(s < 86400) return Math.round(s/3600) + "h ago";
  return Math.round(s/86400) + "d ago";
}

/* ── pull ─────────────────────────────────────────────────────────────── */
async function pull(quiet){
  if(!syncOn()) return;
  try{
    const res = await fetch(SYNC.url + "?token=" + encodeURIComponent(SYNC.token) + "&t=" + Date.now());
    const body = await res.json();
    if(!body.ok) throw new Error(body.error || "refused");
    REMOTE = {rev:body.rev, by:body.by, updated:body.updated};

    if(body.rev > REV && body.data){
      /* someone else moved ahead of us */
      if(PENDING || PUSHING){
        syncStatus(body.by + " also edited — yours will win on save", "warn");
        return;
      }
      DATA = migrate(body.data); DF = null; setRev(body.rev);
      localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
      render();
      if(!quiet) toast(body.by ? body.by + "'s changes loaded" : "Updated from the shared copy");
    }
    if(!PENDING && !PUSHING) syncStatus("shared · " + (REMOTE.by ? REMOTE.by + " " + ago(REMOTE.updated) : "in sync"));
  }catch(e){
    console.warn("pull failed", e);
    syncStatus("offline — editing locally", "warn");
  }
}

/* ── push (debounced) ─────────────────────────────────────────────────── */
function scheduleSync(){
  if(!syncOn()) return;
  PENDING = true;
  syncStatus("saving…", "warn");
  clearTimeout(PUSH_TIMER);
  PUSH_TIMER = setTimeout(push, 1200);
}
async function push(){
  if(!syncOn() || PUSHING) return;
  PUSHING = true; PENDING = false;
  try{
    const res = await fetch(SYNC.url, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},   // keeps it a simple request — no preflight
      body: JSON.stringify({token: SYNC.token, baseRev: REV, by: whoAmI(), data: DATA})
    });
    const body = await res.json();
    if(body.conflict){
      REMOTE = {rev:body.rev, by:body.by, updated:body.updated};
      showConflict(body);
      syncStatus("conflict with " + body.by, "warn");
      return;
    }
    if(!body.ok) throw new Error(body.error || "refused");
    setRev(body.rev);
    REMOTE = {rev:body.rev, by:whoAmI(), updated:new Date().toISOString()};
    syncStatus("shared · saved just now");
  }catch(e){
    console.warn("push failed", e);
    syncStatus("offline — saved on this computer only", "warn");
  }finally{
    PUSHING = false;
    if(PENDING) scheduleSync();
  }
}

/* both sides edited the same version — let the human pick */
function showConflict(body){
  $("#mTitle").textContent = "Both of you edited this";
  $("#mBody").innerHTML = `<b>${esc(body.by || "The other person")}</b> saved changes ${esc(ago(body.updated))} while you were editing. ` +
    `Keeping yours overwrites theirs; taking theirs discards what you just changed. ` +
    `Either way the Google Sheet keeps a version history, so nothing is truly lost.`;
  $("#mText").value = JSON.stringify(body.data, null, 2);
  $("#mActions").innerHTML = `
    <button class="btn" data-act="takeTheirs">Take ${esc(body.by || "theirs")}</button>
    <span style="flex:1"></span>
    <button class="btn primary" data-act="keepMine">Keep mine</button>`;
  $("#scrim").classList.add("on");
  window._conflict = body;
}

/* ═══════════════════════════════════════════════════════════════════════════
   APP — routing, rendering, editing, export
   ═══════════════════════════════════════════════════════════════════════════ */
function currentTab(){ return TABS.find(t => t.id === TAB) || TABS[0]; }

function paintTabs(){
  $("#tabBar").innerHTML = TABS.map(t =>
    `<button class="tab ${t.id===TAB?"on":""}" data-tab="${t.id}">${esc(t.label)}<span class="ct">${
      t.count ? esc(t.count()) : ""}</span></button>`).join("");
}

/* Clicking straight from one field to the next used to swallow the second click:
   leaving field A saves and re-renders, which destroys field B before the click
   lands on it. mousedown fires first, so we note where the click is headed and
   put the cursor back there once the new DOM exists. */
let PENDING_FOCUS = null;
document.addEventListener("mousedown", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  PENDING_FOCUS = el ? el.dataset.edit : null;
});

function render(){
  const focused = document.activeElement && document.activeElement.id === "q";
  const caret = focused ? document.activeElement.selectionStart : null;
  paintTabs();
  $("#view").innerHTML = editBanner() + currentTab().render();
  applyEdit();
  if(focused){
    const q = $("#q");
    if(q){ q.focus(); try{ q.setSelectionRange(caret, caret); }catch(e){} }
  } else if(PENDING_FOCUS){
    const target = PENDING_FOCUS; PENDING_FOCUS = null;
    focusPath(target);
  }
}
function editBanner(){
  return `<div class="edit-banner no-export no-print">
    <b>Edit mode.</b>
    <span class="grow">Click any field to change it. Everything saves to this browser as you go — use <b>Data ▸ Export</b> to hand the plan to the other person.</span>
    <button class="btn sm" data-toggle="edit">Done editing</button>
  </div>`;
}

/* put the cursor in a field we just created */
function focusPath(path){
  const el = document.querySelector(`[data-edit="${CSS.escape(path)}"]`);
  if(!el) return;
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

/* ── dot-path get/set into DATA ───────────────────────────────────────── */
function setPath(path, value){
  const parts = path.split(".");
  let node = DATA;
  for(let i = 0; i < parts.length - 1; i++) node = node[parts[i]];
  node[parts[parts.length - 1]] = value;
}

/* ── edit mode ────────────────────────────────────────────────────────── */
function applyEdit(){
  document.body.classList.toggle("editing", EDITING);
  document.querySelectorAll("[data-edit]").forEach(el => {
    if(EDITING || el.hasAttribute("data-live")) el.setAttribute("contenteditable", "plaintext-only");
    else el.removeAttribute("contenteditable");
  });
  $("#editBtn").classList.toggle("on", EDITING);
  $("#editBtn").textContent = EDITING ? "Done" : "Edit";
}
document.addEventListener("focusin", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if(!el || !(EDITING || el.hasAttribute("data-live"))) return;
  if(el.dataset.ph && el.textContent.trim() === el.dataset.ph) el.textContent = "";
});
/* Optional fields disappear when emptied, rather than leaving a blank chip behind. */
const OPTIONAL_FIELDS = new Set(["track","note","second","secondPresenter","detail","proposed","alt",
                                 "series","call","hotSeat","hotSeatPresenter","lastAsked"]);

/* Save while typing. Blur still does the tidy-up pass and re-renders, but the
   text is already safe by then — closing the tab mid-edit doesn't lose it. */
let INPUT_TIMER = null;
document.addEventListener("input", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if(!el || !(EDITING || el.hasAttribute("data-live"))) return;
  const path = el.dataset.edit;
  if(path.startsWith("__key.") || path.endsWith(".date") || path.endsWith(".due")) return;   // these only apply once you're done
  clearTimeout(INPUT_TIMER);
  INPUT_TIMER = setTimeout(() => {
    setPath(path, el.textContent.replace(/\s+/g, " ").trim());
    save();                                        // deliberately no render — keeps your cursor put
  }, 500);
});

document.addEventListener("focusout", e => {
  const el = e.target.closest && e.target.closest("[data-edit]");
  if(!el || !(EDITING || el.hasAttribute("data-live"))) return;
  clearTimeout(INPUT_TIMER);
  const val = el.textContent.replace(/\s+/g, " ").trim();
  const path = el.dataset.edit;
  if(path.endsWith(".due")){                     // a due date on an order of business
    const item = getPath(path.slice(0, path.lastIndexOf(".")));
    if(!val){ item.due = ""; save(); render(); return; }
    const iso = parseLooseDate(val, new Date().getFullYear());
    if(!iso){ render(); return toast(`Couldn't read "${val}" as a date — try "Sep 3" or "9/3"`); }
    item.due = iso; save(); render();
    return toast("Due " + fmtFull(iso));
  }
  if(path.endsWith(".date")){                    // a call moved nights
    const row = getPath(path.slice(0, path.lastIndexOf(".")));
    const iso = parseLooseDate(val, Number(String(row.date).slice(0, 4)));
    if(!iso){ render(); return toast(`Couldn't read "${val}" as a date — try "Jan 6" or "1/6"`); }
    if(iso === row.date){ render(); return; }
    const clash = DATA.calendar.some(r => r !== row && r.date === iso);
    row.date = iso;
    DATA.calendar.sort((a, b) => a.date.localeCompare(b.date));
    UI.year = Number(iso.slice(0, 4));           // follow the week if it crossed a year
    save(); render();
    return toast("Moved to " + fmtFull(iso) + " (" + fmtDay(iso) + ")" +
                 (clash ? " — heads up, there's already a call that night" : ""));
  }
  if(path.startsWith("__key.")){                 // renaming a category / backlog list
    const rest = path.slice(6);
    const oldKey = rest.slice(rest.indexOf(".") + 1);
    const objPath = rest.slice(0, rest.indexOf("."));
    if(!renameKey(objPath, oldKey, val)) { render(); return toast(val ? "That name is already used" : "A name is required"); }
  } else if(val === "" && OPTIONAL_FIELDS.has(path.split(".").pop())){
    removeAt(path);                                // emptied an optional field — drop it entirely
  } else {
    setPath(path, val);
  }
  save();
  render();
});
document.addEventListener("keydown", e => {
  const live = el2 => el2 && (EDITING || el2.hasAttribute("data-live"));
  const el = e.target.closest && e.target.closest("[data-edit]");
  if(live(el) && e.key === "Enter"){ e.preventDefault(); el.blur(); }
  if(live(el) && e.key === "Escape"){ e.preventDefault(); render(); }
});

/* ── clicks ───────────────────────────────────────────────────────────── */
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if(!t) return;

  if(t.dataset.tab){ TAB = t.dataset.tab; location.hash = TAB; UI.q = ""; UI.presenter = "all"; render(); window.scrollTo(0,0); return; }
  if(t.dataset.seg){
    UI[t.dataset.seg] = t.dataset.seg === "year" ? Number(t.dataset.val) : t.dataset.val;
    render(); return;
  }
  if(t.dataset.toggle === "open"){ UI.open = !UI.open; render(); return; }
  if(t.dataset.toggle === "edit" || t.id === "editBtn"){ EDITING = !EDITING; render(); return; }
  if(t.dataset.png){ exportPNG(t.dataset.png, t.dataset.label); return; }
  if(t.dataset.print){ printBoard(t.dataset.print); return; }
  if(t.dataset.check){                                 // tick an order of business off
    const item = getPath(t.dataset.check);
    item.done = !item.done;
    if(item.done) item.doneOn = todayISO(); else delete item.doneOn;
    save(); render(); return;
  }

  /* ── structural edits, all path-driven ── */
  if(t.dataset.add){                                   // append to a list
    addTo(t.dataset.add, "New item");
    save(); EDITING = true; render();
    focusPath(t.dataset.add + "." + (getPath(t.dataset.add).length - 1)); return;
  }
  if(t.dataset.addrow){                                // append a table row
    const blanks = {speakers:{name:"New speaker", topic:"", lastAsked:""},
                    archive:{n:DATA.archive.length+1, date:todayISO(), topic:"New call",
                             campaign:DATA.archive.length ? DATA.archive[DATA.archive.length-1].campaign : "Archive"}};
    DATA[t.dataset.addrow].push(clone(blanks[t.dataset.addrow]));
    save(); EDITING = true; render();
    focusPath(t.dataset.addrow + "." + (DATA[t.dataset.addrow].length - 1) +
              (t.dataset.addrow === "speakers" ? ".name" : ".topic")); return;
  }
  if(t.dataset.addkey){                                // new named list (category / backlog list)
    const obj = getPath(t.dataset.addkey);
    let name = "New category", n = 2;
    while(name in obj) name = "New category " + n++;
    obj[name] = [];
    save(); EDITING = true; render();
    focusPath("__key." + t.dataset.addkey + "." + name); return;
  }
  if(t.dataset.addyear){                               // extend the calendar
    const y = Number(t.dataset.addyear);
    if(hasYear(DATA.calendar, y)) { UI.year = y; render(); return; }
    DATA.calendar.push(...blankYear(DATA.calendar, y));
    DATA.calendar.sort((a, b) => a.date.localeCompare(b.date));
    UI.year = y; save(); render();
    toast(y + " added — " + DATA.calendar.filter(r => r.date.startsWith(y + "-")).length + " call nights"); return;
  }
  if(t.dataset.setfield){                              // reveal an optional field on a week
    setPath(t.dataset.setfield, " ");
    save(); EDITING = true; render();
    focusPath(t.dataset.setfield); return;
  }
  if(t.dataset.clearweek){                             // wipe a week back to open
    const r = getPath(t.dataset.clearweek);
    const date = r.date;
    for(const k of Object.keys(r)) if(k !== "date") delete r[k];
    r.topic = ""; r.track = ""; r.presenter = ""; r.date = date;
    save(); render(); toast("Week cleared"); return;
  }
  if(t.dataset.del){
    const label = t.title || "this";
    if(!confirm("Delete " + label.replace(/^Delete /, "") + "?")) return;
    removeAt(t.dataset.del); save(); render(); toast("Deleted"); return;
  }
  if(t.id === "syncBtn"){ openData(); return; }
});
document.addEventListener("input", e => {
  if(e.target.id === "q"){ UI.q = e.target.value; clearTimeout(window._qt); window._qt = setTimeout(render, 160); }
});
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if(id && id !== TAB && TABS.some(t => t.id === id)){ TAB = id; render(); }
});

/* ═══════════ PRINT ═══════════ */
function printBoard(id){
  document.querySelectorAll(".export-frame").forEach(n => { n.dataset.hide = (n.id !== id) ? "1" : ""; });
  const style = document.createElement("style");
  style.id = "printOnly";
  style.textContent = `@media print{ [data-hide="1"]{display:none!important} .page-head{display:none!important} }`;
  document.head.appendChild(style);
  document.body.classList.add("exporting");
  setTimeout(() => {
    window.print();
    document.body.classList.remove("exporting");
    style.remove();
  }, 60);
}

/* ═══════════ PNG EXPORT ═══════════
   Renders the board into an <svg><foreignObject> and paints it to a canvas.
   No libraries, no network — except an optional pass that inlines the web
   fonts so the image looks identical to the screen. If that fetch fails
   (offline, or the file opened straight off disk) it falls back to system
   fonts and still produces a clean image. */
let FONT_CSS = null;
async function inlineFonts(){
  if(FONT_CSS !== null) return FONT_CSS;
  FONT_CSS = "";
  try{
    const link = [...document.querySelectorAll("link[rel=stylesheet]")].find(l => l.href.includes("fonts.googleapis"));
    if(!link) return FONT_CSS;
    const css = await (await fetch(link.href)).text();
    const blocks = css.split("@font-face").slice(1)
      .filter(b => b.includes("U+0000-00FF"));           // latin subset only — keeps it small
    const out = [];
    for(const b of blocks){
      const m = b.match(/url\((https:[^)]+\.woff2)\)/);
      if(!m) continue;
      const buf = await (await fetch(m[1])).arrayBuffer();
      let bin = ""; const bytes = new Uint8Array(buf);
      for(let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      out.push("@font-face" + b.replace(m[1], "data:font/woff2;base64," + btoa(bin)));
    }
    FONT_CSS = out.join("\n");
  }catch(e){ console.warn("Font inlining skipped:", e); FONT_CSS = ""; }
  return FONT_CSS;
}

async function exportPNG(id, label){
  const node = document.getElementById(id);
  if(!node) return toast("Nothing to export here");
  const btn = document.querySelector(`[data-png="${id}"]`);
  if(btn){ btn.disabled = true; btn.textContent = "Rendering…"; }
  document.body.classList.add("exporting");

  try{
    const fonts = await inlineFonts();
    const clone = node.cloneNode(true);
    clone.querySelectorAll(".no-export, [contenteditable]").forEach(n => {
      if(n.classList.contains("no-export")) n.remove(); else n.removeAttribute("contenteditable");
    });

    const width = Math.ceil(node.getBoundingClientRect().width);
    const pageCSS = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n");

    const holder = document.createElement("div");
    holder.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");
    holder.style.cssText = `width:${width}px;background:#F7F5F0;padding:28px;font-family:"Geist",-apple-system,sans-serif`;
    const st = document.createElement("style");
    st.textContent = fonts + "\n" + pageCSS + "\n.print-head{display:block!important}";
    holder.appendChild(st);
    holder.appendChild(clone);

    /* measure the real height off-screen before serialising */
    const probe = document.createElement("div");
    probe.style.cssText = `position:fixed;left:-99999px;top:0;width:${width + 56}px`;
    probe.appendChild(holder.cloneNode(true));
    document.body.appendChild(probe);
    const height = Math.ceil(probe.firstChild.getBoundingClientRect().height);
    probe.remove();

    const xml = new XMLSerializer().serializeToString(holder);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width + 56}" height="${height}">` +
                `<foreignObject x="0" y="0" width="100%" height="100%">${xml}</foreignObject></svg>`;

    const scale = 2;
    const img = new Image();
    img.crossOrigin = "anonymous";
    await new Promise((ok, no) => {
      img.onload = ok; img.onerror = () => no(new Error("SVG render failed"));
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    });

    const canvas = document.createElement("canvas");
    canvas.width = (width + 56) * scale; canvas.height = height * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#F7F5F0"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.drawImage(img, 0, 0);

    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "SNA-" + String(label || "board").replace(/[^\w]+/g, "-") + "-" + todayISO() + ".png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("PNG saved to your Downloads");
  }catch(err){
    console.error(err);
    toast("PNG export failed — use Print / PDF instead");
  }finally{
    document.body.classList.remove("exporting");
    if(btn){ btn.disabled = false; btn.textContent = "Export PNG"; }
  }
}

/* ═══════════ DATA EXPORT / IMPORT ═══════════ */
function openData(){
  $("#mTitle").textContent = "Hub data";
  $("#mBody").innerHTML = "This is everything the hub knows, as JSON. <b>Copy</b> it and send it to the other " +
    "person — they paste it in here and hit <b>Load</b> to get your exact plan. <b>Download</b> saves a file you can " +
    "hand to Claude to commit back into the repo.";
  $("#mText").value = JSON.stringify(DATA, null, 2);
  $("#mActions").innerHTML = `
    <button class="btn" data-act="reset">Reset to seed</button>
    <span style="flex:1"></span>
    <button class="btn" data-act="copy">Copy</button>
    <button class="btn" data-act="download">Download</button>
    <button class="btn primary" data-act="load">Load pasted JSON</button>
    <button class="btn" data-act="close">Close</button>`;
  $("#scrim").classList.add("on");
}
$("#scrim").addEventListener("click", async e => {
  if(e.target.id === "scrim") return $("#scrim").classList.remove("on");
  const act = e.target.dataset && e.target.dataset.act;
  if(!act) return;
  if(act === "close") return $("#scrim").classList.remove("on");
  if(act === "copy"){
    try{ await navigator.clipboard.writeText($("#mText").value); toast("Copied"); }
    catch(err){ $("#mText").select(); document.execCommand("copy"); toast("Copied"); }
    return;
  }
  if(act === "download"){
    const blob = new Blob([$("#mText").value], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "sna-hub-data-" + todayISO() + ".json";
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Downloaded"); return;
  }
  if(act === "load"){
    try{
      const parsed = JSON.parse($("#mText").value);
      if(!parsed.calendar || !Array.isArray(parsed.calendar)) throw new Error("missing calendar");
      DATA = migrate(parsed); save(); render();
      $("#scrim").classList.remove("on"); toast("Loaded");
    }catch(err){ toast("That isn't valid hub JSON — " + err.message); }
    return;
  }
  if(act === "keepMine"){
    setRev(window._conflict.rev); push();
    $("#scrim").classList.remove("on"); toast("Your version is now the shared one"); return;
  }
  if(act === "takeTheirs"){
    DATA = migrate(window._conflict.data); DF = null; setRev(window._conflict.rev);
    localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
    render(); $("#scrim").classList.remove("on"); toast("Loaded their version"); return;
  }
  if(act === "reset"){
    if(!confirm("Throw away your local edits and go back to the data pulled from the sheet?")) return;
    localStorage.removeItem(STORE_KEY);
    DATA = clone(SEED); DIRTY = false; DF = null; paintSaveState(); render();
    $("#scrim").classList.remove("on"); toast("Back to seed data");
  }
});
document.addEventListener("keydown", e => { if(e.key === "Escape") $("#scrim").classList.remove("on"); });

/* ═══════════ boot ═══════════ */
$("#sheetLink").href = SEED.meta.sheetUrl;
$("#dashLink").href  = SEED.meta.dashboardUrl;
$("#stamp").textContent = "sheet snapshot " + SEED.meta.snapshot;
if(!TABS.some(t => t.id === TAB)) TAB = TABS[0].id;
paintSaveState();
render();

/* shared mode: pull once on load, then keep an eye on the shared copy */
if(syncOn()){
  syncStatus("connecting…");
  pull(true);
  setInterval(() => { if(document.visibilityState === "visible") pull(); }, SYNC.pollMs);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") pull(); });
  window.addEventListener("beforeunload", e => {
    if(PENDING || PUSHING){ e.preventDefault(); e.returnValue = ""; }   // don't lose an in-flight save
  });
}
</script>
